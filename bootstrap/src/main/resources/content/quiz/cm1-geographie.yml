    bonne: "L'océan Atlantique"
    distracteurs: ["L'océan Pacifique", "L'océan Indien"]
  - question: "Quelle est la monnaie utilisée en France ?"
    bonne: "L'euro"
    distracteurs: ["Le dollar", "La livre"]
