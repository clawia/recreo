questions:
  - question: "Quelle est la capitale de la France ?"
    bonne: "Paris"
    distracteurs: ["Lyon", "Marseille"]
  - question: "Quel fleuve traverse Paris ?"
    bonne: "La Seine"
    distracteurs: ["La Loire", "Le Rhône"]
  - question: "Sur quel continent se trouve la France ?"
    bonne: "L'Europe"
    distracteurs: ["L'Afrique", "L'Asie"]
  - question: "Quel est le plus haut sommet des Alpes ?"
    bonne: "Le mont Blanc"
    distracteurs: ["Le Puy de Dôme", "Le mont Ventoux"]
