    illustration: grille-fautive
    illustrationTexteAlternatif: "Une figure en cases noires sur un quadrillage, avec un trait épais au milieu."
    bonneZone: case-1-3
    indice: "Compte les cases entre la case pleine et le trait épais, puis compte autant de l'autre côté."
    zones:
      - id: case-1-3
        libelle: "colonne 3, ligne 1"
        cadre: { x: 50, y: 2, largeur: 24, hauteur: 24 }
      - id: case-3-3
        libelle: "colonne 3, ligne 3"
        cadre: { x: 50, y: 50, largeur: 24, hauteur: 24 }
      - id: case-4-4
        libelle: "colonne 4, ligne 4"
        cadre: { x: 74, y: 74, largeur: 24, hauteur: 24 }
