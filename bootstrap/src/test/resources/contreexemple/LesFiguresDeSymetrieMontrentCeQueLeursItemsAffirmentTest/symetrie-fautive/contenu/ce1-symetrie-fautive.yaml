schema: 1
id: ce1-symetrie-fautive
type: designation
descripteur:
  matiere: "Mathématiques"
  niveau: "CE1"
  domaine: "Espace et géométrie"
  competence: "Reconnaître un axe de symétrie et compléter une figure par symétrie sur quadrillage"
lignesDeReferentiel: ["MAT-CE1-17"]
emplacementDuLibelleDeZone: hors-de-la-boite
items:
  - enonce: "Touche le numéro de l'axe de symétrie."
    illustration: figure-fautive
    illustrationTexteAlternatif: "Une figure traversée par des lignes en pointillés."
    bonneZone: ligne-a
    indice: "Imagine que tu plies la figure le long de chaque ligne."
