<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Recreo — Par jeu</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css"/>
</head>
<body>
<a class="back-btn" th:href="@{/}" href="/" aria-label="Retour à l'accueil" title="Retour">←</a>

<header class="topbar">
    <h1>🎲 Choisis ton jeu</h1>
</header>

<main class="selection">
    <section class="catalogue">
        <!-- Axe « par jeu » : liste directe de TOUS les jeux, triés par nom (les mêmes jeux se
             regroupent), au format complet « Matière Niveau — Nom » (contexte 'jeu'). -->
        <div class="cards">
            <div th:each="item : ${entries}"
                 th:insert="~{fragments/catalogue :: leaf(${item}, ${from}, 'jeu')}"></div>
        </div>
    </section>
</main>
</body>
</html>
