<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Recreo — Par jeu</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css"/>
</head>
<body>
<a class="back-btn" th:href="@{/}" href="/" aria-label="Retour à l'accueil" title="Retour">←</a>

<header class="topbar">
    <h1>🎲 Choisis ton jeu</h1>
</header>

<main class="selection">
    <section class="catalogue">
        <!-- Barre de filtres NIVEAU : un unique « Tous » qui annule TOUS les filtres
             (aucun parametre → /jeux), puis un chip BASCULE par niveau. Reclic sur un
             niveau actif → deselection (href sans niveau, matiere preservee). -->
        <div class="filters">
            <a class="filter-chip" th:classappend="${selectedNiveau == null and selectedMatiere == null} ? ' active' : ''"
               th:href="@{/jeux}">Tous</a>
            <a class="filter-chip" th:each="n : ${niveaux}"
               th:classappend="${n == selectedNiveau} ? ' active' : ''"
               th:href="${n == selectedNiveau} ? @{/jeux(matiere=${selectedMatiere})} : @{/jeux(niveau=${n}, matiere=${selectedMatiere})}"
               th:text="${n}">CP</a>
        </div>

        <!-- Barre de filtres MATIERE : chip BASCULE par matiere (niveau preserve).
             Reclic sur une matiere active → deselection (href sans matiere). -->
        <div class="filters">
            <a class="filter-chip" th:each="m : ${matieres}"
               th:classappend="${m == selectedMatiere} ? ' active' : ''"
               th:href="${m == selectedMatiere} ? @{/jeux(niveau=${selectedNiveau})} : @{/jeux(niveau=${selectedNiveau}, matiere=${m})}"
               th:text="${m}">Maths</a>
        </div>

        <!-- Axe « par jeu » : liste directe de TOUS les jeux, triés par nom (les mêmes jeux se
             regroupent), au format complet « Matière Niveau — Nom » (contexte 'jeu'). -->
        <div class="cards">
            <div th:each="item : ${entries}"
                 th:insert="~{fragments/catalogue :: leaf(${item}, ${from}, 'jeu')}"></div>
        </div>

        <!-- Aucun jeu ne correspond au filtre courant. -->
        <p th:if="${#lists.isEmpty(entries)}" class="hint">Aucun jeu pour ce filtre</p>
    </section>
</main>
</body>
</html>
