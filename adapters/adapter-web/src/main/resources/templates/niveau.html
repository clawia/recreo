<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Recreo — Jeux du niveau</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css"/>
</head>
<body>
<a class="back-btn" th:href="@{${back}}" href="/niveaux" aria-label="Retour aux niveaux" title="Retour">←</a>

<header class="topbar">
    <h1>Les jeux du niveau <span th:text="${niveau}">CP</span></h1>
</header>

<main class="selection">
    <section class="catalogue">
        <!-- Barre de filtres MATIERE (affichée s'il y a au moins 2 matières à ce niveau).
             Un unique « Toutes » qui annule le filtre, puis un chip BASCULE par matière
             (reclic sur la matière active → déselection). Symétrique aux filtres « Par jeu ». -->
        <div class="filters" th:if="${matieres != null and matieres.size() > 1}">
            <a class="filter-chip" th:classappend="${selectedMatiere == null} ? ' active' : ''"
               th:href="@{/niveau/{n}(n=${niveau})}">Toutes</a>
            <a class="filter-chip" th:each="m : ${matieres}"
               th:classappend="${m == selectedMatiere} ? ' active' : ''"
               th:href="${m == selectedMatiere} ? @{/niveau/{n}(n=${niveau})} : @{/niveau/{n}(n=${niveau}, matiere=${m})}"
               th:text="${m}">Maths</a>
        </div>

        <div class="cards">
            <div th:each="item : ${entries}"
                 th:insert="~{fragments/catalogue :: leaf(${item}, ${from}, 'niveau')}"></div>
        </div>

        <!-- Aucun jeu ne correspond au filtre courant. -->
        <p th:if="${#lists.isEmpty(entries)}" class="hint">Aucun jeu pour ce filtre</p>
    </section>
</main>
</body>
</html>
