<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Recreo — Jeux de la matière</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css"/>
</head>
<body>
<a class="back-btn" th:href="@{${back}}" href="/matieres" aria-label="Retour aux matières" title="Retour">←</a>

<header class="topbar">
    <h1>Les jeux de <span th:text="${matiere}">Maths</span></h1>
</header>

<main class="selection">
    <section class="catalogue">
        <!-- Barre de filtres NIVEAU (affichée s'il y a au moins 2 niveaux dans la matière).
             Un unique « Tous » qui annule le filtre, puis un chip BASCULE par niveau
             (reclic sur le niveau actif → déselection). Symétrique aux filtres « Par jeu ». -->
        <div class="filters" th:if="${niveaux != null and niveaux.size() > 1}">
            <a class="filter-chip" th:classappend="${selectedNiveau == null} ? ' active' : ''"
               th:href="@{/matiere/{m}(m=${matiere})}">Tous</a>
            <a class="filter-chip" th:each="n : ${niveaux}"
               th:classappend="${n == selectedNiveau} ? ' active' : ''"
               th:href="${n == selectedNiveau} ? @{/matiere/{m}(m=${matiere})} : @{/matiere/{m}(m=${matiere}, niveau=${n})}"
               th:text="${n}">CP</a>
        </div>

        <div class="cards">
            <div th:each="item : ${entries}"
                 th:insert="~{fragments/catalogue :: leaf(${item}, ${from}, 'matiere')}"></div>
        </div>

        <!-- Aucun jeu ne correspond au filtre courant. -->
        <p th:if="${#lists.isEmpty(entries)}" class="hint">Aucun jeu pour ce filtre</p>
    </section>
</main>
</body>
</html>
