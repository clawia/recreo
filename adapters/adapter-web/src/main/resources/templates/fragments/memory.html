<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Memory</title>
</head>
<body>
<!--
  Fragment de la mecanique "memory" (jeu de paires). Presentation DISTINCTE : une
  grille de CARTES face cachee (game.associationCards) ; l'enfant retourne deux cartes
  et cherche les paires. game.associationGroups est PARALLELE a associationCards et
  porte le groupe/paire au format "<index><cote>" (ex. "0g","0d","1g","1d") : deux
  cartes forment une paire si meme index ET cotes differents. PAS de machine, PAS de
  boutons de reponse. Le scoreboard, l'emplacement de message et l'ecran de fin sont
  MUTUALISES via fragments/commun. A la completion, /js/memory.js soumet le form cache
  avec les listes paralleles assocItem (cote g) / assocTarget (cote d) par paire.
-->
<div th:fragment="game" class="memory" th:attr="data-session-id=${game.sessionId}">

    <!-- ECRAN DE FIN (session terminee) : ecran commun mutualise.
         th:if porte par un th:block ENVELOPPANT (comme banditmanchot/glisserdeposer) :
         sinon th:replace s'executerait avant th:if et l'ecran de fin s'afficherait
         toujours (ne PAS reproduire le bug s06). -->
    <th:block th:if="${game.finished}">
        <div th:replace="~{fragments/commun :: gameOver}"></div>
    </th:block>

    <!-- ECRAN DE JEU (session active). -->
    <div th:unless="${game.finished}">
        <div th:replace="~{fragments/commun :: scoreboard}"></div>

        <!-- La consigne : ce qu'il faut faire (game.question), affichee telle quelle. -->
        <p class="consigne" th:text="${game.question}">Retrouve les paires</p>

        <!-- GRILLE de cartes : on itere avec index sur les cartes en lisant le groupe
             parallele (associationGroups). La face (.memory-face) est masquee par CSS
             tant que la carte n'a pas la classe .flipped (ou .appariee). -->
        <div class="memory-grille">
            <th:block th:each="card,it : ${game.associationCards}">
                <div class="memory-carte"
                     th:attr="data-group=${game.associationGroups[it.index]}, data-value=${card}">
                    <span class="memory-face" th:text="${card}">?</span>
                </div>
            </th:block>
        </div>

        <!-- Formulaire CACHE : soumis par le JS a la completion (toutes les paires
             trouvees). Le JS pose assocItem / assocTarget via htmx:configRequest puis
             declenche l'envoi. Meme endpoint / meme cible htmx que les autres jeux. -->
        <form class="memory-form"
              th:attr="hx-post=@{/sessions/{id}/moves(id=${game.sessionId})}"
              hx-target="#game-area" hx-swap="innerHTML" method="post">
            <input type="hidden" name="from" th:value="${from}"/>
        </form>

        <!-- Message de resultat : emplacement RESERVE commun, sous la grille. -->
        <div th:replace="~{fragments/commun :: feedbackSlot}"></div>
    </div>
</div>
</body>
</html>
