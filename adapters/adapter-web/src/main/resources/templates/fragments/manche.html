<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- ADR-0020 : ce fragment ne porte pas l'identifiant de la zone qui le recoit. hx-swap="innerHTML"
     l'insere DANS #jeu ; le reprendre ici donnait deux elements du meme identifiant dans le document
     assemble, donc une cible hx-target indeterminee.
     "ecran-de-jeu" est un marqueur d'etat que le serveur pose sur la zone de contenu, sans porter
     aucun style propre. Jusqu'a DEC-0034 (s15, troisieme arbitrage de l'utilisatrice, 2026-08-18)
     il commandait aussi le masquage de l'entree de menu de l'en-tete permanent sur cet ecran
     (arbitrage de nadia-prof du 2026-08-07, S6-9) : l'utilisatrice renverse ce point precis pour la
     manche seule - "Les jeux" reste visible dans l'en-tete pendant une partie en cours, et le
     bouton .retour-accueil qui portait cette sortie ici est retire (S15-3, un seul exemplaire du
     mot par ecran, BARRE-5). Le marqueur reste pose ici pour ADR-0027 (voir plus bas) : sa regle
     de masquage vers .lien-accueil est en cours de revision par theo-archi, hors du perimetre de
     ce commit. -->
<!-- ADR-0027 : data-arrivee est le second marqueur d'etat de cet ecran, et il ne dit pas la meme chose
     que "ecran-de-jeu". Le premier dit ou l'enfant est ; celui-ci dit comment le tirage que les
     colonnes montrent est arrive. Seule une regle d'animation le lira, et c'est lui seul qui autorise
     un mouvement : un mouvement que l'enfant n'a pas declenche est refuse (nadia-prof, arbitrage du
     2026-08-10, section 6).
     ADR-0027, amendement du 2026-08-13 (M10) : son sujet est le tirage, pas la reponse HTTP. Il vaut
     "par-un-geste" quand un geste de l'enfant a fait arriver un tirage neuf, et "sans-geste" dans les
     deux autres cas - un chargement de page que l'enfant n'a pas demande (la reprise silencieuse de
     S1-4, que accueil.html rend sans aucun echange htmx), et un geste qui le laisse sur la meme
     question (echec avec des essais restants, entree en revelation, appui a cote apres la
     revelation). Rejouer le defilement sur une question inchangee ferait dire au mouvement que la
     machine vient de distribuer alors que rien n'a ete distribue (nadia-prof, condition M10). -->
<!-- S10, M13 : data-focus est un troisieme marqueur, sur le meme modele que data-arrivee - le serveur
     declare ou doit aller le focus apres cet echange, jamais un script qui le devine. "enonce" designe
     l'enonce (manche fraiche : premiere manche d'une partie, ou manche qui suit une reussite) ; l'autre
     valeur designe le bouton porteur de data-focus-cible ci-dessous (celui que l'enfant vient de
     presser sur un echec, celui qui porte la reponse revelee au troisieme echec). Jamais la sortie,
     sur aucune des deux valeurs : c'est la clause bloquante de M13. -->
<div th:fragment="manche" class="ecran-de-jeu"
     th:attr="data-arrivee=${arriveeParUnGeste} ? 'par-un-geste' : 'sans-geste', data-focus=${focus}">
    <p class="score" th:text="'Score : ' + ${score.reussites()}"></p>
    <!-- ADR-0075 section 7, VOI-12 (nadia-prof, ARBITRAGE-PREALABLE-s26-la-voix-est-un-adulte.md,
         section 13, son exigence bloquante) : le bloc ou vit tout ce qu'un adulte doit lire pour
         cette manche - le stimulus qu'il prononce et la phrase qui lui dit ce qu'il ne doit pas
         faire -, un seul objet visuel, jamais deux blocs separes (proposition-ines-s26-ecran-
         voix.md, section 1). Premier bloc de la manche, avant .consigne : c'est un des canaux non
         colores qui le distinguent (meme proposition, section 2.1), avec le cadre complet et
         l'etiquette en toutes lettres portes par recreo.css.
         texteAVoixHaute est le champ d'item que pose ADR-0075 (Optional<String> sur Question et
         ReponseAEcrire) ; consigneAdulte porte la phrase d'interdit, invariante a l'interieur d'un
         paquet et variable d'un paquet a l'autre comme la consigne de l'enfant (ADR-0075 section
         7, deuxieme point) - donc un champ de modele a elle, jamais un libelle de gabarit.
         Les deux th:if sont independants, sur le meme principe que texteSupport et illustration
         ci-dessous (ADR-0020, jamais un paragraphe vide) : le lot qui pose le champ doit fournir
         les deux ensemble, sous peine de rendre un bloc incomplet - VOI-12 point 1 ("en meme
         temps") reste alors une garantie de contenu, pas une garantie de ce gabarit.
         Ni ce controleur ni aucun paquet ne remplit encore ces deux attributs a ce commit : le
         bloc est pret a etre servi le jour ou le lot qui pose texteAVoixHaute les cablera
         (ADR-0075, "Pourquoi ces quatre clauses ne sont pas dans ce commit").
         Rendu par la meme condition sur tous les etats de cet ecran - item, echec, revelation :
         ce fragment ne le retire jamais lui-meme, a la difference de .message-jeu qui n'apparait
         qu'avec une reponse (VOI-8 - l'adulte doit pouvoir redire le stimulus autant de fois que
         l'enfant le demande ; nadia-prof, section 12.4, chemin de la revelation). -->
    <div class="bloc-adulte" tabindex="-1" th:if="${texteAVoixHaute != null}">
        <p class="etiquette-adulte">Adulte, à voix haute :</p>
        <p class="stimulus-a-lire" th:text="${texteAVoixHaute}"></p>
        <p class="consigne-adulte" th:if="${consigneAdulte != null}" th:text="${consigneAdulte}"></p>
    </div>
    <p class="consigne" th:text="${consigne}"></p>
    <!-- ADR-0050 (S17-2) : le texte-support est un champ de contenu optionnel, rendu entre la
         consigne et l'enonce quand l'item en declare un, dans un style distinct des deux (COMP-5,
         COMP-6). Jamais un paragraphe vide (ADR-0020) : th:if garde ce bloc absent des jeux qui
         n'en portent pas, plutot que de le nourrir d'une valeur factice. -->
    <p class="texte-support" th:if="${texteSupport != null}" th:text="${texteSupport}"></p>
    <!-- ADR-0073, palier 1 du visuel : l'image fixe qu'un item declare. Elle occupe l'emplacement du
         texte-support - "la matiere sur laquelle porte la question" (ADR-0050) -, entre la consigne
         et l'enonce, et n'invente aucun emplacement neuf : ines-design a mesure les deux placements
         possibles aux dix largeurs et aux trois etats, les trente couples de chiffres sont identiques
         au pixel, le choix est donc semantique (proposition-ines-palier-1-du-visuel.md, section 6.2).
         Le cabinet n'entoure PAS ce bloc : ADR-0030 point 1.a a 1.d fait du meuble ce qui entoure les
         colonnes de reponses et rien d'autre, et sa condition C5 n'y autorise qu'une image fixe,
         celle du bandeau. Un dessin d'item a l'interieur ferait croire qu'il se presse.
         th:if, jamais un bloc vide (ADR-0020) : un jeu qui ne declare aucun dessin ne rend pas ce
         noeud, plutot que de le nourrir d'une valeur factice.
         Le chemin est compose ici et nulle part ailleurs (ADR-0073 clause 1 et 3) : le contenu
         declare un identifiant, l'adapter connait le repertoire et l'extension. C'est la seule
         expression calculee que RessourcesTiercesTest admette, et sa forme y est bornee au terme
         pres - prefixe litteral, un unique terme calcule, extension litterale.
         alt vient du modele, jamais du gabarit : un alt ecrit ici serait le meme pour tous les
         dessins d'un paquet, donc n'en decrirait aucun (clause 5). Ce que ce texte dit appartient a
         nadia-prof (CON-5), jamais a ce fichier. -->
    <div class="illustration" th:if="${illustration != null}">
        <img class="image-item" th:src="@{'/illustrations/' + ${illustration} + '.svg'}"
             th:alt="${illustrationTexteAlternatif}">
    </div>
    <!-- S18, S17-C : tabindex="-1" est declare ici, jamais pose par recreo.js. Un <p> n'est pas
         focalisable nativement ; c'est la seule maniere dont focus() peut l'atteindre quand
         data-focus="enonce" le designe comme point de focus (M13 clause 4).
         ADR-0062 : l'enonce est rendu segment par segment, jamais comme une seule chaine - c'est ce
         qui permet a un segment de porter une marque que CSS puisse selectionner, la ou un noeud
         texte unique ne le permettait pas. Une manche qui ne designe rien rend un seul segment non
         designe, dans une seule boucle sans branche : le gabarit ignore toute convention de contenu
         (aucun parcours de guillemets), il ne fait que rendre ce que le controleur a decoupe. -->
    <p class="enonce" tabindex="-1"><th:block th:each="segment : ${segmentsEnonce}"><span th:if="${segment.designe()}" class="mot-designe" th:text="${segment.texte()}"></span><th:block th:unless="${segment.designe()}" th:text="${segment.texte()}"></th:block></th:block></p>
    <!-- S8-1 : le cabinet entoure les colonnes de reponses, jamais la consigne ni l'enonce, qui
         restent au-dessus, hors du cadre (nadia-prof, arbitrage prealable du 2026-08-11, section 2 ;
         proposition-ines-cabinet.md, section 1). Freres purement decoratifs, aria-hidden parce
         qu'ils ne portent aucune information que le texte de l'ecran ne porte deja.
         ADR-0030 point 1.a : les trois classes portent chacune une regle de recreo.css. Point 1.c :
         aucun th:if ni th:unless sur le cabinet, pour ne pas faire entrer une condition dans
         l'appariement de saillance des boutons qu'il contient. Point 1.d : ce balisage vit
         uniquement ici, jamais sur "ecran-de-jeu" ni sur la racine d'un fragment - c'est cette
         absence ailleurs qui garantit que le cabinet n'atteint ni l'ecran de retour ni l'ecran de
         fin de partie (nadia-prof, section 6 de son arbitrage).
         S10 : le visage (aucun texte, hors du masque de .cabinet-bandeau il resterait quand meme
         muet) et le levier de flanc, frere de .propositions et non son ancetre (ADR-0033).
         L'enseigne n'est pas cablee ici : F11 et ADR-0035 bloquent son emplacement accessible tant
         qu'une ecoute reelle de lecteur d'ecran n'a pas eu lieu (nadia-prof). -->
    <div class="cabinet">
        <div class="cabinet-bandeau" aria-hidden="true">
            <span class="cabinet-visage"></span>
        </div>
        <form class="propositions" th:attr="hx-post=@{'/parties/' + ${jeuId} + '/coups'}" hx-target="#jeu" hx-swap="innerHTML">
            <!-- S10, M9 : "deja-essayee" marque une proposition deja pressee sur cette manche - elle
                 reste cliquable, a sa place, de la meme taille (M8) : la classe ne nomme que la marque,
                 son habillage visuel est laisse au lot qui porte le meuble.
                 M13 clause 2 et 5 : data-focus-cible designe le bouton que ce fragment declare comme
                 point de focus quand data-focus ne vaut pas "enonce" - la proposition que l'enfant
                 vient de presser sur un echec, ou celle qui porte la reponse revelee. -->
            <button type="submit" class="btn proposition" data-role="action"
                    th:each="proposition : ${propositions}"
                    th:classappend="${propositionsEssayees.contains(proposition)} ? 'deja-essayee' : ''"
                    th:attr="data-focus-cible=${focusCibles.contains(proposition)}"
                    name="propositionChoisie" th:value="${proposition}" th:text="${proposition}"></button>
        </form>
        <div class="cabinet-levier" aria-hidden="true">
            <span class="cabinet-levier-embase"></span>
        </div>
        <div class="cabinet-socle" aria-hidden="true"></div>
    </div>
    <!-- S10, M1, M6, M9, M11, M12 : le seul emplacement ou le jeu parle de la reponse de l'enfant,
         sous le meuble, hors du cadre du cabinet - jamais au-dessus (M1, M4). "message-jeu" est le
         bloc que ce chantier pose pour le second lot : sa forme (fond, espacement) lui revient, sa
         presence conditionnelle et son contenu sont ceux que M1-M13 fixent.
         M11 clause 1 : le signal non textuel (icone, aplat) accompagne le texte, sur le meme
         balisage .signal/.icone-signal que l'ancien ecran de retour - meme geometrie de boite,
         juste ou faux. M11 clause 3 et M7 : une manche resolue par revelation n'affiche jamais ce
         signal comme une reussite, et l'explication n'apparait qu'avec la revelation, jamais sur une
         question neuve. -->
    <div class="message-jeu" role="status" th:if="${message != null}">
        <div class="signal" th:classappend="${signalJuste} ? 'est-juste' : 'est-faux'">
            <span class="icone-signal" aria-hidden="true"></span>
            <p class="verdict" th:text="${message}"></p>
        </div>
        <p class="explication" th:if="${explication != null}" th:text="${explication}"></p>
        <p class="indice" th:if="${indice != null}" th:text="${indice}"></p>
    </div>
</div>
</body>
</html>
