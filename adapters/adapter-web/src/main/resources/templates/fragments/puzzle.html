<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Puzzle</title>
</head>
<body>
<!--
  Fragment de la mecanique "puzzle". Meme mecanisme d'arrangement que le glisser-deposer
  (mutualise via ADR-0007) : l'enfant GLISSE des tuiles-lettres depuis la reserve
  (game.arrangementReserve) dans une rangee d'EMPLACEMENTS (game.arrangementSlots) pour
  reconstituer le mot demande. En plus du glisser-deposer, un INDICE (game.hint : emoji,
  image ou definition) est affiche pour guider l'enfant.
  Le scoreboard, l'emplacement de message et l'ecran de fin sont MUTUALISES via
  fragments/commun. L'ordre choisi est envoye au POST /sessions/{id}/moves sous forme
  d'un champ `arrangement` REPETE (arrangement=A&arrangement=B&...), injecte par
  /js/puzzle.js a la soumission (identique au glisser-deposer).
-->
<div th:fragment="game" class="puzzle" th:attr="data-session-id=${game.sessionId}">

    <!-- ECRAN DE FIN (session terminee) : ecran commun mutualise.
         th:if porte par un th:block ENVELOPPANT : sinon th:replace s'executerait avant
         th:if et l'ecran de fin s'afficherait toujours (bug s06 a ne pas reproduire). -->
    <th:block th:if="${game.finished}">
        <div th:replace="~{fragments/commun :: gameOver}"></div>
    </th:block>

    <!-- ECRAN DE JEU (session active). -->
    <div th:unless="${game.finished}">
        <div th:replace="~{fragments/commun :: scoreboard}"></div>

        <!-- La consigne : ce qu'il faut faire (game.question), affichee telle quelle. -->
        <p class="consigne" th:text="${game.question}">Reconstitue le mot</p>

        <!-- L'INDICE : emoji / image / definition guidant l'enfant (grand, centre, lisible). -->
        <div class="puzzle-indice" th:if="${game.hint != null}" th:text="${game.hint}">🐱</div>

        <!-- PLATEAU pilote par le serveur (game.arrangementSlots / game.arrangementReserve) :
             sur un essai faux, les tuiles deja bien placees restent VERROUILLEES dans leur
             emplacement, seules les mal placees repartent en reserve (UX « ranger », DEC-0008).
             On n'affiche JAMAIS game.options (porterait la reponse). -->
        <th:block th:if="${game.arrangementSlots != null}">
            <!-- La RESERVE : tuiles-lettres a (re)placer. Chaque tuile est deplacable
                 (draggable) ; la valeur transportee est portee par data-value (lue par le JS). -->
            <div class="dnd-tuiles">
                <div class="dnd-tuile" th:each="sym : ${game.arrangementReserve}"
                     draggable="true" th:text="${sym}" th:attr="data-value=${sym}">A</div>
            </div>

            <!-- Les EMPLACEMENTS : un .dnd-slot par position. Si la position est verrouillee
                 (valeur non vide), la tuile est PRE-PLACEE dedans ; sinon l'emplacement est vide. -->
            <div class="dnd-slots">
                <div class="dnd-slot" th:each="val : ${game.arrangementSlots}">
                    <div th:if="${!val.isEmpty()}" class="dnd-tuile"
                         draggable="true" th:text="${val}" th:attr="data-value=${val}">A</div>
                </div>
            </div>
        </th:block>

        <!-- Repli (ne devrait pas arriver) : tuiles = reelSymbols en reserve, emplacements vides. -->
        <th:block th:if="${game.arrangementSlots == null}">
            <div class="dnd-tuiles">
                <div class="dnd-tuile" th:each="sym : ${game.reelSymbols}"
                     draggable="true" th:text="${sym}" th:attr="data-value=${sym}">A</div>
            </div>
            <div class="dnd-slots">
                <div class="dnd-slot" th:each="sym : ${game.reelSymbols}"></div>
            </div>
        </th:block>

        <!-- Formulaire de validation : le JS injecte les <input name="arrangement"> dans
             l'ordre des slots juste avant l'envoi htmx (meme endpoint et meme cible que les
             autres mecaniques). -->
        <form class="dnd-form"
              th:attr="hx-post=@{/sessions/{id}/moves(id=${game.sessionId})}"
              hx-target="#game-area" hx-swap="innerHTML" method="post">
            <input type="hidden" name="from" th:value="${from}"/>
            <button type="submit" class="valider-btn">✅ Valider</button>
        </form>

        <!-- Message de resultat : emplacement RESERVE commun, sous le formulaire. -->
        <div th:replace="~{fragments/commun :: feedbackSlot}"></div>
    </div>
</div>
</body>
</html>
