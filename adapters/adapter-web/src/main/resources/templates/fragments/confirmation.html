<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- ADR-0038, DEC-0026 (story 2, s11) : la sortie de l'ecran de manche et de l'ecran de reprise ne
     detruit plus la partie d'un seul geste ; elle rend cet ecran, qui laisse la partie intacte tant
     que l'enfant n'a pas confirme explicitement. "ecran-de-jeu" masque l'entree de menu de l'en-tete
     permanent, exactement comme sur les autres ecrans de jeu (ADR-0022).
     Aucun data-focus n'est declare ici : ce garde-fou n'entre donc jamais dans la population que
     LEcranDeJeuDeclareCommentIlEstArriveTest anime (elle est deja restreinte aux ecrans qui portent
     des propositions), et ADR-0038 clause 2 n'a ici aucun point de focus a examiner. -->
<div th:fragment="confirmation" class="ecran-de-jeu">
    <p class="question-confirmation">Si tu quittes, tu perds ta partie en cours. Veux-tu vraiment quitter ?</p>
    <!-- ADR-0038 clause 1 : ce bouton est le premier arret de tabulation de cet ecran, et sa requete
         ne detruit rien - c'est ce qui rend l'invariante vraie ici, pas seulement declaree.
         ADR-0017 : ce bouton fait avancer l'enfant (il reste dans le jeu), donc data-role="action". -->
    <button type="button" class="btn continuer-partie" data-role="action"
            hx-post="/retour/annuler" hx-target="#jeu" hx-swap="innerHTML">Continuer la partie</button>
    <!-- ADR-0017 : ce bouton fait sortir l'enfant du jeu, donc data-role="sortie" - et sa requete
         detruit reellement la partie, contrairement a celui de fragments/manche.html qui ne mene
         plus qu'ici. Meme mot que toute autre sortie de l'application (ADR-0022 / S6-9). -->
    <button type="button" class="btn retour-accueil" data-role="sortie"
            hx-post="/retour/confirmer" hx-target="#jeu" hx-swap="innerHTML">Les jeux</button>
</div>
</body>
</html>
