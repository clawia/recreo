<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- ADR-0038, DEC-0026 (story 2, s11) : la sortie de l'ecran de manche et de l'ecran de reprise ne
     detruit plus la partie d'un seul geste ; elle rend cet ecran, qui laisse la partie intacte tant
     que l'enfant n'a pas confirme explicitement.
     Ce garde-fou n'entre pas dans la population que LEcranDeJeuDeclareCommentIlEstArriveTest anime
     (elle est deja restreinte aux ecrans qui portent des propositions), donc data-focus n'y est pas
     lu par elle.
     ADR-0040 : nadia-prof a mesure que la premiere Tabulation quitte le document 57 fois sur 69
     arrivees sur cet ecran, faute de tout point de focus declare. data-focus="phrase" et
     data-focus-cible="true" sur la phrase arbitree ci-dessous ferment cette reserve, dans la seule
     forme que la clause 2 d'ADR-0038 laisse verte (ADR-0040, point 4) : un point de focus qui ne
     declare aucune requete, place avant les deux boutons. La phrase ne declare aucun hx-post ni
     href, donc ADR-0040 clause 3 n'a rien a y examiner non plus (rien a activer).
     S14-2, correction du Done pedagogique refuse (nadia-prof, BARRE-1 ; theo-archi, ADR-0022
     troisieme amendement) : cet ecran pose une question et offre deux reponses ; la barre de
     niveaux de l'en-tete, permanente, y ajoutait deux boites de plus, dont une est la puce que
     l'enfant vient de presser - la represser rend le meme ecran. "ecran-exclusif" est le marqueur
     d'etat que le serveur pose ici (ADR-0022, clause 2 generalisee) : un ecran est exclusif quand
     tout chemin qu'il ouvre a l'enfant vit a l'interieur de lui - continuer la partie ou la
     quitter, ici, rien d'autre. Distinct de "ecran-de-jeu" (porte par les quatre fragments, jamais
     nomme par une regle de style) parce que la barre de niveaux ne doit disparaitre que sur deux
     ecrans sur quatre - elle reste visible sur la manche et sur la fin de partie.
     S15-3 (troisieme arbitrage de l'utilisatrice, DEC-0034) : "ecran-porte-sa-sortie" est le
     second marqueur qu'exige le retour de la sortie dans l'en-tete (exigences de theo-archi,
     squad/sprints/s15-cinq-arbitrages-de-l-en-tete/) - cet ecran rend deja sa propre sortie
     (.retour-accueil, "Les jeux") et masque donc celle de l'en-tete pour ne pas la lire deux fois
     (BARRE-5). Il porte les deux marqueurs a la fois, chacun pour son propre motif : "ecran-exclusif"
     masque aussi les puces de niveau (clause B), ce que "ecran-porte-sa-sortie" ne fait pas. -->
<div th:fragment="confirmation" class="ecran-de-jeu ecran-exclusif ecran-porte-sa-sortie" data-focus="phrase">
    <!-- Texte arbitre par nadia-prof (FICHE-bandit-manchot-additions-cp.md, arbitrage prealable du
         2026-08-14, CONF-3) : ni "perdre" (homonymie de jeu) ni question, les deux boutons sont le
         choix. Ne pas reformuler sans un nouvel arbitrage.
         ADR-0040 : cette phrase est le point de focus declare de cet ecran (arbitrage de
         nadia-prof, meme reference) - aucun anneau, aucun contour, aucun changement d'apparence :
         du texte centre encadre resterait, pour un lecteur debutant, trop proche de l'aspect d'une
         chose sur laquelle on appuie (nadia-prof, arbitrage s01, refuse d'avance). -->
    <!-- S18, S17-C : tabindex="-1" est declare ici, jamais pose par recreo.js. Un <p> n'est pas
         focalisable nativement ; c'est la seule maniere dont focus() peut atteindre cette phrase,
         le point de focus arbitre par ADR-0040. -->
    <p class="question-confirmation" data-focus-cible="true" tabindex="-1">Si tu pars, ta partie s'arrête.</p>
    <!-- ines-design, proposition s11 : les deux boutons partagent un seul conteneur pour que la
         feuille maison les empile et les ecarte sans toucher a .continuer-partie ni .retour-accueil,
         qui restent les classes partagees par le reste de l'application (ADR-0017). Aucun element
         focalisable ajoute : la derivation par balise de AucunArretDeTabulationNEstDestructeurTest et
         d'ADR-0017 (button, a[href]) ne voit que les deux boutons, inchanges. -->
    <div class="confirmation-actions">
        <!-- ADR-0038 clause 1 : ce bouton est le premier arret de tabulation de cet ecran, et sa
             requete ne detruit rien - c'est ce qui rend l'invariante vraie ici, pas seulement
             declaree. ADR-0017 : ce bouton fait avancer l'enfant (il reste dans le jeu), donc
             data-role="action". -->
        <button type="button" class="btn continuer-partie" data-role="action"
                hx-post="/retour/annuler" hx-target="#jeu" hx-swap="innerHTML">Continuer la partie</button>
        <!-- ADR-0017 : ce bouton fait sortir l'enfant du jeu, donc data-role="sortie" - et sa requete
             detruit reellement la partie, contrairement a celui de fragments/manche.html qui ne mene
             plus qu'ici. Meme mot que toute autre sortie de l'application (ADR-0022 / S6-9).
             S14-1 : la destination varie selon ce qui a ouvert cette confirmation - un abandon
             ordinaire (/retour/confirmer) ou une puce de niveau (/niveaux/{niveau}/confirmer,
             ADR-0044) - pour que l'accueil qui en resulte reste filtre sur le niveau demande, le
             niveau ne pouvant pas vivre ailleurs que dans l'URL (DEC-0028). Attribut pose a part du
             role, jamais dans le meme th:attr que lui. -->
        <button type="button" class="btn retour-accueil" data-role="sortie"
                th:attr="hx-post=${urlConfirmerAbandon}" hx-target="#jeu" hx-swap="innerHTML">Les jeux</button>
    </div>
</div>
</body>
</html>
