<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Texte à trous</title>
</head>
<body>
<!--
  Fragment de la mecanique "texte a trous" (cf. ADR-0007). Presentation DISTINCTE de
  la machine a sous : on affiche la PHRASE A COMPLETER (game.question, contenant le
  marqueur "___" remplace par un emplacement style bien visible), puis les mots
  proposes en gros boutons tactiles (game.options). PAS de rouleaux, pas de machine.
  Le scoreboard, l'emplacement de message et l'ecran de fin sont MUTUALISES avec le
  bandit manchot via fragments/commun.
-->
<div th:fragment="game" class="trou-game" th:attr="data-session-id=${game.sessionId}">

    <!-- ECRAN DE FIN (session terminee) : ecran commun mutualise. -->
    <div th:if="${game.finished}" th:replace="~{fragments/commun :: gameOver}"></div>

    <!-- ECRAN DE JEU (session active). -->
    <div th:unless="${game.finished}">
        <div th:replace="~{fragments/commun :: scoreboard}"></div>

        <p class="answers-title">Complète la phrase 👇</p>

        <!-- La phrase a completer : le marqueur "___" (convention de la mecanique) est
             remplace par un emplacement de trou stylé, gros et lisible. -->
        <div class="phrase-carte">
            <p class="phrase-a-trou">
                <span th:text="${#strings.substringBefore(game.question, '___')}">Le chat boit du </span><span class="trou" aria-label="mot à trouver">?</span><span th:text="${#strings.substringAfter(game.question, '___')}">.</span>
            </p>
        </div>

        <!-- Les mots proposes : gros boutons tactiles ; le clic POST le mot choisi
             (meme endpoint et meme cible htmx que le bandit manchot). -->
        <div class="words">
            <form class="word-form" th:each="opt : ${game.options}"
                  th:action="@{/sessions/{id}/moves(id=${game.sessionId})}" method="post"
                  th:attr="hx-post=@{/sessions/{id}/moves(id=${game.sessionId})}"
                  hx-target="#game-area" hx-swap="innerHTML">
                <input type="hidden" name="chosenAnswer" th:value="${opt}"/>
                <input type="hidden" name="from" th:value="${from}"/>
                <button type="submit" class="word-btn" th:text="${opt}">mot</button>
            </form>
        </div>

        <!-- Message de resultat : emplacement RESERVE commun, sous les mots. -->
        <div th:replace="~{fragments/commun :: feedbackSlot}"></div>
    </div>
</div>
</body>
</html>
