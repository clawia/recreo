<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Bandit manchot</title>
</head>
<body>
<!--
  Fragment generique de la mecanique "bandit manchot".
  Les rouleaux affichent les tokens fournis EXPLICITEMENT par le contenu
  (game.reelSymbols) : calcul en maths, mot en francais... Le front n'interprete
  plus la structure du contenu (cf. ADR-0004). La consigne (game.question) est
  affichee telle quelle. L'enfant clique ensuite sur la bonne reponse parmi les
  options, EN DEHORS de la machine. Animation cote client : /js/bandit.js.
-->
<div th:fragment="game" class="bandit" th:attr="data-session-id=${game.sessionId}">

    <!-- ECRAN DE FIN (session terminee, cf. ADR-0006) : plus de rouleaux ni de
         reponses. Score X / Y (score courant / nombre de questions jouees) + Rejouer
         (relance une session du meme jeu) et fleche retour. -->
    <div th:if="${game.finished}" class="game-over">
        <h2 class="game-over-title">🎉 Bravo !</h2>
        <p class="final-score">Score : <b th:text="${game.score}">0</b>
            / <span th:text="${game.answered}">0</span></p>
        <div class="game-over-actions">
            <form th:action="@{/sessions}" method="post" class="replay-form">
                <input type="hidden" name="catalogEntryId" th:value="${game.catalogEntryId}"/>
                <input type="hidden" name="from" th:value="${from}"/>
                <button type="submit" class="play-btn big">🔁 Rejouer</button>
            </form>
            <a class="settings-btn" th:href="@{${from}}" href="/">← Retour</a>
        </div>
    </div>

    <!-- ECRAN DE JEU (session active). -->
    <div th:unless="${game.finished}">
        <div class="scoreboard">
            <span class="score">⭐ Score : <b th:text="${game.score}">0</b></span>
            <span class="round">Manche <b th:text="${game.round}">1</b></span>
        </div>

        <!-- Casier de machine a sous : un rouleau par symbole fourni par le contenu. -->
        <div class="machine" th:classappend="${game.hasFeedback and game.correct} ? ' jackpot' : ''">
            <div class="machine-head">🎰 <span>BANDIT MANCHOT</span> 🎰</div>

            <div class="reels">
                <div class="reel" th:each="sym : ${game.reelSymbols}" th:attr="data-value=${sym}">
                    <span class="reel-window">
                        <span class="reel-strip"><span class="reel-item" th:text="${sym}">2</span></span>
                    </span>
                </div>
            </div>

            <div class="lever" aria-hidden="true"><span class="lever-stick"></span><span class="lever-knob"></span></div>
        </div>

        <!-- Consigne : EN DEHORS de la machine (game.question), entre la machine et les reponses. -->
        <p class="consigne" th:text="${game.question}">= ?</p>

        <!-- Les reponses : EN DEHORS de la machine, l'enfant clique sur la bonne. -->
        <p class="answers-title">Clique sur la bonne réponse 👇</p>
        <div class="answers">
            <form class="answer-form" th:each="opt : ${game.options}"
                  th:action="@{/sessions/{id}/moves(id=${game.sessionId})}" method="post"
                  th:attr="hx-post=@{/sessions/{id}/moves(id=${game.sessionId})}"
                  hx-target="#game-area" hx-swap="innerHTML">
                <input type="hidden" name="chosenAnswer" th:value="${opt}"/>
                <input type="hidden" name="from" th:value="${from}"/>
                <button type="submit" class="answer-btn" th:text="${opt}">42</button>
            </form>
        </div>

        <!-- Message de points : SOUS les reponses, pour ne pas decaler la machine. -->
        <div th:if="${game.hasFeedback}"
             th:classappend="${game.correct} ? 'feedback ok' : 'feedback ko'"
             class="feedback">
            <span th:text="${game.feedbackMessage}">Feedback</span>
        </div>
    </div>
</div>
</body>
</html>
