<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Glisser-déposer</title>
</head>
<body>
<!--
  Fragment de la mecanique "glisser-deposer" (4e mecanique, cf. ADR-0007). Presentation
  DISTINCTE des autres mecaniques : les TUILES a ranger (game.reelSymbols) sont
  affichees en desordre ; l'enfant les GLISSE dans une rangee d'EMPLACEMENTS vides
  pour les remettre dans l'ordre demande (game.question). PAS de machine, PAS de trou,
  PAS de boutons de reponse. On N'affiche JAMAIS game.options (contiendrait la reponse) :
  seuls reelSymbols et question sont exposes a la vue.
  Le scoreboard, l'emplacement de message et l'ecran de fin sont MUTUALISES via
  fragments/commun. L'ordre choisi est envoye au POST /sessions/{id}/moves sous forme
  d'un champ `arrangement` REPETE (arrangement=3&arrangement=7&...), injecte par
  /js/glisser-deposer.js a la soumission.
-->
<div th:fragment="game" class="glisser-deposer" th:attr="data-session-id=${game.sessionId}">

    <!-- ECRAN DE FIN (session terminee) : ecran commun mutualise.
         th:if porte par un th:block ENVELOPPANT (comme banditmanchot/quizaventure) : sinon
         th:replace s'executerait avant th:if et l'ecran de fin s'afficherait toujours
         (ne PAS reproduire le bug s06). -->
    <th:block th:if="${game.finished}">
        <div th:replace="~{fragments/commun :: gameOver}"></div>
    </th:block>

    <!-- ECRAN DE JEU (session active). -->
    <div th:unless="${game.finished}">
        <div th:replace="~{fragments/commun :: scoreboard}"></div>

        <!-- La consigne : ce qu'il faut faire (game.question), affichee telle quelle. -->
        <p class="consigne" th:text="${game.question}">Range les nombres du plus petit au plus grand</p>

        <!-- Les TUILES a ranger, en desordre : chaque tuile est deplacable (draggable).
             La valeur transportee est portee par data-value (lue par le JS a la soumission). -->
        <div class="dnd-tuiles">
            <div class="dnd-tuile" th:each="sym : ${game.reelSymbols}"
                 draggable="true" th:text="${sym}" th:attr="data-value=${sym}">3</div>
        </div>

        <!-- Les EMPLACEMENTS vides ou deposer les tuiles : AUTANT de slots que de tuiles. -->
        <div class="dnd-slots">
            <div class="dnd-slot" th:each="sym : ${game.reelSymbols}"></div>
        </div>

        <!-- Formulaire de validation : le JS injecte les <input name="arrangement"> dans
             l'ordre des slots juste avant l'envoi htmx (meme endpoint et meme cible que les
             autres mecaniques). -->
        <form class="dnd-form"
              th:attr="hx-post=@{/sessions/{id}/moves(id=${game.sessionId})}"
              hx-target="#game-area" hx-swap="innerHTML" method="post">
            <input type="hidden" name="from" th:value="${from}"/>
            <button type="submit" class="valider-btn">✅ Valider</button>
        </form>

        <!-- Message de resultat : emplacement RESERVE commun, sous le formulaire. -->
        <div th:replace="~{fragments/commun :: feedbackSlot}"></div>
    </div>
</div>
</body>
</html>
