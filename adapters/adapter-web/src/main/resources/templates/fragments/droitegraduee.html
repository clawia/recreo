<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Droite graduee</title>
</head>
<body>
<!--
  Fragment de la mecanique "droite graduee". Calque la structure du bandit manchot
  (scoreboard / consigne / feedback / gameOver) mais remplace les boutons-reponses
  par une DROITE : un tick cliquable par etiquette de graduation (game.lineTicks,
  entiers OU fractions comme « 1/4 »).
  Chaque tick est un petit formulaire htmx qui poste `chosenAnswer` = etiquette du tick
  (reutilise le coup SpinAndPick, comme les boutons du bandit). Aucun JS requis :
  les ticks sont des formulaires (degradation propre). Un curseur cosmetique peut
  etre rebranche par /js/droite-graduee.js.
-->
<div th:fragment="game" class="droite-graduee" th:attr="data-session-id=${game.sessionId}">

    <!-- ECRAN DE FIN (session terminee) : ecran commun mutualise. th:if porte par un
         th:block ENVELOPPANT (meme raison que le bandit : priorite th:replace > th:if). -->
    <th:block th:if="${game.finished}">
        <div th:replace="~{fragments/commun :: gameOver}"></div>
    </th:block>

    <!-- ECRAN DE JEU (session active). -->
    <div th:unless="${game.finished}">
        <div th:replace="~{fragments/commun :: scoreboard}"></div>

        <!-- Consigne : « Place le nombre N ». -->
        <p class="consigne" th:text="${game.question}">Place le nombre</p>

        <!-- La DROITE : un tick cliquable par ETIQUETTE de graduation (game.lineTicks).
             Les etiquettes sont des Strings : entiers (« 0 », « 1 »…) OU fractions
             (« 0 », « 1/4 », « 1/2 »…). Chaque tick est un formulaire htmx (fonctionne
             SANS JS) postant son etiquette comme chosenAnswer. Les etiquettes deja
             tentees a tort (disabledOptions) sont grisees. -->
        <!-- Seules les EXTREMITES (premier/dernier repere) sont etiquetees : l'enfant doit
             SITUER le nombre/la fraction (donne dans la consigne) a la bonne position, sans que
             sa valeur soit ecrite sur la graduation (sinon le jeu se resume a lire l'etiquette).
             La valeur reste dans le champ cache `chosenAnswer` pour valider le clic. -->
        <div class="droite">
            <form class="tick-form" th:each="v,it : ${game.lineTicks}"
                  th:action="@{/sessions/{id}/moves(id=${game.sessionId})}" method="post"
                  th:attr="hx-post=@{/sessions/{id}/moves(id=${game.sessionId})}"
                  hx-target="#game-area" hx-swap="innerHTML">
                <input type="hidden" name="chosenAnswer" th:value="${v}"/>
                <input type="hidden" name="from" th:value="${from}"/>
                <button type="submit" class="droite-tick"
                        th:text="${it.first or it.last} ? ${v} : ''"
                        th:attr="aria-label=${v},
                                 disabled=${game.disabledOptions != null and game.disabledOptions.contains(v)} ? 'disabled' : null"
                        th:classappend="${game.disabledOptions != null and game.disabledOptions.contains(v)} ? ' tentee' : ''">0</button>
            </form>
        </div>

        <!-- Message de points : emplacement RESERVE mutualise. -->
        <div th:replace="~{fragments/commun :: feedbackSlot}"></div>
    </div>
</div>
</body>
</html>
