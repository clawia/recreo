<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- ADR-0020 : ce fragment ne porte pas l'identifiant de la zone qui le recoit.
     ADR-0022 : marqueur d'etat "ecran-de-jeu", voir fragments/manche.html.
     S10 : depuis que le cycle de manche absorbe la reponse juste comme la fausse
     (PartieController.mancheModele), ce fragment ne rend plus qu'un seul etat - la fin de partie.
     Sa branche "la partie continue" ("Encore !", GET /parties/{jeuId}/manche) n'a plus d'appelant :
     retiree plutot que laissee vivre sans route qui la pose, sur le modele deja etabli par
     DEC-0009/DEC-0014 (l'absence, jamais un drapeau mort).
     S15-3 (troisieme arbitrage de l'utilisatrice, DEC-0034) : "ecran-porte-sa-sortie" est le second
     marqueur d'etat qu'exige le retour de la sortie dans l'en-tete (exigences de theo-archi,
     squad/sprints/s15-cinq-arbitrages-de-l-en-tete/) - un fait structurel (cet ecran rend lui-meme
     un [data-role=sortie]), jamais un jugement pedagogique comme "ecran-exclusif". Il masque la
     sortie d'en-tete ici pour que "Les jeux" ne se lise pas deux fois (BARRE-5) : cet ecran porte
     deja la sienne (.sortie-pleine). Nom propose par theo-archi, confirme par ines-design
     (squad/sprints/s15-cinq-arbitrages-de-l-en-tete/proposition-ines-cloture.md, section 1) :
     il nomme un fait de l'ecran (il porte sa propre sortie), jamais l'effet sur l'habillage. -->
<div th:fragment="retour" class="ecran-de-jeu ecran-porte-sa-sortie">
    <!-- S3-6 : sur cet ecran, la sortie est desormais toujours la seule action possible, donc
         toujours l'aplat le plus saillant (nadia-prof, FICHE-bandit-manchot-additions-cp.md,
         reserve 4). ADR-0017 : data-role="sortie". -->
    <button type="button" class="btn sortie-pleine" data-role="sortie"
            hx-post="/retour" hx-target="#jeu" hx-swap="innerHTML">Les jeux</button>
    <!-- S35-SCO1-ECRAN-FIN, SCO-R1 (verdicts-nadia-instance-A.md, section 5.2), ADR-0083 : cet ecran
         portait un troisieme exemplaire du meme defaut que REV-1 et REV-3 avaient deja corrige plus
         bas dans ce fichier - une concatenation Thymeleaf, "'Score : ' + score.reussites()", qui de
         surcroit echappait a TexteAccentueDesGabaritsTest (son inventaire ne lit que les noeuds de
         texte litteraux, et un th:text remplace tout son sous-arbre au rendu : les mots "Score : "
         n'y ont jamais ete visibles). Un enfant qui avait fait dix manches et en avait trouve six
         seul lisait "Score : 6", un point final - SCO-R1 refuse ce nombre reduit qui remplace les
         deux informations que l'enfant doit lire.
         Forme retenue (avis de faisabilite de theo-archi, s35, section 1.3) : les deux nombres que
         Score porte deja (reussites, tentatives) sont rendus dans deux elements distincts, chacun
         seul et entier dans le sien, jamais l'un concatene dans une phrase - meme forme que
         .reponse-attendue plus bas. Les mots invariants sont desormais du texte litteral du
         gabarit, donc visibles de TexteAccentueDesGabaritsTest. Places hors du bloc .signal, comme
         les deux etaient deja : rendus identiquement que la derniere manche ait ete resolue par une
         reussite ou par une revelation (nadia-prof, meme section, dernier point : "je n'ai pas
         verifie ce que le texte neuf y donnerait" sur ce cas precis).
         Le texte lui-meme reste un candidat, au sens ou les autres textes de ce fichier le sont deja
         (SAI-9b, "La bonne réponse :") : nadia-prof l'arbitre en jouant, avant le Done pedagogique
         de cette story. -->
    <p class="score-trouve-libelle">Tu as trouvé, tout seul :</p>
    <p class="score-trouve-nombre" th:text="${score.reussites()}"></p>
    <p class="score-joue-libelle">Tu as joué toutes les questions :</p>
    <p class="score-joue-nombre" th:text="${score.tentatives()}"></p>
    <!-- S18, S17-C : tabindex="-1" est declare ici, jamais pose par recreo.js. Un <div> n'est pas
         focalisable nativement ; c'est la seule maniere dont focus() peut l'atteindre quand aucun
         data-focus n'est present sur cet ecran, et que le script replie sur .signal. -->
    <div class="signal" tabindex="-1" th:classappend="${juste} ? 'est-juste' : 'est-faux'">
        <span class="icone-signal" aria-hidden="true"></span>
        <p th:if="${juste}" class="verdict">Bravo, c'est juste !</p>
        <!-- REV-2, nadia-prof, reverification du 2026-09-06 (FICHE-bandit-manchot-additions-cp.md) :
             sur cet ecran, juste=false ne peut survenir que si la derniere manche a ete resolue par
             revelation (BanditManchotSession.jouer et SaisieSession.poursuivre n'appellent resoudre
             avec juste=false que depuis la branche "revelee") - et une manche revelee ne se ferme
             que d'un seul geste : l'enfant presse la bonne reponse. "Ce n'est pas ça." dementait donc
             systematiquement le dernier geste de l'enfant, qui vient de reussir a designer la bonne
             reponse. Le texte de nadia-prof ne nomme pas ce geste comme fautif : l'enfant n'a pas
             trouve la question, ce que la revelation a deja constate. -->
        <p th:unless="${juste}" class="verdict">Tu n'as pas trouvé.</p>
    </div>
    <!-- REV-1, ADR-0083 : cet ecran portait la seconde occurrence du meme defaut - "Non, c'est
         <span>${bonneReponse}</span>." donnait "Non, c'est ce n'est pas un etre vivant." sur les
         douze items exacts que nadia-prof a mesures sur l'ecran de revelation. Elle ne l'avait pas
         cherchee ici (passe transverse de s29, section 7 : "il en existe peut-etre d'autres du meme
         genre"). Trouvee en corrigeant l'autre, par l'inventaire de TexteAccentueDesGabaritsTest, ou
         "Non, c'est" etait inscrit avec le commentaire "la reponse suit, posee par le modele" - le
         defaut y etait ecrit en toutes lettres depuis des sprints. Meme forme que sur l'ecran de
         manche : les mots invariants dans le gabarit, la reponse seule dans son element, aucune
         concatenation. -->
    <!-- REV-3, ADR-0084 : la reponse nommee ci-dessous ne dit rien seule - "La bonne reponse : non"
         ne commente aucune question visible, l'enfant ayant enchaine d'autres manches depuis. Cet
         emplacement porte donc l'enonce de la manche que ce verdict commente, tel quel et entier,
         pose au modele par le verdict : a cet instant la session n'a plus de manche courante, et le
         verdict est la seule trace de l'item joue (meme motif qu'ADR-0024 pour l'explication).
         Aucun mot neuf n'est ajoute ici - ADR-0083 clause 1 : la valeur de contenu occupe seule et
         entiere le texte de son element. Un intitule ("La question :") est un texte lu par un
         enfant, donc une decision de nadia-prof, et l'ajouter plus tard ne coute qu'une ligne ici.
         La classe n'est pas .enonce, et le motif est mesure plutot que suppose : le premier jet de
         ce correctif reutilisait .enonce et a ete arrete par ADR-0052 clause 1
         (ToutEcranEchangeEstUnDocumentJouableTest), qui exige la consigne du jeu partout ou un
         enonce est rendu. Cette clause a raison sur l'ecran de manche, ou l'enfant doit agir sur
         l'enonce et ou la consigne peut porter la question invariante du paquet ; ici l'enfant n'a
         plus rien a faire de cette phrase, la seule action de l'ecran etant d'en sortir. Ce n'est
         donc pas un enonce a jouer mais une question rappelee, et la classe le dit.
         S33-PAL2-TROU-A, S33-PAL2-TROU-B (ADR-0088) : les deux conditions ci-dessous ne sont plus
         "th:unless juste" mais deux booleens poses par le controleur, parce que la troisieme
         mecanique (designation) ne suit plus la meme regle que les deux autres - questionRappeleeVisible
         vaut vrai sur toute manche de designation, juste comprise, le dessin n'etant plus a l'ecran ;
         reponseAttendueVisible vaut toujours faux sur une designation, nadia-prof ayant tranche que
         ni un identifiant technique ni un libelle positionnel n'apprend quoi que ce soit ici. Sur le
         bandit manchot et sur la saisie, les deux valent exactement "${!juste}" comme avant ce lot :
         rien n'y change. -->
    <p class="question-rappelee" th:if="${questionRappeleeVisible}" th:text="${enonceRevele}"></p>
    <p class="reponse-revelee" th:if="${reponseAttendueVisible}">La bonne réponse :</p>
    <p class="reponse-attendue" th:if="${reponseAttendueVisible}" th:text="${bonneReponse}"></p>
    <!-- ADR-0024, S6-7 : l'explication de l'item joue, posee au modele sous "explication" par
         PartieController, vide quand le contenu n'en porte pas (ecrite par ChaquePaquetExpliqueSesItemsAVariationTest
         sur les seuls items dont la graphie differe de la reponse attendue). Affichee systematiquement,
         que la reponse soit juste ou fausse - nadia-prof, arbitrage du 2026-08-06, S5-9 : "l'enfant qui
         a trouve DENT par elimination a autant besoin de l'explication que celui qui s'est trompe".
         Sauf quand la bonne reponse est une reproduction : le controleur ne la pose alors a aucun
         verdict (ADR-0104, amendement du 2026-10-14, voie (b) de nadia-prof), elle designe des
         oeuvres que cet ecran ne montre pas. -->
    <p class="explication" th:if="${explication != null}" th:text="${explication}"></p>
    <p class="fin-de-partie">C'est fini !</p>
</div>
</body>
</html>
