<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="retour" id="jeu">
    <!-- S3-6 : sur ce meme ecran, la sortie est un contour discret tant qu'une autre action existe
         ("Encore !"), et devient l'aplat le plus saillant des que c'est la fin de partie, seule
         action possible restante (nadia-prof, FICHE-bandit-manchot-additions-cp.md, reserve 4).
         La classe statique "retour-accueil" reste la valeur par defaut du gabarit source (lue
         telle quelle par le garde-fou de taille) ; th:class la remplace au rendu reel. -->
    <button type="button" class="retour-accueil"
            th:class="${enSuite} ? 'retour-accueil' : 'sortie-pleine'"
            hx-post="/retour" hx-target="#jeu" hx-swap="innerHTML">Les jeux</button>
    <p class="score" th:text="'Score : ' + ${score.reussites()}"></p>
    <div class="signal" th:classappend="${juste} ? 'est-juste' : 'est-faux'">
        <span class="icone-signal" aria-hidden="true"></span>
        <p th:if="${juste}" class="verdict">Bravo, c'est juste !</p>
        <p th:unless="${juste}" class="verdict">
            Non, c'est <span th:text="${bonneReponse}"></span>.
        </p>
    </div>
    <form th:if="${enSuite}" th:attr="hx-get=@{'/parties/' + ${jeuId} + '/manche'}"
          hx-target="#jeu" hx-swap="innerHTML">
        <button type="submit" class="encore">Encore !</button>
    </form>
    <p th:unless="${enSuite}" class="fin-de-partie">C'est fini !</p>
</div>
</body>
</html>
