<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Recreo — En jeu</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css"/>
    <script th:src="@{/js/htmx.min.js}" src="/js/htmx.min.js" defer></script>
    <script th:src="@{/js/bandit.js}" src="/js/bandit.js" defer></script>
</head>
<body>
<!-- Fleche "retour" UNIQUE et CONTEXTUELLE : ramene a l'ecran d'ou l'on vient
     (parcours par niveau ou par jeu), via le parametre `from`. -->
<a class="back-btn" th:href="@{${from}}" href="/" aria-label="Retour" title="Retour">←</a>

<header class="topbar">
    <h1>🎰 Recreo</h1>
</header>

<!-- Ecran de JEU : le bandit manchot centre plein ecran. Le fragment est insere
     dans #game-area ; htmx echange ce meme #game-area a chaque coup. -->
<main class="play">
    <div id="game-area" class="game-area">
        <div th:insert="~{fragments/banditmanchot :: game}"></div>
    </div>
</main>
</body>
</html>
