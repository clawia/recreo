<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recreo</title>
    <link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon">
    <!-- ADR-0014 : la feuille tierce porte le rendu de base, la feuille maison passe toujours en
         dernier. C'est cet ordre qui fait qu'une regle maison de meme specificite l'emporte sur la
         regle tierce, donc que les planchers exiges par nadia-prof sont ceux que l'enfant voit. -->
    <link rel="stylesheet" th:href="@{/vendor/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/recreo.css}">
    <script th:src="@{/vendor/htmx.min.js}"></script>
    <!-- S10 : recreo.js appelle document.body dans son corps, execute des sa lecture (pas de wrapper
         DOMContentLoaded). Charge nu dans le <head>, <body> n'existe pas encore : document.body vaut
         null, l'appel leve une TypeError et l'ecouteur n'est jamais enregistre - le focus de M13 n'a
         donc jamais bouge, y compris avant ce sprint. "defer" reporte l'execution a la fin de
         l'analyse du document, quand <body> existe deja, sans changer l'ordre de chargement ni
         sortir le script du <head>. -->
    <script defer th:src="@{/js/recreo.js}"></script>
</head>
<body>
<!-- S6-1 : l'en-tete est un frere de #jeu, jamais un descendant - hx-swap="innerHTML" ne remplace
     que le contenu de #jeu, jamais #jeu lui-meme, donc l'en-tete survit a chaque fragment de jeu
     rendu (DEC-0012).
     S14-2 (BARRE-7, DEC-0033) : le lien "Les jeux" (a.lien-accueil, data-role="sortie") qui vivait
     ici est retire, pas remplace par un comportement neuf. Il n'etait deja visible que sur
     l'accueil (masque ailleurs par ADR-0022) et, sur l'accueil non filtre, un appui dessus rendait
     le meme document : un enfant qui presse ce lien puis une puce de niveau voisine apprenait que
     la seconde est la sortie uniquement parce que le premier ne fait rien. "Les jeux" reste le seul
     mot de sortie de l'application (ADR-0022 point 3, DEC-0027) : il continue de porter la sortie
     de la fin de partie (sortie-pleine) et le bouton de confirmation d'abandon (retour-accueil) -
     cette suppression ne retire que l'exemplaire de l'en-tete.
     S12-5 : nadia-prof refuse l'ancien aria-label="Menu principal" sur cette zone (motif : un seul
     lien n'est pas un menu, "principal" n'est pas un mot d'enfant de six ans). Devenu sans objet
     depuis que l'en-tete ne porte plus aucun lien de menu, mais garde ici pour la trace : aucun
     garde-fou n'exige de libelle non vide sur cette zone (avis de faisabilite de theo-archi, s13).
     -->
<header class="entete">
    <div class="container entete-contenu">
        <img th:src="@{/favicon.ico}" alt="" class="icone-entete">
        <h1 class="nom-site">Recreo</h1>
    </div>
    <!-- S14-1 (ADR-0043, ADR-0044) : un point d'entree par niveau distinct du catalogue, dans
         l'ordre du catalogue - jamais un libelle ni un href ecrits en clair (ADR-0006). Second
         rang de l'en-tete, sans regle de masquage : c'est l'absence de regle qui rend cette barre
         visible y compris sur un ecran de jeu (FICHE-barre-entree-niveau.md, variante retenue).
         ADR-0044 point 3 : aucun etat de filtre courant ici, l'en-tete ne peut pas etre rafraichi
         par un echange htmx - le niveau demande ne vit que dans la route que chaque puce appelle.
         data-role="entree" (ADR-0043) : ni une action de l'ecran affiche, ni sa sortie. -->
    <nav class="container bandeau-niveaux">
        <button type="button" class="btn chip-niveau" data-role="entree"
                th:each="niveau : ${niveaux}"
                th:attr="hx-get=@{'/niveaux/' + ${niveau}}"
                hx-target="#jeu" hx-swap="innerHTML" th:text="${niveau}">CP</button>
    </nav>
</header>
<!-- ADR-0020 : ce <main> est le seul porteur de l'identifiant de la zone echangee, dans tout le
     depot. Le fragment "zoneAccueil" que /retour renvoie est porte par un th:block, qui ne rend
     aucune balise : reinjecter le <main> dans lui-meme doublait son identifiant et empilait deux
     fois .container et .zone-jeu, donc deux fois leur rembourrage. -->
<main id="jeu" class="container zone-jeu">
<th:block th:fragment="zoneAccueil">
    <div th:if="${reprise}">
        <div th:replace="~{fragments/manche :: manche}"></div>
    </div>
    <div th:unless="${reprise}">
        <p class="message-reprise" th:if="${messageReprise}" th:text="${messageReprise}"></p>
        <p class="pas-de-jeu" th:if="${jeux.isEmpty()}">Il n'y a pas de jeu pour le moment.</p>
        <ul class="jeux list-unstyled" th:unless="${jeux.isEmpty()}">
            <li th:each="jeu : ${jeux}">
                <button type="button" class="btn demarrer" data-role="action" th:text="${jeu.titre()}"
                        th:attr="hx-post=@{'/parties/' + ${jeu.id()}}"
                        hx-target="#jeu" hx-swap="innerHTML">Jouer</button>
            </li>
        </ul>
    </div>
</th:block>
</main>
</body>
</html>
