<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recreo</title>
    <link rel="stylesheet" th:href="@{/css/recreo.css}">
    <script th:src="@{/js/htmx.min.js}"></script>
    <script th:src="@{/js/recreo.js}"></script>
</head>
<body>
<main id="jeu">
    <h1>Recreo</h1>
    <p class="pas-de-jeu" th:if="${jeux.isEmpty()}">Aucune partie disponible pour le moment.</p>
    <ul class="jeux" th:unless="${jeux.isEmpty()}">
        <li th:each="jeu : ${jeux}">
            <button type="button" class="demarrer" th:text="${jeu.titre()}"
                    th:attr="hx-post=@{'/parties/' + ${jeu.id()}}"
                    hx-target="#jeu" hx-swap="innerHTML">Jouer</button>
        </li>
    </ul>
</main>
</body>
</html>
