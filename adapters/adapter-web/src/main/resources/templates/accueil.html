<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recreo</title>
    <link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon">
    <!-- ADR-0014 : la feuille tierce porte le rendu de base, la feuille maison passe toujours en
         dernier. C'est cet ordre qui fait qu'une regle maison de meme specificite l'emporte sur la
         regle tierce, donc que les planchers exiges par nadia-prof sont ceux que l'enfant voit. -->
    <link rel="stylesheet" th:href="@{/vendor/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/recreo.css}">
    <script th:src="@{/vendor/htmx.min.js}"></script>
    <!-- S10 : recreo.js appelle document.body dans son corps, execute des sa lecture (pas de wrapper
         DOMContentLoaded). Charge nu dans le <head>, <body> n'existe pas encore : document.body vaut
         null, l'appel leve une TypeError et l'ecouteur n'est jamais enregistre - le focus de M13 n'a
         donc jamais bouge, y compris avant ce sprint. "defer" reporte l'execution a la fin de
         l'analyse du document, quand <body> existe deja, sans changer l'ordre de chargement ni
         sortir le script du <head>. -->
    <script defer th:src="@{/js/recreo.js}"></script>
</head>
<body>
<!-- S6-1 : l'en-tete est un frere de #jeu, jamais un descendant - hx-swap="innerHTML" ne remplace
     que le contenu de #jeu, jamais #jeu lui-meme, donc l'en-tete survit a chaque fragment de jeu
     rendu (DEC-0012). ADR-0017 : le lien porte data-role="sortie".
     DEC-0034 (s15) : l'utilisatrice retablit ce lien dans l'en-tete, dans son etat d'avant s14, en
     connaissance du motif BARRE-7/DEC-0027 que S14-2 avait ferme en le retirant - ce refus
     pedagogique reste lisible tel quel dans FICHE-barre-entree-niveau.md et n'est ni efface ni
     corrige ici. "Les jeux" est le seul mot de sortie de l'application (ADR-0022 point 3,
     DEC-0027) : il porte aussi la sortie de la fin de partie (sortie-pleine) et le bouton de
     confirmation d'abandon (retour-accueil).
     ADR-0022 / S6-9 : son libelle est "Les jeux". Ce commentaire affirmait jusqu'au 2026-08-19 qu'il
     n'etait pas visible sur un ecran de jeu, masque des que la zone porte le marqueur "ecran-de-jeu" -
     c'etait vrai jusqu'a l'arbitrage C de s15, qui a retire cette regle : l'utilisatrice a tranche
     que la sortie vit dans l'en-tete y compris pendant une partie. Le masquage de ce lien ne depend
     plus du marqueur d'ecran de jeu mais des deux marqueurs qui nomment un fait de l'ecran -
     "ecran-exclusif" (tout chemin qu'il ouvre vit a l'interieur de lui) et "ecran-porte-sa-sortie" -
     et il reste donc visible sur une manche. recreo.css documente ces deux regles a l'endroit ou elles
     vivent ; seul ce commentaire-ci n'avait pas suivi (releve du relecteur-pedagogique, corrige par
     theo-archi qui avait ecrit l'arbitrage).
     Ce qui n'a pas change et vaut toujours : l'element reste permanent dans le document, c'est sa
     visibilite qui depend de l'etat, jamais sa presence (DEC-0012, S6-1).
     S12-5 : nadia-prof refuse l'ancien aria-label="Menu principal" sur cette zone (motif : un seul
     lien n'est pas un menu, "principal" n'est pas un mot d'enfant de six ans, et l'application n'a
     qu'un seul mot de sortie, deja "Les jeux"). Aucun garde-fou n'exige de libelle non vide sur
     cette zone (avis de faisabilite de theo-archi, s13) : l'attribut est retire plutot que
     reformule.
     S15 (troisieme et quatrieme arbitrages de l'utilisatrice, DEC-0034/ADR-0044 amendement) : un
     seul rang, dans l'ordre icone/titre/CP/CM1 puis "Les jeux" pousse a droite (variante 1
     d'ines-design, retenue par nadia-prof - proposition-ines-etat-actif-et-rang-unique.md, section
     1.1 ; FICHE-barre-entree-niveau.md, arbitrage prealable du 2026-08-18, section 1). Le second
     "nav" d'avant ce lot (classe bandeau-niveaux) disparait comme element distinct : les deux
     anciens rangs fusionnent dans ce seul conteneur. -->
<header class="entete">
    <nav class="container entete-contenu">
        <img th:src="@{/favicon.ico}" alt="" class="icone-entete">
        <h1 class="nom-site">Recreo</h1>
        <!-- S14-1 (ADR-0043), amendement d'ADR-0044 (s15, section 1.1 de
             exigences-theo-etat-actif.md) : un point d'entree par niveau distinct du catalogue,
             dans l'ordre du catalogue - jamais un libelle ecrit en clair, et jamais une route par
             niveau ecrite en dur (ADR-0006) : th:href reste calcule depuis ${niveau}, un seul
             element de gabarit sert les deux niveaux du catalogue comme il en servirait un
             treizieme demain. Le href="/niveaux/CP" ci-dessous est un espace reserve, toujours
             ecrase au rendu par th:href, jamais lu par le serveur : il existe pour que ce <a>
             reste reconnaissable comme "a[href]" par les garde-fous qui lisent le gabarit brut,
             avant tout traitement Thymeleaf (TailleDesTextesEtBoutonsTest,
             LHabillageResteImmobileTest et d'autres derivent leur population de pressables de
             "button, a[href]" sur le fichier source, ou seul l'attribut litteral existe encore).
             La puce perd hx-get/hx-target et ne garde que son href : un appui est desormais une
             navigation complete (cout assume, ADR-0044 point 3 amende), ce qui est ce qui rend
             possible de marquer par la donnee (th:classappend, jamais une regle CSS par niveau)
             quel niveau est actif - c'est la puce elle-meme qui declenche ce rendu complet.
             data-role="entree" (ADR-0043) : ni une action de l'ecran affiche, ni sa sortie.
             est-actif (nadia-prof, arbitrage du 2026-08-18, section 2) : pose par la seule donnee
             de niveau demande (PartieController.niveaux, niveauActif), jamais persiste (S15-5) -
             son extinction au demarrage d'un jeu est une regle de feuille qui neutralise
             l'apparence sans toucher cette classe (voir recreo.css). -->
        <a class="btn chip-niveau" data-role="entree" href="/niveaux/CP"
           th:each="niveau : ${niveaux}"
           th:href="@{'/niveaux/' + ${niveau}}"
           th:classappend="${niveau == niveauActif} ? 'est-actif' : ''"
           th:text="${niveau}">CP</a>
        <a class="btn lien-accueil" data-role="sortie" href="/"
           hx-post="/retour" hx-target="#jeu" hx-swap="innerHTML">Les jeux</a>
    </nav>
</header>
<!-- ADR-0020 : ce <main> est le seul porteur de l'identifiant de la zone echangee, dans tout le
     depot. Le fragment "zoneAccueil" que /retour renvoie est porte par un th:block, qui ne rend
     aucune balise : reinjecter le <main> dans lui-meme doublait son identifiant et empilait deux
     fois .container et .zone-jeu, donc deux fois leur rembourrage. -->
<main id="jeu" class="container zone-jeu">
<th:block th:fragment="zoneAccueil">
    <div th:if="${reprise}">
        <div th:replace="~{fragments/manche :: manche}"></div>
    </div>
    <div th:unless="${reprise}">
        <!-- S15 (PartieController.niveaux, amendement d'ADR-0044) : un appui sur une puce de
             niveau pendant une partie en cours est desormais une navigation complete (la puce a
             perdu son hx-get) ; sans cette branche, le controleur rendrait la confirmation nue,
             sans en-tete ni feuille de style, sur ce seul chemin. -->
        <div th:if="${confirmationDirecte}">
            <div th:replace="~{fragments/confirmation :: confirmation}"></div>
        </div>
        <div th:unless="${confirmationDirecte}">
            <p class="message-reprise" th:if="${messageReprise}" th:text="${messageReprise}"></p>
            <!-- S15-2 (nadia-prof, FICHE-barre-entree-niveau.md, arbitrage prealable du
                 2026-08-18, section 5) : la phrase qui nomme le filtre est due meme sans l'etat
                 actif de la puce, et elle vit ici parce que c'est le seul endroit certain d'etre
                 rendu au moment de l'appui (PartieController.niveaux). Libelle tranche par elle -
                 "Pour le CP" - jamais "Les jeux pour le CP", pour ne pas contredire BARRE-5 (un
                 seul mot de sortie par ecran, deja porte par le lien de l'en-tete). -->
            <p class="filtre-niveau" th:if="${niveauActif != null}"
               th:text="'Pour le ' + ${niveauActif}"></p>
            <p class="pas-de-jeu" th:if="${jeux.isEmpty()}">Il n'y a pas de jeu pour le moment.</p>
            <ul class="jeux list-unstyled" th:unless="${jeux.isEmpty()}">
                <li th:each="jeu : ${jeux}">
                    <button type="button" class="btn demarrer" data-role="action"
                            th:text="${jeu.titre()}"
                            th:attr="hx-post=@{'/parties/' + ${jeu.id()}}"
                            hx-target="#jeu" hx-swap="innerHTML">Jouer</button>
                </li>
            </ul>
        </div>
    </div>
</th:block>
</main>
</body>
</html>
