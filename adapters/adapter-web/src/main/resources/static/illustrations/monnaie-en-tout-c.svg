<?xml version="1.0" encoding="UTF-8"?>
<!-- MON, item illustre du palier 1 (S25-MON-1). Trois pieces de meme valeur.
     ADR-0073 clause 4 et DES-7 : aucun element de texte, tout est trace. Les deux balises que
     la clause 4 refuse ne sont pas citees ici, le garde-fou lisant le fichier entier.
     MON-1, MON-2 : la valeur de chaque objet est gravee en geometrie, jamais nommee, et seules
     les valeurs qui existent sont montrees. MON-4 : aucun centime.
     DES-1 a DES-6 : cadre de vue et dimensions en unites utilisateur au meme rapport, hauteur
     declaree a 176 px, trait en unites utilisateur, teinte en clair, glyphes definis une
     fois et instancies. Glyphes d'ines-design, recopies a l'identique. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 380 176" width="380" height="176" role="img" fill="none"
     stroke="#1c2733" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <path id="g1" d="M8 14 L20 2 L20 58"/>
  </defs>
    <circle cx="64" cy="88" r="52"/>
    <circle cx="64" cy="88" r="43" stroke-width="4"/>
    <use xlink:href="#g1" transform="translate(64 88) scale(1.02) translate(-20 -30)"/>
    <circle cx="190" cy="88" r="52"/>
    <circle cx="190" cy="88" r="43" stroke-width="4"/>
    <use xlink:href="#g1" transform="translate(190 88) scale(1.02) translate(-20 -30)"/>
    <circle cx="316" cy="88" r="52"/>
    <circle cx="316" cy="88" r="43" stroke-width="4"/>
    <use xlink:href="#g1" transform="translate(316 88) scale(1.02) translate(-20 -30)"/>
</svg>
