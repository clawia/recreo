  <ellipse cx="50" cy="25" rx="30" ry="10" fill="none" stroke="#1c2733" stroke-width="6"/>
  <ellipse cx="50" cy="75" rx="30" ry="10" fill="none" stroke="#1c2733" stroke-width="6"/>
  <line x1="20" y1="25" x2="20" y2="75" stroke="#1c2733" stroke-width="6"/>
  <line x1="80" y1="25" x2="80" y2="75" stroke="#1c2733" stroke-width="6"/>
</svg>
