<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 32" width="64" height="32">
  <!-- Accent peint du fronton (proposition-ines-meuble-illustre.md). Ancre a droite du bandeau,
       jamais superpose au visage ni a l'emplacement de l'enseigne (zone de gauche laissee au seul
       fond uni). Couleurs litterales egales a la variable recreo cabinet fond (#081c2c) : la
       moitie gauche de ce dessin est un fondu vers l'opacite zero de cette meme teinte, pour se
       fondre avec le fond du bandeau sans coupure visible. Aucun texte, aucune forme dependante
       d'un contenu de jeu : cette image ne varie jamais (C5 clause 2). Note technique : un
       commentaire XML ne tolere jamais deux tirets consecutifs en son sein, d'ou l'absence du
       prefixe habituel de la variable CSS dans ce texte. -->
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123449"/>
      <stop offset="0.55" stop-color="#081c2c"/>
      <stop offset="1" stop-color="#04111c"/>
    </linearGradient>
    <linearGradient id="fondu" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#081c2c" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#081c2c" stop-opacity="1"/>
      <stop offset="1" stop-color="#081c2c" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="64" height="32" fill="url(#sheen)"/>
  <rect x="0" y="0" width="64" height="32" fill="url(#fondu)"/>
  <path d="M20,8 Q42,2 64,8" fill="none" stroke="#2f5770" stroke-width="1.1" stroke-linecap="round" opacity="0.55"/>
  <circle cx="34" cy="16" r="2" fill="#020a12"/>
  <circle cx="33.3" cy="15.3" r="0.55" fill="#2f5770"/>
  <polygon fill="#ffffff" opacity="0.55" points="58.5,12 59.27,14.45 61.86,14.45 59.76,15.99 60.53,18.37 58.5,16.9 56.47,18.37 57.24,15.99 55.14,14.45 57.73,14.45"/>
</svg>
