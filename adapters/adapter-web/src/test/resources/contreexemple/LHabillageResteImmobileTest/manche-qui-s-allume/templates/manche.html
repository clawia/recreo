<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Jeu fautif d'ADR-0033 : le balisage du cabinet tel que fragments/manche.html le porte depuis
     S8-1, sans une ligne de plus. Le sprint 10 ne le modifie pas - le manche vit sur un
     pseudo-element de .cabinet-bandeau, donc dans la feuille voisine, et c'est la qu'est le defaut.
     Ce gabarit est ce qui fait entrer "cabinet-bandeau" dans l'habillage : aucun element pressable ne
     porte cette classe. -->
<div class="ecran-de-jeu">
    <button type="button" class="btn sortir" data-role="sortie" hx-post="/retour" hx-target="#jeu">Les jeux</button>
    <div class="cabinet">
        <div class="cabinet-bandeau" aria-hidden="true"></div>
        <form class="propositions">
            <button type="submit" class="btn proposition" data-role="action">an</button>
            <button type="submit" class="btn proposition" data-role="action">on</button>
            <button type="submit" class="btn proposition" data-role="action">in</button>
        </form>
        <div class="cabinet-socle" aria-hidden="true"></div>
    </div>
</div>
</body>
</html>
