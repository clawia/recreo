# ADR-0106 : une ligne par matiere servie. "matiere" est la valeur exacte du descripteur des paquets
# (ADR-0049). L'ordre des lignes est l'ordre d'affichage, le meme a tous les niveaux et dans les deux
# vues (N5 et APM-4 de nadia-prof). Libelles : N1 et APM-1. Pictogrammes : fichiers de
# adapter-web/src/main/resources/static/images/matieres/, N2 et APM-2. Teintes : N6, APM-5 et APM-6.
# Deux valeurs attendent un arbitrage : le pictogramme de Maths (APM-2) et la teinte de Histoire des
# arts (APM-6) ; ChaqueMatiereServieASaLigneDeMatiereTest et LePictogrammeDeMatiereEstUnFichierArbitreTest
# les nomment dans un cliquet exact.
matieres:
  - matiere: "Français"
    libelle: "Français"
    pictogramme: francais.svg
    teinteFond: "#cfe3f6"
    teinteContour: "#2f6c9f"
    segment: francais
  - matiere: "Mathématiques"
    libelle: "Maths"
    pictogramme: mathematiques.svg
    teinteFond: "#f4e3a1"
    teinteContour: "#7d6208"
