schema: 1
id: ce1-additions-posees
type: question
#
# S45-MAT-ADDITION (MAT-CE1-04), arbitrage de nadia-prof cite dans
# squad/conformite/ARBITRAGE-PREALABLE-s43-mathematiques-ce1-lot-1.md, section 4. Verdict : ACCEPTE
# SOUS CONDITIONS, avec mention de couverture partielle.
#
# ADP-CE1-1, mention de couverture partielle exigee d'avance par nadia-prof, a reprendre telle
# quelle dans la matrice par camille-po - sans elle, la ligne ne ferme pas :
#   "le resultat atteste le calcul ; la technique posee elle-meme - disposition en colonnes,
#   retenues - n'est ni montree ni verifiee par le produit."
#
# ADP-CE1-5 : chaque distracteur correspond a une erreur classique nommee et declaree ici, parmi
# trois formes seulement (definition qui fait foi, ARBITRAGE-PREALABLE-s45-cinq-lots.md, section 2) :
#   - oubliee(retenue) : la retenue n'est pas ajoutee a la colonne suivante (48 + 26 -> 64).
#   - reportee(retenue) : la retenue est ajoutee deux fois a la colonne suivante.
#   - mauvaise-colonne : la retenue des unites est ajoutee a la colonne des centaines en sautant
#     celle des dizaines (items a trois chiffres uniquement).
# "retenue" vaut "unites", "dizaines" ou "les-deux" quand l'item porte deux retenues distinctes.
# Chaque marqueur est relu et compare au calcul par PaquetCe1AdditionsPoseesTest.
#
# ADR-0103 : ce paquet declare MAT-CE1-04, pas MAT-CE1-03 - il sort donc du perimetre de
# ChaquePaquetDAdditionsDeCe1TientSaRepartitionParFormeTest (ADD-CE1-2), qui ne porte que sur les
# paquets d'additions de MAT-CE1-03. La separation d'avec MAT-CE1-03 est tenue par ADP-CE1-2 et
# ADP-CE1-3, encodees dans le test de ce paquet.
