schema: 1
id: cm1-perimetre
type: question
descripteur:
  matiere: "Mathematiques"
  niveau: "CM1"
  domaine: "Grandeurs et mesures"
  competence: "Calculer un périmètre de figures usuelles (carré, rectangle)"
items:
  - enonce: "Le périmètre d'une figure, c'est..."
    bonneReponse: "la longueur de son contour"
    distracteurs: ["sa surface intérieure", "le nombre de ses côtés"]
    indice: "Ce n'est pas la surface, c'est le tour."
  - enonce: "Comment calcule-t-on le périmètre d'un carré ?"
    bonneReponse: "côté × 4"
    distracteurs: ["côté × 2", "côté × côté"]
    indice: "Un carré a quatre côtés égaux."
  - enonce: "Quel est le périmètre d'un carré de côté 5 cm ?"
    bonneReponse: "20 cm"
    distracteurs: ["25 cm", "10 cm"]
    indice: "Multiplie la longueur d'un côté par quatre."
