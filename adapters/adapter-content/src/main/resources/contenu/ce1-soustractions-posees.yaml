schema: 1
id: ce1-soustractions-posees
type: question
#
# S46-MAT-SOUSTRACTION (MAT-CE1-05), arbitrage de nadia-prof cite dans
# squad/conformite/ARBITRAGE-PREALABLE-s43-mathematiques-ce1-lot-1.md, section 5.2, et amende le
# 2026-10-01 par squad/conformite/FICHE-bandit-manchot-soustractions-posees-ce1.md (section 2).
# Verdict : ACCEPTE SOUS CONDITIONS, avec mention de couverture partielle.
#
# SOP-CE1-1, mention de couverture partielle exigee d'avance par nadia-prof, a reprendre telle
# quelle dans la matrice par camille-po - sans elle, la ligne ne ferme pas :
#   "le resultat atteste le calcul ; la technique posee elle-meme - disposition en colonnes,
#   emprunts - n'est ni montree ni verifiee par le produit."
#
# SOP-CE1-5 (amendee le 2026-10-01, quatre formes et seulement celles-la) : chaque distracteur
# correspond a une erreur classique nommee et declaree ici :
#   - oubliee : soustraction colonne par colonne en valeur absolue, sans emprunt (52 - 27 -> 35).
#   - non-reportee : l'emprunt est pris localement sur sa colonne mais n'est jamais reporte a la
#     colonne suivante (347 - 129 -> 228).
#   - somme : l'addition au lieu de la difference (a + b). Seule forme disponible sur un item sans
#     aucun emprunt ; cet item ne porte alors qu'une seule proposition de plus que la bonne
#     reponse.
#   - reportee-deux-fois(colonne) : pour un emprunt reellement fait sur la colonne "unites" ou
#     "dizaines", la colonne suivante perd 2 au lieu de 1 (valeur = bonne reponse - 10^(rang+1)).
#     Admise seulement si la colonne qui recoit l'emprunt en double ne change pas de statut
#     d'emprunt par rapport au calcul juste - sinon l'item porterait deux erreurs enchainees.
# Chaque marqueur est relu et compare au calcul par PaquetCe1SoustractionsPoseesTest, y compris la
# regle d'admission de la quatrieme forme.
#
# SOP-CE1-5, regle de rang sur le paquet entier (items a deux propositions compris) : choisir
# toujours la plus petite proposition ne donne pas la bonne reponse sur plus de la moitie des
# items. Verifiee par PaquetCe1SoustractionsPoseesTest, en plus du garde-fou generique qui ne lit
# que les items a trois propositions.
#
# SOP-CE1-3 : ce paquet declare MAT-CE1-05, pas MAT-CE1-03 - au moins les deux tiers des items
# mettent en jeu un nombre de trois chiffres ou un premier terme superieur a 100, pour ne pas
# reproduire sous un autre code la matiere deja servie par ce1-soustractions-jusqu-a-100.
descripteur:
  matiere: "Mathématiques"
  niveau: "CE1"
  domaine: "Nombres et calculs"
  competence: "Poser et effectuer une soustraction (nombres à deux ou trois chiffres)"
lignesDeReferentiel: ["MAT-CE1-05"]
