# S51-MAT-SYMETRIE (MAT-CE1-17, DEC-0110 sections 1 et 5, DEC-0111 section 5 et amendement A.5 a A.7,
# instance C). Arbitrage prealable de s43 (squad/conformite/ARBITRAGE-PREALABLE-s43-mathematiques-ce1-
# lot-3.md, section 3) : SYM-CE1-1 a SYM-CE1-3, bornes de grille de DEP-CE1-2. Contraintes de dessin :
# squad/design/contrainte-ines-s52-dessins-de-l-instance-c-mathematiques-ce1.md, sections 2 et 4 ;
# reponses de nadia-prof (ARBITRAGE-PREALABLE-s52-instance-c-reponses.md), sections 2 a 5.
#
# Onze items, un dessin par item (deux items sur un meme dessin seraient le meme ecran) : six items
# "reconnaitre un axe" sur une figure traversee de trois lignes candidates, cinq items "completer par
# symetrie" sur un quadrillage de 4 x 4 ou 6 x 6. Les libelles de zone se lisent hors de la boite
# (ADR-0094) : le bouton porte son numero de repere, la legende sous le dessin en liste les libelles.
#
# SYM-CE1-1 : l'enonce nomme l'axe sans decrire la propriete ; la reponse est dans le dessin.
# SYM-CE1-2 : quatre figures sur six (a, b, c, e) portent une ligne candidate qui coupe la figure en deux
# parties de meme aire sans etre un axe (diagonale du rectangle, mediane du triangle, droite par le
# centre du carre) ; une seule ligne par item est un axe. Les lignes d'un item ont toutes le meme trait.
# SYM-CE1-3 : l'axe est trace sur la ligne centrale du quadrillage ; la figure est complete de l'autre
# cote sauf une case ; les zones sont les seules cases vides candidates : la case attendue, la case
# obtenue par glissement (la figure recopiee sans etre retournee), une voisine de la case attendue,
# et au plus une autre case vide qui touche la figure ; la case attendue n'est jamais la seule
# candidate qui touche la figure. Les axes vertical et horizontal sont tous deux servis.
#
# Zones : 16 x 16 unites sur les figures (marge de dessin d'ines-design, la barre de nadia-prof etant
# 15 unites, DEC-0111 A.7), une case entiere sur les quadrillages (16 unites sur 6 x 6, 24 sur 4 x 4).
# L'onglet de la ligne axe n'est pas toujours au meme endroit, et la bonne zone n'est ni toujours la
# premiere ni toujours la derniere declaree. Les controles geometriques sont rejoues par
# LesFiguresDeSymetrieMontrentCeQueLeursItemsAffirmentTest (module bootstrap).
