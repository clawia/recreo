# S26-L5 (DEC-0068 ; ARBITRAGE-PREALABLE-s26-la-voix-est-un-adulte.md, section 4.5). Premier
# paquet à réponse alphabétique sur la mécanique de saisie.
#
# VOI-9 (partiellement testable ; la régularité réelle reste jugée par nadia-prof) : douze mots
# réguliers, une ou deux syllabes, aucune lettre muette finale hors la finale en -e déjà apprise au
# CP. Aucun mot ne porte de consonne finale muette (pas de -t, -d, -s, -x silencieux).
#
# exigenceDeForme: libre - même lecture que cp-complements-10-saisie : la compétence porte sur les
# correspondances grapheme/phonème, pas sur une tolérance de forme à durcir sans motif.
#
# formesAcceptees vide sur chaque item : SAI-1 (accent), SAI-3 (casse) et SAI-4 (espaces) sont
# tenues automatiquement par NormalisationDeSaisie, sans qu'aucune écriture alternative n'ait à
# être énumérée ici.
#
# Correction du 2026-09-01 (nadia-prof, réserve non bloquante de son refus) : "gomme" et "bulle"
# ne se déduisaient pas du son - "gome" et "bule" se liraient exactement pareil, le doublement de
# la consonne y étant une mémoire d'orthographe plutôt qu'une correspondance grapheme/phonème
# (motif de VOI-9). Remplacés par "brosse" et "trousse" : le "s" simple entre deux voyelles s'y
# lirait [z] ("brose", "trouse"), donc le doublement s'y déduit du son entendu - même règle du
# programme de CP que "tasse", déjà dans ce paquet.
exigenceDeForme: libre
