schema: 1
id: cm1-sciences-melanges
type: question
descripteur:
  matiere: "Sciences et technologie"
  niveau: "CM1"
  domaine: "Matière, mouvement, énergie, information"
  competence: "Distinguer un mélange homogène d'un mélange hétérogène et identifier un moyen de séparer les constituants d'un mélange."
lignesDeReferentiel: ["SCI-CM1-02"]
#
# S30-2 (docs/backlog/backlog.md, sprint 30). Premier des deux paquets du second lot de sciences et
# technologie CM1 (DEC-0079, arbitrage prealable de nadia-prof du 2026-09-06, section 2.8 - ligne
# jugee la moins couteuse du lot avec la ligne 12). Referentiel copie conforme
# (squad/programme/sciences-et-technologie/competences-cm1.md, SCI-CM1-02).
#
# Trois elements du libelle a servir en bonne reponse (FER-1) : "homogène", "hétérogène" et "un moyen
# de séparation" - le libelle est au singulier sur ce dernier point, un seul moyen suffit. Deux
# taches distinctes (FER-3) : tache A, classer un mélange décrit comme homogène ou hétérogène (six
# items) ; tache B, choisir le moyen qui sépare les constituants d'un mélange donné (cinq items).
#
# Chaque item ne demande qu'une seule propriété ou un seul critère a la fois, jamais deux dans le
# même item (critère explicite du backlog, S30-2).
#
# SCI-1 (l'indice dit pourquoi une conception fausse courante est fausse, sans nommer la bonne
# reponse) et SCI-4 (l'item porte alors trois propositions au moins) : l'item eau/huile (tache A)
# porte en distracteur la conception fausse qu'un mélange semblant uniforme juste après avoir été
# remué serait homogène, alors qu'il se sépare vite - l'indice le corrige sans jamais ecrire
# "hétérogène" en toutes lettres.
#
# indicesNommentLaReponse n'est pas pose sur ce paquet (absent, vaut faux) : les indices sont donc
# affiches par la mecanique des la premiere reponse fausse (M21, SCI-1).
#
# CON-1 : aucun item ne se resout sans connaitre le mélange qu'il décrit.
#
# HIS-3 (chaque fait porte sa source) : la distinction homogène/hétérogène et les quatre moyens de
# séparation cités (filtration, évaporation, décantation, tri magnétique) sont des faits de sciences
# physiques de base, enseignés au cycle 3, sans controverse scientifique.
#
# CYC-1 : cette ligne ne recoupe aucun paquet de cycle 2 deja servi (aucune ligne de questionner le
# monde CP ne porte sur les mélanges) - vacante, non tenue.
#
# FER-2 (densite) : onze items, strictement superieur aux dix manches par defaut (DEC-0064).
#
# Reprise S31-5 (docs/backlog/backlog.md, sprint 31 - squad/conformite/FICHE-bandit-manchot-
# melanges-cm1.md, reserves MEL-R1 a MEL-R3, nadia-prof, 2026-09-06) : trois corrections, aucune
# bloquante, la ligne reste couvert-valide.
# - MEL-R1 : l'indice de l'item du sel disait "il faut faire disparaître l'eau" - l'eau ne
#   disparait pas, elle se vaporise, et c'est justement ce que SCI-CM1-01 doit enseigner. La
#   seconde phrase de l'indice ne dit plus que l'eau disparait, ne nomme plus le geste a faire, et
#   ne nomme plus la bonne reponse en d'autres mots. Corrige dans le meme geste : l'indice de
#   l'item du sirop de menthe parlait d'une "carafe" alors que son enonce parle d'un "bol".
# - MEL-R2 : l'enonce de l'item de decantation ecrivait sa reponse dans sa propre question ("on
#   laisse reposer" pour la bonne reponse "laisser reposer le mélange"). L'enonce decrit desormais
#   le resultat observe (l'eau redevenue claire, la terre deposee au fond) sans nommer le geste.
# - MEL-R3 : la troisieme proposition de l'item eau/huile ("un mélange qui n'existe pas") ne
#   jouait pas le role d'un candidat plausible que SCI-4 lui donne. Remplacee par une proposition
#   qu'un enfant confronte a l'aspect trompeur du melange (uniforme juste apres avoir remue, puis
#   separe) pourrait vraiment donner.
items:
  - enonce: "Dans un verre, on mélange de l'eau et du sucre. Après avoir bien remué, on ne voit plus le sucre. Quel type de mélange est-ce ?"
    bonneReponse: "un mélange homogène"
    distracteurs: ["un mélange hétérogène"]
    indice: "On ne distingue plus les deux produits l'un de l'autre, même en regardant de près."
  - enonce: "On mélange de l'eau et de l'huile dans un verre. Juste après avoir remué, le mélange semble uniforme, mais on voit vite deux couches se former. Quel type de mélange est-ce ?"
    bonneReponse: "un mélange hétérogène"
    distracteurs: ["un mélange homogène", "un mélange qui n'est ni homogène ni hétérogène"]
    indice: "Même remué, ce mélange ne reste pas uniforme bien longtemps. Les deux liquides finissent toujours par se séparer."
  - enonce: "Dans un verre, on mélange de l'eau et du sable. Le sable retombe au fond du verre. Quel type de mélange est-ce ?"
    bonneReponse: "un mélange hétérogène"
    distracteurs: ["un mélange homogène"]
    indice: "On distingue encore les deux produits, même après avoir remué."
  - enonce: "Dans un verre, on mélange de l'eau et du sel. Après avoir remué, on ne voit plus les grains de sel. Quel type de mélange est-ce ?"
    bonneReponse: "un mélange homogène"
    distracteurs: ["un mélange hétérogène"]
    indice: "Les grains ont disparu à l'œil, comme le sucre dans l'eau sucrée."
  - enonce: "Dans une carafe, on mélange de l'eau et des morceaux de fraise. On voit bien les morceaux flotter dans l'eau. Quel type de mélange est-ce ?"
    bonneReponse: "un mélange hétérogène"
    distracteurs: ["un mélange homogène"]
    indice: "Les morceaux restent visibles, distincts de l'eau qui les entoure."
  - enonce: "Dans un bol, on mélange de l'eau et du sirop de menthe. Le liquide devient vert partout, sans qu'on distingue le sirop. Quel type de mélange est-ce ?"
    bonneReponse: "un mélange homogène"
    distracteurs: ["un mélange hétérogène"]
    indice: "Tout le bol a la même couleur, du haut jusqu'en bas."
  - enonce: "On veut séparer le sable de l'eau, dans un mélange eau-sable. Quel moyen utiliser ?"
    bonneReponse: "utiliser un filtre"
    distracteurs: ["utiliser un aimant", "utiliser une éponge"]
    indice: "Ce moyen laisse passer l'eau et retient les grains les plus gros."
  - enonce: "On veut récupérer le sel d'une eau salée, en gardant seulement le sel. Quel moyen utiliser ?"
    bonneReponse: "laisser l'eau s'évaporer"
    distracteurs: ["utiliser un filtre", "utiliser un aimant"]
    indice: "Le sel dissous ne peut pas être retenu par un filtre. Il reste caché dans l'eau tant que celle-ci garde sa forme liquide."
  - enonce: "Dans un mélange de sable et de petits morceaux de fer, quel moyen permet de séparer le fer ?"
    bonneReponse: "utiliser un aimant"
    distracteurs: ["utiliser un filtre", "laisser reposer le mélange"]
    indice: "Ce moyen attire un seul des deux produits du mélange, jamais le sable."
  - enonce: "Dans un verre d'eau trouble avec de la terre, après un long moment sans qu'on y touche, l'eau est redevenue claire et la terre s'est déposée au fond. Quel moyen a-t-on utilisé pour séparer la terre ?"
    bonneReponse: "laisser reposer le mélange"
    distracteurs: ["utiliser un aimant", "faire chauffer le mélange"]
    indice: "Avec le temps, le plus lourd des deux produits tombe tout seul au fond."
  - enonce: "On veut séparer des pâtes cuites de leur eau de cuisson. Quel moyen utiliser ?"
    bonneReponse: "utiliser une passoire"
    distracteurs: ["utiliser un aimant", "laisser l'eau s'évaporer"]
    indice: "Ce moyen laisse couler l'eau et retient ce qui est trop gros pour passer par les trous."
