schema: 1
id: cp-ranger-nombres
type: question
descripteur:
  matiere: "Mathématiques"
  niveau: "CP"
  domaine: "Nombres et calculs"
  competence: "Ranger des nombres entiers jusqu'à 100 dans l'ordre croissant"
lignesDeReferentiel: ["MAT-CP-02"]
#
# S23-RAN (squad/conformite/ARBITRAGE-PREALABLE-s23-huit-candidats-six-de-contenu-seul-et-deux-de-
# niveau-2.md, section 1, RAN-1 a RAN-8, section 12.2 amendements RAN-4b/RAN-5b du 2026-08-30).
# Ferme la moitie "ranger" de la ligne mathematiques | CP | Nombres et calculs | Comparer et ranger
# des nombres jusqu'a 100 (<, >, =), en cours depuis s09 ; la moitie "comparer" est deja servie par
# cp-comparer-nombres.
#
# RAN-1 : chaque item presente trois entiers ; chacune des trois propositions est une liste des
# memes trois nombres, ecrite "a, b, c". La consigne du jeu (catalogue.yaml) fixe l'ordre croissant
# pour tout le paquet et ne change jamais de sens d'un item a l'autre.
#
# RAN-4 / RAN-4b : deux familles de distracteurs, jamais d'autres, recalculables depuis les trois
# nombres :
#   (a) les trois nombres dans le sens inverse de la consigne (ordre decroissant) ;
#   (b) les trois nombres ranges en ne comparant que leur chiffre des unites.
# RAN-4b (amendement du 2026-08-30) : la famille (b) n'est definie que si les trois chiffres des
# unites sont deux a deux distincts - aucun triplet de ce paquet n'a deux nombres de meme chiffre
# des unites. Aucun triplet retenu ne laisse en outre la famille (b) reproduire la famille (a) ou la
# bonne reponse (verifie a la generation, sur la population entiere des candidats).
#
# RAN-2 / RAN-3 : entiers de 0 a 100, deux a deux distincts par item ; toute proposition "a, b, c"
# tient sur 12 caracteres au plus (la plus longue de ce paquet en fait 11).
#
# RAN-5b (amendement du 2026-08-30, remplace RAN-5) : sur au moins la moitie des items, au moins un
# distracteur commence par le meme nombre que la bonne reponse - RAN-5 d'origine se contentait d'un
# partage entre les deux distracteurs, ce qui laissait le raccourci "premier nombre le plus petit"
# entierement gagnant. Tenu sur 13 items sur 24 (>= 12 requis).
# RAN-6 : au moins un tiers des items opposent deux nombres de la meme dizaine - tenu sur 9 items
# sur 24 (>= 8 requis).
#
# RAN-7 : l'indice donne une methode, jamais le triplet range, et est choisi pour son item -
# jamais distribue par un cycle independant du contenu (correctif du 2026-08-30, REFUS de
# nadia-prof du meme jour, FICHE-bandit-manchot-ranger-nombres-cp.md). Deux contraintes
# tiennent l'appariement, verifiees par le test : "Compare le nombre de chiffres de chaque
# nombre." n'est affectee qu'aux items ou les trois nombres n'ont pas tous le meme nombre de
# chiffres (sinon la methode ne separe rien) ; "Regarde d'abord les dizaines..." et "Compare
# les dizaines, puis les unites si besoin." ne sont affectees qu'aux items sans le nombre 100
# (son chiffre des dizaines lu seul, 0, le fait confondre avec un nombre a un chiffre - c'est
# exactement l'erreur factuelle que nadia-prof a vue en jouant sur les items alors 16 et 22).
# RAN-8 : vingt-quatre items, aucun triplet ne se repete.
#
# ADR-0068 : les propositions de ce paquet sont des listes ordonnees de trois nombres, pas des
# valeurs scalaires uniques - "cp-ranger-nombres" est donc declare hors du domaine numerique des
# garde-fous generiques de rang (voir LeRangDeLaBonneReponseNEstPasPredictibleSurUnPaquetTest,
# PAQUETS_HORS_DU_DOMAINE_NUMERIQUE), qui ne jugent que des propositions a valeur scalaire unique.
