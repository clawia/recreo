#   est reecrit en consequence, il ne pointe plus vers un mot a retrouver mais vers ce que le texte
#   affirme. Le premier item garde son texte-support inchange (bonne reponse, indice, distracteur
#   "un edit royal") : la reserve demande qu'au moins un des deux items porte sur un support ou le mot
#   de la reponse n'apparait pas, ce que le second tient desormais.
# - HG-R7 (mot pour mot) : le texte-support de l'item sur la prise de la Bastille disait que sa chute
#   "devient, des l'annee suivante, une fete nationale" - le 14 juillet n'est fete nationale que
#   depuis 1880. Remplace par le texte fourni par nadia-prof. Enonce, bonne reponse, distracteurs et
#   indice inchanges.
items:
  - enonce: "Quelle grande période vient juste après la Préhistoire ?"  # HIS-1: ordre ; HIS-3: ordre des périodes donné par le référentiel (arbitrage s27, section 5, ligne 1)
    bonneReponse: "l'Antiquité"
    distracteurs: ["le Moyen Âge", "l'époque contemporaine"]
    indice: "Repense à l'ordre des grandes périodes que tu as appris."
    ligneDeReferentiel: "HG-CM1-01"
  - enonce: "Quelle grande période vient juste après le Moyen Âge ?"  # HIS-1: ordre ; HIS-3: ordre des périodes donné par le référentiel (arbitrage s27, section 5, ligne 1)
    bonneReponse: "les Temps modernes"
    distracteurs: ["l'Antiquité", "l'époque contemporaine"]
    indice: "Le Moyen Âge se termine, une nouvelle période commence avant l'époque contemporaine."
    ligneDeReferentiel: "HG-CM1-01"
  - enonce: "La Révolution française commence en 1789. En quel siècle cela se passe-t-il ?"  # HIS-1: restitution ; HIS-3: date 1789 donnée par le référentiel (ligne 7), conversion en siècle par convention calendaire (XVIIIe siècle = 1701-1800)
    bonneReponse: "le XVIIIe siècle"
    distracteurs: ["le XVIIe siècle", "le XIXe siècle"]
    indice: "Compte les centaines d'années. 1789 se situe entre 1701 et 1800, donc au XVIIIe siècle."
    ligneDeReferentiel: "HG-CM1-02"
  - enonce: "Des arènes et des aqueducs en pierre ont été construits en Gaule durant l'Antiquité. Quel peuple les a construits ?"  # HIS-1: association ; HIS-3: patrimoine romain en Gaule (arènes, aqueducs), fait consensuel du programme cycle 3 - je n'ai pas d'outil de recherche en ligne cette session, nadia-prof doit confirmer
    bonneReponse: "les Romains"
    distracteurs: ["les Vikings", "les Égyptiens"]
    indice: "Pense au peuple de l'Antiquité qui a laissé le plus de traces de pierre en Gaule."
    ligneDeReferentiel: "HG-CM1-03"
  - enonce: "À partir du IVe siècle, des peuples venus du nord et de l'est s'installent dans l'Empire romain. Les Francs sont l'un d'eux. Comment appelle-t-on ces peuples ?"  # HIS-1: restitution ; HIS-3: reformulation de nadia-prof qui retire le besoin de source (arbitrage du 2026-09-03, section 3.4) - "l'ensemble" retire, la réponse ne prétend plus à une couverture totale (les Huns, par exemple, n'entrent pas dans "peuples germaniques")
    bonneReponse: "les peuples germaniques"
    distracteurs: ["les peuples grecs", "les peuples gaulois"]
    indice: "Ce ne sont ni les Grecs ni les Gaulois, déjà installés bien avant."
    ligneDeReferentiel: "HG-CM1-04"
  - enonce: "Quel roi de France a fait construire le château de Versailles ?"  # HIS-1: association ; HIS-3: association donnée par le référentiel lui-même (ligne 6, Louis XIV et Versailles)
    bonneReponse: "Louis XIV"
    distracteurs: ["Henri IV", "François Ier"]
    indice: "C'est le roi au plus long règne de l'histoire de France."
    ligneDeReferentiel: "HG-CM1-06"
  - enonce: "Quel roi de France a signé l'édit de Nantes ?"  # HIS-1: association ; HIS-3: référentiel ligne 6 (Henri IV et l'édit de Nantes), date 1598 consensuelle
    bonneReponse: "Henri IV"
    distracteurs: ["Louis IX", "Louis XIV"]
    indice: "Ce roi a mis fin à des années de guerres de religion en 1598."
    ligneDeReferentiel: "HG-CM1-06"
  - enonce: "Quel roi de France a participé à une croisade ?"  # HIS-1: association ; HIS-3: référentiel ligne 6 (Louis IX et la croisade)
    bonneReponse: "Louis IX"
    distracteurs: ["François Ier", "Henri IV"]
    indice: "Ce roi est aussi appelé Saint Louis."
    ligneDeReferentiel: "HG-CM1-06"
  - enonce: "Sous quel roi de France le château de Chambord est-il construit, témoin de la Renaissance ?"  # HIS-1: association ; HIS-3: référentiel ligne 6 (François Ier et la Renaissance), château de Chambord
    bonneReponse: "François Ier"
    distracteurs: ["Louis IX", "Henri IV"]
    indice: "Ce roi a régné au début du XVIe siècle, en pleine Renaissance."
    ligneDeReferentiel: "HG-CM1-06"
  - enonce: "En 1789, quel événement marque le début de la Révolution française à Paris ?"  # HIS-1: restitution ; HIS-3: date du 14 juillet 1789, fait consensuel enseigné nationalement
    bonneReponse: "la prise de la Bastille"
    distracteurs: ["le sacre de Napoléon", "la signature de l'édit de Nantes"]
    indice: "C'est une prison parisienne, symbole du pouvoir du roi."
    ligneDeReferentiel: "HG-CM1-07"
  - enonce: "Parmi ces trois événements de la Révolution française, lequel a eu lieu le premier ?"  # HIS-1: ordre ; HIS-3: dates du 14 juillet 1789, du 26 août 1789 et de septembre 1792, faits consensuels
    bonneReponse: "la prise de la Bastille"
    distracteurs: ["la fin de la monarchie", "la Déclaration des droits de l'homme et du citoyen"]
    indice: "Repense à la date du 14 juillet 1789, la plus ancienne des trois."
    ligneDeReferentiel: "HG-CM1-07"
  - enonce: "Quel événement a eu lieu juste après l'abolition des privilèges, la même année 1789 ?"  # HIS-1: ordre ; HIS-3: dates du 4 août et du 26 août 1789, faits consensuels
    bonneReponse: "la Déclaration des droits de l'homme et du citoyen"
    distracteurs: ["la prise de la Bastille", "la fin de la monarchie"]
    indice: "Ce texte est adopté le 26 août, quelques semaines après l'abolition des privilèges du 4 août."
    ligneDeReferentiel: "HG-CM1-07"
  - enonce: "En 1804, Napoléon Bonaparte se fait sacrer empereur, alors que la Révolution avait aboli la monarchie en 1792. Quel nouveau régime politique commence donc en 1804 ?"  # HIS-1: ordre ; HIS-3: sacre de Napoléon en 1804 et fin de la monarchie en 1792, faits consensuels
    bonneReponse: "l'Empire"
    distracteurs: ["la monarchie absolue", "la République romaine"]
    indice: "Ce n'est pas un retour à la monarchie, puisqu'elle a déjà été abolie."
    ligneDeReferentiel: "HG-CM1-08"
  - enonce: "Un centre-ville avec de nombreux immeubles et des commerces est appelé comment ?"  # HIS-1: restitution ; HIS-3: vocabulaire du programme de géographie cycle 3 (référentiel ligne 11)
    bonneReponse: "un espace urbain"
    distracteurs: ["un espace rural", "un espace périurbain"]
    indice: "Pense au mot qui désigne la ville, par opposition à la campagne."
    ligneDeReferentiel: "HG-CM1-11"
  - enonce: "Dans un espace touristique de montagne, quelle activité se développe surtout en hiver ?"  # HIS-1: association ; HIS-3: fait géographique général, non daté (référentiel ligne 12)
    bonneReponse: "le tourisme lié au ski"
    distracteurs: ["la pêche en mer", "la culture de la vigne"]
    indice: "Pense à la neige et aux pistes."
    ligneDeReferentiel: "HG-CM1-12"
  - enonce: "Dans de nombreux espaces ruraux, quelle activité occupe traditionnellement le plus grand nombre d'habitants qui y travaillent ?"  # HIS-1: association ; HIS-3: fait géographique général, famille (a) (référentiel ligne 11) ; HG-R3 (nadia-prof, 2026-09-03) : les deux distracteurs absurdes sont remplacés par deux activités réellement présentes en espace rural, et l'énoncé est nuancé ("de nombreux", "traditionnellement") pour ne plus réduire l'espace rural à un seul trait (BIA-2 étendue) - voir aussi, plus bas, l'item sur le village de pêcheurs, où l'activité dominante n'est pas agricole
    bonneReponse: "l'agriculture"
    distracteurs: ["l'artisanat local", "le tourisme vert"]
    indice: "Pense aux champs cultivés, tout en sachant que d'autres métiers existent aussi à la campagne."
    ligneDeReferentiel: "HG-CM1-11"
  - enonce: "L'électricité qui alimente nos maisons est produite dans des lieux spécifiques avant d'être acheminée par des câbles. Comment appelle-t-on un de ces lieux de production ?"  # HIS-1: restitution ; HIS-3: vocabulaire technique standard (référentiel ligne 13)
    bonneReponse: "une centrale électrique"
    distracteurs: ["une usine de traitement de l'eau", "un entrepôt agricole"]
    indice: "Pense à l'endroit où l'on fabrique l'électricité."
    ligneDeReferentiel: "HG-CM1-13"
  - enonce: "D'après ce texte, en quelle année ce document est-il adopté ?"  # HIS-1: document ; HIS-3: texte construit sur le fait du référentiel ligne 7 (1789, Déclaration des droits de l'homme et du citoyen)
    texteSupport: "Le 26 août 1789, l'Assemblée nationale adopte un texte majeur de la Révolution française. Il affirme que les hommes naissent et demeurent libres et égaux en droits."
    bonneReponse: "en 1789"
    distracteurs: ["en 1804", "en 1610"]
    indice: "Relis la première phrase du texte, elle donne la date."
    ligneDeReferentiel: "HG-CM1-14"
  - enonce: "D'après ce texte, que peut-on dire de la vie quotidienne de Louis XIV à Versailles ?"  # HIS-1: document ; HIS-3: cérémonial du lever et du coucher du roi à Versailles, caractérisation historique documentée - je n'ai pas d'outil de recherche en ligne cette session, nadia-prof doit confirmer
    texteSupport: "Chaque matin, Louis XIV se lève devant des dizaines de nobles qui se disputent l'honneur de lui tendre sa chemise. Le soir, il ne peut ni manger ni se coucher sans qu'un cérémonial précis ne soit respecté devant toute la cour."
    bonneReponse: "elle suit des règles très strictes et se déroule en public"
    distracteurs: ["elle se déroule dans le calme et la solitude", "elle est identique à celle des paysans du royaume"]
    indice: "Repense au nombre de personnes présentes autour du roi, du matin au soir."
    ligneDeReferentiel: "HG-CM1-14"
  - enonce: "D'après ce texte, que représentait cette prison pour les habitants de Paris avant sa prise ?"  # HIS-1: document ; HIS-3: symbole de la Bastille comme instrument du pouvoir royal, fait consensuel
    texteSupport: "En 1789, des habitants de Paris prennent d'assaut une vieille prison qui servait aussi à enfermer des opposants au roi. Sa chute est fêtée dans toute la ville et, l'année suivante, une grande fête réunit la France entière pour son anniversaire."
    bonneReponse: "le pouvoir absolu et l'autorité du roi"
    distracteurs: ["un simple lieu de commerce", "un monument touristique"]
    indice: "Repense à qui la prison enfermait, en plus des prisonniers ordinaires."
    ligneDeReferentiel: "HG-CM1-14"
  - enonce: "Une zone d'habitations pavillonnaires et de zones commerciales, construite en bordure d'une grande ville et reliée à elle par des transports, comment appelle-t-on cet espace ?"  # HIS-1: restitution ; HIS-3: vocabulaire du programme de géographie cycle 3, famille (a) (référentiel ligne 11) ; FER-1 (nadia-prof) : l'espace périurbain, absent jusqu'ici et servi seulement en distracteur, est ici en bonne réponse
    bonneReponse: "un espace périurbain"
    distracteurs: ["un espace urbain", "un espace rural"]
    indice: "Ce n'est ni le centre-ville ni la campagne : c'est tout autour de la ville."
    ligneDeReferentiel: "HG-CM1-11"
  - enonce: "De grandes parcelles cultivées, peu d'habitations et de longues distances entre les fermes : de quel type d'espace s'agit-il ?"  # HIS-1: restitution ; HIS-3: vocabulaire du programme de géographie cycle 3, famille (a) (référentiel ligne 11)
    bonneReponse: "un espace rural"
    distracteurs: ["un espace urbain", "un espace périurbain"]
    indice: "Pense à la campagne, avec ses champs et ses fermes espacées."
    ligneDeReferentiel: "HG-CM1-11"
  - enonce: "Dans un espace périurbain, comment la plupart des habitants se déplacent-ils le plus souvent pour aller travailler en ville ?"  # HIS-1: association ; HIS-3: fait géographique général, famille (a) (référentiel ligne 11)
    bonneReponse: "en voiture"
    distracteurs: ["en tramway", "à pied"]
    indice: "Les distances entre les maisons et la ville sont assez grandes, et les transports en commun y sont souvent rares."
    ligneDeReferentiel: "HG-CM1-11"
  - enonce: "Dans un espace périurbain, quel type de logement est le plus fréquent ?"  # HIS-1: association ; HIS-3: fait géographique général, famille (a) (référentiel ligne 11)
    bonneReponse: "des maisons individuelles avec un jardin"
    distracteurs: ["des immeubles de plus de dix étages", "des fermes isolées"]
    indice: "Ce sont des maisons avec un peu de terrain, ni en plein centre-ville ni loin de tout."
    ligneDeReferentiel: "HG-CM1-11"
  - enonce: "Dans un espace urbain, quel type de logement est le plus fréquent ?"  # HIS-1: association ; HIS-3: fait géographique général, famille (a) (référentiel ligne 11)
    bonneReponse: "des immeubles collectifs"
    distracteurs: ["des maisons individuelles avec un grand jardin", "des fermes isolées"]
    indice: "Pense à la place qui manque en ville pour construire des maisons avec un grand jardin."
    ligneDeReferentiel: "HG-CM1-11"
  - enonce: "Dans un espace urbain, la densité de population - le nombre d'habitants au kilomètre carré - est-elle en général plus élevée ou plus faible que dans un espace rural ?"  # HIS-1: association ; HIS-3: fait géographique général, famille (a) (référentiel ligne 11)
    bonneReponse: "plus élevée"
    distracteurs: ["plus faible", "exactement la même"]
    indice: "Pense à la ville, où les logements sont serrés les uns contre les autres."
    ligneDeReferentiel: "HG-CM1-11"
  - enonce: "Dans un petit village, loin de toute grande ville, où de nombreux bateaux partent chaque matin en mer, quelle activité fait vivre le plus souvent les habitants ?"  # HIS-1: association ; HIS-3: fait géographique général, famille (a) (référentiel ligne 11) ; HG-R3 (nadia-prof, 2026-09-03) : un espace rural où l'activité dominante n'est pas agricole, exactement la réparation demandée
    bonneReponse: "la pêche"
    distracteurs: ["l'agriculture", "la construction navale"]
    indice: "Pense aux bateaux qui partent tôt le matin et reviennent chargés de poissons."
    ligneDeReferentiel: "HG-CM1-11"
  - enonce: "Dans un espace périurbain, les grandes surfaces commerciales (supermarchés, magasins de bricolage) sont le plus souvent installées où ?"  # HIS-1: association ; HIS-3: fait géographique général, famille (a) (référentiel ligne 11)
    bonneReponse: "en périphérie de la ville, près des grands axes routiers"
    distracteurs: ["au centre historique de la ville", "au milieu des champs, loin de toute route"]
    indice: "Pense aux grands panneaux publicitaires que l'on voit en bordure des routes qui mènent à la ville."
    ligneDeReferentiel: "HG-CM1-11"
  - enonce: "Avant d'être distribuée dans les maisons, l'eau est souvent stockée en hauteur dans une grande construction en forme de tour. Comment appelle-t-on cette construction ?"  # HIS-1: restitution ; HIS-3: vocabulaire du programme de géographie cycle 3, famille (a) (référentiel ligne 13) ; FER-1 (nadia-prof) : l'eau, absente jusqu'ici de la ligne 13, est ici servie
    bonneReponse: "un château d'eau"
    distracteurs: ["une centrale électrique", "un silo à grains"]
    indice: "Elle sert à garder l'eau avant qu'elle ne descende ensuite vers les maisons."
    ligneDeReferentiel: "HG-CM1-13"
  - enonce: "D'où vient le plus souvent l'eau qui arrive ensuite dans les canalisations des maisons ?"  # HIS-1: association ; HIS-3: fait géographique général, famille (a) (référentiel ligne 13)
    bonneReponse: "d'une rivière ou d'une nappe souterraine"
    distracteurs: ["de la mer, sans aucun traitement", "de la pluie recueillie dans chaque maison"]
    indice: "Pense à l'eau qui coule ou qui est présente naturellement, avant tout traitement."
    ligneDeReferentiel: "HG-CM1-13"
  - enonce: "Avant d'être distribuée dans les maisons, l'eau doit d'abord être rendue propre à la consommation. Comment appelle-t-on cette étape ?"  # HIS-1: association ; HIS-3: fait géographique général, famille (a) (référentiel ligne 13)
    bonneReponse: "le traitement de l'eau"
    distracteurs: ["le transport par camion-citerne", "le recyclage des eaux de pluie"]
    indice: "C'est l'étape qui rend l'eau potable, juste avant qu'elle ne soit distribuée."
    ligneDeReferentiel: "HG-CM1-13"
  - enonce: "Un aliment acheté directement à un producteur près de chez soi, avec peu d'intermédiaires, appartient à quel type de circuit ?"  # HIS-1: association ; HIS-3: vocabulaire du programme de géographie cycle 3, domaine « consommer en France », famille (a) (référentiel ligne 13) ; FER-1 (nadia-prof) : les aliments, absents jusqu'ici de la ligne 13, sont ici servis
    bonneReponse: "un circuit court"
    distracteurs: ["un circuit d'importation", "un circuit industriel"]
    indice: "C'est un circuit avec peu d'étapes entre le producteur et l'acheteur."
    ligneDeReferentiel: "HG-CM1-13"
  - enonce: "Une orange achetée en hiver en France vient souvent d'un pays plus chaud. Comment appelle-t-on un aliment qui vient ainsi de loin ?"  # HIS-1: association ; HIS-3: vocabulaire du programme de géographie cycle 3, famille (a) (référentiel ligne 13)
    bonneReponse: "un aliment importé"
    distracteurs: ["un aliment local", "un aliment de saison"]
    indice: "Pense au contraire d'un aliment produit tout près de chez toi."
    ligneDeReferentiel: "HG-CM1-13"
  - enonce: "Quel type d'aliment est récolté et vendu au moment où il pousse naturellement dans sa région, sans transport de loin ni longue conservation ?"  # HIS-1: association ; HIS-3: vocabulaire du programme de géographie cycle 3, famille (a) (référentiel ligne 13)
    bonneReponse: "un aliment de saison"
    distracteurs: ["un aliment importé", "un aliment surgelé"]
    indice: "Pense à un fruit ou un légume que l'on trouve seulement à une période de l'année, près de chez soi."
    ligneDeReferentiel: "HG-CM1-13"
  - enonce: "Le vent fait tourner de grandes hélices qui produisent de l'électricité. Comment appelle-t-on ces installations ?"  # HIS-1: association ; HIS-3: vocabulaire du programme de géographie cycle 3, famille (a) (référentiel ligne 13)
    bonneReponse: "des éoliennes"
    distracteurs: ["des châteaux d'eau", "des serres agricoles"]
    indice: "Elles ont de longues pales qui tournent avec le vent."
    ligneDeReferentiel: "HG-CM1-13"
  - enonce: "Le charbon, le pétrole et le gaz naturel sont extraits du sous-sol et s'épuisent avec le temps. Comment appelle-t-on ce type d'énergie ?"  # HIS-1: association ; HIS-3: vocabulaire du programme de géographie cycle 3, famille (a) (référentiel ligne 13)
    bonneReponse: "une énergie fossile"
    distracteurs: ["une énergie renouvelable", "une énergie nucléaire"]
    indice: "Ce sont les mêmes énergies que celles utilisées dans les voitures à essence ou dans certains chauffages."
    ligneDeReferentiel: "HG-CM1-13"
  - enonce: "Une fois produite dans une centrale, l'électricité doit parcourir de longues distances avant d'arriver dans les maisons. Par quoi est-elle transportée ?"  # HIS-1: association ; HIS-3: fait géographique général, famille (a) (référentiel ligne 13)
    bonneReponse: "des lignes à haute tension"
    distracteurs: ["des canalisations souterraines", "des routes nationales"]
    indice: "Ce sont de grands câbles soutenus par des pylônes métalliques que l'on voit dans la campagne."
    ligneDeReferentiel: "HG-CM1-13"
  - enonce: "Quel fait caractérise le règne de Louis IX, aussi appelé Saint Louis ?"  # HIS-1: association ; HIS-3: référentiel ligne 6 (Louis IX et la croisade), fait consensuel, famille (a)
    bonneReponse: "la croisade"
    distracteurs: ["la Renaissance", "l'édit de Nantes"]
    indice: "Ce roi part combattre en Terre sainte."
    ligneDeReferentiel: "HG-CM1-06"
  - enonce: "Quel fait caractérise le règne de François Ier, qui invite en France le peintre Léonard de Vinci ?"  # HIS-1: association ; HIS-3: référentiel ligne 6 (François Ier et la Renaissance), Léonard de Vinci invité par François Ier, fait consensuel, famille (a)
    bonneReponse: "la Renaissance"
    distracteurs: ["la croisade", "Versailles"]
    indice: "Ce roi encourage les arts et les lettres, comme la peinture italienne."
    ligneDeReferentiel: "HG-CM1-06"
  - enonce: "Quel fait caractérise le règne de Henri IV, qui met fin aux guerres de religion en 1598 ?"  # HIS-1: association ; HIS-3: référentiel ligne 6 (Henri IV et l'édit de Nantes), date 1598 consensuelle, famille (a)
    bonneReponse: "l'édit de Nantes"
    distracteurs: ["la Renaissance", "Versailles"]
    indice: "Ce texte accorde la liberté de culte aux protestants."
    ligneDeReferentiel: "HG-CM1-06"
  - enonce: "Quel fait caractérise le règne de Louis XIV, surnommé le Roi-Soleil ?"  # HIS-1: association ; HIS-3: référentiel ligne 6 (Louis XIV et Versailles), surnom consensuel, famille (a)
    bonneReponse: "Versailles"
    distracteurs: ["la croisade", "l'édit de Nantes"]
    indice: "Ce roi fait construire un immense château non loin de Paris."
    ligneDeReferentiel: "HG-CM1-06"
  - enonce: "Quel château de la Renaissance, avec son escalier à double révolution, est construit sous François Ier ?"  # HIS-1: restitution ; HIS-3: référentiel ligne 6 (François Ier et la Renaissance), château de Chambord, fait consensuel, famille (a)
    bonneReponse: "Chambord"
    distracteurs: ["Versailles", "le Louvre"]
    indice: "Son escalier permet à deux personnes de monter sans se croiser."
    ligneDeReferentiel: "HG-CM1-06"
  - enonce: "Comment appelle-t-on la grande salle du château de Versailles décorée de miroirs, sous le règne de Louis XIV ?"  # HIS-1: restitution ; HIS-3: référentiel ligne 6 (Louis XIV et Versailles), galerie des Glaces, fait consensuel, famille (a)
    bonneReponse: "la galerie des Glaces"
    distracteurs: ["la salle du Jeu de paume", "la cour Carrée"]
    indice: "Son nom rappelle les nombreux miroirs qui ornent ses murs."
    ligneDeReferentiel: "HG-CM1-06"
  - enonce: "En quelle année commence la Révolution française ?"  # HIS-1: restitution ; HIS-3: référentiel ligne 7, date 1789 consensuelle, famille (a)
    bonneReponse: "en 1789"
    distracteurs: ["en 1804", "en 1598"]
    indice: "C'est aussi l'année de la prise de la Bastille."
    ligneDeReferentiel: "HG-CM1-07"
