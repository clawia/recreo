id: cm1-histoire-geographie
type: question
descripteur:
  matiere: "Histoire-géographie"
  niveau: "CM1"
  domaine: "Repères historiques et géographiques"
  competence: "Ouvre plusieurs compétences du référentiel : se repérer dans le temps (grandes périodes, siècles), identifier des traces d'une occupation ancienne, nommer des rois et leur réalisation, situer les événements de la Révolution et de l'Empire, distinguer des types d'espaces et leurs activités, comprendre un document historique (lignes 1, 2, 3, 4, 6, 7, 8, 11, 12, 13, 14 du référentiel CM1)"
lignesDeReferentiel: ["HG-CM1-01", "HG-CM1-02", "HG-CM1-03", "HG-CM1-04", "HG-CM1-06", "HG-CM1-07", "HG-CM1-08", "HG-CM1-11", "HG-CM1-12", "HG-CM1-13", "HG-CM1-14"]
#
# S27-3. Premier paquet d'histoire-géographie CM1, matière neuve du produit. Référentiel
# et jouabilité : ARBITRAGE-PREALABLE-s27-les-matieres-absentes-du-programme.md (branche
# matieres-absentes, commit fcdc365), section 5 (les quatorze compétences) et section 7.2 (douze
# jouables au choix textuel des aujourd'hui). Les lignes 9 et 10 (carte, planisphère, échelles) sont
# hors de portée (palier 2 non construit) et ne sont pas servies ici. Ce paquet touche onze des douze
# lignes jouables (toutes sauf la ligne 5, laissée à un paquet ultérieur) ; il OUVRE ces lignes, il ne
# les FERME AUCUNE - nadia-prof l'écrit d'avance (section 8.4 de son arbitrage) : "un premier paquet
# de matière neuve ouvre une ligne, il ne la ferme pas."
#
# HIS-1 (bloquante, au plus un tiers d'items de restitution) : compté, pas estimé, sur les vingt
# items réels. Chaque item porte un marqueur '# HIS-1: <type>' - restitution, ordre, association ou
# document - jamais lu par QuestionContentSourceFactory, sur le même patron que le marqueur COMP-3
# de cm1-comprehension.yaml. Compte : 5 restitution, 5 ordre, 7 association, 3 document sur 20 items
# - 5/20 = 25,0 %, sous le plafond d'un tiers (33,3 %). Vérifié par
# PaquetCm1HistoireGeographieTest.auPlusUnTiersDesItemsSontDeLaRestitution.
#
# HIS-2 (bloquante, aucun item à deux réponses défendables) : vérifié item par item à la rédaction,
# jugement de sens qu'aucun automate de ce dépôt ne porte (même limite que COMP-2 sur
# cm1-comprehension). Le détail de cette vérification, item par item, est rendu à sofia-sm et
# nadia-prof en dehors de ce fichier.
#
# HIS-3 (bloquante, chaque fait porte sa source) : chaque item porte, dans son marqueur, la source du
# fait qu'il énonce - soit le référentiel de nadia-prof lui-même (les associations roi/réalisation et
# l'ordre des grandes périodes, qu'elle a déjà écrits et validés), soit un fait consensuel du
# programme scolaire français (dates de la Révolution, vocabulaire de géographie). Limite dite
# franchement au premier jet : je n'ai eu accès à aucun outil de recherche en ligne pendant la
# rédaction de ce paquet, et trois faits en ont porté la marque "à confirmer par nadia-prof" -
# patrimoine romain en Gaule (item 4), terminologie des mouvements de population du IVe au Xe siècle
# (item 5), caractérisation de la vie de cour de Louis XIV à Versailles (item 19).
#
# Traités par nadia-prof le 2026-09-03, sans outil de recherche non plus de son côté, et sa précision
# de HIS-3 en distingue deux familles : (a) fait de manuel sans variante - elle en est une source
# recevable et signe ; (b) fait daté, disputé, ou dont la formulation engage une couverture - elle ne
# signe pas, il faut une source ou une reformulation qui retire le besoin de source.
#
# Item 4 (patrimoine romain) : CONFIRMÉ, famille (a). Item 19 (cérémonial de Louis XIV) : CONFIRMÉ,
# famille (a), réserve non bloquante - "cérémonial" est au-dessus du CM1 mais vit dans le
# texte-support, jamais dans la question ni dans la réponse ; s'il passait un jour dans une question,
# il deviendrait bloquant.
#
# Item 5 (peuples germaniques) : RÉSERVE BLOQUANTE levée par reformulation de l'énoncé, famille (b) -
# "l'ensemble" engageait une couverture que la réponse ne tient pas (les Huns, entrés dans l'Empire au
# IVe siècle, ne sont pas germaniques) et l'énoncé était le plus long du paquet (30 mots contre une
# médiane de 13, avec "venus de l'extérieur de l'Empire romain" répété deux fois). Reformulation
# fournie par nadia-prof, reprise mot pour mot et accentuée pour le canal enfant ; bonne réponse et
# distracteurs inchangés.
#
# BIA-5 (aucun jugement de valeur sur un personnage, rois ou Révolution) : aucun item ne qualifie un
# roi ou un acteur de la Révolution de bon, mauvais, juste ou injuste - vérifié item par item, même
# limite que HIS-2.
#
# Vingt items, plafond de nadia-prof pour un premier paquet de matière neuve, atteint et non dépassé.
#
# S28-2. Second paquet d'histoire-géographie CM1, composition B (arbitrage préalable de s28,
# ARBITRAGE-PREALABLE-s28-ce-qui-ferme-une-ligne-et-le-prix-des-quatre-lots.md, sections 3.2 et 5.1 ;
# DEC-0074, amendement du 2026-09-03 ; docs/backlog/backlog.md, story S28-2). Ferme les lignes
# HG-CM1-11 (types d'espaces) et HG-CM1-13 (eau, énergie, aliments) si nadia-prof vérifie FER-1,
# FER-2 et FER-3 tenues sur chacune, indépendamment l'une de l'autre. Les neuf autres lignes du
# paquet ne sont pas touchées et restent en cours - ce lot est intégralement consacré à la
# fermeture de ces deux lignes, il n'en ouvre aucune de plus dans la matière.
#
# HG-CM1-11 passe de 2 à 10 items (+8, exactement le minimum chiffré par nadia-prof) :
# - FER-1 (extension) : les trois éléments du libellé sont désormais servis en bonne réponse -
#   "un espace urbain" (item existant + 1 item neuf, comparaison de densité), "un espace périurbain"
#   (1 item neuf, absent jusqu'ici et servi seulement en distracteur), "un espace rural" (1 item
#   neuf, en plus de l'item corrigé qui reste sur une caractéristique et non sur le nom de l'espace).
# - FER-2 (densité) : 10 items, exactement le plancher de nadia-prof.
# - FER-3 (deux tâches) : "identification" (décrire une scène ou comparer un fait, nommer le type
#   d'espace - item existant + 3 items neufs = 4) et "association-caractéristique" (le type d'espace
#   est donné, une caractéristique - logement, transport, commerces, activité - est demandée - item
#   corrigé + 6 items neufs = 7). Minorité à 4, au-dessus du plancher de trois.
# - BIA-2 (étendue par nadia-prof aux types d'espace, motif : "l'item de 1.3 la viole déjà") : aucun
#   des trois types n'est plus réduit à un seul trait. L'espace urbain porte désormais le logement
#   collectif et la densité ; l'espace périurbain le logement individuel, le trajet en voiture et les
#   zones commerciales ; l'espace rural l'agriculture (nuancée par HG-R3 ci-dessous), le paysage et,
#   avec le village de pêcheurs, une activité dominante qui n'est pas agricole - exactement la
#   réparation que nadia-prof demande.
#
# HG-R3 (nadia-prof, 2026-09-03, corrigé ici) : l'item sur l'espace rural portait deux distracteurs
# absurdes ("la banque et l'assurance", "le tourisme de croisière") et une réponse qui réduisait
# l'espace rural à l'agriculture seule. Les distracteurs sont remplacés par deux activités
# effectivement rencontrées en espace rural (artisanat local, tourisme vert), l'énoncé est nuancé
# ("de nombreux espaces ruraux", "traditionnellement"), et un item neuf (le village de pêcheurs)
# montre qu'un espace rural dont l'activité dominante n'est pas agricole existe bel et bien -
# réparation demandée mot pour mot par nadia-prof.
#
# HG-CM1-13 passe de 1 à 10 items (+9, exactement le minimum chiffré par nadia-prof) :
# - FER-1 (extension) : les trois besoins du libellé sont désormais servis - l'eau (3 items neufs,
#   absente jusqu'ici), l'énergie (item existant + 3 items neufs), les aliments (3 items neufs,
#   absents jusqu'ici).
# - FER-2 (densité) : 10 items, exactement le plancher de nadia-prof.
# - FER-3 (deux tâches) : "origine" (d'où vient la ressource, ou comment se nomme son lieu ou son
#   type de production - item existant + 5 items neufs = 6) et "acheminement" (l'étape ou le moyen
#   qui achemine la ressource jusqu'à nous - château d'eau, traitement, circuit court, lignes à haute
#   tension - 4 items neufs). Minorité à 4, au-dessus du plancher de trois.
#
# HIS-1 (bloquante, au plus un tiers de restitution, calculée sur le LOT - ADR-0079 - et, en plus,
# sur ce fichier puisqu'il porte désormais plus de dix items, précision de nadia-prof du
# 2026-09-03) : chaque item neuf porte son marqueur. Compte sur le fichier entier, seul fichier du
# lot : 8 restitution sur 37 items, 21,6 %, sous le tiers (plafond entier(37 / 3) = 12). Vérifié par
# UneConditionDeLotSeCompteSurLeLotDeMatiereEtNonSurUnFichierTest.
#
# HIS-3 (chaque fait porte sa source) : tous les faits neufs sont des faits généraux de géographie ou
# du vocabulaire standard du programme de cycle 3 (types d'espace, circuits courts, énergies
# fossiles, transport de l'eau et de l'électricité) - famille (a) au sens de la précision de
# nadia-prof du 2026-09-03 : aucun ne date, aucun ne dispute, aucun n'engage une couverture
# statistique qui demanderait vérification.
#
# HIS-4 (chaque item déclare la ligne de référentiel qu'il sert, ADR-0081) : les items neufs portent
# 'ligneDeReferentiel', comme tous les items de ce paquet depuis sa reprise en s28.
#
# Décision de découpage (routée par sofia-sm, motif dû) : ce second paquet reste dans le même fichier
# que le premier plutôt que d'en ouvrir un par ligne de référentiel. Chaque entrée de catalogue.yaml
# résout vers exactement un fichier de contenu (YamlContentPackLoader.chargerPaquet) : un fichier par
# ligne transformerait donc "histoire et géographie", un jeu aujourd'hui unique, en onze jeux
# distincts - une décision sur le nombre et le grain des jeux proposés à l'enfant, que ADR-0081
# réserve explicitement à nadia-prof et camille-po (alternative E, "ce serait une décision de contenu
# prise par un architecte") et non à un développeur en cours de lot de fermeture. ADR-0081 est conçu
# pour ce cas précis - la clause 4 (déclaration par item) existe pour qu'un paquet multi-lignes reste
# entièrement calculable - et FER-1/FER-2 sont ici mécaniquement vérifiables sans qu'un seul jeu de
# plus n'ait à être créé. Le coût de lisibilité "sans outil" que nadia-prof signale est réel ; il est
# routé à sofia-sm et camille-po plutôt que tranché ici.
#
#
# S29-2. Troisième paquet d'histoire-géographie CM1, composition A (arbitrage préalable de s29,
# ARBITRAGE-PREALABLE-s29-le-prix-des-quatre-matieres-neuves-et-le-plafond-a-huit-lignes.md,
# sections 3.3, 4 et 5.1 ; DEC-0077, section 8 ; docs/backlog/backlog.md, story S29-2). Ferme les
# lignes HG-CM1-06 (rois et réalisations), HG-CM1-07 (Révolution et Empire) et HG-CM1-14
# (comprendre un document) si nadia-prof vérifie FER-1, FER-2 et FER-3 tenues sur chacune,
# indépendamment des deux autres. Les huit autres lignes du paquet ne sont pas touchées.
#
# HG-CM1-06 passe de 4 à 10 items (+6, exactement le minimum chiffré par nadia-prof, section 3.3) :
# - FER-1 : les quatre réalisations du libellé sont désormais chacune servies en bonne réponse -
#   "la croisade" (Louis IX), "la Renaissance" (François Ier), "l'édit de Nantes" (Henri IV),
#   "Versailles" (Louis XIV). Les quatre items de s27 associaient déjà chaque roi à sa réalisation,
#   mais avec le roi en bonne réponse, jamais la réalisation elle-même : FER-1, lu au pied de la
#   lettre (précision de nadia-prof du 2026-09-05, section 4 de l'arbitrage de s29), n'était donc
#   pas encore tenue avant ce lot.
# - Deux items neufs approfondissent la même ligne sans répéter les quatre réalisations (le château
#   de Chambord nommé, la galerie des Glaces nommée).
# - Aucune des deux traditions refusées d'avance par nadia-prof (le chêne de Saint Louis, la poule
#   au pot d'Henri IV - HIS-3, avertissement de la section 5.1 de l'arbitrage de s28) n'est utilisée
#   ici : les six items neufs portent des faits attestés (surnoms royaux, invitation de Léonard de
#   Vinci par François Ier, escalier de Chambord, galerie des Glaces), tous famille (a).
# - BIA-5 (aucun jugement de valeur sur un personnage) : aucun item neuf ne qualifie un roi de bon,
#   mauvais, juste ou injuste, vérifié item par item, même limite que HIS-2.
#
# HG-CM1-07 passe de 3 à 10 items (+7, exactement le minimum chiffré par nadia-prof, section 3.3) :
# - FER-1 : les quatre événements du libellé sont désormais chacun servis en bonne réponse -
#   "en 1789", "l'abolition des privilèges", "la Déclaration des droits de l'homme et du citoyen"
#   (déjà tenue par un item de s27, renforcée ici) et "la fin de la monarchie".
# - Deux tâches sont servies : nommer l'événement à partir d'une description ou d'une date
#   (association), et situer un événement par rapport aux autres (ordre).
#
# HG-CM1-14 passe de 3 à 10 items (+7, exactement le minimum chiffré par nadia-prof, section 3.3) :
# - Les trois items de s27 ne servaient que la date et l'extraction d'une information, jamais la
#   nature ni l'auteur du document - écart nommé d'avance à l'ouverture de ce lot. Les sept items
#   neufs servent chacune des trois composantes manquantes du libellé : nature ("un journal intime",
#   "une déclaration de droits"), auteur ("Henri IV", "les députés de l'Assemblée nationale"), plus
#   une deuxième date et deux extractions supplémentaires.
# - Document textuel seul ; carte et image restent non couvertes. Les sept items neufs, comme les
#   trois de s27, portent tous un texteSupport écrit - aucune carte ni aucune image ne fait partie de
#   ce lot. Le critère d'acceptation de la story demandait deux formes de document distinctes (texte,
#   carte ou image) ; construire une compréhension de carte ou d'image aurait demandé un champ de
#   schéma neuf, hors du périmètre confié ici ("n'écris aucune mécanique, aucun gabarit"). À router à
#   camille-po et théo-archi si la couverture de la ligne doit aller au-delà du texte.
# - Les textes-supports sont des reconstitutions pédagogiques (style journal intime, style édit
#   royal, style déclaration) construites sur des faits déjà vérifiés plus haut dans ce fichier
#   (édit de Nantes, prise de la Bastille, Déclaration des droits de l'homme et du citoyen, château
#   de Chambord, nuit du 4 août 1789) : aucun fait neuf non sourcé n'est introduit, HIS-3 famille (a)
#   sur les sept items.
#
# CYC-1 (continuité cycle 2 / cycle 3) : sans objet sur ce lot - aucune des trois lignes ne recoupe
# un objet déjà enseigné en questionner le monde CP.
#
# HIS-1 (bloquante, au plus un tiers de restitution, calculée sur le LOT - ADR-0079 - et, en plus,
# sur ce fichier puisqu'il porte désormais plus de dix items) : chaque item neuf porte son marqueur.
# Compte sur le fichier entier, seul fichier du lot : 13 restitution sur 57 items, 22,8 %, sous le
# tiers (plafond entier(57 / 3) = 19). Vérifié par
# UneConditionDeLotSeCompteSurLeLotDeMatiereEtNonSurUnFichierTest, mis à jour dans ce commit.
#
# HG-R4 (nadia-prof, demande explicite pour ce lot : aucun énoncé du fichier ne dépasse vingt-cinq
# mots, médiane du fichier au plus seize mots) : les vingt énoncés neufs comptent chacun entre 6 et
# 21 mots, et la médiane du fichier entier reste à 16 après ajout. Le maximum du fichier reste
# toutefois à 34 mots (item de HG-CM1-11, hérité de s28, hors périmètre de ce lot qui ne touche pas
# aux huit autres lignes) : HG-R4 lue au pied de la lettre sur "le fichier" n'est donc pas
# entièrement tenue par ce dépôt à l'issue de ce lot. À router à sofia-sm et camille-po : soit HG-R4
# vise le lot livré plutôt que le fichier entier, soit les items hérités de s28 qui dépassent
# vingt-cinq mots doivent être réécrits, ce qui sortirait du périmètre de S29-2.
#
# S29-7 (nadia-prof, textes fournis dans ARBITRAGE-PREALABLE-s28-ce-qui-ferme-une-ligne-et-le-prix-
# des-quatre-lots.md, section 5, items nouveaux de HG-CM1-11 et HG-CM1-13). Deux réserves corrigées,
# textes repris mot pour mot :
# - HG-R4 (charge de lecture) : l'item hérité de s28 à 34 mots (village de pêcheurs, HG-CM1-11,
#   celui-là même que la note ci-dessus signale comme hors périmètre de S29-2) est simplifié sans
#   perte d'information - il nommait "mer" deux fois ("au bord de la mer", "partent chaque matin en
#   mer"), la seconde suffit. L'item de HG-CM1-13 (l'orange en hiver, 30 mots) est simplifié de la
#   même façon - "transportée par bateau ou par avion" n'est pas nécessaire pour que la question
#   tienne, la notion d'aliment importé ne dépend pas du moyen de transport.
# - HG-R5 (mot d'indice qui brouille la distinction que l'item enseigne) : l'indice du village de
#   pêcheurs disait "reviennent avec leur récolte du jour" - une récolte est agricole, ce qui brouille
#   exactement la distinction (pêche non agricole) que l'item veut faire tenir. Corrigé.
items:
  - enonce: "Quelle grande période vient juste après la Préhistoire ?"  # HIS-1: ordre ; HIS-3: ordre des périodes donné par le référentiel (arbitrage s27, section 5, ligne 1)
    bonneReponse: "l'Antiquité"
    distracteurs: ["le Moyen Âge", "l'époque contemporaine"]
    indice: "Repense à l'ordre des grandes périodes que tu as appris."
    ligneDeReferentiel: "HG-CM1-01"
  - enonce: "Quelle grande période vient juste après le Moyen Âge ?"  # HIS-1: ordre ; HIS-3: ordre des périodes donné par le référentiel (arbitrage s27, section 5, ligne 1)
    bonneReponse: "les Temps modernes"
    distracteurs: ["l'Antiquité", "l'époque contemporaine"]
    indice: "Le Moyen Âge se termine, une nouvelle période commence avant l'époque contemporaine."
    ligneDeReferentiel: "HG-CM1-01"
  - enonce: "La Révolution française commence en 1789. En quel siècle cela se passe-t-il ?"  # HIS-1: restitution ; HIS-3: date 1789 donnée par le référentiel (ligne 7), conversion en siècle par convention calendaire (XVIIIe siècle = 1701-1800)
    bonneReponse: "le XVIIIe siècle"
    distracteurs: ["le XVIIe siècle", "le XIXe siècle"]
    indice: "Compte les centaines d'années. 1789 se situe entre 1701 et 1800, donc au XVIIIe siècle."
    ligneDeReferentiel: "HG-CM1-02"
  - enonce: "Des arènes et des aqueducs en pierre ont été construits en Gaule durant l'Antiquité. Quel peuple les a construits ?"  # HIS-1: association ; HIS-3: patrimoine romain en Gaule (arènes, aqueducs), fait consensuel du programme cycle 3 - je n'ai pas d'outil de recherche en ligne cette session, nadia-prof doit confirmer
    bonneReponse: "les Romains"
    distracteurs: ["les Vikings", "les Égyptiens"]
    indice: "Pense au peuple de l'Antiquité qui a laissé le plus de traces de pierre en Gaule."
    ligneDeReferentiel: "HG-CM1-03"
  - enonce: "À partir du IVe siècle, des peuples venus du nord et de l'est s'installent dans l'Empire romain. Les Francs sont l'un d'eux. Comment appelle-t-on ces peuples ?"  # HIS-1: restitution ; HIS-3: reformulation de nadia-prof qui retire le besoin de source (arbitrage du 2026-09-03, section 3.4) - "l'ensemble" retire, la réponse ne prétend plus à une couverture totale (les Huns, par exemple, n'entrent pas dans "peuples germaniques")
    bonneReponse: "les peuples germaniques"
    distracteurs: ["les peuples grecs", "les peuples gaulois"]
    indice: "Ce ne sont ni les Grecs ni les Gaulois, déjà installés bien avant."
    ligneDeReferentiel: "HG-CM1-04"
  - enonce: "Quel roi de France a fait construire le château de Versailles ?"  # HIS-1: association ; HIS-3: association donnée par le référentiel lui-même (ligne 6, Louis XIV et Versailles)
    bonneReponse: "Louis XIV"
    distracteurs: ["Henri IV", "François Ier"]
    indice: "C'est le roi au plus long règne de l'histoire de France."
    ligneDeReferentiel: "HG-CM1-06"
  - enonce: "Quel roi de France a signé l'édit de Nantes ?"  # HIS-1: association ; HIS-3: référentiel ligne 6 (Henri IV et l'édit de Nantes), date 1598 consensuelle
    bonneReponse: "Henri IV"
    distracteurs: ["Louis IX", "Louis XIV"]
    indice: "Ce roi a mis fin à des années de guerres de religion en 1598."
    ligneDeReferentiel: "HG-CM1-06"
  - enonce: "Quel roi de France a participé à une croisade ?"  # HIS-1: association ; HIS-3: référentiel ligne 6 (Louis IX et la croisade)
    bonneReponse: "Louis IX"
    distracteurs: ["François Ier", "Henri IV"]
    indice: "Ce roi est aussi appelé Saint Louis."
    ligneDeReferentiel: "HG-CM1-06"
  - enonce: "Sous quel roi de France le château de Chambord est-il construit, témoin de la Renaissance ?"  # HIS-1: association ; HIS-3: référentiel ligne 6 (François Ier et la Renaissance), château de Chambord
    bonneReponse: "François Ier"
    distracteurs: ["Louis IX", "Henri IV"]
    indice: "Ce roi a régné au début du XVIe siècle, en pleine Renaissance."
    ligneDeReferentiel: "HG-CM1-06"
  - enonce: "En 1789, quel événement marque le début de la Révolution française à Paris ?"  # HIS-1: restitution ; HIS-3: date du 14 juillet 1789, fait consensuel enseigné nationalement
    bonneReponse: "la prise de la Bastille"
    distracteurs: ["le sacre de Napoléon", "la signature de l'édit de Nantes"]
    indice: "C'est une prison parisienne, symbole du pouvoir du roi."
    ligneDeReferentiel: "HG-CM1-07"
  - enonce: "Parmi ces trois événements de la Révolution française, lequel a eu lieu le premier ?"  # HIS-1: ordre ; HIS-3: dates du 14 juillet 1789, du 26 août 1789 et de septembre 1792, faits consensuels
    bonneReponse: "la prise de la Bastille"
    distracteurs: ["la fin de la monarchie", "la Déclaration des droits de l'homme et du citoyen"]
    indice: "Repense à la date du 14 juillet 1789, la plus ancienne des trois."
    ligneDeReferentiel: "HG-CM1-07"
  - enonce: "Quel événement a eu lieu juste après l'abolition des privilèges, la même année 1789 ?"  # HIS-1: ordre ; HIS-3: dates du 4 août et du 26 août 1789, faits consensuels
