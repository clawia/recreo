  competence: "Localiser une syllabe dans un mot (début / milieu / fin)"
# S26-L1 (DEC-0068 ; squad/conformite/ARBITRAGE-PREALABLE-s26-la-voix-est-un-adulte.md, section 4.1).
# ADR-0075 : texteAVoixHaute porte le mot entier et la syllabe cherchée (VOI-1, VOI-7 n'est pas de
# cette ligne mais le principe est le même : jamais une proposition). L'enfant ne voit ni le mot ni
# la syllabe : enonce, indice et propositions sont invariants sur tout le paquet (VOI-13) ; c'est
# texteAVoixHaute qui distingue les dix-huit tours (ADR-0075, décision 3).
#
# VOI-4 : position comptée par item, aucune majoritaire. Compte réel sur les 18 items :
# début = 6, milieu = 6, fin = 6. Les mots comptent deux (8 items) ou trois (10 items) syllabes ;
# la position "milieu" n'existe que sur un mot de trois syllabes, les six items "milieu" en
# portent donc chacun un.
#
# VOI-3 (non gardée par aucun test) : l'adulte dit le mot d'un seul tenant, sans le découper. La
# seule contrepartie est VOI-12, câblée sur consigneAdulte au niveau du catalogue.
#
# Indice générique et invariant, à dessein : un indice qui nommerait la syllabe ou une partie du
# mot romprait VOI-13 (le mot ne doit apparaître nulle part ailleurs que dans texteAVoixHaute).
