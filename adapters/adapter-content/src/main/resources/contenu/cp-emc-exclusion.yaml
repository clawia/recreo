schema: 1
id: cp-emc-exclusion
type: question
descripteur:
  matiere: "Enseignement moral et civique"
  niveau: "CP"
  domaine: "Respecter autrui"
  competence: "Reconnaître une situation de moquerie répétée ou d'exclusion et savoir à quel adulte en parler."
lignesDeReferentiel: ["EMC-CP-03"]
#
# S31-2 (docs/backlog/backlog.md, sprint 31). Reecriture complete apres REFUS de nadia-prof le
# 2026-09-07 (squad/conformite/FICHE-bandit-manchot-exclusion-cp.md, squad/sprints/
# s31-second-passage-de-sciences-et-emc-cp/verdicts-nadia-instance-A.md, section 4.1). Trois motifs
# de refus, tous corriges dans ce meme geste :
#
# 1) La premiere moitie du libelle ("reconnaitre") n'etait pas travaillee : les six items de la
#    tache A decrivaient tous une moquerie repetee, aucun n'etait un accident isole, donc rien
#    n'etait a distinguer. LA TACHE A EST DESORMAIS UNE VRAIE DISCRIMINATION : elle sert trois
#    situations de moquerie/exclusion repetee (items 1 a 3, marquees par "chaque midi cette
#    semaine", "presque tous les jours", "depuis plusieurs jours ... a chaque recreation") et trois
#    situations d'accident isole (items 4 a 6, marquees par "une seule fois", "par accident", "sans
#    faire exprès"). La bonne reponse est un CLASSEMENT ("une moquerie qui se répète" / "un accident
#    isolé"), jamais une action que l'enfant devrait entreprendre.
#
# 2) FAB-1a : la tache A servait six fois "en parler a un adulte", mot pour mot (FER-2 tombait a 6
#    items comptables sur 10). Avec le classement ci-dessus, la bonne reponse varie reellement
#    (5 reponses distinctes sur 11 items au total dans le paquet, aucune tache invariante).
#
# 3) CAT-1 n'etait tenue sur aucune des deux taches. Sur la tache A, les propositions sont
#    desormais trois CLASSEMENTS (jamais une reaction "prudente" contre des reactions "agressives")
#    : "une moquerie qui se répète" / "un accident isolé" / une troisieme categorie de contraste
#    ("une bagarre", "une blague entre amis", "un jeu de récréation", "une dispute", "une
#    vengeance") - aucune n'est grossiere ni dangereuse, ce sont des labels de situation, pas des
#    actes. Sur la tache B, la proposition au rabais "a personne, ..." est retiree ; les trois
#    propositions sont desormais toujours trois adultes reels (maitresse, surveillant de cour,
#    adulte de cantine), dont deux ne conviennent pas au lieu decrit.
#
# Lecture de EMC-3 qui fait foi, ecrite par nadia-prof le 2026-09-07 dans le verdict qui refusait
# ce paquet : "EMC-3 est une interdiction portant sur les propositions - aucune, en bonne reponse
# comme en distracteur, ne dit a l'enfant de regler la situation seul - et non une prescription
# portant sur la bonne reponse. La bonne reponse d'un item de reconnaissance peut donc etre un
# classement, qui n'expose l'enfant a rien." C'est exactement la forme retenue ici : aucune
# proposition de la tache A n'est une action de gestion seule (les propositions sont des noms de
# situation, jamais des verbes d'action) ; la lecture par categorie d'action de la tache B (nommer
# l'adulte precis selon le lieu vaut "en parler a un adulte") reste confirmee sans reserve par
# nadia-prof (meme verdict, section 4.1) : elle n'est pas retouchee ici.
#
# Longueur des enonces : ramenee a une seule phrase de situation courte (12 a 16 mots), contre 22 a
# 31 mots sur la version refusee. Les indices de la tache A n'ajoutent plus seulement la duree deja
# donnee par l'enonce ; ils disent le critere de distinction (la repetition contre l'occurrence
# unique) sans jamais nommer la bonne reponse.
#
# EMC-1 : aucun item n'interroge l'enfant sur ce qu'il ressent, vit ou fait chez lui - les
# personnages sont fictifs et exterieurs a l'enfant qui joue.
#
# EMC-8 : aucun item ne demande a l'enfant de declarer un comportement.
#
# EMC-10 : aucun item ne nomme une personne reelle vivante, un parti, un syndicat ni une
# organisation. Les personnages (Lea, Hugo, Aya, Malo, Tom) sont fictifs.
#
# PLA-1 : chaque proposition est une categorie de situation qu'un enfant de CP peut serieusement
# envisager (moquerie, accident, bagarre, blague, jeu, dispute, vengeance ; un adulte reel selon le
# lieu), jamais un bouton de remplissage.
#
# FAB-1, CAT-1 : verifies par ADR-0086 sur le contenu servi entier (aucun sous-ensemble de trois
# items ou plus ne partage a la fois le meme trio de propositions et la meme bonne reponse).
#
# TYP-1 (ADR-0067) : chaque enonce pose l'espace insecable devant son "?" final.
#
# FER-2 : onze items, au-dessus du plancher de dix (DEC-0064).
#
# Correction du 2026-09-08 (lea-dev, S32-4, docs/backlog/backlog.md, sprint 32), quatre des cinq
# reserves de nadia-prof (squad/conformite/FICHE-bandit-manchot-exclusion-cp.md, bloc du reaudit) :
#
# EXC-R3 : la troisieme proposition de la tache A (items 1, 5, 6) n'etait pas un candidat serieux -
# "une bagarre" la ou personne ne se bat (item 1), "une dispute" sur un pied ecrase par accident
# (item 5), "une vengeance" sur un geste dit "sans faire expres" (item 6). Remplacees par des
# categories qu'un enfant peut vraiment envisager pour la scene decrite ("une bousculade", "un jeu
# de recreation", "une blague") - aucun trio de propositions ne se repete avec la meme bonne reponse.
#
# EXC-R4 : les deux enonces les plus longs de la tache B (items 9 et 10 de ce fichier, 16 et 18
# mots avant correction) posaient deux circonstances avant la question. Ramenes a une seule
# circonstance chacun (LON-1, LON-2, arbitrage prealable de s32, section 16.4).
#
# EXC-R2 : les cinq indices de la tache B ne redonnaient que le lieu deja ecrit dans l'enonce, et
# deux d'entre eux reprenaient un mot de la bonne reponse. Ils disent desormais le role de l'adulte
# aupres des eleves, une information que l'enonce ne donne pas, sans reprendre les mots de la bonne
# reponse ni le lieu deja ecrit.
#
# EXC-R1 (consigne du catalogue) n'est PAS payee dans ce geste : la consigne servie ("Lis bien,
# puis dis ce qu'il faut faire, ou a qui en parler.") ne nomme plus la tache A, qui ne sert plus une
# action depuis la reecriture de s31. Le changer casse quatre tests de
# TexteAccentueExposeParLePortEntrantTest (bootstrap), qui maintient un inventaire Java des chaines
# exposees par le catalogue - hors du perimetre "contenu pur" de cette story. Route a sofia-sm.
#
# EXC-R5 (la presence de l'adulte plutot que le lieu comme critere) n'est pas payee non plus : la
# forme que nadia-prof demande ("quel adulte est la a ce moment ?" au lieu de "a qui ... en
# parler ?") romprait la classification de PaquetCpEmcExclusionTest#estDeTacheAdulte (elle filtre
# sur la sous-chaine "A qui"), et changer le texte des bonnes reponses casserait
# ADULTES_VALIDES, meme test - un changement de contenu ne peut pas payer cette reserve sans
# toucher un module Java. Route a sofia-sm.
items:
  - enonce: "Chaque midi cette semaine, Malo empêche Aya de s'asseoir avec le groupe. Qu'est-ce que c'est ?"
    bonneReponse: "une moquerie qui se répète"
    distracteurs: ["un accident isolé", "une bousculade"]
    indice: "Une seule fois serait un hasard ; là, cela recommence chaque jour."
  - enonce: "Presque tous les jours, Hugo se moque de la façon dont parle Tom. Qu'est-ce que c'est ?"
    bonneReponse: "une moquerie qui se répète"
    distracteurs: ["un accident isolé", "une blague entre amis"]
    indice: "Une moquerie qui revient aussi souvent n'est plus un hasard."
  - enonce: "Depuis plusieurs jours, Malo écarte Tom du jeu à chaque récréation. Qu'est-ce que c'est ?"
    bonneReponse: "une moquerie qui se répète"
    distracteurs: ["un accident isolé", "un jeu de récréation"]
    indice: "Écarter quelqu'un plusieurs jours de suite n'est pas un jeu ordinaire."
  - enonce: "En courant, Tom bouscule Malo une seule fois et s'excuse aussitôt. Qu'est-ce que c'est ?"
    bonneReponse: "un accident isolé"
    distracteurs: ["une moquerie qui se répète", "une bagarre"]
    indice: "Une excuse immédiate après un geste involontaire n'est pas de la moquerie."
  - enonce: "Aya marche sur le pied de Hugo une seule fois, par accident. Qu'est-ce que c'est ?"
    bonneReponse: "un accident isolé"
    distracteurs: ["une moquerie qui se répète", "un jeu de récréation"]
    indice: "Un seul faux pas involontaire n'est pas la même chose qu'une habitude."
  - enonce: "Malo fait tomber le dessin de Léa une fois, sans faire exprès. Qu'est-ce que c'est ?"
    bonneReponse: "un accident isolé"
    distracteurs: ["une moquerie qui se répète", "une blague"]
    indice: "Une maladresse unique n'a rien à voir avec un geste répété exprès."
  - enonce: "Dans la cour, une moquerie se répète chaque jour. À qui Hugo doit-il en parler ?"
    bonneReponse: "à un surveillant de la cour"
    distracteurs: ["à sa maîtresse", "à l'adulte qui surveille la cantine"]
    indice: "Cette personne est là pour veiller sur les élèves qui jouent."
  - enonce: "En classe, une moquerie se répète chaque jour. À qui Aya doit-elle en parler ?"
    bonneReponse: "à sa maîtresse"
    distracteurs: ["à un surveillant de la cour", "à l'adulte qui surveille la cantine"]
    indice: "C'est elle qui reste avec les élèves toute la journée."
  - enonce: "À la cantine, une moquerie se répète chaque jour. À qui Malo doit-il en parler ?"
    bonneReponse: "à l'adulte qui surveille la cantine"
    distracteurs: ["à sa maîtresse", "à un surveillant de la cour"]
    indice: "Cette personne veille sur les élèves qui mangent."
  - enonce: "Une moquerie se répète dans la cour, le matin. À qui Tom doit-il en parler ?"
    bonneReponse: "à un surveillant de la cour"
    distracteurs: ["à l'adulte qui surveille la cantine", "à sa maîtresse"]
    indice: "Son rôle est de veiller sur les élèves pendant les récréations."
  - enonce: "En classe, une moquerie se répète le vendredi. À qui Léa doit-elle en parler ?"
    bonneReponse: "à sa maîtresse"
    distracteurs: ["à l'adulte qui surveille la cantine", "à un surveillant de la cour"]
    indice: "C'est elle qui est avec ses élèves tous les jours."
