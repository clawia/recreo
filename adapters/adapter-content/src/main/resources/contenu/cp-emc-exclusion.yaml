schema: 1
id: cp-emc-exclusion
type: question
descripteur:
  matiere: "Enseignement moral et civique"
  niveau: "CP"
  domaine: "Respecter autrui"
  competence: "Reconnaître une situation de moquerie répétée ou d'exclusion et savoir à quel adulte en parler."
lignesDeReferentiel: ["EMC-CP-03"]
#
# S31-2 (docs/backlog/backlog.md, sprint 31). Reecriture complete apres REFUS de nadia-prof le
# 2026-09-07 (squad/conformite/FICHE-bandit-manchot-exclusion-cp.md, squad/sprints/
# s31-second-passage-de-sciences-et-emc-cp/verdicts-nadia-instance-A.md, section 4.1). Trois motifs
# de refus, tous corriges dans ce meme geste :
#
# 1) La premiere moitie du libelle ("reconnaitre") n'etait pas travaillee : les six items de la
#    tache A decrivaient tous une moquerie repetee, aucun n'etait un accident isole, donc rien
#    n'etait a distinguer. LA TACHE A EST DESORMAIS UNE VRAIE DISCRIMINATION : elle sert trois
#    situations de moquerie/exclusion repetee (items 1 a 3, marquees par "chaque midi cette
#    semaine", "presque tous les jours", "depuis plusieurs jours ... a chaque recreation") et trois
#    situations d'accident isole (items 4 a 6, marquees par "une seule fois", "par accident", "sans
#    faire exprès"). La bonne reponse est un CLASSEMENT ("une moquerie qui se répète" / "un accident
#    isolé"), jamais une action que l'enfant devrait entreprendre.
#
# 2) FAB-1a : la tache A servait six fois "en parler a un adulte", mot pour mot (FER-2 tombait a 6
#    items comptables sur 10). Avec le classement ci-dessus, la bonne reponse varie reellement
#    (5 reponses distinctes sur 11 items au total dans le paquet, aucune tache invariante).
#
# 3) CAT-1 n'etait tenue sur aucune des deux taches. Sur la tache A, les propositions sont
#    desormais trois CLASSEMENTS (jamais une reaction "prudente" contre des reactions "agressives")
#    : "une moquerie qui se répète" / "un accident isolé" / une troisieme categorie de contraste
#    ("une bagarre", "une blague entre amis", "un jeu de récréation", "une dispute", "une
#    vengeance") - aucune n'est grossiere ni dangereuse, ce sont des labels de situation, pas des
#    actes. Sur la tache B, la proposition au rabais "a personne, ..." est retiree ; les trois
#    propositions sont desormais toujours trois adultes reels (maitresse, surveillant de cour,
#    adulte de cantine), dont deux ne conviennent pas au lieu decrit.
#
# Lecture de EMC-3 qui fait foi, ecrite par nadia-prof le 2026-09-07 dans le verdict qui refusait
# ce paquet : "EMC-3 est une interdiction portant sur les propositions - aucune, en bonne reponse
# comme en distracteur, ne dit a l'enfant de regler la situation seul - et non une prescription
# portant sur la bonne reponse. La bonne reponse d'un item de reconnaissance peut donc etre un
# classement, qui n'expose l'enfant a rien." C'est exactement la forme retenue ici : aucune
# proposition de la tache A n'est une action de gestion seule (les propositions sont des noms de
# situation, jamais des verbes d'action) ; la lecture par categorie d'action de la tache B (nommer
# l'adulte precis selon le lieu vaut "en parler a un adulte") reste confirmee sans reserve par
# nadia-prof (meme verdict, section 4.1) : elle n'est pas retouchee ici.
#
# Longueur des enonces : ramenee a une seule phrase de situation courte (12 a 16 mots), contre 22 a
# 31 mots sur la version refusee. Les indices de la tache A n'ajoutent plus seulement la duree deja
# donnee par l'enonce ; ils disent le critere de distinction (la repetition contre l'occurrence
# unique) sans jamais nommer la bonne reponse.
#
# EMC-1 : aucun item n'interroge l'enfant sur ce qu'il ressent, vit ou fait chez lui - les
# personnages sont fictifs et exterieurs a l'enfant qui joue.
#
# EMC-8 : aucun item ne demande a l'enfant de declarer un comportement.
#
# EMC-10 : aucun item ne nomme une personne reelle vivante, un parti, un syndicat ni une
# organisation. Les personnages (Lea, Hugo, Aya, Malo, Tom) sont fictifs.
#
# PLA-1 : chaque proposition est une categorie de situation qu'un enfant de CP peut serieusement
# envisager (moquerie, accident, bagarre, blague, jeu, dispute, vengeance ; un adulte reel selon le
# lieu), jamais un bouton de remplissage.
#
# FAB-1, CAT-1 : verifies par ADR-0086 sur le contenu servi entier (aucun sous-ensemble de trois
# items ou plus ne partage a la fois le meme trio de propositions et la meme bonne reponse).
#
# TYP-1 (ADR-0067) : chaque enonce pose l'espace insecable devant son "?" final.
#
# FER-2 : onze items, au-dessus du plancher de dix (DEC-0064).
#
# Correction du 2026-09-08 (lea-dev, S32-4, docs/backlog/backlog.md, sprint 32), quatre des cinq
# reserves de nadia-prof (squad/conformite/FICHE-bandit-manchot-exclusion-cp.md, bloc du reaudit) :
#
# EXC-R3 : la troisieme proposition de la tache A (items 1, 5, 6) n'etait pas un candidat serieux -
# "une bagarre" la ou personne ne se bat (item 1), "une dispute" sur un pied ecrase par accident
# (item 5), "une vengeance" sur un geste dit "sans faire expres" (item 6). Remplacees par des
# categories qu'un enfant peut vraiment envisager pour la scene decrite ("une bousculade", "un jeu
# de recreation", "une blague") - aucun trio de propositions ne se repete avec la meme bonne reponse.
#
# EXC-R4 : les deux enonces les plus longs de la tache B (items 9 et 10 de ce fichier, 16 et 18
# mots avant correction) posaient deux circonstances avant la question. Ramenes a une seule
# circonstance chacun (LON-1, LON-2, arbitrage prealable de s32, section 16.4).
#
# EXC-R2 : les cinq indices de la tache B ne redonnaient que le lieu deja ecrit dans l'enonce, et
# deux d'entre eux reprenaient un mot de la bonne reponse. Ils disent desormais le role de l'adulte
# aupres des eleves, une information que l'enonce ne donne pas, sans reprendre les mots de la bonne
# reponse ni le lieu deja ecrit.
#
# EXC-R1 et EXC-R5, payees le 2026-09-09 (lea-dev, S33-EXC-R1, S33-EXC-R5,
# squad/sprints/s32-trois-instances-et-ouverture-de-l-eps/confirmation-archunit.md, section 4 ;
# verdicts-nadia-instance-B.md, sections 8 et 13). L'obstacle technique des deux etait deja leve a
# s32 (theo-archi, ADR-0089, decision E) : PaquetCpEmcExclusionTest lit la tache d'un item dans sa
# bonne reponse, jamais dans une sous-chaine de son enonce.
#
# EXC-R1 : la consigne du catalogue ("Lis bien, puis dis ce qu'il faut faire, ou a qui en
# parler.") ne nommait plus la tache A, qui ne sert plus une action depuis la reecriture de s31 -
# aucune proposition de la tache A n'y est une action. Devenue "Lis bien, puis dis si c'est une
# moquerie qui se repete, ou a quel adulte en parler." (catalogue.yaml), qui nomme les deux taches
# reellement servies. L'inventaire de TexteAccentueExposeParLePortEntrantTest (bootstrap) est mis
# a jour dans le meme commit, comme la story l'exige.
#
# EXC-R5 : sur les cinq enonces de la tache B, "a sa maitresse" etait marque faux pour une
# moquerie qui se repete a la cantine ou dans la cour, au seul motif du lieu decrit - nadia-prof a
# presse ce bouton en jouant sur l'item de la cantine et le jeu l'a refuse a tort (verdicts-nadia-
# instance-B.md, section 8). Les cinq enonces disent desormais explicitement quel adulte est
# present au moment decrit ("devant le surveillant", "devant la maitresse", "devant l'adulte du
# repas") plutot que de laisser deviner une convention de lieu non ecrite : le critere devient la
# presence, jamais le seul lieu de la scene. La forme "A qui X doit-il en parler ?" disparait des
# cinq enonces, remplacee par "Quel adulte est la ?", comme la reserve le demande mot pour mot.
# Aucune bonne reponse ne change (les cinq items continuent de nommer l'un des trois adultes de
# ADULTES_VALIDES) : FER-3, ADULTES_VALIDES et le partage exhaustif des deux taches restent tenus
# a l'identique. Les cinq nouveaux enonces comptent 13 a 15 mots et deux phrases (LON-1, LON-2).
#
# S34-EXC-TACHEB (2026-09-10, marc-dev). Refonte de la tache B, sur la decision de forme de
# nadia-prof (arbitrage prealable de s34, section 4.4 ; arbitrage de sortie,
# squad/sprints/s34-dernier-sprint-du-plan-2-palier-2-engage/arbitrage-emccp07-nadia.md, sections 4
# a 4.6). La competence n'est pas "quel adulte", c'est "qu'on en parle a un adulte" : les cinq items
# opposent desormais trois conduites qu'un enfant de six ans a reellement face a une moquerie qui se
# repete, jamais trois adultes de l'ecole.
#
# Objet (4.4 puis 4.2) : devant une moquerie qui se repete, l'enfant reconnait, parmi trois
# conduites, celle qui consiste a en parler a un adulte. Les deux autres sont ce qu'un enfant fait a
# la place - attendre que cela s'arrete tout seul, en parler a un camarade, esperer qu'un adulte
# l'ait deja remarque - jamais une conduite vilaine ("rendre le coup" n'apparait dans aucune
# proposition, C-1 : un item de cette tache ne se decide plus au ton).
#
# C-2 (bloquante) payee : la bonne reponse varie sur les cinq items ("en parler a un surveillant de
# la cour" x2, "en parler a sa maitresse" x2, "en parler a l'adulte qui surveille la cantine" x1),
# jamais une reponse invariante - le defaut meme du premier passage (FAB-1a).
#
# Q1 (EXC-R7) : aucun item ne se gagne en appariant deux mots identiques entre l'enonce et la bonne
# reponse. Le lieu ou le moment est installe par un mot que la bonne reponse n'emploie pas
# ("recreation" contre "surveillant de la cour" ; "classe" contre "maitresse" ; "au moment du repas"
# contre "cantine"), l'enfant doit inferer quel adulte est present, jamais recopier un mot.
#
# Condition ajoutee par Q1 (FAB-1c recomptee) : deux des cinq items (le troisieme et le cinquieme)
# portent un distracteur qui nomme lui aussi un adulte ("esperer qu'un adulte l'ait deja remarque"),
# pour que la bonne reponse ne soit jamais, sur l'ensemble de la tache, la seule proposition a
# nommer un adulte.
#
# Q3 : "attendre que cela s'arrete tout seul" est retenu comme distracteur (PLA-1 : un enfant de six
# ans l'envisage vraiment ; CAT-1 : rien de vilain). Son indice ne renomme pas la bonne reponse : il
# donne le role de l'adulte concerne, un fait que l'enonce ne donne pas.
#
# EXC-R8 : la question ("Que doit faire X ?") recollee a chacune des trois propositions forme une
# phrase francaise ("Que doit faire Tom ? en parler à un surveillant de la cour.").
#
# Ce qui ne bouge pas (perimetre de la story, section 4.2 de l'arbitrage de sortie) : la tache A
# (items 1 a 6), la consigne du catalogue, le fait de droit implicite de chaque lieu. TYP-1 (espace
# insecable devant le "?" final) et LON-1/LON-2 (au plus 15 mots, deux phrases dont la seconde est la
# question) sont tenues sur les cinq enonces neufs sans toucher a la dette de longueur declaree
# (item 2 de la tache A, inchange).
#
# S35-EXC-INDICES (2026-09-11, sofia-sm). Refonte des cinq lignes indice de la tache B, refusee a
# s34 (EXC-R10, squad/conformite/FICHE-bandit-manchot-exclusion-cp.md, section "Le motif du refus") :
# les cinq indices etaient restes ceux de la tache "Quel adulte est la ?" que la refonte de
# S34-EXC-TACHEB supprime, et repondaient donc a une question que les items ne posent plus.
#
# EXC-R10 (bloquante) payee : chacun des cinq indices dit desormais pourquoi les deux conduites
# ecartees de son item ne font pas cesser une moquerie qui se repete, jamais le role de l'adulte de
# la bonne reponse - "Si Tom attend ou croit qu'un adulte a deja vu, Hugo continuera de se moquer de
# lui" plutot que "Cette personne est la pour veiller sur les eleves qui jouent". Aucun indice ne
# renomme la bonne reponse (mode de defaillance nomme par nadia-prof) : le mot "adulte" y figure
# comme sujet d'une conduite ecartee, jamais comme la reponse a presser.
#
# EXC-R11 (non bloquante, soldee dans le meme geste) : sur les trois items qui n'avaient aucun
# distracteur nommant un adulte (items 7, 9, 10), un des deux distracteurs devient "croire qu'un
# adulte a deja vu cela" - la meme famille de conduite que celle deja servie sur les items 8 et 11.
# Les cinq items de la tache portent donc desormais chacun un contrepoids qui nomme un adulte sans
# resoudre la moquerie, au lieu de trois sur cinq a la cloture de s34.
#
# EXC-R12 (non bloquante, soldee dans le meme geste) : "esperer qu'un adulte l'ait remarquee"
# (subjonctif passe, pronom elide sans antecedent dans la proposition) devient, sur les items 8 et
# 11 qui la portaient, "penser que la situation est deja connue d'un adulte" - indicatif, aucun
# pronom elide. Deux formulations distinctes portent cette famille de conduite ("croire qu'un
# adulte a deja vu cela" sur 7, 9, 10 ; "penser que la situation est deja connue d'un adulte" sur 8
# et 11), plutot qu'une seule recopiee cinq fois : LaFormeDesPropositionsNeDesigneJamaisLaBonneReponseTest
# (ADR-0086, clause 2, FOP-R4) refuse qu'un moule de quatre mots ou plus se repete sur quatre
# distracteurs ou plus d'un meme paquet sans qu'aucune bonne reponse ne le partage - une premiere
# ecriture de ce lot, ou les cinq items recopiaient "croire qu'un adulte a deja vu cela" mot pour
# mot, faisait rougir ce garde-fou (5 distracteurs sur 16 dans le meme moule) : c'est exactement la
# contrefacon par l'amorce que la clause existe pour refuser, un enfant qui n'a rien compris
# trouvant la bonne reponse en reconnaissant que les boutons commencant par "croire qu'un adulte"
# sont toujours faux. Corrige en scindant la famille en deux groupes de trois et deux items, chacun
# sous son plafond.
#
# Piege de caractere (avis de faisabilite de theo-archi, s35, section 2.3) : aucune des cinq
# propositions neuves ne porte de ligature "oe"/"ae" (PropositionsAccentueesJouablesIT).
#
# Ce qui ne bouge pas : les cinq enonce, bonneReponse et distracteurs "en parler a ..." de la tache
# B (deja bons, EXC-R7, EXC-R8, C-1, C-2 tenus a l'identique) ; les six items de la tache A ; TYP-1,
# LON-1, LON-2 (qui ne portent pas sur l'indice).
items:
  - enonce: "Chaque midi cette semaine, Malo empêche Aya de s'asseoir avec le groupe. Qu'est-ce que c'est ?"
    bonneReponse: "une mise à l'écart qui se répète"
    distracteurs: ["un accident isolé", "une bousculade"]
    indice: "Une seule fois serait un hasard ; là, cela recommence chaque jour."
  - enonce: "Presque tous les jours, Hugo se moque de la façon dont parle Tom. Qu'est-ce que c'est ?"
    bonneReponse: "une moquerie qui se répète"
    distracteurs: ["un accident isolé", "une blague entre amis"]
    indice: "Une moquerie qui revient aussi souvent n'est plus un hasard."
  - enonce: "Depuis plusieurs jours, Malo écarte Tom du jeu à chaque récréation. Qu'est-ce que c'est ?"
    bonneReponse: "une mise à l'écart qui se répète"
    distracteurs: ["un accident isolé", "un jeu de récréation"]
    indice: "Écarter quelqu'un plusieurs jours de suite n'est pas un jeu ordinaire."
  - enonce: "En courant, Tom bouscule Malo une seule fois et s'excuse aussitôt. Qu'est-ce que c'est ?"
    bonneReponse: "un accident isolé"
    distracteurs: ["une mise à l'écart qui se répète", "une bagarre"]
    indice: "Une excuse immédiate après un geste involontaire n'est pas une mise à l'écart."
  - enonce: "Aya marche sur le pied de Hugo une seule fois, par accident. Qu'est-ce que c'est ?"
    bonneReponse: "un accident isolé"
    distracteurs: ["une moquerie qui se répète", "un jeu de récréation"]
    indice: "Un seul faux pas involontaire n'est pas la même chose qu'une habitude."
  - enonce: "Malo fait tomber le dessin de Léa une fois, sans faire exprès. Qu'est-ce que c'est ?"
    bonneReponse: "un accident isolé"
    distracteurs: ["une moquerie qui se répète", "une blague"]
    indice: "Une maladresse unique n'a rien à voir avec un geste répété exprès."
  - enonce: "Hugo se moque de Tom à chaque récréation. Que doit faire Tom ?"
    bonneReponse: "en parler à un surveillant de la cour"
    distracteurs: ["attendre que cela s'arrête tout seul", "croire qu'un adulte a déjà vu cela"]
    indice: "Si Tom attend ou croit qu'un adulte a déjà vu cela, Hugo continuera de se moquer de lui à la récréation."
  - enonce: "Malo se moque des dessins de Léa chaque jour, en classe. Que doit faire Léa ?"
    bonneReponse: "en parler à sa maîtresse"
    distracteurs: ["penser que la situation est déjà connue d'un adulte", "en parler à un camarade"]
    indice: "Penser qu'un adulte est déjà au courant, ou le dire seulement à un camarade, ne fait pas arrêter Malo."
  - enonce: "Aya se moque de Hugo chaque midi, au moment du repas. Que doit faire Hugo ?"
    bonneReponse: "en parler à l'adulte qui surveille la cantine"
    distracteurs: ["garder cela pour lui sans rien dire", "croire qu'un adulte a déjà vu cela"]
    indice: "Si Hugo garde cela pour lui ou croit qu'un adulte a déjà vu cela, Aya continuera de se moquer de lui à la cantine."
  - enonce: "Tom écarte Malo du jeu à chaque récréation. Que doit faire Malo ?"
    bonneReponse: "en parler à un surveillant de la cour"
    distracteurs: ["faire comme si de rien n'était", "croire qu'un adulte a déjà vu cela"]
    indice: "Si Malo fait comme si de rien n'était ou croit qu'un adulte a déjà vu cela, Tom continuera de l'écarter du jeu."
  - enonce: "Hugo se moque de la lecture d'Aya chaque jour, en classe. Que doit faire Aya ?"
    bonneReponse: "en parler à sa maîtresse"
    distracteurs: ["attendre que cela s'arrête tout seul", "penser que la situation est déjà connue d'un adulte"]
    indice: "Attendre, ou penser qu'un adulte est déjà au courant, ne fait pas arrêter Hugo. Il faut le dire soi-même."
