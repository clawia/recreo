# S52-FRA-PRESENT (s52, DEC-0111 section 4). Arbitrage prealable de nadia-prof, conditions PRS-CE1-1
# a PRS-CE1-3 (squad/conformite/ARBITRAGE-PREALABLE-s48-francais-ce1.md, section 5.8), reponse a Q1
# (squad/conformite/ARBITRAGE-PREALABLE-s52-fra-ce1-questions-de-l-avis.md, section 1) et sept
# conditions transverses TRV-CE1-1 a TRV-CE1-7 (s48, section 2). Avis de faisabilite de theo-archi
# (squad/sprints/s52-deux-instances-ce1-francais-maths/avis-faisabilite.md, V2).
#
# PRS-CE1-1 : dix-huit items sur vingt-quatre ont pour cible un des six verbes (etre, avoir, aller,
# faire, dire, venir), au-dessus de la moitie ; six items portent un verbe du premier groupe sans
# modification orthographique (ecouter, regarder, parler, dessiner, travailler, laver).
# PRS-CE1-2 : le sujet est toujours un pronom personnel ; chacune des six personnes est le sujet de
# quatre items sur vingt-quatre (au-dessus du dixieme exige).
# PRS-CE1-3 : chaque item declare, juste au-dessus, la famille de chacun de ses deux distracteurs,
# dans l'ordre du fichier : "a" le meme verbe a une autre personne, "b" la forme regularisee d'un
# verbe irregulier (seulement vous disez, vous faisez, ils faisent, ils allent, ils venent, admises
# d'avance par nadia-prof, Q1), "c" l'infinitif. Ni "alle" ni "alles" (Q1), aucun participe passe.
# Relu par PaquetCe1ConjugaisonPresentTest contre la table des formes du present.
# TRV-CE1-2 : la bonne reponse est strictement la plus longue des trois propositions dans cinq items
# sur vingt-quatre, sous la moitie.
# TRV-CE1-6 : aucun prenom, aucune possession ni situation familiale dans les phrases a "tu" et a
# "vous" ; deux "il", deux "elle", deux "ils" et deux "elles" a la troisieme personne, et "faire du
# bruit" est porte par "elles".
# TRV-CE1-5 : aucun indice ne renvoie a l'ecoute de la phrase sur un item dont un distracteur se
# prononce comme la bonne reponse (parlez / parler, dis / dit).
# TRV-CE1-1 a TRV-CE1-7 : niveau CE1, une seule ligne de referentiel (FRA-CE1-17), aucun champ a
# voix haute ni texteSupport ni illustration, un indice sur chaque item (douze mots au plus, jamais
# la reponse), vingt-quatre items au-dessus du plancher de vingt. LON-CE1-5 : un mot par
# proposition. La question est portee par la consigne du jeu.
schema: 1
id: ce1-conjugaison-present
type: question
descripteur:
  matiere: "Français"
  niveau: "CE1"
  domaine: "Orthographe et grammaire"
  competence: "Conjuguer au présent de l'indicatif être, avoir, les verbes du premier groupe et quelques verbes fréquents (aller, faire, dire, venir)."
lignesDeReferentiel: ["FRA-CE1-17"]
items:
