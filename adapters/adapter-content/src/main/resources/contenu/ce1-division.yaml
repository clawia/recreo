type: question
descripteur:
  matiere: "Mathématiques"
  niveau: "CE1"
  domaine: "Nombres et calculs"
  competence: "Comprendre le sens de la division en résolvant des problèmes de partage et de groupement"
lignesDeReferentiel: ["MAT-CE1-18"]
items:
