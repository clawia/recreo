# S44-MAT-DIVISION (MAT-CE1-18, DEC-0099 section 9.6). Arbitrage prealable de nadia-prof, conditions
# DIV-CE1-1 a DIV-CE1-5 (squad/conformite/ARBITRAGE-PREALABLE-s43-mathematiques-ce1-lot-3.md,
# section 4), et DIV-CE1-6 (meme fichier, addendum du 2026-09-25, section 11.2), qui pose la
# frontiere avec MAT-CE1-06 (sens de la multiplication).
#
# DIV-CE1-1 : dividende entier de 4 a 60, diviseur entier de 2 a 10, division exacte (aucun reste).
#
# DIV-CE1-2 : les deux sens sont servis, chacun sur au moins un tiers des items. Partage : le nombre
# de parts est donne, la valeur d'une part est cherchee ("partage entre"). Groupement : la valeur
# d'une part est donnee, le nombre de parts est cherche ("range par", "en bouquets de"). Onze items
# de partage, dix de groupement, sur vingt et un.
#
# DIV-CE1-3, elargie par DIV-CE1-6 point 2 : aucune ecriture operatoire nulle part - ni les signes
# "+", "-", "x", "×", ":", "÷" employes entre deux nombres, ni le signe "=", dans l'enonce, les
# propositions ou l'indice. Chaque item est une situation en mots.
#
# DIV-CE1-4 : six items sur vingt et un ont un diviseur de 2 (28,6 %, sous le tiers), aucun n'emploie
# le mot "moitie" et aucun ne se reduit au fait de repertoire deja servi par
# bandit-manchot-moities-ce1 (MAT-CE1-03, forme "Moitie de n = ?") - ce sont des situations en mots,
# jamais une question arithmetique nue.
#
# DIV-CE1-5 : chaque item porte au moins un distracteur correspondant a une erreur identifiable - le
# produit au lieu du quotient (a x b), la difference au lieu du quotient (a - b), ou le diviseur
# recopie (b, le nombre de l'enonce qui n'est pas le dividende : le nombre de parts dans un partage,
# la valeur d'une part dans un groupement - troisieme cas amende le 2026-09-25, section 11.7 de
# l'arbitrage cite plus haut). Tous les distracteurs sont des entiers strictement positifs, distincts
# entre eux et de la bonne reponse.
#
# DIV-CE1-6 : frontiere avec MAT-CE1-06, elargie le 2026-09-25 (section 11.7, meme arbitrage).
# Aucun support visuel (ni illustration ni tableauSupport). Aucune ecriture operatoire dans aucun
# texte de l'item (enonce, bonne reponse, distracteurs, indice - voir DIV-CE1-3 ci-dessus ; ce
# paquet ne porte ni explication, ni texte-support, ni texte a voix haute). Le dividende est une
# quantite d'objets nommes ("8 crayons", "45 perles"), jamais un nombre nu : il est toujours suivi,
# sans ponctuation intercalee, du nom de l'objet compte.
#
# ADR-0098 : la sous-partie de MAT-CE1-18 est allouee dans SousPartieDeMathematiquesCe1
# ("Comprendre le sens de la division en résolvant des problèmes de partage et de groupement"), et ce
# paquet declare la ligne qu'elle sert.
#
# ADR-0101 : le champ "enonce" de chaque item reste a vingt mots et trois phrases au plus (LON-CE1-1,
# LON-CE1-2) - ce paquet n'ajoute aucune entree a la dette de longueur du CE1.
schema: 1
