# NEG-CE1-1 : "ne... pas" seul, verbe au present ; quatorze items vers la negative (au moins la moitie),
# dix vers l'affirmative (au moins le quart).
# NEG-CE1-2 : elision (n') dans quatorze items sur vingt-quatre (au moins le cinquieme).
# NEG-CE1-3 : chaque item declare la famille de ses deux distracteurs, dans l'ordre du fichier : (a) le ne
# omis, (b) pas mal place, (c) elision absente, (d) vers l'affirmative un ne ou un pas reste. Hors de la
# negation, les trois propositions reprennent les memes mots.
# TRV-CE1-2 : vers l'affirmative la bonne reponse est toujours la plus courte des trois (le distracteur
# garde un mot de la negation) ; elle n'est jamais strictement la plus longue.
# TRV-CE1-1 a TRV-CE1-7 (squad/conformite/ARBITRAGE-PREALABLE-s48-francais-ce1.md, section 2) : niveau CE1, une seule ligne de referentiel, aucun champ a
