# S53-FRA-ACCORD-GROUPE-NOMINAL (s53, generation de contenu seul, brouillon soumis a nadia-prof). Conditions
# GNA-CE1-1 a GNA-CE1-3 (squad/conformite/ARBITRAGE-PREALABLE-s48-francais-ce1.md, section 5.6).
#
# GNA-CE1-1 : un adjectif dans vingt et un groupes nominaux sur vingt-quatre ; pluriel en -s six items,
# pluriel en -x douze items, feminin en -e six items (au moins un cinquieme chacun).
# GNA-CE1-2 : le -x seulement pour les mots en -eau, -au, -eu, hors exceptions (bleu, pneu, landau) ; feminin
# par ajout d'un -e sans autre changement ; aucun adjectif deja termine par -e au feminin.
# GNA-CE1-3 : le groupe nominal entier est propose. (a) marque oubliee sur un mot, (b) marque posee sur le
# mauvais mot (determinant de l'autre genre ou de l'autre nombre, ou marque en trop sur l'adjectif), (c) -s a
# la place de -x. Chaque item declare ses familles dans l'ordre du fichier.
# TRV-CE1-2 : le -s a la place du -x a la meme longueur que la bonne reponse ; elle n'est strictement la plus
# longue que dans dix items sur vingt-quatre.
# TRV-CE1-1 a TRV-CE1-7 (squad/conformite/ARBITRAGE-PREALABLE-s48-francais-ce1.md, section 2) : niveau CE1, une seule ligne de referentiel, aucun champ a
# voix haute ni texteSupport ni illustration, un indice sur chaque item (douze mots au plus, jamais
# la reponse, jamais un renvoi a l'ecoute), plancher de vingt items atteint. LON-CE1-5 : au plus six mots
# par proposition. La question est portee par la consigne du jeu quand l'enonce ne la porte pas.
schema: 1
