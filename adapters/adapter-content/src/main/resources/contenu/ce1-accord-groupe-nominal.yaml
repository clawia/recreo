  niveau: "CE1"
  domaine: "Orthographe et grammaire"
  competence: "Accorder en nombre et en genre dans le groupe nominal (déterminant, nom, adjectif) : pluriel en -s et en -x (-eau, -au, -eu), féminin en -e."
