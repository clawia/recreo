schema: 1
id: cp-qlm-autrefois-aujourdhui
type: question
descripteur:
  matiere: "Questionner le monde"
  niveau: "CP"
  domaine: "Se situer dans le temps"
  competence: "Comparer des modes de vie d'autrefois et d'aujourd'hui à partir d'objets et d'images du quotidien."
lignesDeReferentiel: ["QLM-CP-15"]
#
# S47-QLM-AUTREFOIS (docs/backlog/backlog.md, sprint 47). Arbitrage prealable deja rendu
# (ARBITRAGE-PREALABLE-s29-le-prix-des-quatre-matieres-neuves-et-le-plafond-a-huit-lignes.md, ligne
# 374) : "oui, choix ; plus juste en illustre. Piege de biais : 'autrefois' ne veut pas dire 'moins
# bien'." Condition posee d'avance, citee mot pour mot (meme source) :
#   BIA-3 - Sur "autrefois et aujourd'hui" (QLM 15) : la chronologie n'est pas un progres. Aucun item
#   ne qualifie l'ancien de difficile, dur, pauvre ou pas pratique.
# Referentiel copie conforme depuis squad/programme/questionner-le-monde/competences-cp.md
# (QLM-CP-15).
#
# Correction du 2026-10-02 (lea-dev, squad/conformite/FICHE-bandit-manchot-autrefois-aujourdhui-cp.md,
# Done pedagogique REFUSE le 2026-10-02 par nadia-prof, s47 instance A) : deux motifs corriges dans
# le meme geste.
# 1) Les sept items de rattachement (1 a 7) se repondaient par le seul temps du verbe (imparfait
#    pour autrefois, present pour aujourd'hui), sans que l'enfant sache rien de l'objet decrit.
#    Reecrits au present pour les deux epoques : seul l'objet ou la pratique porte l'epoque.
# 2) L'item 14 rangeait le livre d'images dans autrefois et supposait une tablette a la maison.
#    Remplace par un item qui ne suppose aucun equipement au foyer.
# Corrections non bloquantes signalees dans la meme fiche, traitees dans le meme commit :
#   - item 5 reformule en voix active pour ne plus reprendre mot pour mot la reponse de l'item 11 ;
#     item 7 reformule, et son indice ne cite plus la reponse de l'item 13.
#   - item 8 : distracteurs remplaces par deux objets qui lavent aussi le linge, pour que l'epoque
#     decide seule.
#   - item 9 : la question ne reprend plus le mot de la bonne reponse ; le distracteur "un
#     telegramme" (mot inconnu d'un enfant de CP) est remplace par "un telephone fixe".
#   - items 4, 13 : l'indice decrit desormais l'objet, pas l'avantage qu'il procure aujourd'hui.
#
# Correction du 2026-10-02 (lea-dev, squad/conformite/FICHE-bandit-manchot-autrefois-aujourdhui-cp.md,
# Done pedagogique REFUSE une seconde fois le 2026-10-02 par nadia-prof, s47 instance A, motif neuf) :
# 1) item 9 - le distracteur "un telephone fixe" rejetait une reponse juste : un appel telephonique
#    est bien un moyen d'aujourd'hui pour donner une nouvelle, et l'indice ("part et arrive presque
#    aussitot, sans papier ni timbre") le decrit aussi. Remplace par "un messager a cheval", moyen
#    qui n'est plus en usage aujourd'hui et dont un enfant de CP connait les mots.
# Trois points non bloquants de la meme fiche, pris dans le meme passage :
#   - item 14 : "a la pharmacie" et "a la poste" s'ecartaient sans rien savoir de l'epoque, et
#     l'enonce ne disait pas ou le pain etait cuit. Enonce reecrit ("a la maison" plutot que "au
#     four a bois", puisque des boulangers cuisent encore au four a bois aujourd'hui) ;
#     distracteurs remplaces par "a la maison" et "chez le voisin", pour que l'epoque decide seule.
#   - items 1 et 8 : l'indice de l'item 1 donnait mot pour mot la reponse de l'item 8 ("machines a
#     laver"). Indice de l'item 1 reformule sans citer cette reponse.
#   - items 4 et 7 : les indices decrivaient l'objet sans le situer dans le temps. Un marqueur
#     temporel est ajoute a chacun, sans dire ce que l'objet epargne.
#
# BIA-3 : aucun enonce ni aucune proposition ne qualifie une pratique ou un objet d'autrefois de
# difficile, dur, pauvre ou pas pratique, ni n'en fait une norme de progres. Les deux epoques sont
# decrites, jamais comparees en bien ou en mal.
#
# FER-3 : deux taches distinctes, chacune sur des items propres :
#   - rattacher un objet a une epoque (items 1 a 7) : l'enonce decrit une pratique du quotidien et
#     demande s'il releve d'autrefois ou d'aujourd'hui (forme binaire) ;
#   - comparer deux usages (items 8 a 14) : l'enonce decrit une pratique d'une epoque et demande par
#     quel objet ou quelle pratique elle est remplacee, ou ce qu'elle remplace, dans l'autre epoque.
#
# FER-1 : l'element "objets et images du quotidien" est servi par la tache de comparaison, dont la
# bonne reponse nomme toujours un objet ou une pratique concrete (jamais "autrefois"/"aujourd'hui").
#
# FER-2 : quatorze items, au-dessus du plancher de dix items par ligne fermee (DEC-0064).
#
# Les propositions de la tache de rattachement ("autrefois", "aujourd'hui") sont hors du domaine
# numerique (LeRangDeLaBonneReponseNEstPasPredictibleSurUnPaquetTest,
# PAQUETS_HORS_DU_DOMAINE_NUMERIQUE), de meme que les noms d'objets et de pratiques de la tache de
# comparaison.
#
# LON-1, LON-2 (ADR-0089) : chaque enonce compte au plus quinze mots et au plus deux phrases, la
# seconde etant toujours la question.
#
# TYP-1 (ADR-0067) : chaque enonce pose l'espace insecable devant son "?" final. Paquet neuf, aucune
# dette heritee.
items:
  - enonce: "On lave le linge à la main au lavoir. Est-ce autrefois ou aujourd'hui ?"
    bonneReponse: "autrefois"
    distracteurs: ["aujourd'hui"]
    indice: "Les lavoirs ont presque disparu. On lave le linge chez soi, sans sortir de la maison."
  - enonce: "On réchauffe un plat en quelques minutes au micro-ondes. Est-ce autrefois ou aujourd'hui ?"
    bonneReponse: "aujourd'hui"
    distracteurs: ["autrefois"]
    indice: "Le four à micro-ondes est un appareil électrique récent."
  - enonce: "On s'éclaire le soir avec une lampe à huile. Est-ce autrefois ou aujourd'hui ?"
    bonneReponse: "autrefois"
    distracteurs: ["aujourd'hui"]
    indice: "L'éclairage électrique a remplacé la lampe à huile."
  - enonce: "On écrit un texte avec un ordinateur. Est-ce autrefois ou aujourd'hui ?"
    bonneReponse: "aujourd'hui"
    distracteurs: ["autrefois"]
    indice: "Cet appareil, avec un écran et un clavier, est une invention récente."
  - enonce: "Un cheval tire la charrue dans le champ. Est-ce autrefois ou aujourd'hui ?"
    bonneReponse: "autrefois"
    distracteurs: ["aujourd'hui"]
    indice: "Le tracteur a remplacé le cheval pour labourer les champs."
  - enonce: "On roule en ville à vélo électrique. Est-ce autrefois ou aujourd'hui ?"
    bonneReponse: "aujourd'hui"
    distracteurs: ["autrefois"]
    indice: "L'assistance électrique du vélo est une invention récente."
  - enonce: "On va chercher l'eau à un puits. Est-ce autrefois ou aujourd'hui ?"
    bonneReponse: "autrefois"
    distracteurs: ["aujourd'hui"]
    indice: "Ce puits est un trou profond creusé dans le sol. On y allait chercher l'eau avant d'avoir un robinet."
  - enonce: "Autrefois, on lavait le linge au lavoir. Avec quoi le lave-t-on aujourd'hui ?"
    bonneReponse: "une machine à laver"
    distracteurs: ["une planche à laver", "un baquet"]
    indice: "Cet appareil électrique lave et essore le linge tout seul."
  - enonce: "Autrefois, on envoyait une lettre par la poste. Comment envoie-t-on une nouvelle aujourd'hui ?"
    bonneReponse: "un message électronique"
    distracteurs: ["un pigeon voyageur", "un messager à cheval"]
    indice: "Ce message part et arrive presque aussitôt, sans papier ni timbre."
  - enonce: "Autrefois, on s'éclairait à la bougie. Avec quoi éclaire-t-on une pièce aujourd'hui ?"
    bonneReponse: "une ampoule électrique"
    distracteurs: ["une bougie", "un feu de cheminée"]
    indice: "Il suffit d'appuyer sur un interrupteur pour l'allumer."
  - enonce: "Aujourd'hui, un tracteur laboure le champ. Avec quoi labourait-on autrefois ?"
    bonneReponse: "une charrue tirée par un cheval"
    distracteurs: ["une pelle mécanique", "un camion"]
    indice: "Un animal fournissait la force nécessaire pour tirer l'outil."
  - enonce: "Aujourd'hui, on se déplace en voiture. Comment se déplaçait-on autrefois dans un village ?"
    bonneReponse: "à pied ou à cheval"
    distracteurs: ["en avion", "en métro"]
    indice: "Les villages n'avaient alors ni route goudronnée ni moteur."
  - enonce: "Autrefois, on allait chercher l'eau au puits. Comment l'eau arrive-t-elle aujourd'hui ?"
    bonneReponse: "par un robinet"
    distracteurs: ["par une rivière voisine", "par un camion-citerne"]
    indice: "Ce robinet est relié à des tuyaux sous la terre."
  - enonce: "Autrefois, on cuisait le pain à la maison. Où achète-t-on le pain aujourd'hui ?"
    bonneReponse: "à la boulangerie"
    distracteurs: ["à la maison", "chez le voisin"]
    indice: "C'est un commerce qui vend du pain tous les jours."
