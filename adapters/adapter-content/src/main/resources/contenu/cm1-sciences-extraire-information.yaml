schema: 1
id: cm1-sciences-extraire-information
type: question
descripteur:
  matiere: "Sciences et technologie"
  niveau: "CM1"
  domaine: "Démarches et langages scientifiques"
  competence: "Extraire une information explicitement présente dans un document scientifique (texte ou tableau) et la restituer (référentiel CM1, ligne SCI-CM1-20)"
lignesDeReferentiel: ["SCI-CM1-20"]
#
# S40-EXTRACTION (docs/backlog/backlog.md, sprint 40 ; DEC-0093, DEC-0094). Premier paquet a
# utiliser la cle 'tableauSupport' (ADR-0099). Mention de couverture partielle exigee d'avance par
# nadia-prof (ARBITRAGE-PREALABLE-s32-trois-instances-ma-borne-a-douze-le-terrain-sans-image-et-le-
# prix-d-une-ligne-marginale.md, ligne 1033), a reprendre telle quelle dans la matrice par
# camille-po - sans elle, la ligne ne ferme pas :
#   "document textuel et tableau seuls ; le schema et le graphique restent non couverts"
#
# DEC-0094 : les deux formes de document (texte, tableau) sont exigees sur le paquet, pas sur
# chaque item. Six items s'appuient sur 'texteSupport' (deux textes de trois phrases, repris chacun
# sur trois items), six sur 'tableauSupport' (deux tableaux de trois lignes, repris chacun sur trois
# items).
#
# Chaque reponse est un extrait recopiable tel quel du document - aucune deduction, aucun calcul :
# la phrase ou la ligne de tableau qui porte la reponse est identifiee item par item ci-dessous, et
# aucune des deux phrases ou lignes restantes du meme document ne porte cette reponse. Les
# distracteurs sont pris dans le meme document (une autre valeur de la meme colonne du tableau) ou
# de meme nature que la reponse (une autre couche d'air, un autre regime alimentaire, un autre etat
# de la matiere), et ne sont jamais hors sujet.
#
# ADR-0072/ADR-0099 decision 4 (AucunePhraseDuTexteSupportNeSuffitAGagnerLaMajoriteTest) : la
# phrase ou la ligne qui porte la reponse varie d'un item a l'autre sur chaque document, pour
# qu'aucune strategie qui ne lirait qu'un seul fragment fixe ne gagne la majorite du paquet.
#
# indicesNommentLaReponse n'est pas pose sur ce paquet (absent, vaut faux).
#
# Douze items, strictement superieur aux dix manches par defaut (DEC-0064, ADR-0023).
items:
  - enonce: "D'après ce tableau, quel est le régime alimentaire de la vache ?"
    tableauSupport:
      enTete: ["Animal", "Régime alimentaire"]
      lignes:
        - ["vache", "herbivore"]
        - ["loup", "carnivore"]
        - ["ours brun", "omnivore"]
    bonneReponse: "herbivore"
    distracteurs: ["carnivore", "omnivore"]
    indice: "Cherche la ligne de la vache dans le tableau."
  - enonce: "D'après ce tableau, quel est le régime alimentaire du loup ?"
    tableauSupport:
      enTete: ["Animal", "Régime alimentaire"]
      lignes:
        - ["vache", "herbivore"]
        - ["loup", "carnivore"]
        - ["ours brun", "omnivore"]
    bonneReponse: "carnivore"
    distracteurs: ["herbivore", "omnivore"]
    indice: "Cherche la ligne du loup dans le tableau."
  - enonce: "D'après ce tableau, quel est le régime alimentaire de l'ours brun ?"
    tableauSupport:
      enTete: ["Animal", "Régime alimentaire"]
      lignes:
        - ["vache", "herbivore"]
        - ["loup", "carnivore"]
        - ["ours brun", "omnivore"]
    bonneReponse: "omnivore"
    distracteurs: ["herbivore", "carnivore"]
    indice: "Cherche la ligne de l'ours brun dans le tableau."
  - enonce: "D'après ce tableau, dans quel état se trouve le fer à température ambiante ?"
    tableauSupport:
      enTete: ["Matériau", "État à température ambiante"]
      lignes:
        - ["fer", "solide"]
        - ["eau", "liquide"]
        - ["dioxygène", "gazeux"]
    bonneReponse: "solide"
    distracteurs: ["liquide", "gazeux"]
    indice: "Cherche la ligne du fer dans le tableau."
  - enonce: "D'après ce tableau, dans quel état se trouve l'eau à température ambiante ?"
    tableauSupport:
      enTete: ["Matériau", "État à température ambiante"]
      lignes:
        - ["fer", "solide"]
        - ["eau", "liquide"]
        - ["dioxygène", "gazeux"]
    bonneReponse: "liquide"
    distracteurs: ["solide", "gazeux"]
    indice: "Cherche la ligne de l'eau dans le tableau."
  - enonce: "D'après ce tableau, dans quel état se trouve le dioxygène à température ambiante ?"
    tableauSupport:
      enTete: ["Matériau", "État à température ambiante"]
      lignes:
        - ["fer", "solide"]
        - ["eau", "liquide"]
        - ["dioxygène", "gazeux"]
    bonneReponse: "gazeux"
    distracteurs: ["solide", "liquide"]
    indice: "Cherche la ligne du dioxygène dans le tableau."
  - enonce: "D'après ce texte, comment s'appelle la fine couche d'air qui entoure la Terre ?"
    texteSupport: "Autour de la Terre se trouve une fine couche d'air : l'atmosphère. Elle protège les êtres vivants des rayons dangereux du Soleil. Elle retient aussi la chaleur, ce qui permet à l'eau de rester liquide à la surface de la planète."
    bonneReponse: "l'atmosphère"
    distracteurs: ["la stratosphère", "la mésosphère"]
    indice: "Le nom de cette couche d'air est donné juste après les deux points, dans la première phrase."
  - enonce: "D'après ce texte, de quoi cette couche d'air protège-t-elle les êtres vivants ?"
    texteSupport: "Autour de la Terre se trouve une fine couche d'air : l'atmosphère. Elle protège les êtres vivants des rayons dangereux du Soleil. Elle retient aussi la chaleur, ce qui permet à l'eau de rester liquide à la surface de la planète."
    bonneReponse: "des rayons dangereux du Soleil"
    distracteurs: ["des vents violents", "du froid de l'espace"]
    indice: "Relis la deuxième phrase du texte, elle commence par ce que fait cette couche d'air."
  - enonce: "D'après ce texte, que permet la chaleur retenue par cette couche d'air ?"
    texteSupport: "Autour de la Terre se trouve une fine couche d'air : l'atmosphère. Elle protège les êtres vivants des rayons dangereux du Soleil. Elle retient aussi la chaleur, ce qui permet à l'eau de rester liquide à la surface de la planète."
    bonneReponse: "à l'eau de rester liquide"
    distracteurs: ["à l'eau de geler", "à l'air de se réchauffer"]
    indice: "Relis la dernière phrase du texte, après les mots « ce qui permet »."
  - enonce: "D'après ce texte, que récoltent les abeilles en butinant les fleurs ?"
    texteSupport: "Les abeilles butinent les fleurs pour récolter du nectar. En passant de fleur en fleur, elles transportent aussi du pollen. Ce transport de pollen permet à de nombreuses plantes de produire des fruits et des graines."
    bonneReponse: "du nectar"
    distracteurs: ["du miel", "de l'eau"]
    indice: "Relis la première phrase du texte, elle dit pourquoi les abeilles butinent."
  - enonce: "D'après ce texte, que transportent aussi les abeilles en passant de fleur en fleur ?"
    texteSupport: "Les abeilles butinent les fleurs pour récolter du nectar. En passant de fleur en fleur, elles transportent aussi du pollen. Ce transport de pollen permet à de nombreuses plantes de produire des fruits et des graines."
    bonneReponse: "du pollen"
    distracteurs: ["de la cire", "des épines"]
    indice: "Relis la deuxième phrase du texte, après le mot « aussi »."
  - enonce: "D'après ce texte, que permet ce transport de pollen à de nombreuses plantes ?"
    texteSupport: "Les abeilles butinent les fleurs pour récolter du nectar. En passant de fleur en fleur, elles transportent aussi du pollen. Ce transport de pollen permet à de nombreuses plantes de produire des fruits et des graines."
    bonneReponse: "de produire des fruits et des graines"
    distracteurs: ["de pousser plus vite", "de changer de couleur"]
    indice: "Relis la dernière phrase du texte, après le mot « permet »."
