schema: 1
id: cm1-conjugaison-present
type: question
descripteur:
  matiere: "Francais"
  niveau: "CM1"
  domaine: "Orthographe et grammaire"
  competence: "Conjuguer les verbes fréquents au présent, futur et imparfait de l'indicatif"
items:
  - enonce: "Tous les jours, il ___ à l'école."
    bonneReponse: "va"
    distracteurs: ["vais", "vont", "allez"]
    indice: "Le verbe 'aller' est irrégulier : avec 'il' ou 'elle', il devient 'va' au présent."
  - enonce: "Nous ___ une histoire."
    bonneReponse: "lisons"
    distracteurs: ["lit", "lisent", "lis"]
    indice: "Avec 'nous', le verbe se termine presque toujours par '-ons' au présent : c'est 'lisons'."
  - enonce: "Vous ___ du chocolat."
    bonneReponse: "mangez"
    distracteurs: ["mange", "mangeons", "mangent"]
    indice: "Avec 'vous', le verbe se termine presque toujours par '-ez' au présent : c'est 'mangez'."
  - enonce: "Je ___ mes devoirs."
    bonneReponse: "fais"
    distracteurs: ["fait", "faisons", "font"]
    indice: "Le verbe 'faire' est irrégulier : avec 'je', il devient 'fais' au présent."
  - enonce: "Elles ___ dans le jardin."
    bonneReponse: "jouent"
    distracteurs: ["joue", "jouons", "jouez"]
    indice: "Avec 'ils' ou 'elles', le verbe 'jouer' se termine par '-ent' au présent : c'est 'jouent'."
  - enonce: "Tu ___ un dessin."
    bonneReponse: "dessines"
    distracteurs: ["dessine", "dessinent", "dessinez"]
    indice: "Avec 'tu', le verbe 'dessiner' se termine par '-es' au présent : c'est 'dessines'."
  - enonce: "Je ___ mon cahier dans mon sac."
    bonneReponse: "cherche"
    distracteurs: ["cherches", "cherchons", "cherchent"]
    indice: "Avec 'je', le verbe 'chercher' se termine par '-e' au présent : c'est 'cherche'."
  - enonce: "Tu ___ ton exercice avant la récréation."
    bonneReponse: "finis"
    distracteurs: ["finit", "finissons", "finissent"]
    indice: "Avec 'tu', le verbe 'finir' se termine par '-is' au présent : c'est 'finis'."
  - enonce: "Elle ___ toujours ses affaires avant de partir en récréation."
    bonneReponse: "range"
    distracteurs: ["ranges", "rangeons", "rangent"]
    indice: "Avec 'il' ou 'elle', le verbe 'ranger' se termine par '-e' au présent : c'est 'range'."
  - enonce: "Nous ___ dans la cour pendant la récréation."
    bonneReponse: "courons"
    distracteurs: ["cours", "court", "courent"]
    indice: "Avec 'nous', le verbe 'courir' se termine par '-ons' au présent : c'est 'courons'."
  - enonce: "Vous ___ vos cahiers avant de commencer."
    bonneReponse: "prenez"
    distracteurs: ["prend", "prenons", "prennent"]
    indice: "Avec 'vous', le verbe 'prendre' se termine par '-ez' au présent : c'est 'prenez'."
  - enonce: "Ils ___ une chanson en rentrant de l'école."
    bonneReponse: "chantent"
    distracteurs: ["chante", "chantons", "chantez"]
    indice: "Avec 'ils' ou 'elles', le verbe 'chanter' se termine par '-ent' au présent : c'est 'chantent'."
  - enonce: "Demain, je ___ dans le jardin."
    bonneReponse: "jouerai"
    distracteurs: ["joueras", "jouera", "joueront"]
    indice: "Au futur, avec 'je', le verbe 'jouer' se termine par '-erai' : c'est 'jouerai'."
  - enonce: "Demain, tu ___ tes camarades en classe."
    bonneReponse: "aideras"
    distracteurs: ["aiderai", "aidera", "aideront"]
    indice: "Au futur, avec 'tu', le verbe 'aider' se termine par '-eras' : c'est 'aideras'."
  - enonce: "Demain, elle ___ son dessin avant le goûter."
    bonneReponse: "finira"
    distracteurs: ["finirai", "finirons", "finiront"]
    indice: "Au futur, avec 'il' ou 'elle', le verbe 'finir' se termine par '-ira' : c'est 'finira'."
  - enonce: "Demain, nous ___ un gâteau pour la fête."
    bonneReponse: "ferons"
    distracteurs: ["ferai", "fera", "feront"]
    indice: "Au futur, avec 'nous', le verbe 'faire' est irrégulier : il devient 'ferons'."
  - enonce: "Demain, vous ___ à la piscine avec la classe."
    bonneReponse: "irez"
    distracteurs: ["irai", "ira", "iront"]
    indice: "Au futur, avec 'vous', le verbe 'aller' est irrégulier : il devient 'irez'."
  - enonce: "Demain, ils ___ une récréation plus longue."
    bonneReponse: "auront"
    distracteurs: ["avaient", "aurai", "aura"]
    indice: "Le mot 'demain' annonce le futur : avec 'ils' ou 'elles', le verbe 'avoir' devient 'auront', jamais 'avaient', qui est à l'imparfait."
  - enonce: "Autrefois, je ___ tous les jours dans le jardin."
    bonneReponse: "jouais"
    distracteurs: ["jouait", "jouions", "jouaient"]
    indice: "Le mot 'autrefois' annonce l'imparfait : avec 'je', le verbe 'jouer' se termine par '-ais' : c'est 'jouais'."
  - enonce: "Autrefois, tu ___ tes camarades en classe."
    bonneReponse: "aidais"
    distracteurs: ["aidait", "aidions", "aidaient"]
    indice: "Le mot 'autrefois' annonce l'imparfait : avec 'tu', le verbe 'aider' se termine par '-ais' : c'est 'aidais'."
  - enonce: "Autrefois, il ___ du vélo le dimanche."
    bonneReponse: "faisait"
    distracteurs: ["faisais", "faisions", "faisaient"]
    indice: "Le mot 'autrefois' annonce l'imparfait : avec 'il' ou 'elle', le verbe 'faire' est irrégulier : il devient 'faisait'."
  - enonce: "Autrefois, nous ___ toujours les premiers à l'école."
    bonneReponse: "étions"
    distracteurs: ["étais", "était", "étaient"]
    indice: "Le mot 'autrefois' annonce l'imparfait : avec 'nous', le verbe 'être' est irrégulier : il devient 'étions'."
  - enonce: "Autrefois, vous ___ moins de devoirs."
    bonneReponse: "aviez"
    distracteurs: ["avais", "avait", "avaient"]
    indice: "Le mot 'autrefois' annonce l'imparfait : avec 'vous', le verbe 'avoir' est irrégulier : il devient 'aviez'."
  - enonce: "Autrefois, ils ___ ce dessin animé chaque mercredi."
    bonneReponse: "aimaient"
    distracteurs: ["aimeront", "aimais", "aimait"]
    indice: "Le mot 'autrefois' annonce l'imparfait, jamais le futur : avec 'ils' ou 'elles', le verbe 'aimer' devient 'aimaient', pas 'aimeront'."
  - enonce: "Maintenant, elle ___ son frère avant l'école."
    bonneReponse: "aide"
    distracteurs: ["aidait", "aidera", "aidez"]
    indice: "Le mot 'maintenant' annonce le présent : avec 'il' ou 'elle', le verbe 'aider' se termine par '-e' : c'est 'aide'."
