schema: 1
id: cm1-conjugaison-present
type: question
descripteur:
  matiere: "Francais"
  niveau: "CM1"
  domaine: "Orthographe et grammaire"
  competence: "Conjuguer les verbes fréquents au présent, futur et imparfait de l'indicatif"
items:
  - enonce: "Tous les jours, il ___ à l'école."
    bonneReponse: "va"
    distracteurs: ["vais", "vont", "allez"]
    indice: "Le verbe 'aller' est irrégulier : avec 'il' ou 'elle', il devient 'va' au présent."
  - enonce: "Nous ___ une histoire."
    bonneReponse: "lisons"
    distracteurs: ["lit", "lisent", "lis"]
    indice: "Avec 'nous', le verbe se termine presque toujours par '-ons' au présent : c'est 'lisons'."
  - enonce: "Vous ___ du chocolat."
    bonneReponse: "mangez"
    distracteurs: ["mange", "mangeons", "mangent"]
    indice: "Avec 'vous', le verbe se termine presque toujours par '-ez' au présent : c'est 'mangez'."
  - enonce: "Je ___ mes devoirs."
    bonneReponse: "fais"
    distracteurs: ["fait", "faisons", "font"]
    indice: "Le verbe 'faire' est irrégulier : avec 'je', il devient 'fais' au présent."
  - enonce: "Elles ___ dans le jardin."
    bonneReponse: "jouent"
    distracteurs: ["joue", "jouons", "jouez"]
    indice: "Avec 'ils' ou 'elles', le verbe 'jouer' se termine par '-ent' au présent : c'est 'jouent'."
  - enonce: "Tu ___ un dessin."
    bonneReponse: "dessines"
    distracteurs: ["dessine", "dessinent", "dessinez"]
    indice: "Avec 'tu', le verbe 'dessiner' se termine par '-es' au présent : c'est 'dessines'."
  - enonce: "Je ___ mon cahier dans mon sac."
    bonneReponse: "cherche"
    distracteurs: ["cherches", "cherchons", "cherchent"]
    indice: "Avec 'je', le verbe 'chercher' se termine par '-e' au présent : c'est 'cherche'."
  - enonce: "Tu ___ ton exercice avant la récréation."
    bonneReponse: "finis"
    distracteurs: ["finit", "finissons", "finissent"]
    indice: "Avec 'tu', le verbe 'finir' se termine par '-is' au présent : c'est 'finis'."
  - enonce: "Elle ___ toujours ses affaires avant de partir en récréation."
    bonneReponse: "range"
    distracteurs: ["ranges", "rangeons", "rangent"]
    indice: "Avec 'il' ou 'elle', le verbe 'ranger' se termine par '-e' au présent : c'est 'range'."
  - enonce: "Nous ___ dans la cour pendant la récréation."
    bonneReponse: "courons"
    distracteurs: ["cours", "court", "courent"]
    indice: "Avec 'nous', le verbe 'courir' se termine par '-ons' au présent : c'est 'courons'."
  - enonce: "Vous ___ vos cahiers avant de commencer."
    bonneReponse: "prenez"
    distracteurs: ["prend", "prenons", "prennent"]
    indice: "Avec 'vous', le verbe 'prendre' se termine par '-ez' au présent : c'est 'prenez'."
  - enonce: "Ils ___ une chanson en rentrant de l'école."
    bonneReponse: "chantent"
    distracteurs: ["chante", "chantons", "chantez"]
    indice: "Avec 'ils' ou 'elles', le verbe 'chanter' se termine par '-ent' au présent : c'est 'chantent'."
