# S53-FRA-VERBE-SUJET (s53, generation de contenu seul, brouillon soumis a nadia-prof). Conditions
# VSJ-CE1-1 a VSJ-CE1-3 (squad/conformite/ARBITRAGE-PREALABLE-s48-francais-ce1.md, section 5.4).
#
# VSJ-CE1-1 : quinze items demandent le sujet d'un verbe cite (au moins la moitie), neuf le verbe ; les
# propositions sont des mots ou groupes copies de la phrase.
# VSJ-CE1-2 : sujet pronom personnel 5, nom seul 5, groupe nominal de trois mots au plus 5 (au moins un
# cinquieme chacun) ; le sujet precede le verbe, un seul verbe conjugue par phrase, aucun sujet coordonne.
# VSJ-CE1-3 : (a) le groupe place apres le verbe, (b) un autre nom de la phrase, (c) pour les items de
# verbe, un nom ou un adjectif de la phrase ; chaque item declare ses familles dans l'ordre du fichier.
# Majuscule : une proposition copiee du debut de la phrase perd sa majuscule, un prenom garde la sienne ; sur aucun item
# la bonne reponse n'est la seule proposition a majuscule.
# TRV-CE1-1 a TRV-CE1-7 (squad/conformite/ARBITRAGE-PREALABLE-s48-francais-ce1.md, section 2) : niveau CE1, une seule ligne de referentiel, aucun champ a
# voix haute ni texteSupport ni illustration, un indice sur chaque item (douze mots au plus, jamais
# la reponse, jamais un renvoi a l'ecoute), plancher de vingt items atteint. LON-CE1-5 : au plus six mots
# par proposition. La question est portee par la consigne du jeu quand l'enonce ne la porte pas.
schema: 1
id: ce1-verbe-sujet
type: question
descripteur:
  matiere: "Français"
  niveau: "CE1"
  domaine: "Orthographe et grammaire"
  competence: "Identifier le verbe d'une phrase et son sujet (un nom, un groupe nominal court ou un pronom personnel)."
lignesDeReferentiel: ["FRA-CE1-13"]
items:
  # VSJ-CE1-1: sujet
  # VSJ-CE1-2: pronom
  # VSJ-CE1-3: a, b
  - enonce: "« Elle pose le livre sur la table. » Quel est le sujet du verbe « pose » ?"
    bonneReponse: "elle"
    distracteurs: ["le livre", "la table"]
    indice: "Demande-toi : qui fait l'action de ce verbe ?"
  # VSJ-CE1-1: sujet
  # VSJ-CE1-2: pronom
  # VSJ-CE1-3: a, b
