    bonneReponse: "ils"
    distracteurs: ["des fraises", "parc"]
    indice: "Pose la question « Qui est-ce qui ? » avant le verbe."
  # VSJ-CE1-1: verbe
  # VSJ-CE1-3: c
  - enonce: "« Le petit chat boit du lait. » Quel est le verbe de la phrase ?"
    bonneReponse: "boit"
    distracteurs: ["chat", "petit"]
    indice: "Cherche le mot qui dit ce que fait quelqu'un."
