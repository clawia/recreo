schema: 1
id: cm1-sciences-objet-technique
type: question
descripteur:
  matiere: "Sciences et technologie"
  niveau: "CM1"
  domaine: "Matériaux et objets techniques"
  competence: "Identifier la fonction d'un objet technique, nommer ses composants et décrire son fonctionnement."
lignesDeReferentiel: ["SCI-CM1-12"]
#
# S30-2 (docs/backlog/backlog.md, sprint 30). Second des deux paquets du second lot de sciences et
# technologie CM1 (DEC-0079, arbitrage prealable de nadia-prof du 2026-09-06, section 2.8 - ligne
# jugee la moins couteuse du lot avec la ligne 2). Referentiel copie conforme
# (squad/programme/sciences-et-technologie/competences-cm1.md, SCI-CM1-12).
#
# Objets retenus : le vélo, la lampe de poche, le taille-crayon, le ventilateur - quatre objets
# techniques du quotidien dont la fonction, les composants et le fonctionnement se decrivent en
# texte, sans schema (palier 2 non requis).
#
# Trois elements du libelle a servir en bonne reponse (FER-1) : "la fonction" (tache A, quatre
# items), "un composant" (tache B, six items) et "le fonctionnement" (un item, dedie a la
# description du mecanisme entier plutot qu'a un seul composant). Deux taches distinctes (FER-3) :
# tache A, dire a quoi sert un objet decrit ; tache B, nommer la piece qui remplit une fonction
# donnee. L'item de fonctionnement s'ajoute aux deux sans en former une troisieme au sens de FER-3
# (deux taches suffisent, chacune au-dessus du plancher de trois items).
#
# Correction du 2026-09-06 (lea-dev, audit de l'instance B,
# squad/conformite/FICHE-bandit-manchot-objet-technique-cm1.md, commit audite 5824e752, Done
# pedagogique REFUSE le 2026-09-06 par nadia-prof) : les quatre items de la tache A (fonction)
# reproduisaient le defaut nomme OBJ-R2 - les deux distracteurs de chaque item etaient toujours les
# fonctions des trois autres objets du paquet, si bien qu'un enfant ignorant tout de l'objet nomme
# les eliminait quand meme ; et la tache demandait moins que le niveau du CP ("A quoi sert un velo ?"
# quand le CP sert deja parapluie, ciseaux, stylo). Les quatre items sont reecrits : chaque
# distracteur est desormais une fonction plausible pour l'objet nomme et pour lui seul, et l'angle
# de la question porte sur un aspect de la fonction qui n'est pas evident a neuf ans (le velo compare
# a la marche, le ventilateur qui deplace l'air sans le refroidir - une conception fausse repandue,
# comme pour l'item 11). La tache B et l'item 11, non concernes par le refus, sont inchanges.
# Corrige dans le meme geste, sans rejeu supplementaire selon nadia-prof : l'indice de l'item du
# ventilateur employait "piece" au sens de salle juste apres six items qui l'emploient au sens de
# composant ; il dit desormais "salle".
#
# CON-1 : aucun item ne se resout sans connaitre l'objet et la piece ou le mecanisme qu'il decrit.
#
# HIS-3 (chaque fait porte sa source) : le fonctionnement d'un vélo (pédalier, chaîne, roue), d'une
# lampe de poche (pile, interrupteur, ampoule), d'un taille-crayon (lame) et d'un ventilateur
# (moteur, pales) sont des faits de mécanique et d'électricité simples, communément enseignés au
# cycle 3, sans controverse scientifique.
#
# CYC-1 (squad/conformite/ARBITRAGE-PREALABLE-s30-ce-qui-ferme-une-ligne-de-sciences-et-le-prix-des-
# quinze-reserves.md, section 2.6) : verifie contre cp-qlm-objet-technique.yaml (QLM-CP-07) - le
# vélo y sert deja "la selle" (s'asseoir), "le guidon" (tourner) et "la pédale" (avancer). Cette
# ligne ajoute la chaîne et le mécanisme qui relie le pédalage à la roue, sans contredire aucune des
# trois parties déjà servies au CP : progression, pas contradiction.
#
# FER-2 (densite) : onze items, strictement superieur aux dix manches par defaut (DEC-0064).
items:
  - enonce: "À quoi sert un vélo, plutôt qu'à marcher, pour un long trajet ?"
    bonneReponse: "à se déplacer plus vite et avec moins d'effort"
    distracteurs: ["à se déplacer aussi vite qu'une voiture", "à se déplacer sans aucun effort"]
    indice: "En pédalant, on avance plus vite qu'à pied, pour une fatigue proche."
  - enonce: "À quoi sert une lampe de poche ?"
    bonneReponse: "à éclairer dans le noir"
    distracteurs: ["à réchauffer les mains", "à recharger un téléphone"]
    indice: "On l'allume quand il n'y a pas assez de lumière, jamais pour se réchauffer ni recharger un appareil."
  - enonce: "À quoi sert un taille-crayon ?"
    bonneReponse: "à tailler la pointe d'un crayon"
    distracteurs: ["à effacer ce qu'on a écrit au crayon", "à ranger les crayons dans une trousse"]
    indice: "On l'utilise quand la pointe d'un crayon est devenue trop usée, jamais pour effacer ni pour ranger."
  - enonce: "À quoi sert un ventilateur, alors qu'il donne une impression de fraîcheur ?"
    bonneReponse: "à brasser l'air d'une salle, sans jamais le refroidir"
    distracteurs: ["à refroidir réellement l'air d'une salle", "à purifier l'air d'une salle"]
    indice: "Il déplace l'air d'une salle ; il ne le rend jamais plus froid."
  - enonce: "Dans un vélo, quelle pièce fait tourner la roue arrière quand on pédale ?"
    bonneReponse: "la chaîne"
    distracteurs: ["le guidon", "la sonnette"]
    indice: "Cette pièce relie les pédales à la roue arrière."
  - enonce: "Dans un vélo, quelle pièce sert à diriger la roue avant ?"
    bonneReponse: "le guidon"
    distracteurs: ["la chaîne", "la pédale"]
    indice: "On la tient avec les deux mains pour choisir la direction."
  - enonce: "Dans une lampe de poche, quelle pièce donne l'énergie nécessaire pour éclairer ?"
    bonneReponse: "la pile"
    distracteurs: ["l'interrupteur", "l'ampoule"]
    indice: "Sans cette pièce, aucune énergie n'arrive jusqu'à l'ampoule."
  - enonce: "Dans une lampe de poche, quelle pièce permet d'allumer ou d'éteindre la lumière ?"
    bonneReponse: "l'interrupteur"
    distracteurs: ["la pile", "l'ampoule"]
    indice: "On appuie dessus pour laisser passer ou couper le courant."
  - enonce: "Dans un taille-crayon, quelle pièce coupe le bois du crayon ?"
    bonneReponse: "la lame"
    distracteurs: ["le trou", "le manche"]
    indice: "Cette pièce tranchante forme les copeaux de bois."
  - enonce: "Dans un ventilateur, quelle pièce déplace l'air quand le moteur tourne ?"
    bonneReponse: "les pales"
    distracteurs: ["la grille", "le fil électrique"]
    indice: "Cette pièce tourne vite et pousse l'air devant elle."
  - enonce: "Comment fonctionne une lampe de poche quand on appuie sur l'interrupteur ?"
    bonneReponse: "la pile envoie du courant à l'ampoule, qui s'allume"
    distracteurs: ["la pile empêche le courant de passer", "l'ampoule crée sa propre énergie toute seule"]
    indice: "L'énergie doit circuler de la pile jusqu'à l'ampoule pour que la lumière apparaisse."
