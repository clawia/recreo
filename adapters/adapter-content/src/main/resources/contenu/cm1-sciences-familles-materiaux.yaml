schema: 1
id: cm1-sciences-familles-materiaux
type: question
descripteur:
  matiere: "Sciences et technologie"
  niveau: "CM1"
  domaine: "Matériaux et objets techniques"
  competence: "Identifier les principales familles de matériaux et choisir un matériau d'après une propriété (résistance, isolation, souplesse, imperméabilité)."
lignesDeReferentiel: ["SCI-CM1-11"]
#
# S31-4 (docs/backlog/backlog.md, sprint 31). Premier paquet du second lot de sciences et
# technologie CM1, second passage (arbitrage prealable de nadia-prof,
# squad/conformite/ARBITRAGE-PREALABLE-s31-ce-qui-ferme-une-ligne-d-emc-cp-le-catechisme-civique-
# et-ma-borne.md, section 4.3 : ligne 11, l'une des "plus sures du lot"). Referentiel copie
# conforme (squad/programme/sciences-et-technologie/competences-cm1.md, SCI-CM1-11).
#
# Deux taches distinctes (FER-3) : tache A, nommer la famille de materiau dont releve un objet
# decrit (cinq items, bonne reponse = bois, metal, verre, plastique ou tissu - cinq reponses
# distinctes, aucune repetition) ; tache B, choisir le materiau adapte a un usage decrit d'apres
# une propriete nommee dans l'enonce (six items, bonne reponse = un materiau).
#
# FER-1 : les quatre proprietes du libelle (resistance, isolation, souplesse, impermeabilite) sont
# chacune le critere decisif d'au moins un item de la tache B - resistance (item 6), isolation
# (item 7), souplesse (items 8 et 11), impermeabilite (items 9 et 10) - au meme sens que "un moyen
# de separation" pour cm1-sciences-melanges (SCI-CM1-02) : la position de bonne reponse est celle
# de la propriete testee, pas une reprise litterale du mot dans le texte de la reponse. Confirme par
# nadia-prof le 2026-09-07 (verdict de refus, section 2.4) : ce precedent condamne le premier
# verdict plutot que de le sauver, precisement parce qu'il oblige l'item a tester la propriete.
#
# FAB-1b : sur la tache B, la bonne reponse n'est jamais invariante - metal (item 6), bois (item 7),
# plastique (items 8 et 9), verre (item 10) et tissu (item 11) se partagent les six items, aucun
# materiau ne domine la totalite de la tache. Un materiau juste peut se repeter d'un item a l'autre
# (ici le plastique, items 8 et 9, sur deux proprietes differentes) : nadia-prof corrige elle-meme
# sa premiere lecture de FAB-1a le 2026-09-07 (verdicts, section 4) - seule l'invariance totale est
# interdite, un classement a categories fermees repete necessairement ses propositions.
#
# Une seule propriete par item (note de la matrice sur cette ligne : "une propriete par item,
# jamais deux : la charge cognitive double sinon") : aucun item ne nomme deux proprietes a la fois.
#
# HIS-3 (chaque fait porte sa source) : les familles de materiaux (bois, metal, verre, plastique,
# tissu, et le cuir en distracteur) et leurs proprietes usuelles (resistance du metal et du bois de
# charpente, isolation thermique du bois, souplesse du plastique et du tissu, impermeabilite du
# plastique et du verre) sont des faits de technologie de base enseignes au cycle 3, sans
# controverse.
#
# Reprise s31 (nadia-prof, instance B, REFUSE le 2026-09-07,
# squad/conformite/FICHE-bandit-manchot-familles-materiaux-cm1.md) : PLA-1, sur les quatre
# proprietes de FER-1, une seule (isolation, item 7) etait servie par un item dont les distracteurs
# etaient de vrais candidats ; trois items sur six (6, 10, 11) n'offraient aucune alternative
# serieuse, l'enfant trouvant la reponse en ecartant l'absurde. Corrige un distracteur par item
# concerne (le bois pour le pont de l'item 6, le plastique pour la bouteille de l'item 10, le cuir
# pour le vetement de l'item 11), en gardant le modele qui fonctionnait deja (item 7, et l'item 8 de
# cm1-sciences-etats-matiere, cite par nadia-prof comme exemple). Second motif corrige dans le meme
# geste : l'indice de l'item 10 ("meme liquide", qui ne voulait rien dire, l'eau etant deja liquide)
# est reecrit ; et le caoutchouc, servi en bonne reponse a l'item 9 sans avoir jamais ete enseigne
# comme famille en tache A, est remplace par le plastique, deja enseigne (item 4).
#
# CON-1 : aucun item ne se resout sans connaitre le materiau ou l'objet qu'il decrit.
#
# FER-2 (densite) : onze items, strictement superieur aux dix manches par defaut (DEC-0064).
items:
  - enonce: "Une table de jardin fabriquée à partir du tronc d'un arbre scié et poncé : de quelle famille de matériau est-elle faite ?"
    bonneReponse: "le bois"
    distracteurs: ["le métal", "le plastique"]
    indice: "Ce matériau vient directement d'un arbre."
  - enonce: "Une casserole qu'on peut poser directement sur une flamme sans qu'elle fonde ni brûle : de quelle famille de matériau est-elle faite ?"
    bonneReponse: "le métal"
    distracteurs: ["le bois", "le plastique"]
    indice: "Ce matériau résiste à une chaleur très élevée sans se déformer."
  - enonce: "Une bouteille transparente, qu'on voit au travers, mais qui se brise en morceaux tranchants si elle tombe sur un carrelage : de quelle famille de matériau est-elle faite ?"
    bonneReponse: "le verre"
    distracteurs: ["le plastique", "le métal"]
    indice: "Ce matériau laisse passer la lumière mais casse facilement."
  - enonce: "Un gobelet léger et coloré, qui peut fondre s'il est posé trop près d'une flamme : de quelle famille de matériau est-il fait ?"
    bonneReponse: "le plastique"
    distracteurs: ["le verre", "le métal"]
    indice: "Ce matériau peut être moulé dans toutes les formes et toutes les couleurs."
  - enonce: "Une écharpe tricotée, qu'on peut plier et ranger facilement dans une poche : de quelle famille de matériau est-elle faite ?"
    bonneReponse: "le tissu"
    distracteurs: ["le plastique", "le métal"]
    indice: "Ce matériau est fait de fils tissés ou tricotés ensemble."
  - enonce: "On veut construire un pont qui doit supporter le poids de nombreux camions sans jamais se casser. Il faut un matériau très résistant. Lequel choisir ?"
    bonneReponse: "le métal"
    distracteurs: ["le bois", "le verre"]
    indice: "Ce matériau supporte de très lourdes charges sans se briser facilement."
  - enonce: "On veut fabriquer le manche d'une poêle, qui ne doit jamais devenir brûlant à tenir même quand la poêle chauffe. Il faut un matériau isolant, qui ne laisse pas passer la chaleur. Lequel choisir ?"
    bonneReponse: "le bois"
    distracteurs: ["le métal", "le verre"]
    indice: "Ce matériau ne transmet presque pas la chaleur jusqu'à la main."
  - enonce: "On veut fabriquer un tuyau d'arrosage qui doit s'enrouler facilement sans se casser. Il faut un matériau souple. Lequel choisir ?"
    bonneReponse: "le plastique"
    distracteurs: ["le verre", "le métal"]
    indice: "Ce matériau se plie facilement et reprend sa forme sans se briser."
  - enonce: "On veut fabriquer une combinaison de plongée qui ne doit jamais laisser entrer l'eau. Il faut un matériau imperméable. Lequel choisir ?"
    bonneReponse: "le plastique"
    distracteurs: ["le tissu", "le bois"]
    indice: "Ce matériau empêche complètement l'eau de le traverser."
  - enonce: "On veut fabriquer une bouteille réutilisable des centaines de fois, qui ne doit jamais garder le goût du dernier liquide versé. Il faut un matériau imperméable. Lequel choisir ?"
    bonneReponse: "le verre"
    distracteurs: ["le plastique", "le bois"]
    indice: "Ce matériau ne garde jamais aucune odeur ni aucun goût, même après des centaines de lavages."
  - enonce: "On veut fabriquer un vêtement qui doit permettre de bouger librement dans tous les sens. Il faut un matériau souple. Lequel choisir ?"
    bonneReponse: "le tissu"
    distracteurs: ["le métal", "le cuir"]
    indice: "Ce matériau s'adapte aux mouvements du corps sans gêner."
