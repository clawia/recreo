# S53-FRA-PASSE-COMPOSE (s53, generation de contenu seul, brouillon soumis a nadia-prof). Conditions
# PCO-CE1-1 a PCO-CE1-3 (squad/conformite/ARBITRAGE-PREALABLE-s48-francais-ce1.md, section 5.10).
#
# PCO-CE1-1 : auxiliaire avoir seul ; etre (j'ai ete), avoir (j'ai eu) et les verbes du premier groupe
# qui se conjuguent avec avoir (chanter, jouer, regarder, dessiner, parler, laver, ecouter, travailler,
# danser, aider). Aucun verbe a auxiliaire etre, aucun pronominal, aucun complement avant le verbe.
# PCO-CE1-2 : le sujet est toujours un pronom personnel ; chacune des six personnes dans quatre items.
# PCO-CE1-3 : chaque item declare la famille de ses deux distracteurs dans l'ordre du fichier : (a)
# l'infinitif a la place du participe, (b) l'auxiliaire a une autre personne avec le meme pronom, (c) le
# present du verbe. Jamais l'imparfait.
# Aucun indice ne donne un critere qu'un distracteur de son item satisfait (ni "deux mots", ni "parle du passe") :
# participe et infinitif en -e/-er se prononcent de meme, et "j'ai chanter" a deux mots.
# TRV-CE1-1 a TRV-CE1-7 (squad/conformite/ARBITRAGE-PREALABLE-s48-francais-ce1.md, section 2) : niveau CE1, une seule ligne de referentiel, aucun champ a
# voix haute ni texteSupport ni illustration, un indice sur chaque item (douze mots au plus, jamais
# la reponse, jamais un renvoi a l'ecoute), plancher de vingt items atteint. LON-CE1-5 : au plus six mots
# par proposition. La question est portee par la consigne du jeu quand l'enonce ne la porte pas.
schema: 1
id: ce1-passe-compose
type: question
descripteur:
  matiere: "Français"
  niveau: "CE1"
  domaine: "Orthographe et grammaire"
  competence: "Conjuguer au passé composé être, avoir et les verbes du premier groupe, avec l'auxiliaire avoir."
lignesDeReferentiel: ["FRA-CE1-19"]
items:
  # PCO-CE1-3: a, c
  - enonce: "« chanter » : hier, ___ une chanson."
    bonneReponse: "j'ai chanté"
    distracteurs: ["j'ai chanter", "je chante"]
    indice: "Ne recopie pas le verbe écrit au début : il change."
  # PCO-CE1-3: a, b
