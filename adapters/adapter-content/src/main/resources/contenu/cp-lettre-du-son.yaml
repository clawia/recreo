# S26-L3 (DEC-0068 ; ARBITRAGE-PREALABLE-s26-la-voix-est-un-adulte.md, addendum, section 11).
# Clause 1 de la ligne (voyelles et consonnes simples). Cette ligne ne passe couvert-valide que si
# S26-L3 (ce paquet) ET S26-L4 (cp-digraphe-du-son) reçoivent toutes deux un verdict VALIDE
# (addendum, section 11.6). cp-le-bon-son.yaml n'est pas touché par ce lot (clause 3, intacte).
#
# Condition de distribution (mot pour mot, addendum section 11.4) : "chaque lettre servie est
# distracteur au moins aussi souvent qu'elle est réponse". Six lettres servies (p, m, t, r, l, s),
# trois items chacune comme bonne réponse (18 items). Compte réel, réponse / distracteur :
#   p : réponse 3, distracteur 6   m : réponse 3, distracteur 6   t : réponse 3, distracteur 6
#   r : réponse 3, distracteur 6   l : réponse 3, distracteur 6   s : réponse 3, distracteur 6
# Chaque lettre est distracteur deux fois plus souvent qu'elle n'est réponse.
#
# VOI-7 : l'adulte dit le mot entier, jamais le grapheme isolé - texteAVoixHaute porte toujours le
# mot complet, jamais la lettre seule.
