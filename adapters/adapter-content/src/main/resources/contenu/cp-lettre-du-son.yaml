type: question
descripteur:
  matiere: "Français"
  niveau: "CP"
  domaine: "Lecture et compréhension de l'écrit"
  competence: "Associer les graphèmes aux phonèmes (voyelles, consonnes simples, puis digraphes ch, ou, on...)"
lignesDeReferentiel: ["FRA-CP-04"]
# S26-L3 (DEC-0068 ; ARBITRAGE-PREALABLE-s26-la-voix-est-un-adulte.md, addendum, section 11).
# Clause 1 de la ligne (voyelles et consonnes simples). Cette ligne ne passe couvert-valide que si
# S26-L3 (ce paquet) ET S26-L4 (cp-digraphe-du-son) reçoivent toutes deux un verdict VALIDE
# (addendum, section 11.6). cp-le-bon-son.yaml n'est pas touché par ce lot (clause 3, intacte).
#
# Condition de distribution (mot pour mot, addendum section 11.4) : "chaque lettre servie est
# distracteur au moins aussi souvent qu'elle est réponse". Six lettres servies (p, m, t, r, l, s),
# trois items chacune comme bonne réponse (18 items). Compte réel, réponse / distracteur :
#   p : réponse 3, distracteur 6   m : réponse 3, distracteur 6   t : réponse 3, distracteur 6
#   r : réponse 3, distracteur 6   l : réponse 3, distracteur 6   s : réponse 3, distracteur 6
# Chaque lettre est distracteur deux fois plus souvent qu'elle n'est réponse.
#
# VOI-7 : l'adulte dit le mot entier, jamais le grapheme isolé - texteAVoixHaute porte toujours le
# mot complet, jamais la lettre seule.
#
# Correction du 2026-09-01 (nadia-prof, second motif de son refus, non levé par VOI-12) : sur 5
# items sur 18 (pomme/m, moto/t, table/l, tortue/r, lapin/p), un distracteur est aussi une lettre
# dont le son est présent dans le mot entendu. Rien ne disait à l'enfant, avant son premier essai,
# que le son cherché est le PREMIER du mot - seul l'indice, affiché après une erreur, le précisait.
# Un enfant qui entend "pomme" et presse "m" a raison sur la compétence visée et se voit corrigé à
# tort. Correctif : l'énoncé nomme désormais "le tout premier son" avant toute réponse - un mot
# ajouté à la consigne de l'enfant (ici et dans catalogue.yaml), aucune lettre supplémentaire à
# l'écran. La position d'un son n'est pas sa graphie : le motif d'acceptation de la ligne (détacher
# le son de la lettre) n'y perd rien.
#
# S29-8 (nadia-prof, ARBITRAGE-PREALABLE-s28-ce-qui-ferme-une-ligne-et-le-prix-des-quatre-lots.md,
# sections 1.2 et 7.2, dette des paquets à voix due depuis s27). Deux défauts corrigés, textes repris
# mot pour mot : l'énoncé répétait la consigne du catalogue, remplacé par un énoncé propre à l'item
# ("Quelle lettre fait le premier son ?") ; l'indice demandait à l'adulte de redire le mot
# "doucement", ce que VOI-3 interdit (l'adulte dit le mot d'un seul tenant, à vitesse normale) -
# remplacé par "en entier". Aucune ligne de matrice ne bouge, les items restent couvert-valide.
