schema: 1
id: ce1-emc-biens-communs
type: question
descripteur:
  matiere: "Enseignement moral et civique"
  niveau: "CE1"
  domaine: "Respecter autrui"
  competence: "Respecter les biens personnels et collectifs : reconnaître ce qui appartient à tous (matériel de la classe, livres de la bibliothèque, jeux de la cour) et le geste qui le protège."
lignesDeReferentiel: ["EMC-CE1-01"]
#
# S57-BR-EMC-CE1-01 (s57, palier 3). Paquet ecrit par lea-dev dans le lot, sur la competence EMC-CE1-01
# (squad/programme/enseignement-moral-et-civique/competences-ce1.md) et les conditions de nadia-prof :
# BCO-CE1-1 et BCO-CE1-2 (ARBITRAGE-PREALABLE-s57-instruction-questionner-le-monde-et-emc-ce1.md, 4.1),
# conditions transverses de la section 2 de ce meme fichier, mesure de BCO-CE1-2
# (reponses-nadia-questions-stories-palier-3.md, section 4). Rien n'est joue : le Done est a nadia-prof.
#
# BCO-CE1-1, deux taches, chacune annoncee au-dessus de l'item par "BCO-CE1-1 tache 1" ou "tache 2" :
#   tache 1 : a qui est cet objet, a tous ou a une seule personne ? Douze items, dans les deux sens
#             (six "quel objet est a tous" dont la bonne reponse nomme les trois exemples du libelle :
#             materiel de la classe, livres de la bibliotheque, jeux de la cour ; six "quel objet est a
#             une seule personne").
#   tache 2 : quel geste protege un bien de tous ? Douze items.
# Ranger et remettre a sa place ne sont jamais la bonne reponse (c'est cp-emc-regles-de-vie,
# NRC-CE1-1) : aucun de ces mots n'est servi dans ce paquet.
#
# BCO-CE1-2 : un bien personnel est celui d'un personnage nomme, a l'ecole (la trousse de Lina) ; aucun
# item ne parle de ce que l'enfant possede ni de ce qu'il y a chez lui, aucun possessif de deuxieme
# personne, aucun item ne compare des biens ; preter n'est jamais un devoir.
#
# TRV-CE1-2 : trois propositions distinctes, une seule acceptable. Chaque item declare la famille de ses
# deux distracteurs, dans l'ordre du fichier :
#   (a) un bien d'une seule personne propose quand la question demande un bien de tous ;
#   (b) un bien de tous propose quand la question demande un bien d'une seule personne ;
#   (c) un geste qui abime le bien ;
#   (d) un geste qui laisse le bien sans protection ;
#   (e) un geste qui fait d'un bien de tous le sien.
# La bonne reponse est strictement la plus longue (en caracteres) dans la moitie des items au plus.
#
# TRV-CE1-1, -5, -6, LON-CE1-1, -2, -5 : niveau CE1, une seule ligne, aucun texteSupport ni voix, un indice
# par item (douze mots au plus, une methode, jamais la reponse), propositions de six mots au plus, prenoms
# varies et equilibres (sept feminins, huit masculins), aucun role distribue par genre.
#
# EMC-1, EMC-5, EMC-6 : situations d'un personnage nomme ou d'un objet de l'ecole, jamais l'enfant ;
# aucun item n'a deux reponses defendables ; aucun lieu de vie, aucune commune, aucun type d'ecole.
#
# TYP-1 (ADR-0067) : l'espace qui precede ":" et "?" est insecable. Paquet neuf, aucune dette heritee.
# FER-2 : vingt-quatre items, au-dessus des vingt de la preparation de nadia-prof (4.4).
items:
  # BCO-CE1-1 tache 1
  # TRV-CE1-2 : a, a
  - enonce: "Quel objet est à tous les élèves de l'école ?"
    bonneReponse: "le ballon de la cour"
    distracteurs: ["le cartable de Tom", "le manteau de Jade"]
    indice: "Demande-toi : un seul élève s'en sert, ou tous ?"
  # BCO-CE1-1 tache 1
  # TRV-CE1-2 : a, a
  - enonce: "Parmi ces objets, lequel peut servir à tout le monde ?"
    bonneReponse: "le livre de la bibliothèque"
    distracteurs: ["le manteau d'Omar", "le cahier d'Inès"]
    indice: "Regarde à qui appartient chaque objet."
  # BCO-CE1-1 tache 1
  # TRV-CE1-2 : a, a
  - enonce: "Un seul de ces objets est à tout le monde. Lequel ?"
    bonneReponse: "la règle de la classe"
    distracteurs: ["la trousse de Mila", "la gomme de Samir"]
    indice: "Pense à celui dont tous les élèves peuvent se servir."
  # BCO-CE1-1 tache 1
  # TRV-CE1-2 : a, a
  - enonce: "Quel objet peut être utilisé par n'importe quel élève ?"
    bonneReponse: "le jeu de la cour"
    distracteurs: ["le bonnet de Zoé", "le sac de Léo"]
    indice: "Lis chaque objet et dis qui s'en sert."
  # BCO-CE1-1 tache 1
  # TRV-CE1-2 : a, a
  - enonce: "Quel objet est à tout le monde dans l'école ?"
    bonneReponse: "le crayon de la classe"
    distracteurs: ["le stylo d'Aya", "le feutre de Noé"]
    indice: "Compare les trois objets : qui peut les utiliser ?"
  # BCO-CE1-1 tache 1
  # TRV-CE1-2 : a, a
  - enonce: "Hugo veut un objet que tous les élèves partagent. Que choisit-il ?"
    bonneReponse: "le jeu de la classe"
    distracteurs: ["le goûter de Mila", "le chapeau d'Adam"]
    indice: "Pense à ce qui ne reste pas dans le sac d'un élève."
  # BCO-CE1-1 tache 1
  # TRV-CE1-2 : b, b
  - enonce: "Quel objet est à une seule personne ?"
    bonneReponse: "la trousse de Lina"
    distracteurs: ["la règle de la classe", "la corde de la cour"]
    indice: "Demande-toi : qui a le droit de s'en servir ?"
  # BCO-CE1-1 tache 1
  # TRV-CE1-2 : b, b
  - enonce: "Un seul de ces objets est à un seul élève. Lequel ?"
    bonneReponse: "le cartable d'Omar"
    distracteurs: ["le livre de la bibliothèque", "le crayon de la classe"]
    indice: "Lis le nom de chaque objet avec attention."
  # BCO-CE1-1 tache 1
  # TRV-CE1-2 : b, b
  - enonce: "Parmi ces objets, lequel n'est qu'à un seul élève ?"
    bonneReponse: "la gourde de Zoé"
    distracteurs: ["la colle de la classe", "la balle de la cour"]
    indice: "Pense à l'objet qu'un seul élève utilise."
  # BCO-CE1-1 tache 1
  # TRV-CE1-2 : b, b
  - enonce: "Quel objet n'est pas à tout le monde ?"
    bonneReponse: "le stylo de Samir"
    distracteurs: ["le jeu de la cour", "le livre de la classe"]
    indice: "Demande-toi quel objet ne sert qu'à une personne."
  # BCO-CE1-1 tache 1
  # TRV-CE1-2 : b, b
  - enonce: "Maya et Noé regardent trois objets. Lequel est à une seule personne ?"
    bonneReponse: "le cahier d'Inès"
    distracteurs: ["le ballon de la cour", "le livre de la bibliothèque"]
    indice: "Compare ce qui sert à beaucoup d'élèves et à un seul."
  # BCO-CE1-1 tache 1
  # TRV-CE1-2 : b, b
  - enonce: "Quel objet est à un élève, et pas à toute l'école ?"
    bonneReponse: "le manteau de Léo"
    distracteurs: ["le jeu de la cour", "le feutre de la classe"]
    indice: "Cherche ce que les autres élèves ne peuvent pas utiliser."
  # BCO-CE1-1 tache 2
  # TRV-CE1-2 : c, c
  - enonce: "Lina lit un livre de la bibliothèque. Que fait-elle pour ne pas l'abîmer ?"
    bonneReponse: "elle tourne les pages doucement"
    distracteurs: ["elle plie un coin", "elle écrit son prénom dedans"]
    indice: "Pense à ce qui garde les pages en bon état."
  # BCO-CE1-1 tache 2
  # TRV-CE1-2 : d, d
  - enonce: "Omar voit une page déchirée dans un livre de la bibliothèque. Que fait-il ?"
    bonneReponse: "il prévient un adulte"
    distracteurs: ["il le rend sans rien dire", "il cache la page"]
    indice: "Demande-toi qui doit savoir que le livre est abîmé ?"
  # BCO-CE1-1 tache 2
  # TRV-CE1-2 : e, d
  - enonce: "Un ballon de la cour est crevé. Que fait Jade ?"
    bonneReponse: "elle prévient un adulte"
    distracteurs: ["elle le garde pour elle", "elle le cache dans un coin"]
    indice: "Pense à qui peut décider quoi faire du ballon."
  # BCO-CE1-1 tache 2
  # TRV-CE1-2 : d, c
  - enonce: "Mila a fini d'utiliser la colle de la classe. Que fait-elle ?"
    bonneReponse: "elle referme le tube"
    distracteurs: ["elle laisse le tube ouvert", "elle presse le tube très fort"]
    indice: "Pense à ce qui arrive à la colle à l'air."
  # BCO-CE1-1 tache 2
  # TRV-CE1-2 : c, c
  - enonce: "Samir veut lire un livre de la bibliothèque. Que fait-il avant de l'ouvrir ?"
    bonneReponse: "il se lave les mains"
    distracteurs: ["il mange en lisant", "il l'ouvre avec des doigts collants"]
    indice: "Pense aux traces que laissent les doigts."
  # BCO-CE1-1 tache 2
  # TRV-CE1-2 : c, c
  - enonce: "Noé veut dessiner. Où dessine-t-il pour ne pas abîmer le matériel de la classe ?"
    bonneReponse: "sur une feuille"
    distracteurs: ["sur la table", "sur le mur"]
    indice: "Pense à ce qui est fait pour dessiner."
  # BCO-CE1-1 tache 2
  # TRV-CE1-2 : c, c
  - enonce: "Aya a des craies de la cour. Où dessine-t-elle ?"
    bonneReponse: "sur le sol de la cour"
    distracteurs: ["sur le mur de l'école", "sur la porte de la classe"]
    indice: "Pense à l'endroit qu'on peut laver sans l'abîmer."
  # BCO-CE1-1 tache 2
  # TRV-CE1-2 : d, c
  - enonce: "Inès a un livre de la bibliothèque et il pleut. Que fait-elle ?"
    bonneReponse: "elle le garde au sec"
    distracteurs: ["elle le laisse sous la pluie", "elle le pose sur un banc"]
    indice: "Pense à ce que l'eau fait au papier."
  # BCO-CE1-1 tache 2
  # TRV-CE1-2 : d, e
  - enonce: "Hugo joue avec un jeu de la classe. Que fait-il quand la partie est finie ?"
    bonneReponse: "il vérifie qu'il ne manque rien"
    distracteurs: ["il laisse tout sur la table", "il garde une pièce pour lui"]
    indice: "Pense à ce qui montre qu'aucune pièce ne manque."
  # BCO-CE1-1 tache 2
  # TRV-CE1-2 : d, c
  - enonce: "Enzo voit une corde à sauter coupée dans la cour. Que fait-il ?"
    bonneReponse: "il prévient un adulte"
    distracteurs: ["il s'en sert quand même", "il la jette sous un banc"]
    indice: "Un jeu cassé n'est plus sûr : qui doit le savoir ?"
  # BCO-CE1-1 tache 2
  # TRV-CE1-2 : c, c
  - enonce: "Zoé tient un livre de la bibliothèque à la main. Où le pose-t-elle ?"
    bonneReponse: "sur une table propre"
    distracteurs: ["par terre dans la cour", "sur une chaise mouillée"]
    indice: "Pense à un endroit sec et propre."
  # BCO-CE1-1 tache 2
  # TRV-CE1-2 : d, c
  - enonce: "Adam utilise les feutres de la classe. Que fait-il quand il a fini ?"
    bonneReponse: "il referme chaque feutre"
    distracteurs: ["il laisse les bouchons ouverts", "il appuie fort sur les pointes"]
    indice: "Pense à ce qui garde l'encre dans le feutre."
