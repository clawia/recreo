# S50-FRA-VALEUR-LETTRE (s50, DEC-0108). Arbitrage prealable de nadia-prof, conditions
# VLE-CE1-1 a VLE-CE1-3 (squad/conformite/ARBITRAGE-PREALABLE-s48-francais-ce1.md, section 3.2)
# et sept conditions transverses TRV-CE1-1 a TRV-CE1-7 (meme source, section 2). Avis de
# faisabilite de theo-archi (squad/rapports/avis-faisabilite-s50-cinq-stories.md, section 3, V1),
# dont les quatre pieges de fabrication sont repris sans changement par PaquetCe1ValeurLettreTest.
#
# VLE-CE1-2 : mots de reference stables, declares ici et relus par le test (piege 1 de l'avis,
# lexiques en mots entiers et accentues). Dans chacun, la lettre n'a qu'une lecture possible.
# VLE-CE1-2: c=car,cerise; g=gare,girafe; s=sel,rose
#
# VLE-CE1-1 : trois lettres, huit items chacune sur vingt-quatre (33,3 %, au-dessus du quart).
# Par lettre, chaque valeur (dure/douce) est la bonne reponse de quatre items sur huit (50 %, au-
# dessus du tiers). Pour g, quatre items sur huit (guitare, guepard, bourgeon, pigeon) dependent
# d'un u ou d'un e insere (50 %, au-dessus du tiers exige).
# VLE-CE1-2 : les propositions de chaque item sont exactement les deux reperes de sa lettre ; le
# mot de l'enonce n'est jamais lui-meme un repere ; chaque repere calcule une seule valeur (verifie
# une fois par PaquetCe1ValeurLettreTest).
# VLE-CE1-3 : aucun mot ne porte sc, cc, ch ni gn sur la lettre cible ; aucun s final muet ni s
# apres une consonne n'est teste ; le lexique des exceptions (second, gageure) est absent.
#
# Reprise s50 (second passage), motif 1 de squad/conformite/FICHE-bandit-manchot-valeur-lettre-ce1.md,
# section 4 : ce paquet sert desormais le c cedille (ç), sur un item neuf ("garcon"/cerise) qui
# remplace l'ancien item "cinq". Le remplacement (pas un ajout) garde le compte de c lu comme dans
# cerise a douze items sur vingt-quatre (VLE-CE1-1) et la bonne reponse strictement la plus longue a
# douze items sur vingt-quatre au plus (TRV-CE1-2), la ou un ajout serait passe a treize sur
# vingt-cinq. La forme d'enonce nomme "le c" (lettre ASCII, comme les sept autres items de c) et
# ecrit "une cedille" en toutes lettres plutot que d'isoler "ç" comme mot a lui seul, ce qui evite
# AucunMotServiNeSEcarteDeSonAccentTest : "garcon" et "cedille" sont des mots entiers et accentues,
# relus comme tels par le lexique.
# TRV-CE1-1 a TRV-CE1-7 : niveau CE1, une seule ligne de referentiel (FRA-CE1-02), aucun champ a
# voix haute ni texteSupport, deux propositions distinctes par item (un seul distracteur, forme
# binaire deja servie par cm1-homophones), un seul mot entre guillemets par enonce portant la
# lettre ou la graphie ciblee, le lexique de grammaire de TRV-CE1-4 exclu en mots entiers et
# accentues, un indice present sur chaque item (douze mots au plus, huit formes distinctes sur le
# paquet, jamais la bonne reponse en mot entier), vingt-quatre items au-dessus du plancher de vingt.
# LON-CE1-1 et LON-CE1-2 sont deja tenues par AucunEnonceDeCe1NeDepasseVingtMotsNiTroisPhrasesTest
# (ADR-0101) : chaque enonce compte dix mots, une seule phrase. LON-CE1-5 : chaque proposition est
# un seul mot, donc au plus six mots et une seule phrase.
#
# Piege 1 de l'avis (regle de lecture calculable) : la valeur de c et g devant e, e accent aigu,
# grave ou circonflexe, i, y est douce, dure sinon ; ss se lit comme une seule unite, dure ; s seul
# entre deux voyelles est doux, dur sinon, et jamais en tete de mot (pas de voyelle avant lui).
# PaquetCe1ValeurLettreTest recalcule cette regle depuis le mot de l'enonce et verifie qu'elle
# rejoint la valeur declaree par le marqueur et la bonne reponse - c'est l'exactitude de chaque
# item, verifiee item par item, contrairement a FRA-CE1-01 ou cette propriete restait a nadia-prof.
# Piege 2 (lettre presente deux fois dans le mot cible) : evite par construction, chaque mot cible
# ne porte qu'une seule occurrence de la lettre ou du groupe cible (c, g, s ou ss comptee une fois).
# Piege 3 (biais de longueur) : avec les reperes de VLE-CE1-2, la valeur douce est toujours portee
# par le repere le plus long (cerise/car, girafe/gare, rose/sel). La bonne reponse est donc
# strictement la plus longue exactement sur les items a valeur douce, soit douze sur vingt-quatre
# (50 %, a la limite de "au plus la moitie").
# Piege 4 (partDesignee) : aucun item ne declare cette cle. La lettre est nommee en toutes lettres
# dans l'enonce ("le c", "le g", "le s"), jamais designee par une sous-chaine de l'enonce.
schema: 1
id: ce1-valeur-lettre
type: question
descripteur:
  matiere: "Français"
  niveau: "CE1"
  domaine: "Lecture et compréhension de l'écrit"
  competence: "Déterminer la valeur d'une lettre selon les lettres qui l'entourent (c, g/ge/gu, s/ss entre deux voyelles)."
lignesDeReferentiel: ["FRA-CE1-02"]
