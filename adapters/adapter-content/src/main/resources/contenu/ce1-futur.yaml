# S53-FRA-FUTUR (s53, generation de contenu seul, brouillon soumis a nadia-prof). Conditions FUT-CE1-1 a
# FUT-CE1-3 (squad/conformite/ARBITRAGE-PREALABLE-s48-francais-ce1.md, section 5.9).
#
# FUT-CE1-1 : etre et avoir dans huit items sur vingt-quatre (au-dessus du quart) ; seize items de premier
# groupe sans modification orthographique (chanter, jouer, dessiner, regarder, parler, laver, ecouter,
# travailler, danser).
# FUT-CE1-2 : le sujet est toujours un pronom personnel ; chacune des six personnes est le sujet de quatre
# items sur vingt-quatre.
# FUT-CE1-3 : chaque item declare, juste au-dessus, la famille de ses deux distracteurs dans l'ordre du
# fichier : (a) le futur a une autre personne, (b) le present du meme verbe, (c) un radical regularise pour
# etre ou avoir. Jamais conditionnel, futur proche ni imparfait.
# Chaque phrase porte un mot de temps (demain, bientot, plus tard), et la consigne du jeu demande le futur : avec un mot
# de temps, le present reste une phrase correcte ("demain, je chante"), c'est la consigne qui l'ecarte.
# TRV-CE1-1 a TRV-CE1-7 (squad/conformite/ARBITRAGE-PREALABLE-s48-francais-ce1.md, section 2) : niveau CE1, une seule ligne de referentiel, aucun champ a
# voix haute ni texteSupport ni illustration, un indice sur chaque item (douze mots au plus, jamais
# la reponse, jamais un renvoi a l'ecoute), plancher de vingt items atteint. LON-CE1-5 : au plus six mots
# par proposition. La question est portee par la consigne du jeu quand l'enonce ne la porte pas.
schema: 1
id: ce1-futur
type: question
descripteur:
  matiere: "Français"
  niveau: "CE1"
  domaine: "Orthographe et grammaire"
  competence: "Conjuguer au futur être, avoir et les verbes du premier groupe."
lignesDeReferentiel: ["FRA-CE1-18"]
