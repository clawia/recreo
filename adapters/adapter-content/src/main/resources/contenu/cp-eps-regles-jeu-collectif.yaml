schema: 1
id: cp-eps-regles-jeu-collectif
type: question
descripteur:
  matiere: "Éducation physique et sportive"
  niveau: "CP"
  domaine: "Conduire et maîtriser un affrontement individuel ou collectif"
  competence: "Connaître et respecter les règles d'un jeu collectif simple."
lignesDeReferentiel: ["EPS-CP-08"]
#
# S32-5 (docs/backlog/backlog.md, sprint 32, terrain C). Second paquet d'education physique et
# sportive du produit, meme lot que cp-eps-regles-de-securite.yaml. Referentiel copie conforme
# depuis squad/programme/education-physique-et-sportive/competences-cp.md (DEC-0074).
#
# Premier terrain sans image d'aucune instance de nadia-prof (PAR-13).
#
# Frontiere corps-et-effort (DEC-0083, section 9.2 ; arbitrage prealable de s32, section 6.4),
# reprise mot pour mot : "l'EPS ne porte que l'effort lui-meme (...), jamais l'hygiene de vie en
# general". Ce paquet ne porte aucun item sur les effets de l'effort, l'echauffement,
# l'hydratation ou la recuperation (EPS-CP-10, EPS-CP-11) : il sert uniquement les regles d'un jeu
# collectif, hors de la ligne de corps-et-effort que ce sprint ne finance pas.
#
# Couverture partielle exigee d'avance par nadia-prof (referentiel, ligne 8) : cette ligne ne
# couvre que la connaissance de la regle du jeu ; la tenue d'un role en situation n'est pas servie
# par ce produit.
#
# EPS-1 : chaque item porte sur un jeu collectif universellement scolaire en France (1, 2, 3
# soleil ; chat perche ; l'epervier ; la balle au prisonnier ; le loup et les moutons ; les
# demenageurs) - aucun item ne suppose une pratique particuliere non universelle, et aucune regle
# ne depend d'une variante locale non nommee.
#
# EPS-2 : aucun item ne compare des corps, des performances ou des capacites entre enfants, et
# aucune performance chiffree n'est presentee comme une norme.
#
# EPS-3 : aucun item ne fait porter une attitude, une emotion ou une conduite morale par la bonne
# reponse - les items de la tache B jugent le respect factuel d'une regle, jamais une intention ou
# un comportement moral (la contrefacon refusee a la ligne 9 du referentiel, "accepter le resultat",
# n'est pas reproduite ici).
#
# BIA-4 : aucun item n'interroge l'enfant sur sa propre pratique ou sa propre situation - les
# situations mettent en scene des personnages nommes (Léa, Hugo, Aya, Malo), exterieurs a l'enfant.
#
# FER-3 : deux taches mentalement distinctes - reconnaitre la regle d'un jeu collectif nomme (tache
# A, items 1 a 6), et dire si une situation decrite respecte ou viole une regle donnee (tache B,
# items 7 a 11).
#
# FER-2 : onze items, plancher de dix (DEC-0064).
#
# FER-1 : le libelle de cette ligne ne porte aucune parenthese enumerative ; la condition est donc
# vacuement tenue.
#
# BIN-1 : aucun item n'est binaire (0 sur 11). Les items 7 et 8 l'etaient a l'origine ; leur
# reprise S33-EPS-JEU (JEU-R1, JEU-R4) les a portes a trois propositions chacun.
#
# ADR-0086 : aucune bonne reponse n'est repetee d'un item a l'autre sous le meme moule de
# propositions ; aucun distracteur ne partage une amorce de quatre mots avec trois autres
# distracteurs du paquet sans qu'aucune bonne reponse ne la partage ; aucun mot de la liste des
# marqueurs de restriction (seulement, uniquement, seul, seule, seuls, seules, sauf) n'est employe.
#
# TYP-1 (ADR-0067) : chaque enonce pose l'espace insecable devant son "?" final. Paquet neuf, aucune
# dette heritee.
#
# S33-EPS-JEU (docs/backlog/backlog.md, sprint 33). Reprise apres REFUS du 2026-09-09
# (squad/conformite/FICHE-bandit-manchot-regles-jeu-collectif-eps-cp.md ;
# squad/sprints/s32-trois-instances-et-ouverture-de-l-eps/verdicts-nadia-instance-C.md, sections 6
# et 11), au tarif de lot de PAR-14 (six items sur onze retouches). Sur la tache A, les items 1, 2
# et 3 sont inchanges ; l'item 4 ne change que d'enonce (JEU-R5) ; les items 5 et 6 sont reecrits
# (JEU-R2, JEU-R3, JEU-R8, JEU-R7) :
#
# 1) JEU-R1 (item 7) : toucher un joueur perche au chat perche n'a aucun effet, ce n'est pas une
#    infraction. L'item pose desormais la question de l'effet ("que se passe-t-il ?") et non celle
#    de la faute, et son indice cesse d'affirmer qu'un joueur perche "ne peut pas etre touche".
#
# 2) JEU-R2, JEU-R3, JEU-R8 (item 5) : la regle jugee ("un mouton touche devient loup") est
#    desormais rappelee dans l'enonce lui-meme plutot que supposee (EPS-1) ; son indice ("le loup
#    grandit au fil de la partie") etait faux au premier degre et devient "chaque mouton touche
#    devient un loup de plus" ; la tournure "Au loup et les moutons" devient "Au jeu du loup et des
#    moutons", lisible au CP.
#
# 3) JEU-R4 (item 8) : a l'epervier, "traverser sans se faire toucher" n'est pas une regle mais une
#    reussite, et l'enonce portait deja son propre verdict. L'item met desormais en jeu la vraie
#    regle du couloir et porte trois propositions plutot que deux.
#
# 4) JEU-R5 (item 4) : le pronom des propositions n'avait aucun antecedent dans l'enonce ("quand on
#    est touche" puis "il va..."). L'enonce devient "que devient un joueur touche ?", sans toucher
#    aux propositions.
#
# 5) JEU-R6 (items 10 et 11) : la tache B se gagnait a la forme de l'enonce, la bonne reponse etant
#    la seule proposition de forme "sanction" face a deux recompenses. Les distracteurs des deux
#    items deviennent des sanctions plausibles elles aussi.
#
# 6) JEU-R7 (reserve, item 6) : la regle "un objet a la fois", jugee en tache B a l'item 10,
#    n'etait jamais posee comme regle avant d'etre jugee. L'item 6 porte desormais cette regle en
#    bonne reponse ("un seul objet"), avant que l'item 10 ne la juge.
items:
  - enonce: "À 1, 2, 3, soleil, quand doit-on s'arrêter de bouger ?"
    bonneReponse: "quand le meneur se retourne"
    distracteurs: ["quand on touche le mur", "quand un joueur crie stop"]
    indice: "Le meneur regarde les autres joueurs de temps en temps."
  - enonce: "Au chat perché, comment un joueur évite-t-il d'être attrapé ?"
    bonneReponse: "en montant sur un point en hauteur"
    distracteurs: ["en fermant les yeux", "en criant le plus fort"]
    indice: "Un joueur touché en hauteur n'est pas pris."
  - enonce: "À l'épervier, que doivent faire les joueurs pour traverser ?"
    bonneReponse: "éviter de se faire toucher"
    distracteurs: ["rester immobiles au milieu", "lancer un ballon à l'épervier"]
    indice: "Un joueur touché devient épervier à son tour."
  - enonce: "À la balle au prisonnier, que devient un joueur touché ?"
    bonneReponse: "il va dans le camp adverse"
    distracteurs: ["il gagne un point", "il devient arbitre du jeu"]
    indice: "Être touché fait changer de camp, pas perdre la partie."
  - enonce: "Au jeu du loup et des moutons, un mouton touché devient loup. Que fait-il ensuite ?"
    bonneReponse: "il peut toucher d'autres moutons"
    distracteurs: ["il doit attendre la fin de la partie", "il redevient mouton peu après"]
    indice: "Chaque mouton touché devient un loup de plus."
  - enonce: "Aux déménageurs, combien d'objets porte-t-on à chaque passage ?"
    bonneReponse: "un seul objet"
    distracteurs: ["deux objets à la fois", "autant d'objets que l'on veut"]
    indice: "Porter un seul objet permet d'aller plus vite entre les deux zones."
  - enonce: "Au chat perché, Léa touche Hugo monté sur un banc. Que se passe-t-il ?"
    bonneReponse: "rien, Hugo est perché"
    distracteurs: ["Hugo est attrapé", "Hugo devient chat"]
    indice: "Toucher un joueur perché ne change rien pour lui."
  - enonce: "À l'épervier, Malo traverse en sortant du couloir. Que se passe-t-il ?"
    bonneReponse: "Malo est éliminé"
    distracteurs: ["Malo change de rôle", "Malo continue de jouer"]
    indice: "Le couloir marque les limites que les joueurs doivent respecter."
  - enonce: "Au chat perché, Malo touche Aya qui court au sol. Que se passe-t-il ?"
    bonneReponse: "Aya est attrapée"
    distracteurs: ["Aya devient meneuse", "rien ne se passe"]
    indice: "Aya n'est pas en hauteur, elle peut donc être touchée."
  - enonce: "Aux déménageurs, Hugo porte deux objets à la fois. Que se passe-t-il ?"
    bonneReponse: "Hugo n'a pas respecté la règle"
    distracteurs: ["Hugo passe son tour", "Hugo laisse un objet à l'arrivée"]
    indice: "La règle des déménageurs impose de transporter un objet à chaque passage."
  - enonce: "À 1, 2, 3, soleil, Hugo avance quand le meneur regarde. Que se passe-t-il ?"
    bonneReponse: "Hugo doit retourner au départ"
    distracteurs: ["Hugo doit rester immobile pendant un tour", "Hugo change de place avec un autre joueur"]
    indice: "Bouger pendant que le meneur regarde n'est pas permis."
