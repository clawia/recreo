  - enonce: "Dans 2/5, en combien de parts égales le tout est-il partagé ?"
    bonneReponse: "5"
    distracteurs: ["6", "7"]
    indice: "Regarde le nombre du bas : il compte les parts égales."
    fraction: "2/5"
    forme: "d"
