  - enonce: "Dans 3/4, en combien de parts égales le tout est-il partagé ?"
    bonneReponse: "4"
    distracteurs: ["3", "5"]
    indice: "Le nombre du bas dit combien de parts il faut compter."
    fraction: "3/4"
    forme: "d"
    famillesDistracteurs:
      "3": "a"
      "5": "b"
  - enonce: "Dans 1/6, en combien de parts égales le tout est-il partagé ?"
    bonneReponse: "6"
    distracteurs: ["1", "5"]
    indice: "Compte les parts annoncées par le nombre du bas."
    fraction: "1/6"
    forme: "d"
    famillesDistracteurs:
      "1": "a"
      "5": "b"
  - enonce: "Dans 7/10, en combien de parts égales le tout est-il partagé ?"
    bonneReponse: "10"
    distracteurs: ["7", "9"]
    indice: "Cherche le nombre de parts, il est écrit en bas."
    fraction: "7/10"
    forme: "d"
    famillesDistracteurs:
      "7": "a"
      "9": "b"
  - enonce: "Dans 1/9, en combien de parts égales le tout est-il partagé ?"
    bonneReponse: "9"
    distracteurs: ["1", "10"]
    indice: "Le nombre du bas compte toutes les parts égales."
    fraction: "1/9"
    forme: "d"
    famillesDistracteurs:
