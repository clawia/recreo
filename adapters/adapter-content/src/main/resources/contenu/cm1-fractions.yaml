  - enonce: "Une piste est partagée en 3 parts égales. On en marque 1. Quelle fraction est marquée ?"  # S25-FRA-1 : marquer admet une part, courir non (FRA-13)
    bonneReponse: "1/3"
    distracteurs: ["1/2", "1/4"]
