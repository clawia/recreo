#
# S24-FRA (DEC-0059 section 2, docs/backlog/backlog.md ; arbitrage prealable de nadia-prof du
# 2026-08-30, ARBITRAGE-PREALABLE-s23-huit-candidats-six-de-contenu-seul-et-deux-de-niveau-2.md,
# section 8bis, FRA-1 a FRA-9 ; et
# ARBITRAGE-PREALABLE-s24-borne-den-premier-paquet-de-saisie-et-deux-points-de-satisfaisabilite.md,
# section 5.2, qui arrete la lecture de FRA-5 sur la forme (d) et ajoute FRA-10). Paquet
# integralement neuf : contenu-repris/fractions/cm1-compare.yml a ete REFUSE par nadia-prof et
# n'est pas la matiere de ce paquet.
#
# FRA-9, couverture partielle nommee : ce paquet ne porte que la moitie "notion de fraction
# simple". La moitie "reperage sur une droite numerique" reste non couverte - elle exige une ligne
# reellement dessinee et graduee.
#
# Trois cles de declaration d'auteur, sur le patron deja en service pour 'graphie' (cp-le-bon-son)
# et 'relationBonneReponse' (cm1-mots-de-liaison) : 'fraction', 'forme' et 'famillesDistracteurs'.
# Aucune fabrique ne les lit ; PaquetCm1FractionsTest les relit et recalcule a partir d'elles la
# bonne reponse et les deux distracteurs de chaque item. C'est ce que FRA-5 demande - qu'un tiers
# puisse recalculer les deux distracteurs a partir de la famille declaree, et sur la forme (d) a
# partir de la fraction enoncee, qui est dans l'item.
#
# FRA-2 et FRA-3, les quatre formes et leur effectif : (a) de l'ecriture chiffree vers la
# denomination, 6 items ; (b) de la denomination vers l'ecriture chiffree, 6 ; (c) de la situation
# de partage vers la fraction, 6 ; (d) la lecture du denominateur seul, 6.
#
# FRA-4 : dix items sur vingt-quatre ont pour numerateur 1, pour un minimum de
# arrondi-inferieur(24/3) = 8.
#
# FRA-5, les familles employees : (a) le numerateur et le denominateur echanges ; (b) le
# denominateur decale de un ; (e) le numerateur et le denominateur additionnes, sur la forme (d)
# seule. La famille (c) - une denomination formee sur le numerateur - n'est employee par aucun
# item : FRA-5 l'autorise sur les formes (a) et (b) sans l'exiger, et la famille (a) est
# indisponible sur un item de numerateur 1, ou l'echange produit d/1, qui n'a pas de denomination.
# Ces items-la portent donc deux distracteurs de famille (b), un par decalage : FRA-5 n'exige pas
# deux familles distinctes, il exige que chaque distracteur appartienne a une famille et que la
# derivation soit nommee.
#
# FRA-5, famille (e), amendement de nadia-prof du 2026-08-31
# (ARBITRAGE-FRA-la-forme-d-contre-le-seuil-minimal-de-rang.md). Elle attrape l'enfant qui lit le
# denominateur comme le nombre de parts RESTANTES au lieu du nombre de parts total : sur 3/8, il
# repond 11 - trois parts prises plus huit qui restent. C'est le contresens meme que la forme (d)
# existe pour trouver, du meme genre que la famille (a) appliquee a l'autre malentendu, et jamais
# un distracteur ecrit pour satisfaire un seuil.
#
# Ce que l'amendement debloque, et pourquoi il etait du : avec les seules familles (a) et (b), la
# bonne reponse d'un item de forme (d) ne peut JAMAIS etre la plus petite des trois propositions -
# FRA-1 impose n < d et la famille (a) rend n. Un enfant qui elimine systematiquement la plus
# petite n'eliminait donc jamais la bonne reponse. nadia-prof l'a reverifie par enumeration sur les
# 45 fractions admises : 0 sur 45, impossible et non rare.
#
# Le seul couple qui atteint ce rang est (b) avec d+1 et (e), qui donne les propositions
# {d, d+1, n+d} - elle le nomme pour qu'on ne le cherche pas. Deux items le portent, "Dans 3/8"
# (8, 9, 11) et "Dans 2/5" (5, 6, 7), et tous deux ont un numerateur d'au moins 2, ce que FRA-5e-2
# exige : sur un numerateur de 1, n+d vaudrait d+1 et FRA-6 ne serait pas tenue.
#
# FRA-5e-1 : la famille (a) figure sur quatre des six items de forme (d), soit 66,7 %, au-dessus du
# plancher de la moitie. Le distracteur qui apprend le plus sur cette forme n'est pas efface par
# l'assouplissement.
#
# FRA-10 : sur l'item "Dans 3/4", le decalage vers le bas produirait 3, deja donne par la famille
# (a) ; c'est donc le decalage vers le haut qui est retenu, 5.
#
# FRA-8 : aucune situation de partage ne suppose gouter, anniversaire, part de gateau ni objet
# possede. Les six situations portent sur une bande de papier, un ruban, une ficelle, une
# longueur, une corde et une piste, aucune rattachee a quelqu'un.
#
# Correction du 2026-08-31 (Done pedagogique VALIDE SOUS RESERVE, nadia-prof,
# FICHE-bandit-manchot-fractions-cm1.md, reserve 1). Le paquet emploie six indices qui tournent a
# l'identique sur les quatre formes ; deux d'entre eux disaient que le nombre du bas donne le NOM
# de la part, ce qui est juste sur les formes (a) et (b), ou la reponse est une denomination, et a
# cote de la cible sur la forme (d), ou la reponse est un nombre. Un enfant bloque pouvait chercher
# "dixiemes" parmi 7, 9 et 10 et ne rien trouver.
#
# Deux items de forme (d) corriges, et deux seulement - ceux que nadia-prof nomme, "Dans 3/4" et
# "Dans 7/10". Leurs indices parlent desormais de compter les parts, jamais de les nommer ; les
# quatre autres indices de cette forme conviennent tels quels, elle l'ecrit. Les memes textes
# restent en place sur les items des formes (a), (b) et (c), ou nommer la part est exactement ce
# que la question demande.
#
# Ce que cette correction ne touche pas, verifie et non suppose : aucune bonne reponse, aucun
# distracteur, aucun enonce, aucune famille declaree. Les comptes que ce fichier declare sur
# lui-meme sont inchanges - 24 items, six par forme, 10 numerateurs 1, famille (a) sur 4 des 6
# items de forme (d), rangs 2/2/2. FRA-8 etait tenue a la lettre avant cette correction, et c'est
# pourquoi la reserve n'etait pas bloquante.
#
# FRA-11 (neuve, 2026-08-31, NON RETROACTIVE) : sur un paquet a plusieurs formes d'items, l'indice
# est accorde a la forme de son item. Elle ne s'applique pas a ce paquet et vaut pour les paquets a
# formes multiples suivants.
items:
  - enonce: "Comment lit-on la fraction 3/8 ?"
    bonneReponse: "trois huitièmes"
    distracteurs: ["huit tiers", "trois neuvièmes"]
    indice: "Le nombre du bas dit en combien de parts on partage."
    fraction: "3/8"
    forme: "a"
    famillesDistracteurs:
      "huit tiers": "a"
      "trois neuvièmes": "b"
  - enonce: "Comment lit-on la fraction 1/4 ?"
    bonneReponse: "un quart"
    distracteurs: ["un tiers", "un cinquième"]
    indice: "Regarde le nombre du bas : il compte les parts égales."
    fraction: "1/4"
    forme: "a"
    famillesDistracteurs:
      "un tiers": "b"
      "un cinquième": "b"
  - enonce: "Comment lit-on la fraction 2/5 ?"
    bonneReponse: "deux cinquièmes"
    distracteurs: ["cinq demis", "deux sixièmes"]
    indice: "Le nombre du bas donne le nom de la part."
    fraction: "2/5"
    forme: "a"
    famillesDistracteurs:
      "cinq demis": "a"
      "deux sixièmes": "b"
  - enonce: "Comment lit-on la fraction 1/6 ?"
    bonneReponse: "un sixième"
    distracteurs: ["un cinquième", "un septième"]
    indice: "Compte les parts annoncées par le nombre du bas."
    fraction: "1/6"
    forme: "a"
    famillesDistracteurs:
      "un cinquième": "b"
      "un septième": "b"
  - enonce: "Comment lit-on la fraction 3/4 ?"
    bonneReponse: "trois quarts"
    distracteurs: ["quatre tiers", "trois cinquièmes"]
    indice: "Le nombre du bas compte toutes les parts égales."
    fraction: "3/4"
    forme: "a"
    famillesDistracteurs:
      "quatre tiers": "a"
      "trois cinquièmes": "b"
  - enonce: "Comment lit-on la fraction 2/9 ?"
    bonneReponse: "deux neuvièmes"
    distracteurs: ["neuf demis", "deux huitièmes"]
    indice: "Le nom de la part vient du nombre du bas."
    fraction: "2/9"
    forme: "a"
    famillesDistracteurs:
      "neuf demis": "a"
      "deux huitièmes": "b"
  - enonce: "Écris en chiffres la fraction trois quarts."
    bonneReponse: "3/4"
    distracteurs: ["4/3", "3/5"]
    indice: "Le nombre du bas dit en combien de parts on partage."
    fraction: "3/4"
    forme: "b"
    famillesDistracteurs:
      "4/3": "a"
      "3/5": "b"
  - enonce: "Écris en chiffres la fraction un cinquième."
    bonneReponse: "1/5"
    distracteurs: ["1/4", "1/6"]
    indice: "Regarde le nombre du bas : il compte les parts égales."
    fraction: "1/5"
    forme: "b"
    famillesDistracteurs:
      "1/4": "b"
      "1/6": "b"
  - enonce: "Écris en chiffres la fraction deux tiers."
    bonneReponse: "2/3"
    distracteurs: ["3/2", "2/4"]
    indice: "Le nombre du bas donne le nom de la part."
    fraction: "2/3"
    forme: "b"
    famillesDistracteurs:
      "3/2": "a"
      "2/4": "b"
  - enonce: "Écris en chiffres la fraction un huitième."
    bonneReponse: "1/8"
    distracteurs: ["1/7", "1/9"]
    indice: "Compte les parts annoncées par le nombre du bas."
    fraction: "1/8"
    forme: "b"
    famillesDistracteurs:
      "1/7": "b"
      "1/9": "b"
  - enonce: "Écris en chiffres la fraction cinq sixièmes."
    bonneReponse: "5/6"
    distracteurs: ["6/5", "5/7"]
    indice: "Le nom de la part vient du nombre du bas."
    fraction: "5/6"
    forme: "b"
    famillesDistracteurs:
      "6/5": "a"
      "5/7": "b"
  - enonce: "Écris en chiffres la fraction un neuvième."
    bonneReponse: "1/9"
    distracteurs: ["1/8", "1/10"]
    indice: "Le nombre du bas compte toutes les parts égales."
    fraction: "1/9"
    forme: "b"
    famillesDistracteurs:
      "1/8": "b"
      "1/10": "b"
  - enonce: "Une bande de papier est partagée en 8 parts égales. On en colorie 3. Quelle fraction est coloriée ?"
    bonneReponse: "3/8"
    distracteurs: ["8/3", "3/7"]
