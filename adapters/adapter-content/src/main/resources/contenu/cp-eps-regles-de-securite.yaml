schema: 1
id: cp-eps-regles-de-securite
type: question
descripteur:
  matiere: "Éducation physique et sportive"
  niveau: "CP"
  domaine: "Adapter ses déplacements à des environnements variés"
  competence: "Connaître et respecter les règles de sécurité propres à l'activité et au lieu de pratique."
lignesDeReferentiel: ["EPS-CP-04"]
#
# S32-5 (docs/backlog/backlog.md, sprint 32, terrain C). Premier paquet d'education physique et
# sportive du produit. Referentiel copie conforme depuis
# squad/programme/education-physique-et-sportive/competences-cp.md (DEC-0074) : "un mot change, la
# ligne n'est plus la mienne" - meme regle que pour tout autre referentiel de nadia-prof.
#
# Premier terrain sans image d'aucune instance de nadia-prof (PAR-13, arbitrage prealable de s32,
# section 6.3) : aucun paquet de cette matiere n'a encore ete audite.
#
# Frontiere corps-et-effort (DEC-0083, section 9.2 ; arbitrage prealable de s32, section 6.4),
# reprise mot pour mot parce qu'elle est opposable a tout lot futur touchant le meme objet : "l'EPS
# ne porte que l'effort lui-meme (...), jamais l'hygiene de vie en general". Ce paquet ne porte
# aucun item sur les effets de l'effort ni sur l'echauffement, l'hydratation ou la recuperation
# (EPS-CP-10, EPS-CP-11) : il sert uniquement les regles de securite de la pratique, hors de la
# ligne de corps-et-effort que ce sprint ne finance pas.
#
# Couverture partielle exigee d'avance par nadia-prof (referentiel, ligne 4) : cette ligne ne couvre
# que la connaissance de la regle de securite ; sa mise en oeuvre en situation n'est pas servie par
# ce produit (aucun capteur, aucune mecanique n'observe un geste).
#
# EPS-2 : aucun item ne compare des corps, des performances ou des capacites entre enfants, et
# aucune performance chiffree n'est presentee comme une norme.
#
# EPS-3 : aucun item ne fait porter une attitude, une emotion ou une conduite morale par la bonne
# reponse - chaque item porte sur une regle de securite factuelle et sur son motif, jamais sur un
# comportement a adopter face a autrui.
#
# BIA-4 : aucun item n'interroge l'enfant sur sa propre pratique, son propre corps ou sa propre
# situation - les situations mettent en scene une activite ou un lieu decrit de facon impersonnelle.
#
# CAT-1 (condition datee du 2026-09-07) : aucune tache ne se gagne au seul registre ou au seul ton.
# Plusieurs distracteurs de la tache A sonnent eux-memes prudents (mettre de la creme solaire,
# verifier la temperature de l'eau) pour qu'un enfant ne puisse pas reussir en choisissant
# systematiquement la proposition qui semble la plus sage.
#
# FER-3 : deux taches mentalement distinctes - reconnaitre la regle de securite qui s'applique a une
# activite ou un lieu decrit (tache A, items 1 a 6), et dire pourquoi une regle de securite decrite
# existe (tache B, items 7 a 11).
#
# FER-2 : onze items, plancher de dix (DEC-0064).
#
# FER-1 : le libelle de cette ligne ne porte aucune parenthese enumerative ; la condition est donc
# vacuement tenue - rien n'est a compter en bonne reponse au-dela des deux taches ci-dessus.
#
# BIN-1 : tous les items portent trois propositions (deux distracteurs) ; aucun n'est binaire.
#
# ADR-0086 : aucune bonne reponse n'est repetee d'un item a l'autre sous le meme moule de
# propositions ; aucun distracteur ne partage une amorce de quatre mots avec trois autres
# distracteurs du paquet sans qu'aucune bonne reponse ne la partage ; aucun mot de la liste des
# marqueurs de restriction (seulement, uniquement, seul, seule, seuls, seules, sauf) n'est employe.
#
# TYP-1 (ADR-0067) : chaque enonce pose l'espace insecable devant son "?" final. Paquet neuf, aucune
# dette heritee.
#
# S33-EPS-SEC (docs/backlog/backlog.md, sprint 33). Reprise apres REFUS du 2026-09-09
# (squad/conformite/FICHE-bandit-manchot-regles-securite-eps-cp.md ;
# squad/sprints/s32-trois-instances-et-ouverture-de-l-eps/verdicts-nadia-instance-C.md, sections 5
# et 11). Quatre motifs traites dans ce diff, la tache A restant inchangee :
#
# 1) SEC-R3 (motif du refus, FAB-1c/CAT-1 branche registre) : sur la tache B, la bonne reponse des
#    items 8, 9, 10 et 11 etait la seule proposition a nommer un danger, une blessure ou un secours
#    (quatre items sur cinq). Les huit distracteurs de ces items sont reecrits pour que les trois
#    propositions de chaque item nomment un danger, une blessure ou une consequence, dont deux
#    fausses - forme reprise mot pour mot sur l'item 9 dans le backlog.
#
# 2) EPS-7 (condition nouvelle, nadia-prof, 2026-09-09, arbitrage prealable de s33 section 3.5) :
#    les quatre indices de ces memes items portaient le meme repere lexical que la bonne reponse
#    ("voiture", "danger", le choc, "blesser"), ce qui aurait redesigne la bonne reponse une fois
#    les distracteurs reecrits. Les quatre indices sont reformules pour expliquer la regle sans
#    reprendre ce mot.
#
# 3) SEC-R1 (reserve) : les items 3 et 8 portaient sur la traversee d'une rue a pied, hors du champ
#    "activite et lieu de pratique" de EPS-CP-04. Les deux enonces ancrent desormais la situation
#    sur un engin roulant (la trottinette), comme le fait deja le referentiel a la ligne 4.
#
# 4) SEC-R2 (reserve) : sur l'item 1, "mettre de la creme solaire" restait une reponse de securite
#    defendable que l'indice n'ecartait pas. L'indice ecarte desormais explicitement la creme
#    solaire, en plus d'affirmer la regle de la bonne reponse.
items:
  - enonce: "Avant d'entrer dans une piscine, que doit-on faire ?"
    bonneReponse: "attendre l'autorisation de l'adulte"
    distracteurs: ["mettre de la crème solaire", "courir sur le bord du bassin"]
    indice: "La crème solaire protège du soleil, pas de l'eau. Il faut d'abord l'autorisation de l'adulte."
  - enonce: "Pour faire du vélo dans la rue, que doit-on porter ?"
    bonneReponse: "un casque"
    distracteurs: ["des chaussures de sport", "des lunettes de soleil"]
    indice: "Le casque protège la tête en cas de chute."
  - enonce: "Avant de traverser une rue en trottinette, que doit-on faire ?"
    bonneReponse: "regarder des deux côtés"
    distracteurs: ["attendre qu'un camarade traverse d'abord", "courir sans s'arrêter"]
    indice: "Il faut vérifier soi-même qu'aucune voiture n'arrive."
  - enonce: "Sur un toboggan, qu'attend-on avant de glisser ?"
    bonneReponse: "que le camarade devant soit descendu"
    distracteurs: ["que la maîtresse compte jusqu'à dix", "que la file soit vide"]
    indice: "Deux enfants en même temps sur le toboggan peuvent se cogner."
  - enonce: "Avant de plonger dans une piscine, que doit-on vérifier ?"
    bonneReponse: "la profondeur de l'eau"
    distracteurs: ["la température de l'eau", "le nombre de spectateurs"]
    indice: "Plonger là où l'eau est trop basse peut blesser la tête."
  - enonce: "Pour utiliser un tapis de gymnastique, que doit-on faire ?"
    bonneReponse: "attendre son tour"
    distracteurs: ["sauter dessus dès qu'on arrive", "monter à plusieurs en même temps"]
    indice: "Un élève à la fois évite les chocs."
  - enonce: "Pourquoi porte-t-on un casque à vélo ?"
    bonneReponse: "pour protéger la tête en cas de chute"
    distracteurs: ["pour aller plus vite en pédalant", "pour être vu de loin par les voitures"]
    indice: "En cas de chute, la tête est la partie la plus fragile."
  - enonce: "Pourquoi regarde-t-on des deux côtés avant de traverser en trottinette ?"
    bonneReponse: "pour vérifier qu'aucune voiture n'arrive"
    distracteurs: ["pour éviter de trébucher sur le trottoir", "pour ne pas se cogner à un passant"]
    indice: "Regarder des deux côtés permet de voir ce qui arrive avant de traverser."
  - enonce: "Pourquoi un adulte surveille-t-il toujours la piscine ?"
    bonneReponse: "pour porter secours en cas de danger"
    distracteurs: ["pour vérifier que l'eau n'est pas trop froide", "pour compter les nageurs qui entrent dans le bassin"]
    indice: "Un adulte présent peut réagir tout de suite si besoin."
  - enonce: "Pourquoi descend-on un par un sur le toboggan ?"
    bonneReponse: "pour éviter que deux enfants se heurtent"
    distracteurs: ["pour ne pas tomber en attendant en haut", "pour éviter de glisser trop vite"]
    indice: "Descendre seul laisse de la place en bas du toboggan."
  - enonce: "Pourquoi vérifie-t-on la profondeur avant de plonger ?"
    bonneReponse: "pour éviter de se blesser en touchant le fond"
    distracteurs: ["pour éviter d'avaler de l'eau en plongeant", "pour ne pas glisser sur le bord du bassin"]
    indice: "Vérifier avant de plonger évite les mauvaises surprises."
