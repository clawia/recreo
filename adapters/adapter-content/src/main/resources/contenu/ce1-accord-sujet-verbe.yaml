# S53-FRA-ACCORD-SUJET-VERBE (s53, generation de contenu seul, brouillon soumis a nadia-prof). Conditions
# ACV-CE1-1 a ACV-CE1-3 (squad/conformite/ARBITRAGE-PREALABLE-s48-francais-ce1.md, section 5.5).
#
# ACV-CE1-1 : le sujet est place immediatement avant le verbe, sans mot entre eux ; sujet nominal dans dix-sept
# items sur vingt-quatre (au-dessus des deux tiers), sujet pluriel douze items, singulier douze items ;
# aucun sujet coordonne.
# ACV-CE1-2 : trois formes du present du meme verbe ; verbes de PRS-CE1-1 seulement (etre, avoir, aller,
# faire, dire, venir et premier groupe sans modification orthographique).
# ACV-CE1-3 : le nombre se lit sur le sujet, surtout un nom (frontiere avec FRA-CE1-17, sujet toujours pronom).
# Aucun indice ne donne un critere qu'un distracteur de son item satisfait : le nombre seul (un ou plusieurs) est
# satisfait par la forme d'une autre personne (joues, ecoutons). Les formes en -e, -es, -ent se prononcent de meme.
# TRV-CE1-1 a TRV-CE1-7 (squad/conformite/ARBITRAGE-PREALABLE-s48-francais-ce1.md, section 2) : niveau CE1, une seule ligne de referentiel, aucun champ a
# voix haute ni texteSupport ni illustration, un indice sur chaque item (douze mots au plus, jamais
# la reponse, jamais un renvoi a l'ecoute), plancher de vingt items atteint. LON-CE1-5 : au plus six mots
# par proposition. La question est portee par la consigne du jeu quand l'enonce ne la porte pas.
schema: 1
id: ce1-accord-sujet-verbe
type: question
descripteur:
  matiere: "Français"
  niveau: "CE1"
  domaine: "Orthographe et grammaire"
  competence: "Accorder le verbe avec son sujet au présent, quand le sujet est un pronom personnel ou un nom placé juste avant le verbe."
lignesDeReferentiel: ["FRA-CE1-14"]
items:
  # ACV-CE1-1: sujet nominal singulier
  - enonce: "« jouer » : le chat ___ dans le jardin."
    bonneReponse: "joue"
    distracteurs: ["jouent", "joues"]
    indice: "Remplace le sujet par « il », « elle », « ils » ou « elles », puis relis."
  # ACV-CE1-1: sujet nominal pluriel
  - enonce: "« écouter » : les élèves ___ la maîtresse."
    bonneReponse: "écoutent"
    distracteurs: ["écoute", "écoutons"]
    indice: "Remplace le sujet par « il », « elle », « ils » ou « elles », puis relis."
  # ACV-CE1-1: sujet pronom pluriel
  - enonce: "« venir » : ils ___ de l'école."
    bonneReponse: "viennent"
    distracteurs: ["vient", "viens"]
    indice: "Le sujet se trouve juste avant le trou : combien en voit-on ?"
  # ACV-CE1-1: sujet nominal singulier
  - enonce: "« être » : la maîtresse ___ dans la classe."
    bonneReponse: "est"
    distracteurs: ["sont", "es"]
    indice: "Remplace le sujet par « il », « elle », « ils » ou « elles », puis relis."
  # ACV-CE1-1: sujet nominal pluriel
