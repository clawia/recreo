# S51-FRA-GRAPHIE (s51, DEC-0110 section 3). Arbitrage prealable de nadia-prof, conditions GRL-CE1-1 a
# GRL-CE1-3 (squad/conformite/ARBITRAGE-PREALABLE-s48-francais-ce1.md, section 5.13), sept
# conditions transverses TRV-CE1-1 a TRV-CE1-7 (meme source, section 2), et conditions 1 a 6 de la
# section 2 de squad/conformite/ARBITRAGE-PREALABLE-s51-fra-ce1-22-graphie-cedille.md. Le
# distracteur sans cedille n'est servi que dans la forme admise par l'amendement A1 d'ADR-0065 :
# meme mot, meme determinant, seule la cedille manque.
#
# GRL-CE1-1 : trois regles, huit items chacune sur vingt-quatre (un tiers, au-dessus du quart) :
# m devant m, b, p ; c/ç ; g, ge, gu (quatre items en gu, quatre en ge).
# GRL-CE1-2 : deux propositions, le meme mot ecrit deux fois, ne differant que par la graphie que
# la regle decide. Section 2, point 1 : la bonne reponse porte ç devant a, o ou u, jamais l'inverse.
# GRL-CE1-3 : aucune exception a la regle du m (bonbon, néanmoins).
# Section 2, points 2 et 3 : mots frequents, le distracteur n'est pas un mot. Point 4 : le mot cible
# n'est ni dans l'enonce ni dans l'indice. Point 5 : l'indice donne une methode, jamais le mot.
# Point 6 : aucune explication (voir PaquetCe1GraphieTest, section2Point6) : ChaquePaquetExpliqueSesItemsAVariationTest
# lie toute explication a une graphie et a un enonce qui nomme le mot, ce que le point 4 interdit ici.
# TRV-CE1-2 : les distracteurs des regles m et c/ç ont la meme longueur que la bonne reponse ; ceux de
# la regle g sont plus courts, soit huit items sur vingt-quatre ou la bonne reponse est strictement la
# plus longue, sous la moitie. TRV-CE1-1 a TRV-CE1-7 : niveau CE1, une seule
# ligne (FRA-CE1-22), aucun champ a voix haute ni texteSupport, vingt-quatre items.
