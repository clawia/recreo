# S53-FRA-CLASSES-DE-MOTS (s53, generation de contenu seul, brouillon soumis a nadia-prof). Conditions
# CLM-CE1-1 a CLM-CE1-3 (squad/conformite/ARBITRAGE-PREALABLE-s48-francais-ce1.md, section 5.3).
#
# CLM-CE1-1 : le mot cible est designe (partDesignee, ADR-0062) ; trois propositions parmi les cinq classes ;
# nom commun 5, nom propre 4, verbe 5, determinant 5, adjectif 5 sur vingt-quatre (au moins un dixieme
# chacun) ; nom commun et verbe reunis : dix, sous la moitie.
# CLM-CE1-2 : le mot cible n'ouvre jamais la phrase ; aucun pronom, adverbe, preposition ni conjonction
# n'est designe.
# CLM-CE1-3 : trois noms communs sur cinq suivent un adjectif et non un determinant ; l'adjectif est place
# avant le nom dans deux items sur cinq, apres dans trois.
# L'enonce est la phrase seule ; la question (la classe du mot entre guillemets) est portee par la consigne
# du jeu. Chaque item declare sa classe juste au-dessus de lui.
# TRV-CE1-1 a TRV-CE1-7 (squad/conformite/ARBITRAGE-PREALABLE-s48-francais-ce1.md, section 2) : niveau CE1, une seule ligne de referentiel, aucun champ a
# voix haute ni texteSupport ni illustration, un indice sur chaque item (douze mots au plus, jamais
# la reponse, jamais un renvoi a l'ecoute), plancher de vingt items atteint. LON-CE1-5 : au plus six mots
# par proposition. La question est portee par la consigne du jeu quand l'enonce ne la porte pas.
