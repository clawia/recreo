id: cp-emc-regle-souhait-loi
type: question
descripteur:
  matiere: "Enseignement moral et civique"
  niveau: "CP"
  domaine: "Acquérir et partager les valeurs de la République"
  competence: "Distinguer une règle qui vaut pour tous d'un simple souhait, et reconnaître qu'une loi s'impose à tous."
lignesDeReferentiel: ["EMC-CP-07"]
#
# S31-2 (docs/backlog/backlog.md, sprint 31). Reecriture partielle apres REFUS de nadia-prof le
# 2026-09-07 (squad/conformite/FICHE-bandit-manchot-regle-souhait-loi-cp.md, squad/sprints/
# s31-second-passage-de-sciences-et-emc-cp/verdicts-nadia-instance-A.md, section 4.1).
#
# A LA DATE DU 2026-09-07, LA TACHE A (items 1 a 6) ETAIT INCHANGEE : nadia-prof l'avait
# explicitement confirmee bonne et a conserver telle quelle ("Elle est reutilisable telle quelle",
# fiche, section "Ce que je tiens a porter au credit du paquet"). Deux motifs de refus portaient sur
# la seule tache B et sur l'item 11 de cette tache, tous deux corriges dans ce meme geste :
#
# 1) Un fait de droit etait faux (ancien item 11) : "une loi interdit de traverser en dehors des
#    passages prevus pour les pietons" - l'article R412-37 du code de la route n'oblige a emprunter
#    le passage que s'il en existe un a moins de 50 metres. CET ITEM EST RETIRE et remplace par un
#    item sur la vente d'alcool aux mineurs (Code de la sante publique, L3342-1 : vente d'alcool
#    interdite aux moins de dix-huit ans), fait verifie exact.
#
# 2) FAB-1a et FAB-1c cumulees : la tache B servait cinq fois "tout le monde, meme les adultes"
#    (ou une variante a un mot pres), amorce reconnaissable sur 5 items sur 5 (FER-2 tombait a 7
#    comptables sur 10). LA TACHE B SERT DESORMAIS CINQ REPONSES ENTIEREMENT DISTINCTES, sans
#    amorce partagee : "tout le monde, y compris les adultes" (feu rouge), "le conducteur et tous
#    les passagers" (ceinture), "personne, pas meme les adultes" (tabac a l'ecole), "tout
#    conducteur, meme adulte" (klaxon), "seulement les adultes" (vente d'alcool - contre-exemple
#    d'une loi qui NE s'applique PAS aux enfants, comme nadia-prof le suggere dans son verdict :
#    "une loi qui vise les adultes seuls (le tabac, l'alcool)"). L'enfant apprend alors ce que
#    "s'impose a tous" veut dire par contraste plutot que par repetition d'une seule formule.
#
# PLA-1 sur l'item du klaxon : le distracteur "seulement les enfants" est retire (un enfant de six
# ans ne klaxonne pas, ce n'est un candidat pour personne) et remplace par deux usagers de la route
# plausibles ("seulement les motards", "seulement les chauffeurs de taxi").
#
# Faits verifies un par un (nadia-prof, meme verdict) : feu rouge (R412-30), ceinture pour le
# conducteur et tous les passagers (R412-1), interdiction de fumer dans l'enceinte d'un
# etablissement scolaire, espaces non couverts compris, sans exception pour les adultes, klaxon
# limite au danger immediat (R416-1). Vente d'alcool aux mineurs interdite (Code de la sante
# publique, L3342-1), verifie a l'ecriture de ce correctif.
#
# CAT-1 (tache A et tache B) : deja tenue et non retouchee - les propositions sont des categories
# institutionnelles ou des groupes de personnes, jamais un registre poli oppose a un registre
# grossier.
#
# BIN-1 (tache A) : deja tenue et non retouchee - trois des six items de classement portent deux
# propositions (items 1, 2, 3), les trois autres en portent trois (items 4, 5, 6).
#
# FER-1 (tache A) : deja tenue et non retouchee - "une règle qui vaut pour tous" (items 1, 3, 5),
# "un simple souhait" (items 2, 6), "une loi" (item 4).
#
# EMC-1, EMC-5, EMC-8, EMC-10 : deja tenues, non retouchees.
#
# FAB-1 : verifie par ADR-0086 sur le contenu servi entier (aucun sous-ensemble de trois items ou
# plus ne partage a la fois le meme trio de propositions et la meme bonne reponse).
#
# TYP-1 (ADR-0067) : chaque enonce pose l'espace insecable devant son "?" final.
#
# FER-2 : onze items, au-dessus du plancher de dix (DEC-0064).
#
# Correction du 2026-09-08 (lea-dev, S32-EMCCP07, docs/backlog/backlog.md, sprint 32), refus
# maintenu par nadia-prof le 2026-09-08 sur le seul motif FAB-1c (squad/conformite/FICHE-bandit-
# manchot-regle-souhait-loi-cp.md, bloc de reaudit) : sur la tache B (items 7 a 11), la bonne
# reponse etait la seule proposition sans marqueur restrictif ("seulement", "sauf"...) sur 3 a 4
# items sur 5, la ou la clause n'en autorise qu'un.
#
# FAB-1c payee : sur les items 7, 8, 9 et 10, un des deux distracteurs devient lui-meme une
# proposition sans marqueur restrictif ("les motards et les cyclistes", "les enfants et les adultes
# a l'arriere", "les adultes de l'ecole", "les chauffeurs de bus et de taxi"), toutes fausses pour la
# situation decrite. La bonne reponse n'est donc plus jamais la seule proposition sans marqueur.
# L'item 11 (vente d'alcool) est inchange : sa bonne reponse porte elle-meme le marqueur
# ("seulement les adultes"), ce qui est deja le contre-exemple que la barre demande.
#
# LON-1 et LON-2 (arbitrage prealable de s32, section 16.4, nadia-prof) : chaque enonce du paquet
# compte desormais au plus 15 mots et au plus deux phrases, la seconde etant la question. Les six
# questions de la tache A ("Est-ce une regle qui vaut pour tous, [un simple souhait,] [ou une
# loi] ?") reenumeraient les propositions deja portees par les boutons ; elles sont raccourcies en
# "Est-ce une regle ?", et deux situations de la tache B (items 9 et 11) sont raccourcies d'un mot
# chacune pour la meme barre. Aucune bonne reponse, aucun distracteur de la tache A et aucun fait de
# la tache B ne changent : FER-1, BIN-1, CAT-1, EMC-1, EMC-5, EMC-8, EMC-10 et l'exactitude des cinq
# faits de droit restent tenus a l'identique.
#
# Correction du 2026-09-09 (lea-dev, s32, defaut trouve par relecteur-pedagogique) : le
# raccourcissement de l'item 11 pour LON-1 avait retire le partitif ("vendre l'alcool" au lieu de
# "vendre de l'alcool"), un enonce agrammatical servi a un enfant en cours d'apprentissage de la
# lecture. Le partitif est restitue, et "aux moins de dix-huit ans" est remplace par "aux mineurs"
# (le terme meme du Code de la sante publique, L3342-1) pour rester sous la barre : l'enonce tombe
# a 13 mots, sans toucher au fait de droit ni a la bonne reponse.
#
# Quatrieme passage (2026-09-09, lea-dev, S33-EMCCP07). Refus du 2026-09-08 sur deux points
# (squad/sprints/s32-trois-instances-et-ouverture-de-l-eps/verdicts-nadia-instance-B.md, section 3 ;
# squad/conformite/ARBITRAGE-PREALABLE-s33-le-plan-2-applique-a-s33-le-vivier-que-quatre-refus-ont-
# realimente-et-ce-que-la-borne-de-douze-ne-finance-pas.md, section 3.4).
#
# Point 2, item 11 (vente d'alcool aux mineurs), PAYE : le distracteur mort "seulement les enfants"
# (condamne par nadia-prof le 2026-09-08 sur l'item du klaxon du meme paquet, et retrouve intact ici
# le 2026-09-09) est remplace par "seulement les parents", un candidat qu'un enfant de CP peut
# vraiment envisager (PLA-1) sans devenir la bonne reponse.
#
# Point 1, items 4, 5, 6, NON PAYE, route a theo-archi et nadia-prof via sofia-sm plutot que
# contourne. L'arbitrage prealable de s33 (section 3.4) demande que la tache de classement
# redevienne binaire sur ces trois items ("une regle qui vaut pour tous" contre "un simple
# souhait", comme sur les items 1, 2 et 3), au motif que le libelle ne demande pas de distinguer
# une loi d'une regle. Mesure sur ce diff, avant d'etre revert : cette sortie fait echouer deux
# garde-fous opposables et non amendes par cet arbitrage ("aucune clause anterieure n'est
# amendee ici", meme section) -
#   - FER-1 (PaquetCpEmcRegleSouhaitLoiTest.fer1LesTroisTermesSontEnBonneReponseDeLaTacheDe
#     Classement) : "une loi" ne serait plus en position de bonne reponse sur aucun item de la
#     tache de classement, alors que le test l'exige mot pour mot depuis S31-2 ;
#   - BIN-1 (PaquetCpEmcRegleSouhaitLoiTest.bin1AuPlusLaMoitieDesItemsDeClassementSontBinaires) :
#     les six items de la tache de classement deviendraient tous binaires (6 sur 6), bien au-dela
#     du plafond d'un item sur deux que BIN-1 pose.
# Aucune troisieme proposition non fautive n'est constructible sur ces trois items sans reprendre
# soit "une loi" (interdit par EMC-11), soit un distracteur mort (interdit par PLA-1) : les items
# 4, 5 et 6 restent donc au comportement refuse le 2026-09-08, dans l'attente d'une decision
# ecrite sur laquelle des deux clauses (FER-1 tel que code, ou BIN-1) cede.
#
items:
  - enonce: "Avant la récréation, chaque élève doit ranger sa chaise, sans exception. Est-ce une règle ?"
    bonneReponse: "une règle qui vaut pour tous"
    distracteurs: ["un simple souhait"]
    indice: "Personne n'a le droit d'y échapper."
  - enonce: "La maîtresse aimerait que la classe soit plus silencieuse. Est-ce une règle ?"
    bonneReponse: "un simple souhait"
    distracteurs: ["une règle qui vaut pour tous"]
    indice: "Elle exprime ce qu'elle aimerait, pas une obligation écrite."
  - enonce: "Dans la cour, il est interdit de pousser un camarade. Est-ce une règle ?"
    bonneReponse: "une règle qui vaut pour tous"
    distracteurs: ["un simple souhait"]
    indice: "Cet interdit s'applique à chaque élève, sans exception."
  - enonce: "En France, le casque à vélo est obligatoire avant douze ans. Est-ce une règle ?"
    bonneReponse: "une loi"
    distracteurs: ["une règle qui vaut pour tous", "un simple souhait"]
    indice: "Cette obligation vient de l'État et s'applique dans tout le pays, pas seulement à l'école."
  - enonce: "À la cantine, chaque élève doit attendre son tour pour se servir. Est-ce une règle ?"
    bonneReponse: "une règle qui vaut pour tous"
    distracteurs: ["un simple souhait", "une loi"]
    indice: "Cela s'applique à chaque élève qui mange à la cantine."
  - enonce: "Aya aimerait que la maîtresse donne moins de devoirs le week-end. Est-ce une règle ?"
    bonneReponse: "un simple souhait"
    distracteurs: ["une règle qui vaut pour tous", "une loi"]
    indice: "C'est ce qu'elle voudrait, pas ce qui est décidé."
  - enonce: "Le code de la route dit qu'il faut s'arrêter au feu rouge. Qui doit s'arrêter ?"
    bonneReponse: "tout le monde, y compris les adultes"
    distracteurs: ["les motards et les cyclistes", "seulement les piétons"]
    indice: "Cette règle ne fait pas de différence selon l'âge de la personne."
  - enonce: "Une loi rend obligatoire le port de la ceinture en voiture. Qui doit l'attacher ?"
    bonneReponse: "le conducteur et tous les passagers"
    distracteurs: ["seulement le conducteur", "les enfants et les adultes à l'arrière"]
    indice: "Chaque personne assise dans la voiture doit l'attacher, quel que soit son âge."
  - enonce: "Une loi interdit de fumer dans la cour d'une école. Qui peut y fumer ?"
    bonneReponse: "personne, pas même les adultes"
    distracteurs: ["les enseignants seulement", "les adultes de l'école"]
    indice: "Cette interdiction s'applique à toutes les personnes présentes dans la cour."
  - enonce: "Une loi interdit de klaxonner sans raison en ville. Qui doit la respecter ?"
    bonneReponse: "tout conducteur, même adulte"
    distracteurs: ["seulement les motards", "les chauffeurs de bus et de taxi"]
    indice: "Cette loi s'applique à toutes les personnes qui conduisent en ville."
  - enonce: "Une loi interdit de vendre de l'alcool aux mineurs. Qui peut en acheter ?"
    bonneReponse: "seulement les adultes"
    distracteurs: ["tout le monde, même les enfants", "seulement les parents"]
    indice: "Cette loi fixe un âge minimum pour acheter de l'alcool."
