    bonneReponse: "Enzo et Maya"
    distracteurs: ["Enzo", "leurs affaires"]
    indice: "Relis la phrase d'avant pour trouver qui agit."
  # il, le sens decide
  - enonce: "Que désigne « il » dans le texte ?"
    texteSupport: "Le chat voit Elias. Il lui donne un biscuit."
    bonneReponse: "Elias"
    distracteurs: ["le chat", "un biscuit"]
