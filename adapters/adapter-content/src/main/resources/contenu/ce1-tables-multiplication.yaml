# S47-MAT-TABLES (MAT-CE1-07, DEC-0104 section 4, instance A). Arbitrage prealable de s43
# (squad/conformite/ARBITRAGE-PREALABLE-s43-mathematiques-ce1-lot-2.md, section 1.3) :
# TAB-CE1-1 a TAB-CE1-6, corrigees et amendees le 2026-10-02
# (squad/conformite/FICHE-bandit-manchot-tables-multiplication-ce1.md).
#
# TAB-CE1-1 : l'espace couvert est les 50 produits a x b (a dans {2, 3, 4, 5, 10}, b entier de 1 a
# 10), qui ne font que 40 faits distincts - 3 x 4 et 4 x 3 sont le meme produit, un item de l'un
# couvre l'autre. Les 40 faits sont tous servis, un item par fait.
#
# TAB-CE1-2 : "facteur de table" d'un fait est le membre de {2, 3, 4, 5, 10} dont la table est
# exercee - quand les deux facteurs sont dans cet ensemble, c'est le plus petit (fiche, section 5).
# Sur les 40 items : 23 de facteur de table 2, 5 ou 10 (57,5 %, plancher 50 %), 9 de facteur de
# table 3 (22,5 %, plancher 15 %), 8 de facteur de table 4 (20 %, plancher 15 %).
#
# TAB-CE1-3 : cinq items portent un facteur 1 (2 x 1, 3 x 1, 4 x 1, 5 x 1, 10 x 1 - imposes par
# TAB-CE1-1), soit 12,5 % des 40 items, sous le plafond de 20 %.
#
# TAB-CE1-4 : sur les 30 items dont les deux facteurs different et dont aucun ne vaut 1, quinze
# (50 %, plancher un tiers) ecrivent le facteur de table en seconde position ("7 × 3", pas
# seulement "3 × 7").
#
# TAB-CE1-5 : chaque enonce est une expression numerique nue, signe "×" (jamais "x"), sans
# situation ni unite. TYP-1 (ADR-0067) : l'espace devant le "?" final est insecable (U+00A0).
#
# TAB-CE1-6 : chaque distracteur appartient a l'une des cinq familles, nommee en commentaire sur la
# ligne de l'item ("# TAB-CE1-6: <famille du premier distracteur>,<famille du second>") - (a) produit
# voisin par defaut (a x (b-1)), (b) produit voisin par exces (a x (b+1)), (c) somme des facteurs
# (a+b, sous condition), (d) produit de la table voisine ((a-1) x b ou (a+1) x b, le facteur restant
# dans {2, 3, 4, 5, 10}), (e) confusion de "x 1" avec "+ 1" (a+1, uniquement quand un facteur vaut
# 1). Quand les deux facteurs du fait sont dans {2, 3, 4, 5, 10}, les familles (a) a (d) sont
# recalculees sur l'une ou l'autre lecture du couple. Sur le paquet entier, la bonne reponse est la
# plus petite sur 14 items (35 %), la mediane sur 13 (32,5 %), la plus grande sur 13 (32,5 %) -
# chaque rang entre 10 % et 50 %.
