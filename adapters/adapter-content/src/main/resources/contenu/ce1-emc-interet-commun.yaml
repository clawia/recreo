schema: 1
id: ce1-emc-interet-commun
type: question
descripteur:
  matiere: "Enseignement moral et civique"
  niveau: "CE1"
  domaine: "Construire une culture civique"
  competence: "Distinguer, dans une situation simple, ce qui sert l'intérêt d'une seule personne de ce qui sert l'intérêt de tous."
lignesDeReferentiel: ["EMC-CE1-04"]
#
# S57-BR-EMC-CE1-04 (s57, palier 4, poste p4-9, lot LP6). Paquet ecrit par sofia-sm, casquette
# developpeuse, dans le lot, sur la competence EMC-CE1-04 (squad/programme/enseignement-moral-et-
# civique/competences-ce1.md) et les conditions de nadia-prof : INT-CE1-1 et INT-CE1-2
# (ARBITRAGE-PREALABLE-s57-instruction-questionner-le-monde-et-emc-ce1.md, 4.4), communes d'EMC de
# 4.4 de arbitrage-nadia-preparation-palier-3-ce1.md, point d'audit commun de FICHE-bandit-manchot-
# regle-sanction-ce1.md (aucune forme ne donne la reponse). Rien n'est joue : le Done est a
# nadia-prof, qui reste seule garde de INT-CE1-1 (une seule lecture defendable, aucun blame).
#
# La tache : une scene d'une phrase, un personnage nomme, une seule action ; l'enfant dit pour qui
# elle est utile. Les propositions disent pour une seule personne et pour toute la classe (INT-CE1-2) ;
# la troisieme est un nombre d'eleves entre les deux, jamais la bonne reponse. Les mots que
# l'arbitrage interdit a l'enfant de lire ne sont ecrits nulle part dans ce fichier ; le test du
# paquet les cherche dans le fichier entier.
#
# INT-CE1-1, la portee de chaque scene et l'appartenance de son objet (declarees item par item, relues
# par le test du paquet) :
#   portee un : une chose qui ne sert qu'a un seul personnage
#   portee tous : une chose qui sert tout le groupe
#   objet personnel : la scene porte un possessif (son, sa, ses)
#   objet partage : la scene porte un lieu ou un objet partage (liste fermee du test), jamais de possessif
# L'appartenance de l'objet ne dit pas la portee (FICHE-bandit-manchot-interet-commun-ce1.md, M1) : dans
# chaque portee, au moins un tiers des scenes croise les deux (un objet partage qui ne sert qu'a un
# personnage ; un objet personnel qui sert tous). Le test recompte sur le texte des scenes, non sur les
# declarations, ce que gagnerait une regle qui repond "une seule personne" quand la scene porte un
# possessif et "toute la classe" sinon. Il fait le meme compte pour la regle symetrique, qui repond
# "toute la classe" des que la scene nomme un lieu ou un objet de la liste fermee : le lieu ne dit pas
# plus la portee que le possessif (reserve 4 du rejeu de nadia-prof). Un mot qui dit la portee (chacun,
# tous, toute) n'est ni un lieu ni un objet : il n'entre pas dans la liste fermee et aucune scene ne
# le porte.
# Une scene ne dit jamais les deux : aucun personnage n'est mis en balance avec le groupe (mais,
# alors que, tandis que, plutot que, au lieu de, pourtant). Vouloir quelque chose pour soi n'est
# jamais dit mal : aucun mot de jugement (egoiste, honte, mechant, gentil, vilain, faute, tort). Que
# chaque scene n'ait qu'une lecture defendable reste a la lecture de nadia-prof (EMC-5).
#
# TRV-CE1-2, les familles de distracteurs (liste fermee, le test relit chaque distracteur dans sa
# famille, dans l'ordre du fichier) :
#   famille a : pour une seule personne | pour toute la classe
#   famille b : pour quelques élèves | pour deux élèves | pour trois élèves
# (a) l'autre formule que la bonne reponse (jamais la meme) ; (b) un nombre d'eleves entre les deux,
# jamais la bonne reponse, une scene n'en servant ni deux ni trois. Chaque item porte donc ses trois
# propositions : les deux formules et un nombre. La bonne reponse est une formule, 13 items sur 24
# pour toute la classe, 11 pour une seule personne ; chaque nombre est servi avec les deux bonnes
# reponses (ADR-0086, clause 1 : un moule de propositions n'est jamais une seule bonne reponse).
#
# Aucune forme ne donne la reponse (point d'audit commun) : propositions en minuscule, sans chevrons ni
# guillemets ; aucune proposition ne reprend un mot plein de la scene (classe, personne, seule, toute,
# eleves, quelques, trois) ; la bonne reponse est strictement la plus longue des trois dans la moitie
# des items au plus (TRV-CE1-2, caracteres).
#
# NRC-CE1-1 : aucune proposition ni aucun enonce n'est celui d'un paquet de CP (cp-emc-regles-de-vie,
# cp-emc-regle-souhait-loi, cp-emc-droits-enfant) ni d'un cousin de CM1 (cm1-emc-regle-loi, cm1-emc-
# droit-devoir, cm1-emc-regles-vie-collective) : le test compare les textes. Ce que le test ne
# compare pas, le sujet, nadia-prof le lit. EMC-CE1-01 (ce1-emc-biens-communs) sert aussi ce qui est
# a tous ; ici, l'action et celui qu'elle sert, jamais l'objet ni son appartenance.
#
# Pli a 744 x 551 (mesure-ines-palier-4-pli-744x551.md, LP4) : l'enonce compte 112 caracteres au
# plus (trois lignes) et l'indice 46 au plus (une ligne). Seuils derives de la mesure de LP4, non
# mesures sur ce paquet.
#
# TRV-CE1-1, -5, -6, LON-CE1-1, -2, -5, EMC-1, EMC-6 : niveau CE1, aucun texteSupport ni voix, un
# indice par item (douze mots au plus, une question de methode, jamais une proposition, vingt-quatre
# indices distincts), enonces de vingt mots et trois phrases au plus, propositions de six mots au plus,
# quinze prenoms dont sept feminins et huit masculins, aucun lieu de vie hors l'ecole, aucune adresse
# a l'enfant.
#
# TYP-1 (ADR-0067) : l'espace qui precede "?" est insecable. Paquet neuf. FER-2 : vingt-quatre items.
items:
