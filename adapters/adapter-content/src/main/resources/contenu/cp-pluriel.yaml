#
# S24-PLU (DEC-0059). Arbitrage prealable de nadia-prof du 2026-08-30
# (squad/conformite/ARBITRAGE-PREALABLE-s23-huit-candidats-six-de-contenu-seul-et-deux-de-niveau-2.md,
# partie 4, conditions PLU-1 a PLU-9). Ecriture neuve : aucun fichier de contenu-repris ne porte
# cette competence.
#
# PLU-1 : la proposition porte le groupe entier, determinant compris, et le groupe a trou n'est
# jamais le sujet du verbe - aucune phrase ne porte donc d'autre indice de nombre pour ce groupe
# (ni accord du verbe, ni adjectif, ni nombre ecrit). C'est l'accord interne au groupe qui decide.
# PLU-2 : les six determinants admis, et aucun autre - un, une, le, la, les, des. Les six sont
# employes dans ce paquet.
# PLU-4 : les deux distracteurs sont derives de la bonne reponse et recalculables par un tiers -
# (a) le nom porte la marque inverse de celle qu'exige son determinant, le determinant inchange ;
# (b) le determinant passe au nombre inverse (un/une -> des, le/la -> les, les -> le/la, des ->
# un/une, selon le genre du nom), le nom inchange. Ils sont ecrits dans cet ordre sur chaque item.
# PLU-5 : sur les 21 items, la bonne reponse porte la marque -s sur le nom sur 10 items et ne la
# porte pas sur 11 - le plancher de nadia-prof est de 7 de chaque cote (partie entiere de 21/3).
#
# PLU-1 (aucun autre indice de nombre) et PLU-8 (ce que dit l'indice) restent le jugement de
# nadia-prof. Les conditions calculables sont verifiees par PaquetCpPlurielTest.
