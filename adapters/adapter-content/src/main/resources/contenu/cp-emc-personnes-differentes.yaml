schema: 1
id: cp-emc-personnes-differentes
type: question
descripteur:
  matiere: "Enseignement moral et civique"
  niveau: "CP"
  domaine: "Respecter autrui"
  competence: "Reconnaître que les personnes sont différentes et qu'aucune différence ne justifie de traiter quelqu'un moins bien."
lignesDeReferentiel: ["EMC-CP-04"]
#
# S53 (session de contenu seul, hors sprint). Paquet ecrit pour la ligne EMC-CP-04, sans arbitrage
# prealable specifique a cette session : il applique les conditions deja ecrites. Aucun Done n'est
# prononce ici, tout est a juger par nadia-prof.
#
# POINT D'ATTENTION POUR L'AUDIT. ARBITRAGE-PREALABLE-s31-ce-qui-ferme-une-ligne-d-emc-cp-le-catechisme-civique-et-ma-borne.md
# (section 3.1) a ecrit trois fois que cette ligne ne se sert pas : EMC-4 ne laisse que la forme de
# l'interdit (une seule tache), et la premiere moitie du libelle ("les personnes sont differentes")
# ne se sert pas sans enumerer des differences, donc FER-1 echoue. Ce paquet applique la seule porte
# que nadia-prof y a laissee ouverte, "une seconde tache portant sur des differences individuelles
# nommees dans l'enonce (deux enfants qui n'aiment pas le meme jeu), jamais sur une categorie de
# personnes", et ne pretend pas lever le refus : il est ecrit pour etre juge item par item.
#
# EMC-4 : aucune proposition n'attribue un trait, un gout ou une capacite a une categorie de
# personnes, distracteurs compris. Chaque difference est celle d'un enfant nomme (lunettes, taille,
# main d'ecriture, facon de parler, pull, cheveux, gout pour un autre jeu), jamais d'un groupe.
#
# FER-3 : deux taches distinctes - dire ce qui est different entre deux enfants nommes dont
# l'enonce donne ce qu'ils ont en commun (tache A, items 1 a 4), et reconnaitre, parmi trois enfants
# qui ne peuvent pas jouer, celui pour qui la raison est une difference et non une raison de jeu
# (tache B, items 5 a 11).
#
# FER-2 : onze items, strictement superieur aux dix manches par defaut (DEC-0064).
#
# FAB-1 : onze bonnes reponses distinctes. Les trois propositions de la tache B ont la meme forme
# ("Prenom, parce que ..."), la meme longueur a quelques mots pres, et les deux raisons de jeu sont
# de vraies raisons (la cloche, le tour, une partie finie). CAT-1 : aucune proposition ne se
# reconnait a son ton.
#
# LON-1 et LON-2 : la tache A tient en quinze mots et deux phrases, ce que les deux enfants ont en
# commun et ce qui les distingue dans la premiere, la question dans la seconde.
#
# FOP-R4 (ADR-0086, clause 2) : le debut d'une proposition de la tache B ne departage pas. Des
# raisons de jeu ouvrent sur l'enfant ("parce qu'il a deja eu son tour") comme des raisons tirees de
# ce qu'est l'enfant ("parce qu'il porte des lunettes") ; les deux ouvrent aussi sur "parce que".
# Le sens departage, jamais un mot de tete.
#
# EMC-1 et EMC-8 : tous les enfants sont des personnages nommes, aucun item ne demande a l'enfant
# ce qu'il ressent ou ce qu'il ferait.
#
# EMC-3 : la tache B decrit un enfant ecarte d'un jeu, une seule fois et sans repetition ni
# violence. Aucun item ne decrit une moquerie repetee ni une exclusion durable, qui sont la ligne
# EMC-CP-03. A juger par nadia-prof si la tache B est trop proche de cette ligne.
#
# EMC-5 : chaque raison de jeu est sans ambiguite (aucune ne peut passer pour un pretexte), et la
# raison tiree d'une difference n'est jamais valable.
#
# EMC-10 : aucun nom de personne reelle. Prenoms fictifs repris des paquets voisins du CP.
#
# CYC-1 : a confronter par nadia-prof a cp-emc-permis-interdit.yaml et a cp-emc-exclusion.yaml
# (memes personnages, aucune situation reprise).
#
# TYP-1 (ADR-0067) : chaque enonce pose l'espace insecable devant son "?" final.
items:
  - enonce: "Léa et Tom sont dans la même classe : Léa lit, Tom dessine. Qu'est-ce qui change ?"
    bonneReponse: "ce qu'ils font"
    distracteurs: ["leur classe", "leur école"]
    indice: "Ils sont ensemble dans la classe, cela ne change pas."
  - enonce: "Aya et Malo habitent la même rue : Aya parle doucement, Malo fort. Qu'est-ce qui change ?"
    bonneReponse: "leur façon de parler"
    distracteurs: ["leur rue", "leur ville"]
    indice: "La rue et la ville sont les mêmes pour les deux."
  - enonce: "Hugo et Lina jouent en équipe : Hugo est grand, Lina petite. Qu'est-ce qui change ?"
    bonneReponse: "leur taille"
    distracteurs: ["leur équipe", "leur jeu"]
    indice: "L'équipe et le jeu sont les mêmes pour les deux."
  - enonce: "Tom et Aya jouent ensemble : Tom a des lunettes, Aya non. Qu'est-ce qui change ?"
    bonneReponse: "les lunettes"
    distracteurs: ["leur jeu", "leur récréation"]
    indice: "Ils jouent ensemble, au même jeu, à la même récréation."
  - enonce: "Trois enfants ne peuvent pas jouer au ballon. Pour qui la raison n'est-elle pas juste ?"
    bonneReponse: "Tom, parce qu'il porte des lunettes"
    distracteurs: ["Léa, parce qu'elle est déjà dans l'autre équipe", "Aya, parce que la cloche a sonné"]
    indice: "Cherche la raison qui ne parle pas du jeu."
  - enonce: "Trois enfants ne jouent pas à la corde. Pour qui la raison n'est-elle pas juste ?"
    bonneReponse: "Malo, parce qu'il est plus petit que les autres"
    distracteurs: ["Lina, parce que c'est l'heure de ranger", "Hugo, parce qu'il doit voir la maîtresse"]
    indice: "Une raison juste parle de ce qui se passe, pas de ce qu'est l'enfant."
  - enonce: "Trois enfants ne peuvent pas jouer aux billes. Pour qui la raison n'est-elle pas juste ?"
    bonneReponse: "Aya, parce qu'elle écrit de la main gauche"
    distracteurs: ["Tom, parce qu'il a déjà eu son tour", "Léa, parce qu'elle doit voir la maîtresse"]
    indice: "Une différence n'est pas une raison de laisser quelqu'un de côté."
  - enonce: "Trois enfants ne peuvent pas jouer à chat. Pour qui la raison n'est-elle pas juste ?"
    bonneReponse: "Hugo, parce que sa voix est douce"
    distracteurs: ["Aya, parce que l'équipe est déjà pleine", "Malo, parce que la récréation est finie"]
    indice: "Cherche la raison tirée de ce qu'est l'enfant, pas de ce qui se passe."
  - enonce: "Trois enfants ne peuvent pas jouer à cache-cache. Pour qui la raison n'est-elle pas juste ?"
    bonneReponse: "Lina, parce qu'elle n'aime pas les mêmes jeux que les autres"
    distracteurs: ["Tom, parce que le jeu se joue à quatre", "Aya, parce que c'est l'heure d'aller en classe"]
    indice: "Aucune différence ne donne le droit de laisser quelqu'un de côté."
  - enonce: "Trois enfants ne peuvent pas jouer au loup. Pour qui la raison n'est-elle pas juste ?"
    bonneReponse: "Tom, parce qu'il porte un pull que personne d'autre n'a"
    distracteurs: ["Malo, parce qu'il doit rentrer en classe", "Léa, parce que le jeu est fini"]
    indice: "Une raison juste parle du jeu ou de l'heure."
  - enonce: "Trois enfants ne jouent pas à la marelle. Pour qui la raison n'est-elle pas juste ?"
    bonneReponse: "Aya, parce que ses cheveux sont très longs"
    distracteurs: ["Hugo, parce que c'est le tour de Lina", "Malo, parce qu'il a déjà eu son tour"]
    indice: "Une raison juste vient de ce qui se passe, pas de ce qu'est l'enfant."
