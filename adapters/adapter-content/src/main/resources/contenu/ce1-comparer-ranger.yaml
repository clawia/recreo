# S51-MAT-COMPARER-RANGER (MAT-CE1-02, moitie textuelle, DEC-0110 sections 1 et 5, DEC-0111
# sections 5.1 et 5.4, instance C). Arbitrage prealable de s43 (squad/conformite/ARBITRAGE-
# PREALABLE-s43-mathematiques-ce1-lot-1.md, section 3) : ORD-CE1-1 a ORD-CE1-6, couverture partielle
# nommee sur texte seul. Le verbe "placer sur une ligne graduee" n'est servi par aucun item : aucun
# enonce ne demande de placer un nombre et aucun ne donne la position d'un nombre sur une ligne.
#
# Trois taches dans un paquet, reconnues a la premiere phrase de l'enonce : ranger (20 items, "Range
# du plus petit au plus grand"), comparer (6 items, "Quel signe faut-il mettre entre ..."),
# encadrer (8 items, "Entre quelles deux dizaines / centaines se trouve ..."). Le libelle de
# competence est la mention d'ORD-CE1-5 (DEC-0111 section 5.4, point 7), accentuee ici parce que ce
# champ traverse le port entrant (DEC-0002) et avec l'espace insecable devant le point-virgule
# (ADR-0067).
#
# ORD-CE1-1 : entiers de 0 a 1000, deux a deux distincts dans un item ; plus de la moitie des items
# portent un nombre de trois chiffres ou plus.
#
# ORD-CE1-2 (ranger, RAN-1 a RAN-8 avec RAN-2 a 1000 et RAN-3 a 16 caracteres) : un seul sens, le
# croissant ; deux distracteurs derives des trois nombres, (a) l'ordre decroissant et (b) l'ordre
# obtenu en ne comparant que le chiffre des unites (RAN-4b : les trois chiffres des unites sont deux
# a deux distincts, et (b) ne reproduit ni (a) ni la bonne reponse) ; RAN-5b : 11 items sur 20 ont un
# distracteur qui commence par le meme nombre que la bonne reponse (plancher 10) ; RAN-6 : 9 items
# sur 20 opposent deux nombres de la meme dizaine (plancher 6) ; RAN-7 : l'indice est l'un des trois
# textes surs de RAN-1 et RAN-4, dix mots au plus, jamais la liste ; RAN-8 : vingt triplets distincts.
#
# ORD-CE1-3 (comparer) : deux nombres distincts, trois signes proposes, "=" n'est donc jamais la
# bonne reponse. L'indice est choisi pour son item : "Les centaines sont les memes" seulement quand
# elles le sont, "Compte les chiffres" seulement quand les nombres n'en ont pas autant.
#
# ORD-CE1-4 (encadrer) : l'enonce nomme l'echelle, quatre items a la dizaine et quatre a la centaine ;
# la bonne reponse est un encadrement ("340 et 350"), jamais un complement ; les deux distracteurs
# sont deux autres encadrements de meme largeur, jamais le bon.
#
# ADR-0068 : aucune proposition n'a de valeur numerique lisible (liste de trois nombres, signe,
# encadrement), le paquet est donc declare hors du domaine numerique des garde-fous de rang.
# TYP-1 (ADR-0067) : l'espace devant ":" et "?" est insecable.
