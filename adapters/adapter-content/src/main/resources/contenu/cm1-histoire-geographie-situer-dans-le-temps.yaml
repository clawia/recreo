schema: 1
id: cm1-histoire-geographie-situer-dans-le-temps
type: question
descripteur:
  matiere: "Histoire-géographie"
  niveau: "CM1"
  domaine: "Repères historiques et géographiques"
  competence: "Se repérer dans le temps : situer un fait dans le temps (grande période, siècle ou millénaire), ou remettre des faits dans l'ordre chronologique (référentiel CM1, lignes HG-CM1-01, HG-CM1-02, HG-CM1-07)"
lignesDeReferentiel: ["HG-CM1-01", "HG-CM1-02", "HG-CM1-07"]
#
# S35-CONS-4 (docs/backlog/backlog.md ; DEC-0088 ; avis de faisabilite de s35 de
# theo-archi, section 6). Ce paquet est l'une des quatre entrees issues de la scission de
# bandit-manchot-histoire-geographie-cm1 (S34-CONS-4, decision de grain rendue conjointement par
# camille-po et nadia-prof, ADR-0081) : une entree par tache reellement distincte plutot qu'une par
# ligne de referentiel. Les items ci-dessous sont repris a l'identique (enonce, bonne reponse,
# distracteurs, indice, marqueurs HIS-1/HIS-3) depuis cm1-histoire-geographie.yaml, retire par ce
# commit ; leur genealogie complete (S27-3 a S33-HG-08-12, chaque reserve levee par nadia-prof) vit
# dans l'historique git de ce fichier retire, pas ici. La scission ne cree aucun item neuf, ne
# modifie aucun texte et ne rouvre aucune ligne de referentiel.
#
# Repartition de HG-CM1-07 (dix items) entre cette entree et "Nommer, en histoire", laissee au
# choix de qui execute (S34-CONS-4, nadia-prof ayant verifie que le grain ne change pas quel que
# soit cet arbitrage) : les cinq items ci-dessous relevent d'une tache de situer/ordonner dans le
# temps (marque HIS-1 "ordre", ou restitution d'une date), les cinq autres relevent d'une tache de
# nommer un evenement a partir d'une description (voir cm1-histoire-geographie-nommer-en-histoire.yaml).
items:
  - enonce: "Quelle grande période vient juste après la Préhistoire ?"  # HIS-1: ordre ; HIS-3: ordre des périodes donné par le référentiel (arbitrage s27, section 5, ligne 1)
    bonneReponse: "l'Antiquité"
    distracteurs: ["le Moyen Âge", "l'époque contemporaine"]
    indice: "Repense à l'ordre des grandes périodes que tu as appris."
    ligneDeReferentiel: "HG-CM1-01"
  - enonce: "Quelle grande période vient juste après le Moyen Âge ?"  # HIS-1: ordre ; HIS-3: ordre des périodes donné par le référentiel (arbitrage s27, section 5, ligne 1)
    bonneReponse: "les Temps modernes"
    distracteurs: ["l'Antiquité", "l'époque contemporaine"]
    indice: "Le Moyen Âge se termine, une nouvelle période commence avant l'époque contemporaine."
    ligneDeReferentiel: "HG-CM1-01"
  - enonce: "Quelle grande période vient juste avant l'Antiquité ?"  # HIS-1: ordre ; HIS-3: ordre des périodes donné par le référentiel (arbitrage s27, section 5, ligne 1)
    bonneReponse: "la Préhistoire"
    distracteurs: ["le Moyen Âge", "les Temps modernes"]
    indice: "C'est la période la plus ancienne, avant l'invention de l'écriture."
    ligneDeReferentiel: "HG-CM1-01"
  - enonce: "Quelle grande période vient juste avant les Temps modernes ?"  # HIS-1: ordre ; HIS-3: ordre des périodes donné par le référentiel (arbitrage s27, section 5, ligne 1)
    bonneReponse: "le Moyen Âge"
    distracteurs: ["l'Antiquité", "l'époque contemporaine"]
    indice: "C'est la période des chevaliers et des châteaux forts."
    ligneDeReferentiel: "HG-CM1-01"
  - enonce: "Quelle grande période vient juste après les Temps modernes ?"  # HIS-1: ordre ; HIS-3: ordre des périodes donné par le référentiel (arbitrage s27, section 5, ligne 1)
    bonneReponse: "l'époque contemporaine"
    distracteurs: ["l'Antiquité", "le Moyen Âge"]
    indice: "C'est la période la plus récente, celle dans laquelle nous vivons."
    ligneDeReferentiel: "HG-CM1-01"
  - enonce: "Les hommes préhistoriques peignaient des animaux sur les parois des grottes. À quelle période cela correspond-il ?"  # HIS-1: association ; HIS-3: fait consensuel du programme cycle 3 (art pariétal), famille (a)
    bonneReponse: "la Préhistoire"
    distracteurs: ["l'Antiquité", "le Moyen Âge"]
    indice: "Cette période est la plus ancienne de toutes, bien avant l'invention de l'écriture."
    ligneDeReferentiel: "HG-CM1-01"
  - enonce: "Les gladiateurs combattaient dans de grands amphithéâtres en pierre. À quelle période cela correspond-il ?"  # HIS-1: association ; HIS-3: fait consensuel du programme cycle 3 (amphithéâtres romains), famille (a)
    bonneReponse: "l'Antiquité"
    distracteurs: ["le Moyen Âge", "les Temps modernes"]
    indice: "Pense à Rome et à ses grands monuments de pierre."
    ligneDeReferentiel: "HG-CM1-01"
  - enonce: "Les chevaliers vivaient dans des châteaux forts entourés de douves. À quelle période cela correspond-il ?"  # HIS-1: association ; HIS-3: fait consensuel du programme cycle 3 (châteaux forts médiévaux), famille (a)
    bonneReponse: "le Moyen Âge"
    distracteurs: ["l'Antiquité", "l'époque contemporaine"]
    indice: "Pense aux tournois de chevaliers et aux châteaux forts."
    ligneDeReferentiel: "HG-CM1-01"
  - enonce: "Louis XIV a fait construire le château de Versailles. À quelle période cela correspond-il ?"  # HIS-1: association ; HIS-3: référentiel ligne 6 (Louis XIV et Versailles)
    bonneReponse: "les Temps modernes"
    distracteurs: ["le Moyen Âge", "l'époque contemporaine"]
    indice: "Ce roi règne bien après le Moyen Âge, avant la Révolution française."
    ligneDeReferentiel: "HG-CM1-01"
  - enonce: "Aujourd'hui, nous utilisons souvent un ordinateur ou un téléphone. À quelle période cela correspond-il ?"  # HIS-1: association ; HIS-3: fait consensuel et actuel, famille (a)
    bonneReponse: "l'époque contemporaine"
    distracteurs: ["les Temps modernes", "le Moyen Âge"]
    indice: "C'est la période dans laquelle nous vivons aujourd'hui."
    ligneDeReferentiel: "HG-CM1-01"
  - enonce: "La Révolution française commence en 1789. En quel siècle cela se passe-t-il ?"  # HIS-1: restitution ; HIS-3: date 1789 donnée par le référentiel (ligne 7), conversion en siècle par convention calendaire (XVIIIe siècle = 1701-1800)
    bonneReponse: "le XVIIIe siècle"
    distracteurs: ["le XVIIe siècle", "le XIXe siècle"]
    indice: "Compte les centaines d'années. 1789 se situe entre 1701 et 1800, donc au XVIIIe siècle."
    ligneDeReferentiel: "HG-CM1-02"
  - enonce: "Clovis devient roi des Francs en 481. En quel siècle cela se passe-t-il ?"  # HIS-1: restitution ; HIS-3: date 481 consensuelle, fait canonique du programme scolaire français, famille (a)
    bonneReponse: "le Ve siècle"
    distracteurs: ["le IVe siècle", "le VIe siècle"]
    indice: "481 se situe entre 401 et 500, dans le Ve siècle."
    ligneDeReferentiel: "HG-CM1-02"
  - enonce: "Charlemagne est couronné empereur en 800. En quel siècle cela se passe-t-il ?"  # HIS-1: restitution ; HIS-3: date 800 consensuelle, famille (a)
    bonneReponse: "le VIIIe siècle"
    distracteurs: ["le VIIe siècle", "le IXe siècle"]
    indice: "800 se situe entre 701 et 800, dans le VIIIe siècle."
    ligneDeReferentiel: "HG-CM1-02"
  - enonce: "Jeanne d'Arc participe à la bataille d'Orléans en 1429. En quel siècle cela se passe-t-il ?"  # HIS-1: restitution ; HIS-3: date 1429 consensuelle, famille (a)
    bonneReponse: "le XVe siècle"
    distracteurs: ["le XIVe siècle", "le XVIe siècle"]
    indice: "1429 se situe entre 1401 et 1500, dans le XVe siècle."
    ligneDeReferentiel: "HG-CM1-02"
  - enonce: "Napoléon Bonaparte se fait sacrer empereur en 1804. En quel millénaire cela se passe-t-il ?"  # HIS-1: restitution ; HIS-3: référentiel ligne 8 (sacre de Napoléon en 1804), conversion en millénaire par convention calendaire
    bonneReponse: "le IIe millénaire"
    distracteurs: ["le Ier millénaire", "le IIIe millénaire"]
    indice: "Un millénaire dure mille ans. 1804 se situe entre 1001 et 2000."
    ligneDeReferentiel: "HG-CM1-02"
  - enonce: "Parmi ces trois faits de l'histoire de France, lequel a eu lieu le plus tôt ?"  # HIS-1: ordre ; HIS-3: dates 481, 800 et 1789, consensuelles, famille (a)
    bonneReponse: "Clovis devient roi des Francs, en 481"
    distracteurs: ["le sacre de Charlemagne, empereur, en 800", "la prise de la Bastille, en 1789"]
    indice: "Compare les trois dates : cherche celle qui est arrivée en premier."
    ligneDeReferentiel: "HG-CM1-02"
  - enonce: "Parmi ces trois faits de l'histoire de France, lequel a eu lieu le plus tard ?"  # HIS-1: ordre ; HIS-3: dates 481, 1429 et 1789, consensuelles, famille (a)
    bonneReponse: "la prise de la Bastille, en 1789"
    distracteurs: ["Clovis devient roi des Francs, en 481", "la bataille d'Orléans menée par Jeanne d'Arc, en 1429"]
    indice: "Compare les trois dates : cherche celle qui est arrivée en dernier."
    ligneDeReferentiel: "HG-CM1-02"
  - enonce: "Parmi ces trois faits de l'histoire de France, lequel a eu lieu le plus tôt ?"  # HIS-1: ordre ; HIS-3: dates 800, 1429 et 1598, consensuelles, famille (a)
    bonneReponse: "le sacre de Charlemagne, empereur, en 800"
    distracteurs: ["la bataille d'Orléans menée par Jeanne d'Arc, en 1429", "la signature de l'édit de Nantes, en 1598"]
    indice: "Compare les trois dates : cherche celle qui est arrivée en premier."
    ligneDeReferentiel: "HG-CM1-02"
  - enonce: "Parmi ces trois faits de l'histoire de France, lequel a eu lieu le plus tard ?"  # HIS-1: ordre ; HIS-3: dates 1429, 1643 et 1804, consensuelles, famille (a)
    bonneReponse: "le sacre de Napoléon, empereur, en 1804"
    distracteurs: ["Louis XIV devient roi, en 1643", "la bataille d'Orléans menée par Jeanne d'Arc, en 1429"]
    indice: "Compare les trois dates : cherche celle qui est arrivée en dernier."
    ligneDeReferentiel: "HG-CM1-02"
  - enonce: "Parmi ces trois faits de l'histoire de France, lequel a eu lieu le plus tôt ?"  # HIS-1: ordre ; HIS-3: dates 1598, 1789 et 1804, consensuelles, famille (a)
    bonneReponse: "la signature de l'édit de Nantes, en 1598"
    distracteurs: ["la prise de la Bastille, en 1789", "le sacre de Napoléon, empereur, en 1804"]
    indice: "Compare les trois dates : cherche celle qui est arrivée en premier."
    ligneDeReferentiel: "HG-CM1-02"
  - enonce: "Parmi ces trois événements de la Révolution française, lequel a eu lieu le premier ?"  # HIS-1: ordre ; HIS-3: dates du 14 juillet 1789, du 26 août 1789 et de septembre 1792, faits consensuels
    bonneReponse: "la prise de la Bastille"
    distracteurs: ["la fin de la monarchie", "la Déclaration des droits de l'homme et du citoyen"]
    indice: "Repense à la date du 14 juillet 1789, la plus ancienne des trois."
    ligneDeReferentiel: "HG-CM1-07"
  - enonce: "Quel événement a eu lieu juste après l'abolition des privilèges, la même année 1789 ?"  # HIS-1: ordre ; HIS-3: dates du 4 août et du 26 août 1789, faits consensuels
    bonneReponse: "la Déclaration des droits de l'homme et du citoyen"
    distracteurs: ["la prise de la Bastille", "la fin de la monarchie"]
    indice: "Ce texte est adopté le 26 août, quelques semaines après l'abolition des privilèges du 4 août."
    ligneDeReferentiel: "HG-CM1-07"
  - enonce: "En quelle année commence la Révolution française ?"  # HIS-1: restitution ; HIS-3: référentiel ligne 7, date 1789 consensuelle, famille (a)
    bonneReponse: "en 1789"
    distracteurs: ["en 1804", "en 1598"]
    indice: "C'est aussi l'année de la prise de la Bastille."
    ligneDeReferentiel: "HG-CM1-07"
  - enonce: "Parmi ces trois événements de la Révolution française, lequel a eu lieu le plus tard ?"  # HIS-1: ordre ; HIS-3: référentiel ligne 7, dates 1789 et 1792 consensuelles, famille (a)
    bonneReponse: "la fin de la monarchie"
    distracteurs: ["la prise de la Bastille", "l'abolition des privilèges"]
    indice: "Repense à l'événement de 1792, le plus récent des trois."
    ligneDeReferentiel: "HG-CM1-07"
  - enonce: "Quelle est la date précise de la prise de la Bastille, qui marque le début de la Révolution française ?"  # HIS-1: restitution ; HIS-3: référentiel ligne 7, 14 juillet 1789 consensuelle, famille (a)
    bonneReponse: "le 14 juillet 1789"
    distracteurs: ["le 26 août 1789", "le 4 août 1789"]
    indice: "C'est la date que la France célèbre chaque année comme fête nationale."
    ligneDeReferentiel: "HG-CM1-07"
