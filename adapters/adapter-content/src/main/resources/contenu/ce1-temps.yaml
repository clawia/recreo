    distracteurs: ["passé", "présent"]
    indice: "Ne te fie pas qu'au mot de temps : lis le verbe."
  - enonce: "Yanis a dessiné un grand chat."
    bonneReponse: "passé"
    distracteurs: ["présent", "futur"]
    indice: "Lis le verbe : que dit-il du moment ?"
  - enonce: "Aïcha chante dans la classe."
