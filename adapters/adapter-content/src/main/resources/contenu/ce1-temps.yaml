    distracteurs: ["présent", "futur"]
    indice: "Regarde le verbe, c'est lui qui décide."
  - enonce: "Samir ouvre la porte."
    bonneReponse: "présent"
    distracteurs: ["passé", "futur"]
    indice: "Cherche le verbe et regarde sa fin."
  - enonce: "Demain, Hugo chantera avec la classe."
