# S55-ART-CP-10-PAQUET (ART-CP-10), premier paquet a reproductions. ADR-0104 (T4, T5), DEC-0116.
#
# Trois paires, chacune dans les deux sens : six items. Les textes lus par l'enfant (enonce, texte
# alternatif, indices, explications) sont ceux de nadia-prof, recopies sans changement depuis
# squad/conformite/CHOIX-OEUVRES-s56-art-cp-10.md, section 3. Les paires, les distracteurs et
# l'exactitude des explications sont a elle (S56-ART-CP-10-OEUVRES, conditions B1 a B14 de
# squad/conformite/ARBITRAGE-PREALABLE-s56-instance-b-art-cp-10-et-emc-cm1.md).
#
# Forme (ADR-0104 decision 1) : l'illustration est l'oeuvre de reference, bonneReponse et chaque
# distracteur sont des identifiants de reproduction. Aucun identifiant n'est lu par l'enfant (X1).
#
# Enonce et texte alternatif identiques sur les six items (B2, B8), sans sujet, titre ni artiste
# (CON-5). Chaque oeuvre d'une paire est reference une seule fois (B3). Aucune statuette en
# proposition (B6). nombreDeManches de l'entree de catalogue : strictement inferieur a six (ADR-0023).
#
# TYP-1 (ADR-0067) : l'espace qui precede le point d'interrogation est insecable.
