# S13-3 (DEC-0053, docs/backlog/backlog.md, section "Sprint 13") : arbitrage prealable de
# nadia-prof (squad/conformite/ARBITRAGE-PREALABLE-s13-multiplications-divisions-et-durees-cm1.md,
# section 3, D-1 a D-11), reformulation de D-9 et levee du comptage manuel de D-7 par
# squad/conformite/PORTE-PEDAGOGIQUE-apres-arbitrage-du-2026-08-28.md.
#
# Cinq reserves non bloquantes du Done pedagogique VALIDE SOUS RESERVE du 2026-08-30
# (squad/conformite/FICHE-bandit-manchot-problemes-durees-cm1.md, docs/backlog/backlog.md,
# section "Sprint 22"), levees le 2026-08-30 (s23, lea-dev) : reserve A (item 9), reserve B
# (espace insecable devant "?" sur les 24 enonces), reserve C (espace insecable dans l'instant de
# l'item 8), reserve D (item 15), reserve E (ligne D-9 ci-dessous). Detail a cote de chaque
# condition touchee.
#
# Les deux formes du referentiel (D-1) : les douze premiers items calculent une duree ecoulee
# entre deux instants donnes, les douze suivants calculent un horaire d'arrivee a partir d'un
# instant de depart et d'une duree. Aucune lecture de l'heure seule, aucune conversion d'unite
# seule, aucune recherche de l'heure de depart (exclue par l'arbitrage, section 3.2).
#
# D-2 : un instant s'ecrit en abrege ("10 h 15", "9 h 05"), une duree s'ecrit en toutes lettres
# ("25 minutes", "1 heure 15 minutes") - deux ecritures visiblement differentes, constantes sur
# tout le paquet, jamais melangees dans les trois propositions d'un meme item.
#
# D-6, corrige le 2026-08-29 (nadia-prof, REFUS du 2026-08-29 sur les 48 distracteurs de la
# premiere version : ils deplacaient la bonne reponse d'un ecart constant par bloc de quatre
# items, sans deriver des nombres de chaque item, et l'erreur de base 100 n'apparaissait sur
# aucun des vingt-quatre items). Trois familles, nommees ici, chacune recalculee depuis les
# instants et la duree propres a chaque item - aucun ecart constant, aucune liste fermee :
#   - ERR-INVERSE (calcul d'une duree) : l'enfant intervertit les deux instants (debut moins
#     fin au lieu de fin moins debut), obtient un total negatif, et le corrige en lui ajoutant
#     soixante minutes quel que soit le nombre d'heures reellement separant les deux instants -
#     valeur = 60 - (duree reelle modulo 60).
#   - ERR-INVERSE (horaire d'arrivee) : la duree est soustraite a l'heure de depart au lieu d'y
#     etre ajoutee.
#   - ERR-REPORT (calcul d'une duree) : le report d'une heure entre les deux instants est
#     oublie (le total est incomplet de soixante minutes) ou ajoute en trop (le total compte
#     soixante minutes de trop) - valeur = duree reelle -/+ 60 minutes.
#   - ERR-REPORT (horaire d'arrivee) : le report d'une heure est ajoute en trop (l'heure calculee
#     tombe soixante minutes trop tard), ou l'heure de depart est recopiee telle quelle en
#     reponse, sans que la duree ne soit appliquee.
#   - ERR-BASE100, sur au moins un item de chaque forme, chacune ecrivant une valeur reellement
#     differente de la bonne reponse (AucuneValeurDeProductionNeCoincideAvecUneAutreDansLeMemeItem
#     interdit toute egalite de valeur entre deux propositions d'un meme item, y compris entre
#     deux textes differents qui liraient le meme total) :
#       - item 11 (calcul d'une duree) : l'enfant emprunte cent minutes au lieu de soixante sans
#         retrancher l'heure empruntee ("2 heures 70 minutes" au lieu de "1 heure 30 minutes") -
#         l'heure non retranchee rend ce total reellement different, pas seulement autrement ecrit.
#       - item 14 (horaire d'arrivee) : l'enfant convertit la duree en comptant cent minutes par
#         heure au lieu de soixante ("1 heure 40 minutes" devient 140 dans son calcul, pas 100),
#         puis l'ajoute normalement a l'heure de depart ("10 h 50" au lieu de "10 h 10").
#       - item 9 (calcul d'une duree), ajoute le 2026-08-30 (reserve A du Done pedagogique du
#         2026-08-30) : meme erreur que l'item 11, calculee sur les instants propres de l'item 9
#         (17 h 40 a 18 h 15) - "1 heure 75 minutes" au lieu de "1 heure 35 minutes" - pour que
#         l'ecriture de l'item 11, superieure a 59 minutes, ne soit plus la seule anomalie visible
#         du paquet sur les 72 propositions (D-6, derniere clause). L'autre distracteur de
#         l'item 9 (ERR-INVERSE) est inchange.
# Aucune proposition egale a une autre dans un item.
#
# D-6, item 15 (horaire d'arrivee), reecrit le 2026-08-30 (reserve D) : les deux distracteurs
# passent de ERR-INVERSE (11 h 30) + recopie du depart (13 h 05) - qui rendaient tous deux la
# bonne reponse la plus grande des trois - a ERR-REPORT trop (15 h 40, correction ajoutee en trop)
# et ERR-BASE100 (15 h 20, duree comptee a cent minutes par heure), deux erreurs deja nommees
# ci-dessus. La bonne reponse (14 h 40) devient la plus petite des trois sur cet item, seul
# changement demande par la reserve D : aucun autre item n'est retouche.
#
# D-4 : minutes multiples de 5, un seul item sur les vingt-quatre a ses deux instants sur un
# quart d'heure exact - tres en dessous de la moitie admise.
# D-5 : quinze items sur vingt-quatre (62,5 %) franchissent une heure ronde, entre le tiers et
# les deux tiers demandes ; la duree la plus longue est de 2 heures 10 minutes, sous le plafond
# de cinq heures.
# D-7, remesure le 2026-08-30 apres la reecriture de l'item 15 (reserve D) : vingt-quatre items sur
# vingt-quatre classes - sept fois la plus petite, douze fois intermediaire, cinq fois la plus
# grande (29,2 % / 50,0 % / 20,8 %), a l'interieur des 10 % a 50 % demandes (50,0 % pile n'excede
# pas le seuil, comparaison stricte, meme lecture que cp-soustractions dans le garde-fou). Avant
# la reserve D (2026-08-29) : 25,0 % / 50,0 % / 25,0 %, egalement dans les bornes - la reserve D ne
# devait pas faire sortir D-7 de ses bornes et ne l'a pas fait. Mesure a la main sur les valeurs
# du paquet servi ; la CI remesure elle-meme (ADR-0041, dureeEnMinutes/lireValeur).
# D-8 : chaque enonce tient en deux phrases et dix-huit a vingt-quatre mots, sous le plafond de
# vingt-cinq.
# D-9 (version reformulee du 2026-08-28, corrigee le 2026-08-29 - reserve 2 de nadia-prof :
# l'ancienne phrase attribuait la recette a un garcon) : aucune situation ne suppose un bien, un
# service ou une pratique que tous les enfants n'ont pas chez eux - ecole, cantine, recreation,
# bus, train, bibliotheque, musee, ferme pedagogique, match, film, recette. Prenoms varies, roles
# non stereotypes (le basket et le football sont joues ou regardes par des filles et des garcons,
# la recette est preparee par des filles - Iris, Nour -, jamais associee a une mere ; l'item
# d'Iris se deroule "en classe", corrige le 2026-08-30 (reserve E) pour ne plus preter cette
# precision a l'item de Nour, qui ne l'ecrit pas).
# D-10 : quatre indices distincts pour le calcul de duree, trois distincts pour l'horaire
# d'arrivee, jamais le meme sur tout le paquet.
# D-11 : vingt-quatre items, au-dessus du plancher de vingt. La matiere premiere partielle de
# contenu-repris/quiz/cm1-heure.yml (deux items conformes sur dix) n'est pas reprise : les deux
# items auraient de toute facon du etre integralement reecrits (troisieme distracteur a retirer,
# indice a ajouter, ecriture instant/duree a corriger pour D-2), sans que la reprise ne reduise
# l'effort de redaction sur un paquet de cette taille.
#
# Typographie, corrige le 2026-08-30 (reserve B) : les 24 enonces portent desormais une espace
# insecable (U+00A0) devant leur "?" final, au lieu de l'espace ordinaire d'origine - meme
# caractere que cm1-reperes (REP-6), seul autre paquet du depot a deja poser ce caractere devant un
# signe double. Le choix du caractere pour le reste de la dette du catalogue (espace insecable
# ordinaire U+00A0, insecable etroite U+202F, ou retrait) reste ouvert et route a theo-archi,
# ines-design et sofia-sm (ADR-0067) ; cette correction-ci suit le seul precedent deja ecrit dans
# ce depot plutot que d'en poser un nouveau, et serait a revoir si ce choix se fermait autrement.
# Le cliquet de dette (AucunSigneDoubleNEstDetachableDeSonMotTest, ADR-0067) est mis a jour dans le
# meme commit. Les 3 occurrences des indices ("... pas 100 : compte bien.") ne sont pas dans le
# perimetre de la reserve B (limitee aux 24 enonces) et restent inchangees.
#
# Reserve C (2026-08-30) : l'instant "9 h 10" de l'item 8 se coupait entre son nombre et son unite
# a l'ecran (744 x 551, releve de nadia-prof). Une espace insecable est posee entre "9" et "h" sur
# ce seul cas mesure ; le paquet n'a pas ete balaye pour d'autres occurrences du meme defaut
# (squad/conformite/FICHE-bandit-manchot-problemes-durees-cm1.md, reserve C). Le motif local
# INSTANT de PaquetCm1ProblemesDureesTest tolere desormais U+00A0 a cote de l'espace ordinaire pour
# continuer a lire cet instant.
schema: 1
