schema: 1
id: cp-problemes-additifs
type: question
descripteur:
  matiere: "Mathematiques"
  niveau: "CP"
  domaine: "Nombres et calculs"
  competence: "Resoudre des problemes simples d'addition/soustraction en situation (1 etape)"
items:
  - enonce: "Léa a 3 billes et en gagne 2. Combien en a-t-elle ?"
    bonneReponse: "5"
    distracteurs: ["1", "2"]
    indice: "Elle avait des billes et elle en gagne d'autres : additionne 3 et 2."
  - enonce: "Tom a 4 bonbons et en reçoit 3. Combien en a-t-il ?"
