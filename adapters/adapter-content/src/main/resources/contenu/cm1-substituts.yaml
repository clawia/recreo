#
# S25-SUB-1. Arbitrage prealable de nadia-prof du 2026-08-30, ACCEPTE sous conditions SUB-1 a
# SUB-10 (ARBITRAGE-PREALABLE-s23-huit-candidats-six-de-contenu-seul-et-deux-de-niveau-2.md,
# section 5). Paquet integralement neuf : aucune matiere premiere de contenu-repris/ sur cette
# ligne, recherche deja faite a DEC-0039.
#
# SUB-3 : la ligne du programme dit "pronoms, groupes nominaux", et un paquet qui ne servirait
# qu'une des deux familles ne la couvrirait qu'a moitie. Le substitut interroge est marque
# '# pronom' ou '# groupe nominal' sur chaque item ci-dessous - un marqueur qu'aucun code de
# production ne lit, pose pour que le compte se refasse en lisant le fichier.
#
# SUB-5 : sur les items marques '# SUB-5', le referent n'est PAS le groupe nominal compatible en
# genre et en nombre le plus proche a gauche du substitut. C'est la condition que nadia-prof nomme
# la plus utile du lot - "un enfant qui ne bute jamais sur un referent eloigne n'a jamais
# travaille la competence".
#
# SUB-4, SUB-5 et SUB-6 ne sont pas jugeables par un automate de ce depot : l'accord en genre et
# en nombre d'un groupe nominal francais demande un lexique morphologique qui n'existe pas ici, et
# le masquage du texte est un jugement de sens. nadia-prof les porte a la main, item par item, et
# elle l'a ecrit avant qu'on les lui assigne.
#
items:
  - enonce: "À qui renvoie « Elle » dans ce texte ?"  # pronom, SUB-5
    texteSupport: "Nadia répète son exposé depuis deux semaines. Inès et Lila l'écoutent une dernière fois. Elle monte enfin sur l'estrade."
    bonneReponse: "Nadia"
    distracteurs: ["Inès", "Lila"]
    indice: "Relis la première phrase du texte."
  - enonce: "À qui renvoie « Il » dans ce texte ?"  # pronom, SUB-5
    texteSupport: "Malo arbitre le tournoi depuis le matin. Théo et Rachid gonflent les ballons près du banc. Il siffle enfin le début du match."
    bonneReponse: "Malo"
    distracteurs: ["Théo", "Rachid"]
    indice: "Relis la première phrase du texte."
  - enonce: "À qui renvoie « la gardienne » dans ce texte ?"  # groupe nominal, SUB-5
    texteSupport: "Zoé et Jade arrivent les premières au gymnase. Zoé plonge sans arrêt pour attraper les ballons pendant que Sofia range les plots. La gardienne se relève en souriant."
    bonneReponse: "Zoé"
    distracteurs: ["Jade", "Sofia"]
    indice: "Relis la phrase du milieu."
  - enonce: "À qui renvoie « Ils » dans ce texte ?"  # pronom, SUB-5
    texteSupport: "Théo et Adam remplissent les seaux à la pompe du jardin. Plus loin, les jardiniers taillent la haie. Ils versent l'eau sur les jeunes plants."
    bonneReponse: "Théo et Adam"
    distracteurs: ["les jardiniers", "les jeunes plants"]
    indice: "Relis la première phrase du texte."
  - enonce: "À qui renvoie « le cuisinier » dans ce texte ?"  # groupe nominal, SUB-5
    texteSupport: "Ilan prépare la soupe depuis le début de l'après-midi, aidé par Noé. Tom dresse les assiettes sur le comptoir. Le cuisinier goûte enfin son bouillon."
    bonneReponse: "Ilan"
    distracteurs: ["Noé", "Tom"]
    indice: "Relis la première phrase du texte."
  - enonce: "À qui renvoie « Elle » dans ce texte ?"  # pronom
    texteSupport: "Lila et Jade apportent un roman policier au club de lecture. Manon s'installe près de la fenêtre. Elle ouvre le livre à la première page."
    bonneReponse: "Manon"
    distracteurs: ["Lila", "Jade"]
    indice: "Relis la phrase du milieu."
  - enonce: "À qui renvoie « la cycliste » dans ce texte ?"  # groupe nominal, SUB-5
    texteSupport: "Sofia et Anna s'entraînent chaque mercredi sur la piste. Sofia grimpe la côte sans ralentir tandis que Nadia règle son casque. La cycliste franchit la ligne la première."
    bonneReponse: "Sofia"
    distracteurs: ["Anna", "Nadia"]
    indice: "Relis la phrase du milieu."
  - enonce: "À qui renvoie « Elles » dans ce texte ?"  # pronom, SUB-5
