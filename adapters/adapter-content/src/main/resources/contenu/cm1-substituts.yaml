  - enonce: "À qui renvoie « Il » dans ce texte ?"  # pronom, SUB-5
    texteSupport: "Adam répare la chaîne de son vélo devant l'atelier, aidé par Tom. Yanis gonfle les pneus d'une trottinette. Il repart en roulant tout doucement."
