    distracteurs: ["les grandes du CM2", "les fraisiers"]
    indice: "Relis la première phrase du texte."
  - enonce: "À qui renvoie « le danseur » dans ce texte ?"  # groupe nominal, SUB-5
    texteSupport: "La troupe répète depuis une heure. Enzo enchaîne les sauts au centre du plateau. Malo règle la musique et le danseur salue à la fin du morceau."
