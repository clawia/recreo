  - enonce: "À qui renvoie « la scientifique » dans ce texte ?"  # groupe nominal, SUB-5
    texteSupport: "Le club sciences observe la mare depuis le ponton. Anna note la couleur de l'eau dans son carnet. Lila prépare les tubes et la scientifique annonce ses résultats."
    bonneReponse: "Anna"
    distracteurs: ["Lila", "la mare"]
    indice: "Relis la phrase du milieu."
  - enonce: "À qui renvoie « Elle » dans ce texte ?"  # pronom, SUB-5
    texteSupport: "Léna et Chloé installent le décor du spectacle. Léna accroche les guirlandes pendant que Zoé teste les projecteurs. Elle descend enfin de l'estrade."
