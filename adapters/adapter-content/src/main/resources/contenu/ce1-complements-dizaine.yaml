# MAT-CE1-03, sous-partie "complements a la dizaine pris pour eux-memes" (S38-COMPLEMENTS-DIZAINE).
# Forme unique : a + ? = d, d plus petit multiple de dix strictement superieur a a (CDZ-CE1-1).
# 18 items, chaque complement de 1 a 9 apparait deux fois et les neuf dizaines (10 a 90) sont
# toutes representees (CDZ-CE1-2). Distracteurs : arbitrage de nadia-prof du 2026-09-22, section
# 2.3 (amendement du meme jour) - un distracteur vaut unite(a), remplace par unite(a) - 1 quand
# unite(a) = 5 ; un second distracteur vaut d - a - 1, remplace par d - a + 1 quand unite(a) = 9 ou
# unite(a) = 5. Le rang de la bonne reponse est verifie a la main par nadia-prof sur les neuf
# valeurs de unite(a) dans l'arbitrage : la table est reprise a l'identique ici, chaque valeur deux
# fois, ce qui conserve ses proportions (1/9 plus petite, 4/9 intermediaire, 4/9 plus grande).
