lignesDeReferentiel: ["FRA-CP-04"]
# S26-L4 (DEC-0068 ; ARBITRAGE-PREALABLE-s26-la-voix-est-un-adulte.md, addendum, section 11).
# Clause 2 de la ligne (digraphes ou, oi, ch). Cette ligne ne passe couvert-valide que si S26-L4
# (ce paquet) ET S26-L3 (cp-lettre-du-son) reçoivent toutes deux un verdict VALIDE (addendum,
# section 11.6). cp-le-bon-son.yaml n'est pas touché par ce lot (clause 3, intacte).
#
# Condition de distribution (mot pour mot, addendum section 11.4) : "chacun des trois est réponse
# sur un tiers des items". Quinze items, cinq par digraphe. Compte réel :
#   ou : réponse 5 (33,3 %)   oi : réponse 5 (33,3 %)   ch : réponse 5 (33,3 %)
# Aucun des trois n'est majoritaire ; c'est la répartition qui a rendu les trois nasales de
# cp-le-bon-son à exactement 33,3 % chacune (addendum, section 11.2), reconduite ici mot pour mot.
#
# VOI-7 : l'adulte dit le mot entier, jamais le grapheme isolé - texteAVoixHaute porte toujours le
# mot complet, jamais le digraphe seul.
#
# S29-8 (nadia-prof, ARBITRAGE-PREALABLE-s28-ce-qui-ferme-une-ligne-et-le-prix-des-quatre-lots.md,
# sections 1.2 et 7.2, dette des paquets à voix due depuis s27). Deux défauts corrigés, textes repris
# mot pour mot : l'énoncé répétait la consigne du catalogue, remplacé par un énoncé propre à l'item
# ("Quel groupe de lettres fait ce son ?") ; l'indice demandait à l'adulte de redire le mot
# "doucement", ce que VOI-3 interdit (l'adulte dit le mot d'un seul tenant, à vitesse normale) -
# remplacé par "en entier". Aucune ligne de matrice ne bouge, les items restent couvert-valide.
