# DEGRADE : la lecture de l'heure sur un cadran n'est pas servie, aucune horloge n'est rendue, et l'ordre des mois est deja servi par QLM-CP-13 ; seul le reperage d'une date dans le calendrier l'est, par du texte.
#
# S53-G1-DATES (MAT-CE1-11). Paquet de contenu seul, hors sprint. Arbitrage prealable de nadia-prof,
# conditions CAL-CE1-1 a CAL-CE1-5 (squad/conformite/ARBITRAGE-PREALABLE-s43-mathematiques-ce1-lot-2.md,
# section 4) : couverture partielle nommee, la ligne reste "en cours". Ce paquet ne declare aucune
# conformite pedagogique : le Done est a nadia-prof.
#
# CAL-CE1-1 : uniquement des items de date ; aucun item sur l'ordre ou le nom des mois pris pour eux-
# memes, sur les saisons, sur les jours de la semaine, sur les moments de la journee ni sur une heure.
# CAL-CE1-2 : les quatre formes sont servies, au moins un cinquieme des 25 items chacune (soit 5) :
# (i) nombre de jours d'un mois, 7 items ; (ii) lendemain ou veille d'une date, 7 items, dont 5 au
# changement de mois ; (iii) ordre de trois dates, 5 items ; (iv) date en toutes lettres vers sa forme
# chiffree et l'inverse, 6 items.
# CAL-CE1-3 : calendrier reel, fevrier compte 28 jours et aucun item ne porte sur l'annee bissextile ;
# aucune date fausse, distracteurs compris (jamais un 31 juin, un 31 septembre ni un 32 d'un mois).
# CAL-CE1-4 : aucune date de fete, de rentree ni de vacances (ni 1er janvier, 1er avril, 1er mai, 14
# juillet, 31 octobre, 25 decembre, ni fin d'aout), aucune annee.
# CAL-CE1-5 : les distracteurs sont le nombre de jours d'un mois voisin, la date decalee d'un jour ou
# le mois decale ; trois propositions deux a deux distinctes ; l'indice donne une methode. Rang de la
# bonne reponse sur la forme (i) : 3 hautes (31 jours), 3 intermediaires (30), 1 basse (28).
# LON-CE1-1 et LON-CE1-2 : 20 mots au plus, trois phrases au plus, la derniere est la question.
#
# TYP-1 (ADR-0067) : l'espace qui precede ":" et "?" est insecable.
schema: 1
id: ce1-calendrier-dates
type: question
descripteur:
  matiere: "Mathématiques"
  niveau: "CE1"
  domaine: "Grandeurs et mesures"
  competence: "Lire l'heure sur une horloge (heures, demi-heures, quarts d'heure) et se repérer dans le calendrier (mois, date)"
lignesDeReferentiel: ["MAT-CE1-11"]
items:
  # (i) Nombre de jours d'un mois
  - enonce: "Combien de jours a le mois de janvier ?"
    bonneReponse: "31 jours"
    distracteurs: ["30 jours", "28 jours"]
    indice: "Ferme le poing : les creux comptent 30 jours, les bosses 31."
  - enonce: "Combien de jours a le mois de février ?"
    bonneReponse: "28 jours"
    distracteurs: ["30 jours", "31 jours"]
    indice: "Un seul mois est à part des autres."
  - enonce: "Combien de jours a le mois d'avril ?"
    bonneReponse: "30 jours"
    distracteurs: ["31 jours", "28 jours"]
    indice: "Ferme le poing : les creux comptent 30 jours, les bosses 31."
  - enonce: "Combien de jours a le mois de juillet ?"
    bonneReponse: "31 jours"
    distracteurs: ["30 jours", "28 jours"]
    indice: "Compte les mois sur tes poings, de janvier à juillet."
  - enonce: "Combien de jours a le mois de novembre ?"
    bonneReponse: "30 jours"
    distracteurs: ["31 jours", "28 jours"]
    indice: "Ferme le poing : les creux comptent 30 jours, les bosses 31."
  - enonce: "Combien de jours a le mois de juin ?"
    bonneReponse: "30 jours"
    distracteurs: ["31 jours", "28 jours"]
    indice: "Compte les mois sur tes poings, de janvier à juin."
  - enonce: "Combien de jours a le mois de décembre ?"
    bonneReponse: "31 jours"
    distracteurs: ["30 jours", "28 jours"]
    indice: "Ferme le poing : les creux comptent 30 jours, les bosses 31."
  # (ii) Lendemain ou veille d'une date, y compris au changement de mois
  - enonce: "Quel est le lendemain du 14 mars ?"
    bonneReponse: "le 15 mars"
    distracteurs: ["le 13 mars", "le 15 avril"]
    indice: "Le lendemain, c'est le jour d'après."
  - enonce: "Quelle est la veille du 9 octobre ?"
    bonneReponse: "le 8 octobre"
    distracteurs: ["le 10 octobre", "le 8 novembre"]
    indice: "La veille, c'est le jour d'avant."
  - enonce: "Quel est le lendemain du 31 mai ?"
    bonneReponse: "le 1er juin"
    distracteurs: ["le 1er mai", "le 30 mai"]
    indice: "Pense au dernier jour du mois, puis au mois d'après."
  - enonce: "Quelle est la veille du 1er juin ?"
    bonneReponse: "le 31 mai"
    distracteurs: ["le 30 mai", "le 30 juin"]
    indice: "Pense au dernier jour du mois d'avant."
  - enonce: "Quel est le lendemain du 30 septembre ?"
    bonneReponse: "le 1er octobre"
    distracteurs: ["le 1er septembre", "le 2 octobre"]
    indice: "Pense au dernier jour du mois, puis au mois d'après."
  - enonce: "Quel est le lendemain du 30 juin ?"
    bonneReponse: "le 1er juillet"
    distracteurs: ["le 1er juin", "le 2 juillet"]
    indice: "Pense au dernier jour du mois, puis au mois d'après."
  - enonce: "Quelle est la veille du 1er août ?"
    bonneReponse: "le 31 juillet"
    distracteurs: ["le 30 juillet", "le 31 août"]
    indice: "Pense au dernier jour du mois d'avant."
  # (iii) Ordre de trois dates
  - enonce: "Entre le 28 février, le 3 avril et le 15 mars, quelle date vient la première ?"
    bonneReponse: "le 28 février"
    distracteurs: ["le 3 avril", "le 15 mars"]
    indice: "Compare d'abord les mois, puis les jours."
  - enonce: "Entre le 5 juin, le 20 mai et le 12 juillet, quelle date vient la dernière ?"
    bonneReponse: "le 12 juillet"
    distracteurs: ["le 5 juin", "le 20 mai"]
    indice: "Compare d'abord les mois, puis les jours."
  - enonce: "Entre le 3 octobre, le 27 janvier et le 10 mai, quelle date vient la première ?"
    bonneReponse: "le 27 janvier"
    distracteurs: ["le 3 octobre", "le 10 mai"]
    indice: "Classe les trois dates dans l'ordre du calendrier."
  - enonce: "Entre le 11 avril, le 11 mars et le 11 juin, quelle date vient la dernière ?"
    bonneReponse: "le 11 juin"
    distracteurs: ["le 11 avril", "le 11 mars"]
    indice: "Les jours sont les mêmes, regarde les mois."
  - enonce: "Entre le 6 mai, le 18 mars et le 24 juillet, quelle date est au milieu ?"
    bonneReponse: "le 6 mai"
    distracteurs: ["le 18 mars", "le 24 juillet"]
    indice: "Classe les trois dates dans l'ordre du calendrier."
  # (iv) Date en toutes lettres vers chiffres, et l'inverse
  - enonce: "Écris en chiffres : le vingt et un mai."
    bonneReponse: "le 21 mai"
    distracteurs: ["le 12 mai", "le 21 mars"]
    indice: "Écoute le nombre, puis regarde bien le mois."
  - enonce: "Écris en chiffres : le trente juin."
    bonneReponse: "le 30 juin"
    distracteurs: ["le 13 juin", "le 30 juillet"]
    indice: "Écoute le nombre, puis regarde bien le mois."
  - enonce: "Écris en chiffres : le quatorze avril."
    bonneReponse: "le 14 avril"
    distracteurs: ["le 4 avril", "le 14 août"]
    indice: "Écoute le nombre, puis regarde bien le mois."
  - enonce: "Lis cette date : le 1er juin."
    bonneReponse: "le premier juin"
    distracteurs: ["le onze juin", "le premier juillet"]
    indice: "Dis le jour dans ta tête, puis le mois."
  - enonce: "Lis cette date : le 23 octobre."
    bonneReponse: "le vingt-trois octobre"
    distracteurs: ["le vingt-deux octobre", "le vingt-trois novembre"]
    indice: "Dis le jour dans ta tête, puis le mois."
  - enonce: "Lis cette date : le 12 mars."
    bonneReponse: "le douze mars"
    distracteurs: ["le deux mars", "le douze mai"]
    indice: "Dis le jour dans ta tête, puis le mois."
