# S49-FRA-GRAPHEMES (s49, DEC-0107). Arbitrage prealable de nadia-prof, conditions GRC-CE1-1 a
# GRC-CE1-3 (squad/conformite/ARBITRAGE-PREALABLE-s48-francais-ce1.md, section 3.1) et sept
# conditions transverses TRV-CE1-1 a TRV-CE1-7 (meme source, section 2). Avis de faisabilite de
# theo-archi (squad/rapports/avis-faisabilite-s49-quatre-stories.md, section 6), dont les six
# pieges de fabrication sont repris sans changement par PaquetCe1GraphemesComplexesTest.
#
# Choix non bloquants tranches ici pour avancer (section 8 de l'avis, Q1 et Q2, routes a
# nadia-prof). Reponses recues le 2026-10-03 (FICHE-bandit-manchot-graphemes-complexes-ce1.md,
# premier passage section 5, second passage section 2) :
#   - Q1 : oui, un indice peut nommer des lettres pour dire ou regarder. Ce paquet ne le fait pas
#     ("ecoute le son", "compare les mots" restent generiques) - un choix admis, pas une regle.
#   - Q2 : confirme, la longueur d'une proposition (TRV-CE1-2, "strictement la plus longue") est
#     comptee en lettres.
#
# GRC-CE1-1 : six familles (ain/ein, oin, ien, eil/eille, ill, gn), quatre items chacune sur
# vingt-quatre (16,7 %, au-dessus du dixieme). Aucun grapheme du CP (an, en, on, in, ou, oi, ch)
# n'est jamais la cible ; "oi" (roi) figure seulement en distracteur (famille b, GRC-CE1-3),
# comme la condition l'autorise.
# GRC-CE1-2 : aucune bonne reponse n'appartient au lexique d'exclusion (ville, mille, village,
# tranquille et leurs flexions) - verifie par PaquetCe1GraphemesComplexesTest, mot entier.
# GRC-CE1-3 : chaque distracteur declare sa famille en commentaire ("# GRC-CE1: cible=x;fam=y,z"),
# relue et verifiee par PaquetCe1GraphemesComplexesTest. La famille (a) n'existe que sur les trois
# familles nasales (ain/ein, oin, ien ; piege 4 de l'avis) : douze items nasals sur vingt-quatre,
# chacun porte un distracteur de famille (a), soit 50 % du paquet, au-dessus du tiers exige.
# GRC-CE1-R1 (reserve levee le 2026-10-03, FICHE-bandit-manchot-graphemes-complexes-ce1.md, second
# passage section 4) : "colline", qui revenait sur les quatre items ill, reste sur les items 17 et
# 18 (deux au plus) et est remplace par "ballon" (item 19) et "tulipe" (item 20), aucun des deux ne
# portant le son de "fille" ni n'appartenant au lexique de GRC-CE1-2. Aucun distracteur du paquet ne
# figure plus de deux fois (PaquetCe1GraphemesComplexesTest).
# TRV-CE1-1 a TRV-CE1-7 : niveau CE1, une seule ligne de referentiel (FRA-CE1-01), aucun champ a
# voix haute, trois propositions distinctes par item (la bonne reponse n'est strictement la plus
# longue que sur dix items sur vingt-quatre), un seul mot entre guillemets dans l'enonce portant
# une graphie de la famille cible, le lexique de grammaire de TRV-CE1-4 exclu en mots entiers et
# accentues, un indice present sur chaque item (douze mots au plus, cinq formes distinctes sur le
# paquet, jamais la bonne reponse en mot entier), vingt-quatre items au-dessus du plancher de
# vingt.
# LON-CE1-1 et LON-CE1-2 sont deja tenues par AucunEnonceDeCe1NeDepasseVingtMotsNiTroisPhrasesTest
# (ADR-0101), dette nulle pour ce paquet neuf (chaque enonce compte neuf mots, une seule phrase).
# LON-CE1-5 : chaque proposition est un seul mot, donc au plus six mots et une seule phrase.
#
# Piege 1 de l'avis (lexiques en mots entiers et accentues) : evite par construction, aucun mot du
# lexique de TRV-CE1-4 n'est servi, et le lexique d'exclusion de GRC-CE1-2 est ecrit accentue
# (village, tranquille) dans PaquetCe1GraphemesComplexesTest.
# Piege 2 (indice par sous-chaine) : indiceNeRevelePasLaBonneReponse compare des mots entiers.
# Piege 3 (terminaison -ient) : aucun item ne cible un verbe en -ient ; laisse a nadia-prof.
# Piege 5 (guillemets et point d'interrogation) : « et » encadrent un espace insecable (ADR-0060,
# clause 2) et l'espace qui precede "?" est insecable (TYP-1, ADR-0067) - zero occurrence
# detachable dans ce paquet neuf.
# Piege 6 (titre) : "Le meme son" ne porte pas le niveau et ne reprend pas "Le bon son" (CP).
schema: 1
id: ce1-graphemes-complexes
type: question
