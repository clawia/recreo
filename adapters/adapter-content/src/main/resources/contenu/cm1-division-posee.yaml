#
# POS-1 (squad/conformite/ARBITRAGE-PREALABLE-s28-ce-qui-ferme-une-ligne-et-le-prix-des-quatre-lots.md,
# section 5.4), mention de couverture partielle exigee d'avance par nadia-prof, a reprendre telle
# quelle dans la matrice par camille-po - sans elle, la ligne ne ferme pas :
#   "le resultat atteste le calcul ; la technique posee elle-meme - disposition, retenues, produits
#   partiels - n'est ni montree ni verifiee par le produit."
#
# POS-3 : chaque distracteur correspond a une erreur classique nommee ici plutot que par une liste
# fermee. Quatre familles sont utilisees, deux d'entre elles ajoutees le 2026-09-06 (voir POS-R1
# ci-dessous) pour que la serie ne repose plus sur les deux memes formules sur les onze items :
#   - RETENUE-DIZAINE-OUBLIEE : une retenue oubliee majore le chiffre des dizaines du quotient
#     d'une unite (quotient correct + 10) ; le chiffre des unites du quotient et le reste de la
#     derniere soustraction sont recopies sans etre recalcules.
#   - DIZAINE-DU-QUOTIENT-SOUS-ESTIMEE : la meme lecture du chiffre des dizaines, mais dans l'autre
#     sens - l'enfant s'arrete un cran trop tot sur ce chiffre et minore le quotient d'une unite a
#     cette position (quotient correct - 10) ; le chiffre des unites et le reste sont recopies sans
#     etre recalcules, exactement comme pour RETENUE-DIZAINE-OUBLIEE.
#   - PRODUIT-PARTIEL-MAL-DECALE : un produit partiel non decale d'un rang fait sous-estimer le
#     quotient de deux unites (quotient correct - 2) ; le reste qui en decoule est un autre reste
#     valide (strictement inferieur au diviseur), distinct du reste correct.
#   - CHIFFRE-DES-UNITES-SURESTIME : l'enfant place un chiffre des unites du quotient trop grand
#     d'une unite (quotient correct + 1) ; le reste qui en decoule est un autre reste valide
#     (strictement inferieur au diviseur), distinct du reste correct.
# Les quatre erreurs donnent, par construction, un reste strictement inferieur au diviseur : aucun
# distracteur ne s'elimine par la seule regle "le reste est plus petit que le diviseur" - propriete
# posee le 2026-09-05 (S29-6, POS-R1) et non touchee par cette correction.
# Les deux autres erreurs nommees dans l'arbitrage prealable (squad/conformite/ARBITRAGE-PREALABLE-
# s28-ce-qui-ferme-une-ligne-et-le-prix-des-quatre-lots.md, section 5.4) restent hors de ce paquet :
# "reste superieur au diviseur" est structurellement incompatible avec la propriete du paragraphe
# precedent, et "quotient donne sans reste" reconstituerait, s'il recopiait le quotient correct, le
# defaut releve le 2026-09-04 (le quotient correct visible deux fois sur un item) ; aucune des deux
# n'est utilisee ici.
#
# POS-2 : sur chaque item, le quotient de chaque distracteur a le meme nombre de chiffres que la
# bonne reponse.
#
# POS-R1 (squad/conformite/FICHE-bandit-manchot-division-posee-cm1.md, second audit s29, section 3) :
# correction du 2026-09-06. Le refus portait sur la serie, pas sur un item : les onze items
# fabriquaient toujours le meme couple de distracteurs (quotient + 10, quotient - 2), si bien que la
# bonne reponse etait toujours la valeur du milieu parmi les trois quotients tries, onze fois sur
# onze - un enfant qui presse systematiquement le milieu gagnait sans poser une seule division. Le
# couple de distracteurs a d'abord varie d'item en item entre les quatre erreurs listees ci-dessus,
# de sorte que le rang de la bonne reponse (la plus petite, intermediaire, la plus grande) change
# sur la serie. **Levee le 2026-09-06** (troisieme audit) sur cette forme-la, remplacee ci-dessous
# par POS-R2.
#
# POS-R2 (squad/conformite/FICHE-bandit-manchot-division-posee-cm1.md, troisieme audit s29,
# section 2 ; docs/backlog/backlog.md, story S30-6) : correction du 2026-09-06 (s30). La forme qui
# a leve POS-R1 laissait une regularite plus exploitable que la premiere : sur huit items, le
# distracteur RETENUE-DIZAINE-OUBLIEE ou DIZAINE-DU-QUOTIENT-SOUS-ESTIMEE recopiait toujours le
# reste de la bonne reponse, si bien que la bonne reponse partageait toujours son reste avec un
# distracteur et que le distracteur au reste unique etait toujours faux ; sur les trois items a
# restes egaux, le triplet de quotients etait toujours symetrique (quotient - 10, quotient,
# quotient + 10), si bien que la bonne reponse y etait toujours la valeur du milieu. Un enfant qui
# ecartait systematiquement la proposition au reste unique, ou pressait le milieu quand les trois
# restes se valaient, gagnait 63,6 % des items sans poser une seule division.
#
# Corrige par deux changements de forme, les onze divisions et le reste de la bonne reponse
# inchanges :
#   - sur quatre items (224/6, 213/4, 323/5, 351/6), les deux distracteurs partagent desormais un
#     reste recalcule qui n'est PAS celui de la bonne reponse - c'est elle qui porte alors le reste
#     unique du triplet, l'inverse exact de la regularite refusee. Le couple de distracteurs reste
#     une erreur classique (quotient +/-1 ou +/-2, chiffre des unites ou produit partiel mal poses),
#     seule la valeur du reste recalcule est partagee entre les deux plutot que choisie distincte.
#   - sur un des trois items a restes egaux (234/9), les deux distracteurs recopient toujours le
#     reste (0) mais ne sont plus disposes de part et d'autre de la bonne reponse : les deux
#     quotients (36, 46) sont superieurs a 26, si bien que la bonne reponse y est la plus petite du
#     triplet et non plus la valeur du milieu. Les deux autres items a restes egaux (299/7, 177/2)
#     gardent leur triplet symetrique.
# Sur les quatre items restants a restes distincts (152/8, 215/3, 312/9, 879/7), la forme qui
# partage le reste de la bonne reponse avec un distracteur est conservee inchangee : la propriete
# demandee est que la bonne reponse ne soit pas TOUJOURS du meme cote, pas qu'elle ne le soit
# jamais. Mordu par posR2LaBonneReponseNEstPasToujoursDuCoteDuResteQuiSePartage et
# posR2LesItemsARestesEgauxNeSontPasTousSymetriques.
#
# POS-4 : le diviseur a un seul chiffre sur les onze items, sans exception, et le reste est
# demande a chaque fois. Reste nul sur les items 4 et 6 ; reste non nul sur les neuf autres.
#
# ChaqueJeuDuCatalogueOffrePlusDItemsQueDeManchesTest (DEC-0064) : dix manches exigent au moins
# onze items distincts sans derogation sur nombreDeManches. L'item 11 sert ce seul motif
# technique ; les dix premiers items suffisent deja a POS-1 a POS-4.
items:
  - enonce: "224 ÷ 6 = ?"
    bonneReponse: "37 reste 2"
    distracteurs: ["38 reste 4", "39 reste 4"]
    indice: "Pose la division en colonnes : cherche combien de fois le diviseur entre dans chaque tranche du dividende, et n'oublie pas le reste, toujours plus petit que le diviseur."
