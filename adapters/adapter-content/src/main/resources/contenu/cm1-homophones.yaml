schema: 1
id: cm1-homophones
type: question
descripteur:
  matiere: "Francais"
  niveau: "CM1"
  domaine: "Orthographe et grammaire"
  competence: "Distinguer et utiliser correctement les principaux homophones grammaticaux (et/est, son/sont, a/a...)"
items:
  - enonce: "Il ___ mangé une pomme."
    bonneReponse: "a"
    distracteurs: ["à"]
  - enonce: "Je vais ___ l'école."
    bonneReponse: "à"
    distracteurs: ["a"]
  - enonce: "Papa ___ maman font la cuisine."
    bonneReponse: "et"
    distracteurs: ["est"]
  - enonce: "Le chat ___ noir."
    bonneReponse: "est"
    distracteurs: ["et"]
  - enonce: "Les enfants ___ partis."
    bonneReponse: "sont"
    distracteurs: ["son"]
  - enonce: "Il prend ___ cartable."
    bonneReponse: "son"
    distracteurs: ["sont"]
  - enonce: "Ils ___ un chien."
    bonneReponse: "ont"
    distracteurs: ["on"]
  - enonce: "___ joue dans la cour."
    bonneReponse: "On"
    distracteurs: ["Ont"]
  - enonce: "___ vas-tu ?"
    bonneReponse: "Où"
    distracteurs: ["Ou"]
  - enonce: "Tu veux du thé ___ du café ?"
    bonneReponse: "ou"
    distracteurs: ["où"]
  - enonce: "Pose ton cartable là, à côté du mien."
    bonneReponse: "là"
    distracteurs: ["la"]
  - enonce: "Léa cherche la règle dans sa trousse."
    bonneReponse: "la"
    distracteurs: ["là"]
  - enonce: "Tom avait perdu sa gomme ; il l'a enfin retrouvée ce matin."
    bonneReponse: "l'a"
    distracteurs: ["la"]
  - enonce: "Il la range soigneusement dans son cartable."
    bonneReponse: "la"
    distracteurs: ["l'a"]
  - enonce: "Ce cahier appartient à mon petit frère."
    bonneReponse: "ce"
    distracteurs: ["se"]
  - enonce: "Après la récréation, tous les élèves se rangent devant la porte de la classe."
    bonneReponse: "se"
    distracteurs: ["ce"]
  - enonce: "Regarde ces oiseaux là-bas, sur la branche !"
    bonneReponse: "ces"
    distracteurs: ["ses"]
  - enonce: "Léa range son cahier et ses crayons avant de partir."
    bonneReponse: "ses"
    distracteurs: ["ces"]
  - enonce: "Il fait très froid ce matin, mais le soleil brille quand même."
    bonneReponse: "mais"
    distracteurs: ["mes"]
  - enonce: "J'ai rangé mes affaires avant de partir à l'école."
    bonneReponse: "mes"
    distracteurs: ["mais"]
  - enonce: "Il reste peu de pain dans le placard de la cuisine."
    bonneReponse: "peu"
    distracteurs: ["peut"]
  - enonce: "Même si le ciel est bien dégagé ce matin, il peut encore pleuvoir avant le soir."
    bonneReponse: "peut"
    distracteurs: ["peu"]
