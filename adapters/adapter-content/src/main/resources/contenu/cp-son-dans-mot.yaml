schema: 1
id: cp-son-dans-mot
type: question
descripteur:
  matiere: "Français"
  niveau: "CP"
  domaine: "Langage oral et conscience phonologique"
  competence: "Identifier un son (phonème) dans un mot"
lignesDeReferentiel: ["FRA-CP-03"]
# S26-L2 (DEC-0068 ; squad/conformite/ARBITRAGE-PREALABLE-s26-la-voix-est-un-adulte.md, section 4.2).
# Point ouvert non tranché (routé par sofia-sm à nadia-prof, squad/design/proposition-ines-s26-
# ecran-voix.md, section 6, point 4) : lecture prudente par défaut retenue ici, aucune lettre du
# son cherché n'apparaît dans ce que l'enfant lit (enonce, indice) - seul texteAVoixHaute la porte,
# et l'adulte la prononce en son, jamais en lettre isolée.
#
# VOI-6 : sur l'ensemble du paquet, le son cherché est présent dans le mot sur une part des items
# et absent sur une autre, aucune des deux n'étant majoritaire, et sa position varie quand il est
# présent. Compte réel sur les 12 items : oui = 6, non = 6 (exactement la moitié chacun).
# Position du son quand il est présent (item "oui") : début = 3 (manteau, singe, toupie),
# milieu = 1 (renard), fin = 2 (ballon, souris) - la position n'est jamais constante.
#
# VOI-5 (non gardée par aucun test) : l'adulte n'appuie pas le son cherché, ni accentuation ni
# allongement. Contrepartie : VOI-12, câblée sur consigneAdulte au niveau du catalogue.
#
# S29-8 (nadia-prof, ARBITRAGE-PREALABLE-s28-ce-qui-ferme-une-ligne-et-le-prix-des-quatre-lots.md,
# sections 1.2 et 7.2, dette des paquets à voix due depuis s27 - le pire des cinq défauts mesurés).
# Deux défauts corrigés, textes repris mot pour mot : l'énoncé répétait la consigne du catalogue,
# remplacé par un énoncé propre à l'item ("Entends-tu ce son ?") ; l'indice demandait à l'adulte de
# redire le mot "lentement", quand VOI-3 exige que l'adulte le dise d'un seul tenant, à vitesse
# normale - sur ce paquet précisément, où la compétence est d'entendre un son dans un mot, un mot
# ralenti donne la réponse. Remplacé par "en entier". Aucune ligne de matrice ne bouge, les items
# restent couvert-valide.
items:
  - enonce: "Entends-tu ce son ?"
    bonneReponse: "oui"
    distracteurs: ["non"]
    indice: "Demande à l'adulte de redire le mot en entier, puis écoute bien le son qu'il te demande de chercher."
