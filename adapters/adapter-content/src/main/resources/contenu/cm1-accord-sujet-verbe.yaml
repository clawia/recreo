schema: 1
id: cm1-accord-sujet-verbe
type: question
descripteur:
  matiere: "Français"
  niveau: "CM1"
  domaine: "Orthographe et grammaire"
  competence: "Accorder le verbe avec son sujet (cas fréquents, temps simples : présent, futur, imparfait)"
# S19-3 (FICHE-bandit-manchot-accord-sujet-verbe-cm1.md, docs/backlog/backlog.md) : paquet neuf,
# aucune matiere premiere reutilisable (contenu-repris/textes-trous/cm1-conjugaison.yml teste la
# conjugaison derriere un sujet pronominal colle au verbe, pas l'accord avec un sujet eloigne).
#
# Distinction tenue sur les vingt et un items : le sujet n'est jamais un pronom personnel seul
# immediatement suivi du verbe. Il est soit un groupe nominal ("les enfants du voisin ___"), soit
# un sujet compose ("mon frere et moi ___"), soit separe du verbe par un groupe de mots insere
# ("les enfants, malgre la pluie, ___"). Les trois temps du referentiel (present, futur, imparfait)
# sont chacun representes par sept items.
#
# REFUSE du 2026-08-24 (nadia-prof, FICHE-bandit-manchot-accord-sujet-verbe-cm1.md) : quatre
# motifs corriges dans ce lot, squelette et accords inchanges.
#   - Motif 1 (decisif, largeur) : deux items (futur, verbes longs organiseront/construiront)
#     mettaient le bloc de verdict sous le pli a 744x551 (564,19 px, pli a 551). Verbes remplaces
#     par des formes plus courtes de meme temps et de meme sujet (gagneront, batiront), largeur
#     mesuree avant livraison (voir compte rendu de marc-dev pour la methode).
#   - Motif 2 : la clause finale de chaque indice (comme dans "ils jouent", devient "irons")
#     donnait la reponse en toutes lettres - retiree des vingt et un indices. La methode (sujet,
#     nombre, personne, terminaison ou irregularite) reste ; le resultat s'en va.
#   - Motif 3 : quinze items portaient un troisieme distracteur en -ons/-ions qu'aucun enfant ne
#     choisirait sous un sujet a la troisieme personne (les enfants du voisin jouons). Remplaces
#     par une erreur reellement plausible : un homophone de conjugaison (joue/joues) ou une
#     confusion de temps (voyaient/verront) - jamais un accord avec nous sous un sujet qui ne l'est
#     pas.
#   - Motif 4 : deferler et moudre sont au-dessus du CM1, et l'item "les vagues deferlent
#     doucement" se contredisait (deferler, c'est se briser avec force). Les deux items sont
#     remplaces par un verbe et un sujet neufs, meme structure (GN separe du verbe / GN singulier),
#     meme temps.
#   - Motif 5 (non bloquant, corrige dans le meme geste que le motif 2) : les citations de mots et
#     de terminaisons dans les indices passent des apostrophes droites aux guillemets francais avec
#     espaces insecables, comme SYN-6/SYN-9.
#
# Chaque indice nomme le sujet et le verbe plutot que d'enoncer une regle de personne generale non
# temperee (AucunIndiceNeContreditUnAutreItemDuMemePaquetTest, ne du refus de nadia-prof sur
# cm1-conjugaison-present le 2026-08-10, cliquet a zero).
#
# Sur chaque item, au moins un distracteur est la forme correcte du meme verbe a un autre nombre ou
# une autre personne que le sujet reel - une erreur d'accord, jamais une erreur de temps.
items:
  - enonce: "Les enfants du voisin ___ dans le jardin tous les après-midis."
    bonneReponse: "jouent"
    distracteurs: ["joue", "joues"]
    indice: "Le sujet est « les enfants du voisin », au pluriel : le verbe « jouer » se termine par « -ent »."
  - enonce: "Le chat de ma grand-mère, malgré son âge, ___ encore sur le mur du jardin."
    bonneReponse: "grimpe"
    distracteurs: ["grimpent", "grimpes"]
    indice: "Le sujet est « le chat de ma grand-mère », au singulier : le verbe « grimper » se termine par « -e »."
  - enonce: "Mon frère et moi ___ tous les mercredis au foot."
    bonneReponse: "jouons"
    distracteurs: ["joue", "jouent"]
    indice: "Le sujet est « mon frère et moi », c'est-à-dire « nous » : le verbe « jouer » se termine par « -ons »."
  - enonce: "Les élèves de la classe, après la récréation, ___ leur cahier de mathématiques."
    bonneReponse: "rangent"
    distracteurs: ["range", "ranges"]
    indice: "Le sujet est « les élèves de la classe », au pluriel : le verbe « ranger » se termine par « -ent »."
  - enonce: "Toi et ton frère ___ la vaisselle après le repas."
    bonneReponse: "lavez"
    distracteurs: ["lave", "laviez"]
    indice: "Le sujet est « toi et ton frère », c'est-à-dire « vous » : le verbe « laver » se termine par « -ez »."
  - enonce: "Le vieux chêne du parc ___ de l'ombre sur tout le banc."
    bonneReponse: "offre"
    distracteurs: ["offrent", "offres"]
    indice: "Le sujet est « le vieux chêne du parc », au singulier : le verbe « offrir » se termine par « -e »."
  - enonce: "Les feuilles des arbres, malgré le vent, ___ encore accrochées aux branches."
    bonneReponse: "restent"
    distracteurs: ["reste", "resteront"]
    indice: "Le sujet est « les feuilles des arbres », au pluriel : le verbe « rester » se termine par « -ent »."
  - enonce: "Demain, les enfants du quartier ___ un grand tournoi de football."
    bonneReponse: "gagneront"
    distracteurs: ["gagnera", "gagnent"]
    indice: "Le sujet est « les enfants du quartier », au pluriel : au futur, le verbe « gagner » se termine par « -ont »."
  - enonce: "La semaine prochaine, mon cousin et moi ___ à la piscine tous les jours."
    bonneReponse: "irons"
    distracteurs: ["ira", "iront"]
    indice: "Le sujet est « mon cousin et moi », c'est-à-dire « nous » : au futur, le verbe « aller » est irrégulier."
  - enonce: "Bientôt, les hirondelles, comme chaque année, ___ vers les pays chauds."
    bonneReponse: "partiront"
    distracteurs: ["partira", "partaient"]
    indice: "Le sujet est « les hirondelles », au pluriel : au futur, le verbe « partir » se termine par « -ont »."
  - enonce: "L'année prochaine, toi et tes amis ___ dans une nouvelle école."
    bonneReponse: "entrerez"
    distracteurs: ["entrera", "entreront"]
    indice: "Le sujet est « toi et tes amis », c'est-à-dire « vous » : au futur, le verbe « entrer » se termine par « -ez »."
  - enonce: "Dans quelques minutes, le train de Paris ___ en gare."
    bonneReponse: "arrivera"
    distracteurs: ["arriveront", "arrivait"]
    indice: "Le sujet est « le train de Paris », au singulier : au futur, le verbe « arriver » se termine par « -a »."
  - enonce: "Cet été, mes cousins ___ une cabane au fond du jardin."
    bonneReponse: "bâtiront"
    distracteurs: ["bâtira", "bâtissent"]
    indice: "Le sujet est « mes cousins », au pluriel : au futur, le verbe « bâtir » se termine par « -ont »."
  - enonce: "Dans deux jours, le chien des voisins ___ un nouveau panier."
    bonneReponse: "aura"
    distracteurs: ["auront", "avait"]
    indice: "Le sujet est « le chien des voisins », au singulier : au futur, le verbe « avoir » est irrégulier."
  - enonce: "Autrefois, les paysans du village ___ leurs champs à la main."
    bonneReponse: "labouraient"
    distracteurs: ["labourait", "laboureront"]
    indice: "Le sujet est « les paysans du village », au pluriel : à l'imparfait, le verbe « labourer » se termine par « -aient »."
  - enonce: "Quand j'étais petit, mon frère et moi ___ ensemble dans la même chambre."
    bonneReponse: "dormions"
    distracteurs: ["dormait", "dormaient"]
    indice: "Le sujet est « mon frère et moi », c'est-à-dire « nous » : à l'imparfait, le verbe « dormir » se termine par « -ions »."
  - enonce: "Chaque hiver, les habitants de la vallée ___ beaucoup de neige."
    bonneReponse: "voyaient"
    distracteurs: ["voyait", "verront"]
    indice: "Le sujet est « les habitants de la vallée », au pluriel : à l'imparfait, le verbe « voir » se termine par « -aient »."
  - enonce: "Avant les vacances, toi et ta sœur ___ tous les soirs à la bibliothèque."
    bonneReponse: "alliez"
    distracteurs: ["allait", "allaient"]
    indice: "Le sujet est « toi et ta sœur », c'est-à-dire « vous » : à l'imparfait, le verbe « aller » se termine par « -iez »."
  - enonce: "Il y a longtemps, le vieux tracteur du fermier ___ encore dans le champ."
    bonneReponse: "roulait"
    distracteurs: ["roulaient", "roulera"]
    indice: "Le sujet est « le vieux tracteur du fermier », au singulier : à l'imparfait, le verbe « rouler » se termine par « -ait »."
  - enonce: "Autrefois, les enfants, même les jours de pluie, ___ dehors après l'école."
    bonneReponse: "jouaient"
    distracteurs: ["jouait", "joueront"]
    indice: "Le sujet est « les enfants », au pluriel : à l'imparfait, le verbe « jouer » se termine par « -aient »."
  - enonce: "Quand j'étais au CP, mes amis et moi ___ toujours les premiers dans la cour."
    bonneReponse: "étions"
    distracteurs: ["était", "étaient"]
    indice: "Le sujet est « mes amis et moi », c'est-à-dire « nous » : à l'imparfait, le verbe « être » est irrégulier."
