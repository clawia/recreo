# MAT-CE1-03, sous-partie "moities" (S38-MOITIES).
# 21 items, n pair, 0 % de cas degenere (n = 0, MOI-CE1-1 : au plus 5 %, sans plancher, donc 0 %
# est conforme). Repartition par forme (MOI-CE1-2) : 9 items de repertoire de base (2 a 20,
# 42,9 %, bande 30-50 %), 5 items de nombre rond (30 a 100, 23,8 %, bande 15-30 %), 7 items de
# deux chiffres general (22 a 98 pair hors multiples de dix, 33,3 %, bande 15-35 %).
# Distracteurs (arbitrage de nadia-prof du 2026-09-22, section 3.4) : le double, la moitie plus
# un, la moitie moins un. Avec seulement ces trois formules, la bonne reponse ne peut jamais etre
# la plus grande des trois propositions (le double la depasse toujours) : pour que le rang de la
# bonne reponse ne soit pas predictible sur le paquet (LeRangDeLaBonneReponseNEstPasPredictibleSur
# UnPaquetTest), un tiers des items associe la moitie moins un a la moitie moins deux (au lieu du
# double), qui reste une erreur de decompte identifiable - la meme famille que celle deja retenue
# pour les complements a la dizaine - et rend la bonne reponse la plus grande des trois. Les deux
# autres tiers utilisent le double avec la moitie plus un (bonne reponse la plus petite) ou la
# moitie plus un avec la moitie moins un (bonne reponse intermediaire). Sept items par rang sur
# les vingt et un, soit 33,3 % chacun : au-dessus du plancher de 10 %, loin du plafond de
# majorite a 50 %.
