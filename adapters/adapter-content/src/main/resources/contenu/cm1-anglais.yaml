schema: 1
id: cm1-anglais
type: question
descripteur:
  matiere: "Langues vivantes (anglais)"
  niveau: "CM1"
  domaine: "Lire et comprendre ; découverte culturelle"
  competence: "Ouvre la ligne lire et comprendre des mots et expressions familiers du référentiel Langues vivantes (anglais) CM1, et sert en français la ligne découverte culturelle (lignes LVE-CM1-04 et LVE-CM1-07)"
lignesDeReferentiel: ["LVE-CM1-04", "LVE-CM1-07"]
#
# S28-3 (backlog S28-3 ; ARBITRAGE-PREALABLE-s28-ce-qui-ferme-une-ligne-et-le-prix-des-quatre-lots.md,
# sections 5.3 et 6). Premier paquet d'anglais CM1, matiere neuve du produit, reporte de s27 a s28 par
# DEC-0072. Lot textuel (aucune illustration) : REC-1 a REC-4 ne s'appliquent donc pas (elles ne
# valent que sur un lot illustre) ; un lot illustre aurait porte le sprint a 5,5, que nadia-prof
# decline par ecrit.
#
# ANG-4 (nadia-prof, 2026-09-03) : le lot declare ses champs lexicaux et en couvre au moins trois,
# cinq mots chacun au minimum. Trois champs sont couverts ici, cinq mots chacun :
#   - la personne et la vie quotidienne : house, dog, friend, morning, bedroom (5 items)
#   - l'environnement geographique et urbain : street, bridge, hill, town, field (5 items)
#   - l'imaginaire : witch, castle, fairy, king, ghost (5 items)
# Total ligne LVE-CM1-04 : 15 items, au-dessus du plancher de dix de FER-2.
#
# ANG-5 (nadia-prof, 2026-09-03) : la reponse attendue est un mot seul, jamais une forme grammaticale
# que le lot n'enseigne pas (pluriel, conjugaison, determinant variable). Tous les mots ci-dessous
# sont des noms communs au singulier, sans article.
#
# REC-5 (aucun mot transparent en bonne reponse) : verifie mot par mot a la redaction. Aucun des
# quinze mots anglais ni des cinq mots francais donnes en bonne reponse n'est identique ou quasi
# identique a son equivalent dans l'autre langue (house/maison, chien/dog, friend/ami, morning/matin,
# bedroom/chambre, street/rue, bridge/pont, hill/colline, town/ville, champ/field, witch/sorciere,
# castle/chateau, fairy/fee, king/roi, fantome/ghost - castle/chateau et fairy/fee ont demande un
# examen, parente etymologique et non graphique, et sont acceptees ; aucune autre paire ne se
# ressemble).
#
# S29-7 (nadia-prof, ANG-R1, ouverte a s28, defaut nomme et REC-5/REC-6 cites dans FICHE-bandit-
# manchot-anglais-cm1.md, section 4 - aucun texte de remplacement n'y etait fourni, correction
# apportee par marc-dev et jugee par nadia-prof en reverification, S29-7 bis) : l'item "montagne"
# donnait "mountain" en bonne reponse, un mot transparent (meme racine, meme silhouette que son
# equivalent francais) qui se devine sans avoir
# jamais appris un mot d'anglais - contrefacon de mesure que REC-5 interdit. Il violait aussi REC-6
# (mountain, huit lettres, etait la plus longue des trois propositions face a des distracteurs de
# quatre et cinq lettres). Remplace par l'item "colline"/"hill", qui garde le champ lexical a cinq
# mots et le triplet homogene.
#
# REC-6 (trois propositions du meme champ lexical et de longueur voisine) : chaque distracteur est
# choisi dans le meme champ que la bonne reponse de son item, jamais dans un autre champ.
#
# Trois sens de traduction (reconduits) : aucune image dans ce lot textuel, donc aucun item
# image -> anglais. Douze items mot francais -> anglais (le sens second, majoritaire ici) et trois
# items anglais -> francais (dog, field, ghost - un par champ, jamais seul sur le paquet, 3/20 = 15 %,
# sous le plafond d'un item sur quatre).
#
# Aucun dispositif ni aucun indice ne demande a un adulte de prononcer un mot d'anglais (reserve du
# 2026-09-02, reconduite) : ce paquet se joue par lecture, sans aucune consigne a l'adulte.
#
# Ligne LVE-CM1-07 (decouverte culturelle, 5 items) : mention exigee d'avance par nadia-prof -
# "découverte culturelle seule, en français ; aucune compétence linguistique n'est servie". BIA-1
# (aucune comparaison d'un pays anglophone a la France en position de norme) et BIA-2 (aucun pays
# represente par un seul trait) : le Royaume-Uni est servi par sa capitale et un monument, les
# Etats-Unis par leur capitale, leur drapeau et une fete traditionnelle - deux et trois traits
# distincts, jamais un seul.
#
# S32-2 (arbitrage prealable de s32, section 7.2 ; docs/backlog/backlog.md, story S32-2). Cinq
# items neufs, tous en francais, aucune competence linguistique servie. Les cinq items existants ne
# sont pas modifies - nadia-prof les a confirmes bons au reaudit du 2026-09-08. Ligne portee de 5 a
# 10 items (FER-2). Les trois elements de la parenthese du referentiel (fetes, lieux, vie
# quotidienne) sont desormais tous servis en bonne reponse : les cinq items de s28 ne couvraient
# que fetes et lieux, "vie quotidienne" n'etait servie par aucun ; deux items neufs la couvrent
# (uniforme scolaire au Royaume-Uni, bus scolaire jaune aux Etats-Unis). Royaume-Uni passe de deux
# a quatre traits, Etats-Unis de trois a six (BIA-2, toujours au moins deux). Chaque bonne reponse
# neuve est distincte des cinq existantes et des quatre autres items neufs (FAB-1a). Aucun item ne
# mentionne la France (BIA-1).
#
# S34-ANG-CORR (2026-09-10, marc-dev, docs/backlog/backlog.md). Leve les quatre reserves non
# bloquantes de LVE-CM1-07 (deja couvert-valide, aucun statut de matrice ne change) confirmees par
# nadia-prof le 2026-09-09 :
#
# ANG-R3 : sur les items du bus a imperiale et de Halloween, les distracteurs n'etaient pas
# ecartables par la seule lecture - ils le sont devenus par accumulation d'indices dans l'enonce
# lui-meme. Le bus a imperiale ne decrit plus l'objet (couleur, nombre d'etages) et propose deux
# autres transports londoniens reels (le metro, le taxi noir) ; Halloween propose deux autres fetes
# americaines d'automne reelles (Thanksgiving, le Labor Day).
#
# ANG-R4 : la question de Halloween etait coupee par une incise de 14 mots entre le sujet et le
# verbe. Reecrite sur le patron de l'item de Thanksgiving ("Quelle fete traditionnelle, celebree fin
# novembre aux Etats-Unis, reunit la famille... ?") : une courte apposition, puis le verbe.
#
# ANG-R5 : l'indice de Londres attribuait a la capitale le nom d'une grande roue (le London Eye),
# qui n'est pas son nom. Remplace par un fait propre a la ville elle-meme.
#
# ANG-R6 : sur le trajet vers l'ecole americaine, "a pied" reste la pratique concurrente reelle des
# zones les plus denses ; "en metro", ecartable d'emblee dans ce contexte, est remplace par "en
# voiture avec un parent", une autre pratique reelle et frequente.
#
# Ce qui ne bouge pas : les dix bonnes reponses, les cinq items confirmes bons au reaudit du
# 2026-09-08, FER-1 et FER-2 (dix items sur la ligne).
items:
  - enonce: "Comment dit-on « maison » en anglais ?"
    bonneReponse: "house"
    distracteurs: ["friend", "morning"]
    indice: "Pense à l'endroit où on habite avec sa famille."
    ligneDeReferentiel: "LVE-CM1-04"
  - enonce: "Que veut dire « dog » en français ?"
    bonneReponse: "chien"
    distracteurs: ["ami", "chambre"]
    indice: "C'est un animal qui aboie et qu'on promène en laisse."
    ligneDeReferentiel: "LVE-CM1-04"
  - enonce: "Comment dit-on « ami » en anglais ?"
    bonneReponse: "friend"
    distracteurs: ["house", "morning"]
    indice: "C'est une personne avec qui on aime jouer et partager."
    ligneDeReferentiel: "LVE-CM1-04"
  - enonce: "Comment dit-on « matin » en anglais ?"
    bonneReponse: "morning"
    distracteurs: ["friend", "bedroom"]
    indice: "C'est le début de la journée, quand on se réveille."
    ligneDeReferentiel: "LVE-CM1-04"
  - enonce: "Comment dit-on « chambre » en anglais ?"
    bonneReponse: "bedroom"
    distracteurs: ["morning", "friend"]
    indice: "C'est la pièce où l'on dort la nuit."
    ligneDeReferentiel: "LVE-CM1-04"
  - enonce: "Comment dit-on « rue » en anglais ?"
    bonneReponse: "street"
    distracteurs: ["bridge", "town"]
    indice: "C'est la voie, bordée de maisons, où l'on marche en ville."
    ligneDeReferentiel: "LVE-CM1-04"
  - enonce: "Comment dit-on « pont » en anglais ?"
    bonneReponse: "bridge"
    distracteurs: ["street", "field"]
    indice: "Cette construction permet de traverser une rivière."
    ligneDeReferentiel: "LVE-CM1-04"
  - enonce: "Comment dit-on « colline » en anglais ?"
    bonneReponse: "hill"
    distracteurs: ["field", "town"]
    indice: "C'est une petite hauteur de terrain, moins haute qu'une montagne."
    ligneDeReferentiel: "LVE-CM1-04"
  - enonce: "Comment dit-on « ville » en anglais ?"
    bonneReponse: "town"
    distracteurs: ["street", "field"]
    indice: "C'est un lieu où vivent beaucoup d'habitants, avec des rues et des maisons."
    ligneDeReferentiel: "LVE-CM1-04"
  - enonce: "Que veut dire « field » en français ?"
    bonneReponse: "champ"
    distracteurs: ["rue", "pont"]
    indice: "C'est un grand terrain cultivé, à la campagne."
    ligneDeReferentiel: "LVE-CM1-04"
  - enonce: "Comment dit-on « sorcière » en anglais ?"
    bonneReponse: "witch"
    distracteurs: ["castle", "ghost"]
    indice: "Dans les contes, ce personnage prépare des potions magiques."
    ligneDeReferentiel: "LVE-CM1-04"
  - enonce: "Comment dit-on « château » en anglais ?"
    bonneReponse: "castle"
    distracteurs: ["witch", "ghost"]
    indice: "C'est une grande construction avec des tours, où vivait un roi."
    ligneDeReferentiel: "LVE-CM1-04"
  - enonce: "Comment dit-on « fée » en anglais ?"
    bonneReponse: "fairy"
    distracteurs: ["king", "ghost"]
    indice: "Dans les contes, ce personnage exauce des vœux avec sa baguette magique."
    ligneDeReferentiel: "LVE-CM1-04"
  - enonce: "Comment dit-on « roi » en anglais ?"
    bonneReponse: "king"
    distracteurs: ["fairy", "ghost"]
    indice: "Dans les contes, ce personnage porte une couronne et gouverne un royaume."
    ligneDeReferentiel: "LVE-CM1-04"
  - enonce: "Que veut dire « ghost » en français ?"
    bonneReponse: "fantôme"
    distracteurs: ["sorcière", "château"]
    indice: "Dans les histoires, ce personnage traverse les murs et fait peur la nuit."
    ligneDeReferentiel: "LVE-CM1-04"
  - enonce: "Quelle est la capitale du Royaume-Uni ?"
    bonneReponse: "Londres"
    distracteurs: ["Berlin", "Madrid"]
    indice: "C'est la plus grande ville du Royaume-Uni, traversée par la Tamise."  # ANG-R5 (S34-ANG-CORR) : l'indice ne cite plus le London Eye, une grande roue, comme si elle portait le nom de la capitale
    ligneDeReferentiel: "LVE-CM1-07"
  - enonce: "Quel monument célèbre, situé à Londres, sert aussi d'horloge ?"
    bonneReponse: "Big Ben"
    distracteurs: ["le Colisée", "la statue de la Liberté"]
    indice: "C'est une tour, avec une cloche, près du Parlement britannique."
    ligneDeReferentiel: "LVE-CM1-07"
  - enonce: "Quelle est la capitale des États-Unis ?"
    bonneReponse: "Washington"
    distracteurs: ["New York", "Los Angeles"]
    indice: "Ce n'est pas la ville la plus peuplée du pays."
    ligneDeReferentiel: "LVE-CM1-07"
  - enonce: "Quel drapeau porte des étoiles et des bandes rouges et blanches ?"
    bonneReponse: "le drapeau des États-Unis"
    distracteurs: ["le drapeau du Canada", "le drapeau de l'Australie"]
    indice: "Il compte une étoile pour chacun des cinquante États."
    ligneDeReferentiel: "LVE-CM1-07"
  - enonce: "Quelle fête traditionnelle, célébrée fin novembre aux États-Unis, réunit la famille autour d'un grand repas ?"
    bonneReponse: "Thanksgiving"
    distracteurs: ["Halloween", "Noël"]
    indice: "Cette fête remercie pour les récoltes de l'année."
    ligneDeReferentiel: "LVE-CM1-07"
  - enonce: "Dans les écoles du Royaume-Uni, que portent la plupart des élèves ?"
    bonneReponse: "un uniforme scolaire"
    distracteurs: ["des vêtements de sport", "aucun vêtement particulier"]
    indice: "Beaucoup d'écoles imposent la même tenue à tous les élèves."
    ligneDeReferentiel: "LVE-CM1-07"
  - enonce: "Quel moyen de transport est un symbole touristique de Londres ?"  # ANG-R3 (S34-ANG-CORR) : l'énoncé ne décrit plus l'objet (couleur, nombre d'étages)
    bonneReponse: "le bus à impériale"
    distracteurs: ["le métro", "le taxi noir"]  # ANG-R3 (S34-ANG-CORR) : deux autres transports londoniens réels
    indice: "Il est célèbre par sa couleur rouge et ses deux niveaux."
    ligneDeReferentiel: "LVE-CM1-07"
  - enonce: "Quelle fête américaine, célébrée le 31 octobre, fait déguiser les enfants pour récolter des bonbons ?"  # ANG-R4 (S34-ANG-CORR) : la question principale n'est plus coupée par une incise, sur le patron de l'item "Quelle fête traditionnelle, célébrée fin novembre aux États-Unis, réunit la famille autour d'un grand repas ?"
    bonneReponse: "Halloween"
    distracteurs: ["Thanksgiving", "le Labor Day"]  # ANG-R3 (S34-ANG-CORR) : deux autres fêtes américaines d'automne réelles
    indice: "Les enfants frappent aux portes en réclamant des friandises."
    ligneDeReferentiel: "LVE-CM1-07"
  - enonce: "Aux États-Unis, dans de nombreuses régions, comment la plupart des élèves se rendent-ils à l'école ?"
    bonneReponse: "en bus scolaire jaune"
    distracteurs: ["à pied", "en voiture avec un parent"]  # ANG-R6 (S34-ANG-CORR) : "à pied" reste la pratique concurrente réelle des zones denses ; "en métro", écartable d'emblée, est remplacé par une autre pratique réelle
    indice: "Ce véhicule est reconnaissable à sa couleur vive."
    ligneDeReferentiel: "LVE-CM1-07"
  - enonce: "Quel monument, une grande statue tenant une torche, se trouve sur une île à l'entrée du port de New York ?"
    bonneReponse: "la statue de la Liberté"
    distracteurs: ["la tour Eiffel", "le Colisée"]
    indice: "Elle est devenue un symbole d'accueil pour de nombreux immigrants."
    ligneDeReferentiel: "LVE-CM1-07"
