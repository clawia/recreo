schema: 1
id: cm1-emc-droit-devoir
type: question
descripteur:
  matiere: "Enseignement moral et civique"
  niveau: "CM1"
  domaine: "Acquérir et partager les valeurs de la République"
  competence: "Distinguer un droit d'un devoir, et connaître quelques droits et devoirs de l'élève et de l'enfant."
lignesDeReferentiel: ["EMC-CM1-07"]
#
# S29-5 (docs/backlog/backlog.md, sprint 29). Second des deux paquets du lot d'EMC CM1, arbitrage
# prealable de nadia-prof
# (squad/conformite/ARBITRAGE-PREALABLE-s29-le-prix-des-quatre-matieres-neuves-et-le-plafond-a-huit-
# lignes.md, sections 4.4 et 5). Referentiel copie conforme
# (squad/programme/enseignement-moral-et-civique/competences-cm1.md, EMC-CM1-07).
#
# Correction du 2026-09-06 (lea-dev, audit de l'instance B, squad/conformite/FICHE-bandit-manchot-droit-devoir-cm1.md,
# commit audite ee3ef70, Done pedagogique REFUSE le 2026-09-05 par nadia-prof) : trois defauts
# corriges dans le meme geste.
# 1) L'item 1 avait deux reponses defendables sur l'axe meme de la ligne ("aller a l'ecole pour
#    apprendre a lire et a compter" keye un droit, un devoir en distracteur, alors que l'education est
#    un droit et l'instruction une obligation, les deux enseignees ensemble au cycle 3). Remplace,
#    sans faire descendre le paquet sous onze items (DEC-0064), par un droit qui ne porte aucune
#    obligation symetrique : jouer et se reposer.
# 2) La troisieme proposition ("une interdiction") etait un decor sur les six items de classement :
#    jamais la bonne reponse, elle etait pressee ou ignoree sans avoir ete lue des le deuxieme item.
#    Retiree : les six items de classement portent desormais deux propositions (un droit contre un
#    devoir), sans troisieme bouton qui ne serait jamais correct.
# 3) Les cinq items de la seconde tache portaient tous sur un droit, jamais sur un devoir, alors que
#    le libelle dit "quelques droits et devoirs" : l'item 4 devient une question sur la raison d'etre
#    du devoir d'ecouter la maitresse et de respecter les regles de la classe (le droit qu'il
#    remplacait, etre protege contre la violence, reste servi par l'item 5 en classement).
#
# FER-1 : les deux notions du libelle sont chacune en bonne reponse - "un droit" (items 1, 5, 9),
# "un devoir" (items 3, 7, 11). Tenue.
#
# FER-3 : deux taches distinctes - classer une situation comme un droit ou un devoir (items 1, 3, 5,
# 7, 9, 11), dire a quoi sert un droit ou un devoir (items 2, 4, 6, 8, 10 - dont un devoir, item 4).
#
# BIA-4 : aucun item n'interroge l'enfant sur sa propre situation - chaque situation porte sur "un
# enfant" ou "un eleve" au general, jamais sur l'enfant qui joue.
#
# HIS-3 (bloquante, chaque fait institutionnel porte sa source) : les cinq droits cites (education,
# protection contre la violence, sante, jeu et repos, expression et ecoute) sont ceux de la Convention
# internationale des droits de l'enfant (CIDE, 1989, ratifiee par la France en 1990) - articles 28
# (education), 19 (protection contre toute forme de violence), 24 (sante), 31 (repos, loisirs, jeu) et
# 12 (droit d'exprimer son opinion et d'etre entendu). Les devoirs cites (ecouter et respecter les
# regles de la classe, faire ses devoirs et apprendre ses lecons, prendre soin du materiel collectif)
# ne viennent pas d'un texte unique : ce sont les devoirs de l'eleve communement enseignes en
# symetrie des droits, tels qu'ils figurent dans un reglement interieur d'ecole type. Ce point est
# signale explicitement pour que nadia-prof le verifie contre sa propre lecture du programme -
# verifie et confirme le 2026-09-05.
#
# EMC-8 : aucun item ne demande a l'enfant de declarer un comportement ("que fais-tu si..."). Chaque
# item porte sur une action generale attribuee a "un enfant" ou "un eleve", jamais sur l'enfant qui
# joue.
#
# EMC-1 : aucun item n'interroge l'enfant sur ce qu'il ressent, vit, croit ou fait chez lui.
#
# EMC-5 : chaque distracteur est nettement hors sujet, aucun item n'a deux reponses defendables.
#
# EMC-10 : aucun item ne nomme une personne reelle vivante, un parti, un syndicat ni une
# organisation.
#
# CYC-1 : verifie contre le lot de CP livre le meme jour (S29-4, cp-emc-regles-de-vie.yaml et
# cp-emc-permis-interdit.yaml) - la ligne CP sur les regles de vie et cette ligne sur les devoirs de
# l'eleve sont complementaires (les regles de classe sont un exemple de devoir), sans contradiction -
# verifie au perimetre du depot par nadia-prof le 2026-09-05, aucune contradiction.
#
# TYP-1 (ADR-0067) : chaque enonce pose l'espace insecable devant son "?" final.
#
# FER-2 : onze items, au-dessus du plancher de dix (DEC-0064, un paquet de fermeture porte
# strictement plus d'items que de manches).
#
# Correction du 2026-09-06 (s30, reprise bloc F, S30-8, squad/conformite/FICHE-bandit-manchot-
# droit-devoir-cm1.md, second audit s29, sections 4 a 6) : trois reserves corrigees dans le meme
# geste.
# - DRO-R1 : trois items d'utilite (ceux qui portaient sur la meme situation qu'un item de
#   classement - ecouter le maitre et respecter les regles, etre soigne, jouer et se reposer)
#   nommaient la categorie a trouver (un devoir, un droit), resolvant l'item de classement associe
#   des qu'un tirage avait deja servi l'autre. Leur enonce ne prononce plus ni "droit" ni "devoir" -
#   la situation qu'ils traitent reste inchangee, seule la formulation de la question change.
# - DRO-R2 (regle etendue par nadia-prof a tout item binaire du depot : sur un item a deux
#   propositions, l'indice porte le critere et jamais la categorie) : l'indice de l'item 1
#   prononcait la categorie ("Ce droit protege...") au lieu du critere ; l'indice de l'item 5
#   employait le mot "droit" dans un autre sens (la permission), signal ambigu. Les deux indices
#   sont reecrits pour ne plus nommer ni employer le mot "droit". Verifie sur les six items
#   binaires du paquet, pas seulement l'item 1 : les items 3, 7, 9 et 11 portaient deja le critere
#   sans nommer la categorie et restent inchanges.
# - DRO-R3 (constat de serie, cout nul) : l'adulte de classe nomme par ce paquet ("la maitresse",
#   items 3 et 4) devient masculin ("le maitre"), une occurrence suffisant a equilibrer la serie de
#   quatre paquets d'EMC ou l'adulte nomme etait une femme dans les quatre occurrences.
items:
  - enonce: "Jouer et se reposer en dehors du travail scolaire, qu'est-ce que c'est pour un enfant ?"
    bonneReponse: "un droit"
    distracteurs: ["un devoir"]
    indice: "C'est quelque chose que chaque enfant peut réclamer pour lui-même, sans que personne ne puisse le lui retirer."
  - enonce: "À quoi sert le droit à l'éducation pour un enfant ?"
    bonneReponse: "à lui permettre d'apprendre et de grandir"
    distracteurs: ["à le récompenser quand il est sage", "à le préparer à un seul métier précis"]
    indice: "L'école sert à apprendre, pas à récompenser un comportement."
  - enonce: "Écouter le maître et respecter les règles de la classe, qu'est-ce que c'est pour un élève ?"
    bonneReponse: "un devoir"
    distracteurs: ["un droit"]
    indice: "C'est ce qu'un élève doit faire pour que la classe fonctionne bien."
  - enonce: "À quoi sert, pour un élève, le fait d'écouter le maître et de respecter les règles de la classe ?"
    bonneReponse: "à ce que chacun puisse apprendre sans être dérangé"
    distracteurs: ["à empêcher les élèves de bouger", "à choisir les élèves les plus sages"]
    indice: "Ce devoir permet à tout le monde de travailler dans le calme."
  - enonce: "Être protégé contre la violence et la maltraitance, qu'est-ce que c'est pour un enfant ?"
    bonneReponse: "un droit"
    distracteurs: ["un devoir"]
    indice: "Aucun adulte, ni personne d'autre, n'est autorisé à faire du mal à un enfant."
  - enonce: "À quoi sert, pour un enfant, le fait d'être soigné quand il est malade ?"
    bonneReponse: "à permettre à chaque enfant d'être soigné, quelle que soit sa famille"
    distracteurs: ["à obliger un enfant à rester à la maison", "à décider de l'école qu'il fréquente"]
    indice: "Ce droit concerne la santé de l'enfant, pas son école."
  - enonce: "Faire ses devoirs et apprendre ses leçons, qu'est-ce que c'est pour un élève ?"
    bonneReponse: "un devoir"
    distracteurs: ["un droit"]
    indice: "C'est ce qu'un élève doit faire pour progresser à l'école."
  - enonce: "À quoi sert, pour un enfant, le fait de jouer et de se reposer ?"
    bonneReponse: "à lui laisser du temps pour grandir en dehors du travail scolaire"
    distracteurs: ["à le dispenser de toute règle", "à remplacer le droit à l'éducation"]
    indice: "Ce droit protège des moments de repos, pas l'absence de toute règle."
  - enonce: "Être soigné quand on est malade ou blessé, qu'est-ce que c'est pour un enfant ?"
    bonneReponse: "un droit"
    distracteurs: ["un devoir"]
    indice: "Chaque enfant peut être soigné, quelle que soit sa famille."
  - enonce: "À quoi sert le droit de donner son avis et d'être écouté ?"
    bonneReponse: "à permettre à l'enfant d'exprimer ce qu'il pense sur ce qui le concerne"
    distracteurs: ["à lui permettre de décider seul à la place des adultes", "à le dispenser d'écouter les autres"]
    indice: "Être écouté ne veut pas dire décider seul."
  - enonce: "Prendre soin du matériel de la classe partagé avec les autres, qu'est-ce que c'est pour un élève ?"
    bonneReponse: "un devoir"
    distracteurs: ["un droit"]
    indice: "C'est ce qu'un élève doit faire pour que le matériel dure pour tous."
