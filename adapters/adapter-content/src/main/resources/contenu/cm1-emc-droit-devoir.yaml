schema: 1
id: cm1-emc-droit-devoir
type: question
descripteur:
  matiere: "Enseignement moral et civique"
  niveau: "CM1"
  domaine: "Acquérir et partager les valeurs de la République"
  competence: "Distinguer un droit d'un devoir, et connaître quelques droits et devoirs de l'élève et de l'enfant."
lignesDeReferentiel: ["EMC-CM1-07"]
#
# S29-5 (docs/backlog/backlog.md, sprint 29). Second des deux paquets du lot d'EMC CM1, arbitrage
# prealable de nadia-prof
# (squad/conformite/ARBITRAGE-PREALABLE-s29-le-prix-des-quatre-matieres-neuves-et-le-plafond-a-huit-
# lignes.md, sections 4.4 et 5). Referentiel copie conforme
# (squad/programme/enseignement-moral-et-civique/competences-cm1.md, EMC-CM1-07).
#
# FER-1 : les deux notions du libelle sont chacune en position de bonne reponse - "un droit" (items
# 1, 5, 9) et "un devoir" (items 3, 7, 11).
#
# FER-3 : deux taches distinctes - classer une situation comme un droit ou un devoir (items impairs),
# associer un droit a ce qu'il protege (items pairs).
#
# BIA-4 : aucun item n'interroge l'enfant sur sa propre situation - chaque situation porte sur "un
# enfant" ou "un eleve" au general, jamais sur l'enfant qui joue.
#
# HIS-3 (bloquante, chaque fait institutionnel porte sa source) : les cinq droits cites (education,
# protection contre la violence, sante, jeu et repos, expression et ecoute) sont ceux de la Convention
# internationale des droits de l'enfant (CIDE, 1989, ratifiee par la France en 1990) - articles 28
# (education), 19 (protection contre toute forme de violence), 24 (sante), 31 (repos, loisirs, jeu) et
# 12 (droit d'exprimer son opinion et d'etre entendu). Les devoirs cites (ecouter et respecter les
# regles de la classe, faire ses devoirs et apprendre ses lecons, prendre soin du materiel collectif)
# ne viennent pas d'un texte unique : ce sont les devoirs de l'eleve communement enseignes en
# symetrie des droits, tels qu'ils figurent dans un reglement interieur d'ecole type. Ce point est
# signale explicitement pour que nadia-prof le verifie contre sa propre lecture du programme.
#
# EMC-8 : aucun item ne demande a l'enfant de declarer un comportement ("que fais-tu si..."). Chaque
# item porte sur une action generale attribuee a "un enfant" ou "un eleve", jamais sur l'enfant qui
# joue.
#
# EMC-1 : aucun item n'interroge l'enfant sur ce qu'il ressent, vit, croit ou fait chez lui.
#
# EMC-5 : chaque distracteur est nettement hors sujet, aucun item n'a deux reponses defendables.
#
# EMC-10 : aucun item ne nomme une personne reelle vivante, un parti, un syndicat ni une
# organisation.
#
# CYC-1 : verifie contre le lot de CP livre le meme jour (S29-4, cp-emc-regles-de-vie.yaml et
# cp-emc-permis-interdit.yaml) - la ligne CP sur les regles de vie et cette ligne sur les devoirs de
# l'eleve sont complementaires (les regles de classe sont un exemple de devoir), sans contradiction.
#
# TYP-1 (ADR-0067) : chaque enonce pose l'espace insecable devant son "?" final. Paquet neuf, aucune
# dette heritee.
#
# FER-2 : onze items, au-dessus du plancher de dix (DEC-0064, un paquet de fermeture porte
# strictement plus d'items que de manches).
items:
  - enonce: "Aller à l'école pour apprendre à lire et à compter, qu'est-ce que c'est pour un enfant ?"
    bonneReponse: "un droit"
    distracteurs: ["un devoir", "une interdiction"]
    indice: "Chaque enfant peut aller à l'école, personne ne peut l'en empêcher."
  - enonce: "À quoi sert le droit à l'éducation pour un enfant ?"
    bonneReponse: "à lui permettre d'apprendre et de grandir"
    distracteurs: ["à le récompenser quand il est sage", "à le préparer à un seul métier précis"]
    indice: "L'école sert à apprendre, pas à récompenser un comportement."
  - enonce: "Écouter la maîtresse et respecter les règles de la classe, qu'est-ce que c'est pour un élève ?"
    bonneReponse: "un devoir"
    distracteurs: ["un droit", "une interdiction"]
    indice: "C'est ce qu'un élève doit faire pour que la classe fonctionne bien."
  - enonce: "À quoi sert le droit d'être protégé contre la violence ?"
    bonneReponse: "à garder chaque enfant en sécurité"
    distracteurs: ["à choisir ses amis à sa place", "à décider seul de ses loisirs"]
    indice: "Ce droit protège le corps et la sécurité de l'enfant."
  - enonce: "Être protégé contre la violence et la maltraitance, qu'est-ce que c'est pour un enfant ?"
    bonneReponse: "un droit"
    distracteurs: ["un devoir", "une interdiction"]
    indice: "Personne n'a le droit de faire du mal à un enfant."
  - enonce: "À quoi sert le droit d'être soigné quand on est malade ?"
    bonneReponse: "à permettre à chaque enfant d'être soigné, quelle que soit sa famille"
    distracteurs: ["à obliger un enfant à rester à la maison", "à décider de l'école qu'il fréquente"]
    indice: "Ce droit concerne la santé de l'enfant, pas son école."
  - enonce: "Faire ses devoirs et apprendre ses leçons, qu'est-ce que c'est pour un élève ?"
    bonneReponse: "un devoir"
    distracteurs: ["un droit", "une interdiction"]
    indice: "C'est ce qu'un élève doit faire pour progresser à l'école."
  - enonce: "À quoi sert le droit de jouer et de se reposer pour un enfant ?"
    bonneReponse: "à lui laisser du temps pour grandir en dehors du travail scolaire"
    distracteurs: ["à le dispenser de toute règle", "à remplacer le droit à l'éducation"]
    indice: "Ce droit protège des moments de repos, pas l'absence de toute règle."
  - enonce: "Être soigné quand on est malade ou blessé, qu'est-ce que c'est pour un enfant ?"
    bonneReponse: "un droit"
    distracteurs: ["un devoir", "une interdiction"]
    indice: "Chaque enfant peut être soigné, quelle que soit sa famille."
  - enonce: "À quoi sert le droit de donner son avis et d'être écouté ?"
    bonneReponse: "à permettre à l'enfant d'exprimer ce qu'il pense sur ce qui le concerne"
    distracteurs: ["à lui permettre de décider seul à la place des adultes", "à le dispenser d'écouter les autres"]
    indice: "Être écouté ne veut pas dire décider seul."
  - enonce: "Prendre soin du matériel de la classe partagé avec les autres, qu'est-ce que c'est pour un élève ?"
    bonneReponse: "un devoir"
    distracteurs: ["un droit", "une interdiction"]
    indice: "C'est ce qu'un élève doit faire pour que le matériel dure pour tous."
