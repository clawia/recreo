# S57-BR-FRA-CE1-21 (s57, palier 4, ecrit par marc-dev ; l'etat de validation est dans la fiche de conformite, squad/conformite/).
# Paquet de saisie : l'enfant ecrit le mot qui manque, et le mot n'est ecrit nulle part a l'ecran avant sa reponse
# (nadia-prof, arbitrage-nadia-palier-4.md 3.1 ; arbitrage-nadia-q05-q10.md 4.3, points 1 a 5).
#
# Les 24 enonces sont reecrits pour la saisie (amendement de la story, critere 9) : en choix parmi trois graphies le sens
# n'avait pas a fermer la phrase, en saisie il le doit. Chaque phrase dit ce que le mot veut dire (un contraire, une
# definition, une reponse, une place dans une suite) pour qu'un seul mot invariable de CE1 la ferme.
# Onze mots de S53 ne se fermaient pas et sont remplaces : souvent, maintenant, alors, pourtant, aussi, vraiment, parfois,
# ensuite, surtout, seulement, ailleurs. Les mots essayes et ecartes pour chaque item sont dans le rapport du lot.
#
# MIV-CE1-1 : vingt-quatre mots cibles distincts, aucun accent (SAI-1 le tolere, mais le point 3 de nadia-prof exclut les
# mots dont l'orthographe tient a un accent). Aucun mot decide par une regle d'une autre ligne (a et a accent grave, et/est,
# m devant m b p, c et c cedille, g/ge/gu).
# MIV-CE1-3 : chaque mot cible est la reponse d'un seul item ; aucun mot cible ne figure dans l'enonce ni dans l'indice
# d'un item, le sien ou un autre. Aucune explication.
# QP1 (backlog, S57-BR-FRA-CE1-21, critere 10) : "aujourd'hui" porte une apostrophe, et un clavier de tablette peut la
# produire en U+2019. NormalisationDeSaisie ne la replie pas ; les deux graphies sont donc ecrites sur l'item
# (formeDeReference en U+0027, formesAcceptees en U+2019). Ce n'est pas une faute d'orthographe du mot.
# TRV-CE1-1 a TRV-CE1-7 (squad/conformite/ARBITRAGE-PREALABLE-s48-francais-ce1.md, section 2) : niveau CE1, une seule ligne
# de referentiel, aucun champ a voix haute ni texteSupport ni illustration, un indice sur chaque item (douze mots au plus,
# jamais la reponse, jamais un renvoi a l'ecoute), plancher de vingt items atteint. La consigne du jeu est l'etiquette du
# champ de saisie : elle dit ce qu'on attend de l'enfant, l'enonce ne le redit pas.
# Les espaces avant ? : ; ! et a l'interieur des guillemets francais sont insecables (ADR-0067, TYP-1).
schema: 1
id: ce1-mots-invariables
type: saisie
descripteur:
  matiere: "Français"
  niveau: "CE1"
  domaine: "Orthographe et grammaire"
  competence: "Orthographier les mots invariables et les mots fréquents étudiés."
lignesDeReferentiel: ["FRA-CE1-21"]
exigenceDeForme: libre
items:
  - enonce: "Le soleil se lève ___ à l'est."
    formeDeReference: "toujours"
    formesAcceptees: []
    indice: "Pense à chaque matin de l'année : aucun ne fait exception."
  - enonce: "« As-tu déjà vu un poisson marcher ? » « Non, ___ ! »"
    formeDeReference: "jamais"
    formesAcceptees: []
    indice: "Pense au mot qui veut dire « pas une seule fois »."
  - enonce: "Hier, c'était lundi, demain ce sera mercredi : ___, c'est mardi."
    formeDeReference: "aujourd'hui"
    formesAcceptees: ["aujourd’hui"]
    indice: "Ce mot dit le jour où nous sommes. Il porte une apostrophe."
  - enonce: "Inès met son manteau parce qu'il fait froid. ___ met-elle son manteau ?"
    formeDeReference: "Pourquoi"
    formesAcceptees: []
    indice: "Pense au mot qui sert à demander la raison."
  - enonce: "Omar marche derrière Mia, donc Mia marche ___ Omar."
    formeDeReference: "devant"
    formesAcceptees: []
    indice: "Pense au contraire de « derrière »."
  - enonce: "On a mis des bonbons à l'intérieur de la boîte : il y a des bonbons ___."
    formeDeReference: "dedans"
    formesAcceptees: []
    indice: "Les bonbons sont à l'intérieur : cherche le mot qui le dit."
  - enonce: "Les enfants sortent de la classe et jouent ___, dans la cour."
    formeDeReference: "dehors"
    formesAcceptees: []
    indice: "Les enfants ne sont pas à l'intérieur, ils sont à l'extérieur."
  - enonce: "Il y a des feuilles ___ : sur le sol, sur les bancs, sur les murs."
    formeDeReference: "partout"
    formesAcceptees: []
    indice: "Pense à tous les endroits de la cour, un par un."
  - enonce: "On a planté des fleurs en cercle ___ de l'arbre : elles l'entourent."
    formeDeReference: "autour"
    formesAcceptees: []
    indice: "Pense à un cercle dessiné tout le tour de l'arbre."
  - enonce: "Léa habite à cent kilomètres de l'école : elle habite ___ de l'école."
    formeDeReference: "loin"
    formesAcceptees: []
    indice: "Pense au contraire d'un endroit tout proche."
  - enonce: "Tom se couche à minuit : il ne se couche pas tôt, il se couche ___."
    formeDeReference: "tard"
    formesAcceptees: []
    indice: "Pense au contraire de « tôt »."
  - enonce: "Chloé lit du début à la fin de la récréation : elle lit ___ la récréation."
    formeDeReference: "pendant"
    formesAcceptees: []
    indice: "Elle lit tout le temps que dure la récréation."
  - enonce: "Il a commencé à pleuvoir ce matin et il pleut encore : il pleut ___ ce matin."
    formeDeReference: "depuis"
    formesAcceptees: []
    indice: "La pluie a commencé ce matin et elle continue."
  - enonce: "Le jour qui vient ___ le mercredi, c'est le mardi."
    formeDeReference: "avant"
    formesAcceptees: []
    indice: "Pense au contraire de « après »."
  - enonce: "Après trois heures d'attente, le train arrive ___ !"
    formeDeReference: "enfin"
    formesAcceptees: []
    indice: "Après une longue attente, on est soulagé : cherche le mot."
  - enonce: "Il ne manque qu'une goutte pour que le verre soit plein : il est ___ plein."
    formeDeReference: "presque"
    formesAcceptees: []
    indice: "Il ne manque qu'une toute petite goutte."
  - enonce: "Je m'appelle Karim. Et toi, ___ t'appelles-tu ?"
    formeDeReference: "Comment"
    formesAcceptees: []
    indice: "Pense au mot qui sert à demander un nom."
  - enonce: "Ce livre coûte six euros. ___ coûte-t-il ?"
    formeDeReference: "Combien"
    formesAcceptees: []
    indice: "Pense au mot qui sert à demander un prix."
  - enonce: "Mon anniversaire est le douze mai. Et toi, ___ est ton anniversaire ?"
    formeDeReference: "Quand"
    formesAcceptees: []
    indice: "Pense au mot qui sert à demander une date."
  - enonce: "Sofia met du sucre dans son thé, Ethan n'en met pas : il boit son thé ___ sucre."
    formeDeReference: "sans"
    formesAcceptees: []
    indice: "Pense au contraire de « avec »."
  - enonce: "Jules n'est pas à l'école, il est ___ lui, dans sa chambre."
    formeDeReference: "chez"
    formesAcceptees: []
    indice: "Pense au mot qui dit « dans la maison de »."
  - enonce: "Le mardi est ___ le lundi et le mercredi."
    formeDeReference: "entre"
    formesAcceptees: []
    indice: "Pense à ce qui est au milieu de deux autres jours."
  - enonce: "Le chat est assis sur le tapis : le tapis est ___ le chat."
    formeDeReference: "sous"
    formesAcceptees: []
    indice: "Pense au contraire de « sur »."
  - enonce: "Il ne reste qu'une goutte d'eau : il y en a ___."
    formeDeReference: "peu"
    formesAcceptees: []
    indice: "Pense au contraire de « beaucoup »."
