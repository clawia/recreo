schema: 1
id: cp-deplacements-quadrillage
type: question
descripteur:
  matiere: "Mathématiques"
  niveau: "CP"
  domaine: "Espace et géométrie"
  competence: "Se repérer et décrire des déplacements sur un quadrillage simple"
lignesDeReferentiel: ["MAT-CP-10"]
#
# S42-MAT-TEXTUEL (docs/backlog/backlog.md, section "Sprint 42"). Terrain 2, instance B de
# nadia-prof (squad/sprints/s42-fusion-six-lignes-deux-instances/planning.md).
#
# Arbitrage prealable deja rendu, cite en entier par la story, aucun arbitrage neuf a router
# (ARBITRAGE-PREALABLE-s32-trois-instances-ma-borne-a-douze-le-terrain-sans-image-et-le-prix-d-une-
# ligne-marginale.md, section 17.7) : decrire un deplacement n'est pas une designation et se sert en
# choix textuel, dans un second paquet distinct de celui qui servira le palier 2 (se reperer et se
# deplacer sur un quadrillage, designation sur un dessin, hors de portee ici). Ce paquet ne couvre
# QUE la moitie "decrire un deplacement". Mention de couverture partielle due au Done pedagogique,
# reprise mot pour mot du critere d'acceptation de la story pour tracabilite - la tenue de la cellule
# 227 de MATRICE-couverture.md reste a camille-po, pas a moi :
# "moitie 'decrire un deplacement' seule, en choix textuel ; la moitie 'se reperer et se deplacer'
# (designation sur quadrillage, palier 2) reste non couverte".
#
# REFUS du Done pedagogique le 2026-09-24 par nadia-prof, instance B (DEC-0098 ;
# squad/conformite/FICHE-bandit-manchot-deplacements-quadrillage-cp.md), sur la version precedente
# de ce paquet. Deux motifs, chacun suffisant : (1) douze items ne posaient jamais de quadrillage et
# se resolvaient par simple substitution du mot de direction deja present dans l'enonce vers
# l'etiquette du geste, sans aucun raisonnement spatial ; (2) deux items decrivaient un etat final
# sans etat initial, non deductible de l'enonce, avec une confusion gauche relative / gauche
# absolue. Correctif applique ici, repris de la fiche : chaque enonce pose une position de depart
# sur une suite de cases numerotees et demande la case d'arrivee apres un deplacement d'une case ;
# la bonne reponse n'est plus jamais l'etiquette du geste deja donnee dans l'enonce, et les indices
# donnent une regle de comptage plutot que de reformuler la direction.
#
# Avis de faisabilite de theo-archi (squad/sprints/s42-fusion-six-lignes-deux-instances/
# avis-faisabilite.md, section 6.3) : la contrainte reelle du lot est LON-1/LON-2 (ADR-0089) - au CP,
# un enonce compte au plus quinze mots et au plus deux phrases, la seconde etant la question. Chaque
# enonce ci-dessous pose la scene en une premiere phrase courte, puis la question en seconde phrase,
# sans texteSupport : mesure a l'ecriture, aucun enonce ne depasse quinze mots.
#
# Aucune condition pedagogique bloquante n'est posee sur cette ligne (meme avis, section 7.5). Les
# quatre formes de deplacement du critere d'acceptation (avancer, reculer, aller a gauche, aller a
# droite) figurent chacune dans l'enonce de trois items ; la bonne reponse et les distracteurs sont
# toujours une case du quadrillage, jamais l'etiquette du geste. Aucun item ne designe une case ou un
# point sur une image : ce paquet ne porte aucune illustration, palier 2 hors de portee ici.
#
# TYP-1 (ADR-0067) : l'espace qui precede le point d'interrogation est insecable.
items:
  - enonce: "Zoé est sur la case 3 et avance d'une case. Où est-elle ?"
    bonneReponse: "la case 4"
    distracteurs: ["la case 2", "la case 3"]
    indice: "Avancer, c'est ajouter une case. Compte bien."
  - enonce: "Malo est sur la case 2 et avance d'une case. Où est-il ?"
    bonneReponse: "la case 3"
    distracteurs: ["la case 1", "la case 2"]
    indice: "Avancer, c'est ajouter une case. Compte bien."
  - enonce: "Nina est sur la case 4 et avance d'une case. Où est-elle ?"
    bonneReponse: "la case 5"
    distracteurs: ["la case 3", "la case 4"]
    indice: "Avancer, c'est ajouter une case. Compte bien."
  - enonce: "Iris est sur la case 4 et recule d'une case. Où est-elle ?"
    bonneReponse: "la case 3"
    distracteurs: ["la case 4", "la case 5"]
    indice: "Reculer, c'est retirer une case. Compte bien."
  - enonce: "Hugo est sur la case 3 et recule d'une case. Où est-il ?"
    bonneReponse: "la case 2"
    distracteurs: ["la case 3", "la case 4"]
    indice: "Reculer, c'est retirer une case. Compte bien."
  - enonce: "Léa est sur la case 2 et recule d'une case. Où est-elle ?"
    bonneReponse: "la case 1"
    distracteurs: ["la case 2", "la case 3"]
    indice: "Reculer, c'est retirer une case. Compte bien."
  - enonce: "Tom est sur la case 4 et va vers la gauche d'une case. Où est-il ?"
    bonneReponse: "la case 3"
    distracteurs: ["la case 4", "la case 5"]
    indice: "Aller à gauche, c'est retirer une case. Compte bien."
  - enonce: "Nour est sur la case 3 et va vers la gauche d'une case. Où est-elle ?"
    bonneReponse: "la case 2"
    distracteurs: ["la case 3", "la case 4"]
    indice: "Aller à gauche, c'est retirer une case. Compte bien."
  - enonce: "Ali est sur la case 2 et va vers la gauche d'une case. Où est-il ?"
    bonneReponse: "la case 1"
    distracteurs: ["la case 2", "la case 3"]
    indice: "Aller à gauche, c'est retirer une case. Compte bien."
  - enonce: "Elsa est sur la case 2 et va vers la droite d'une case. Où est-elle ?"
    bonneReponse: "la case 3"
    distracteurs: ["la case 1", "la case 2"]
    indice: "Aller à droite, c'est ajouter une case. Compte bien."
  - enonce: "Ivan est sur la case 3 et va vers la droite d'une case. Où est-il ?"
    bonneReponse: "la case 4"
    distracteurs: ["la case 2", "la case 3"]
    indice: "Aller à droite, c'est ajouter une case. Compte bien."
  - enonce: "Maya est sur la case 4 et va vers la droite d'une case. Où est-elle ?"
    bonneReponse: "la case 5"
    distracteurs: ["la case 3", "la case 4"]
    indice: "Aller à droite, c'est ajouter une case. Compte bien."
