  niveau: "CE1"
  domaine: "Nombres et calculs"
  competence: "Calcul mental - tables de multiplication de 2, 5 et 10, puis de 3 et 4"
lignesDeReferentiel: ["MAT-CE1-07"]
items:
  - enonce: "2 × 3 = ?"  # TAB-CE1-6: a,b
    bonneReponse: "6"
    distracteurs: ["7", "8"]
    indice: "Table de 2 : additionne le nombre avec lui-même."
