# ADR-0013 obligation 3 : jeu fautif de PaquetCe1TablesMultiplicationTest. Un seul item, dont le
# premier distracteur declare la famille (a) (produit voisin par defaut, a x (b-1)) mais porte une
# valeur fausse : sur le fait (2, 3), la lecture (2, 3) donne 2 x 2 = 4 et la lecture (3, 2) donne
# 3 x 1 = 3 ; ni l'une ni l'autre ne vaut 7. Le calcul depuis le fait doit le refuser.
