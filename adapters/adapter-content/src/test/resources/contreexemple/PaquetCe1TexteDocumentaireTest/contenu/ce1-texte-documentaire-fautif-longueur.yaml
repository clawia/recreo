schema: 1
id: ce1-texte-documentaire-fautif-longueur
type: question
descripteur:
  matiere: "Français"
  niveau: "CE1"
  domaine: "Lecture et compréhension de l'écrit"
  competence: "Comprendre un texte documentaire court ou une consigne écrite, et y prélever une information."
lignesDeReferentiel: ["FRA-CE1-07"]
# ADR-0013 obligation 3 : jeu fautif de PaquetCe1TexteDocumentaireTest pour TRV-CE1-2. La bonne
# reponse est strictement la plus longue, en caracteres, sur deux items de trois.
items:
  - enonce: "Que mange le renard ?"
    texteSupport: "Le renard mange de la viande. Le lapin mange de l'herbe."
    bonneReponse: "de la viande"
    distracteurs: ["de l'herbe", "du pain"]
    indice: "Cherche le mot « renard » dans le texte."
  - enonce: "Où pousse la carotte ?"
    texteSupport: "La carotte pousse sous la terre. La pomme pousse sur un arbre."
    bonneReponse: "sous la terre"
    distracteurs: ["sur un arbre", "dans l'eau"]
    indice: "Cherche le mot « carotte » dans le texte."
  - enonce: "Que mange le lapin ?"
    texteSupport: "Le lapin mange de l'herbe. Le renard mange de la viande."
    bonneReponse: "de l'herbe"
    distracteurs: ["de la viande", "de la soupe"]
    indice: "Cherche le mot « lapin » dans le texte."
