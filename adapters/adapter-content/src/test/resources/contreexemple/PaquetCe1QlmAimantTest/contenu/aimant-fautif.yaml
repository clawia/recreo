schema: 1
id: fautif
type: question
descripteur:
  matiere: "Questionner le monde"
  niveau: "CE1"
  domaine: "Jeu fautif"
  competence: "Jeu fautif du test du paquet de l'aimant."
lignesDeReferentiel: ["QLM-CE1-06"]
#
# Jeu fautif de PaquetCe1QlmAimantTest : chaque item porte en commentaire le marqueur de la sonde qu'il
# met a l'epreuve, dans l'ordre ou les gardes sont ecrites. Les sondes dites 'passe' sont des clauses :
# elles doivent passer. Les sondes tirees d'un texte de nadia-prof ou de theo-archi le disent, avec
# leur source. Aucun item n'est un contenu servi, et chaque item ne vise que la garde qu'il nomme.
items:
  # sonde 01 g1, un objet hors de la liste fermee en A
  - enonce: "Lequel de ces objets l'aimant attire-t-il ?"
    bonneReponse: "la vis"
    distracteurs: ["le papier d'aluminium", "la gomme"]
    indice: "Imagine l'aimant qu'on approche de chaque objet, un par un."
  # sonde 02 g1, un objet hors de la liste fermee dans un groupe de B
  - enonce: "Tous ces objets sont en métal. Dans quel groupe l'aimant attire-t-il les trois objets ?"
    bonneReponse: "clou, vis, aiguille"
    distracteurs: ["clou, épingle, papier d'aluminium", "trombone, épingle, fil de cuivre"]
    indice: "Vérifie un groupe à la fois, objet par objet."
  # sonde 03 g1, un objet de la liste sans son article en A
  - enonce: "Lequel de ces objets l'aimant attire-t-il ?"
    bonneReponse: "clou"
    distracteurs: ["la gomme", "le papier d'aluminium"]
    indice: "Imagine l'aimant qu'on approche de chaque objet, un par un."
  # sonde 04 g1, un groupe de B ecrit avec des articles et un et : deux segments, aucun n'est un objet
  - enonce: "Tous ces objets sont en métal. Dans quel groupe l'aimant attire-t-il les trois objets ?"
    bonneReponse: "le clou, le trombone et l'aiguille"
    distracteurs: ["clou, épingle, papier d'aluminium", "trombone, épingle, fil de cuivre"]
    indice: "Vérifie un groupe à la fois, objet par objet."
  # sonde 05 g1, passe : une apostrophe typographique dans une proposition de A
  - enonce: "Lequel de ces objets l'aimant n'attire-t-il pas ?"
    bonneReponse: "la gomme"
    distracteurs: ["l’épingle", "le clou"]
    indice: "Imagine l'aimant qu'on approche de chaque objet, un par un."
