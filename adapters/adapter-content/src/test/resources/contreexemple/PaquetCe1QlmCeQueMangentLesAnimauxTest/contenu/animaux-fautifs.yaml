lignesDeReferentiel: ["QLM-CE1-02"]
#
# Jeu fautif de PaquetCe1QlmCeQueMangentLesAnimauxTest : chaque item porte en commentaire le marqueur
# de la sonde qu'il met a l'epreuve. Les sondes 03 et 04 sont des clauses : elles doivent passer.
# Les sondes 13 et 14 proposent une paraphrase de categorie (des plantes, de la viande) en tache aliment.
# La sonde 01 ecrit une categorie avec l'apostrophe typographique, voulue.
items:
