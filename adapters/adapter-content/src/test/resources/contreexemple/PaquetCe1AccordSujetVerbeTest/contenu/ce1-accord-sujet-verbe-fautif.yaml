schema: 1
id: ce1-accord-sujet-verbe-fautif
type: question
# ADR-0013 obligation 3 : jeu fautif de PaquetCe1AccordSujetVerbeTest. Le premier item porte
# l'indice retire du paquet par l'arbitrage de s55 (K1 : "joues" a le meme nombre que "joue", le
# nombre seul ne departage pas : TRV-CE1-5). Le second porte un sujet feminin pour une activite de
# courses (K2 : TRV-CE1-6). Le troisieme porte la bonne reponse "va" dans son indice (ACV-CE1-R1 :
# TRV-CE1-5).
descripteur:
  matiere: "Français"
  niveau: "CE1"
  domaine: "Orthographe et grammaire"
  competence: "Accorder le verbe avec son sujet au présent, quand le sujet est un pronom personnel ou un nom placé juste avant le verbe."
lignesDeReferentiel: ["FRA-CE1-14"]
items:
  - enonce: "« jouer » : le chat ___ dans le jardin."
    bonneReponse: "joue"
    distracteurs: ["jouent", "joues"]
    indice: "Regarde le sujet : un seul ou plusieurs ?"
  - enonce: "« aller » : elle ___ au marché."
    bonneReponse: "va"
    distracteurs: ["vont", "vas"]
    indice: "Lis le sujet avec chaque verbe proposé : lequel est le bon ?"
  - enonce: "« aller » : il ___ au marché."
    bonneReponse: "va"
    distracteurs: ["vont", "vas"]
    indice: "Cherche le verbe va avec ce sujet."
