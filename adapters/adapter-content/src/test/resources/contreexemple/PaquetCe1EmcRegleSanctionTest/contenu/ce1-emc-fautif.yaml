    bonneReponse: "à réparer le tort fait"
    distracteurs: ["à changer la règle", "à oublier ce qui s'est passé"]
    indice: "Pense au geste."
  # RSA-CE1-1 tache 2 : reparation
  # TRV-CE1-2 : d, e
  - enonce: "Omar a cassé en sept mots le jouet de Lina. Le maître lui fait le recoller. À quoi sert cette sanction ?"
    bonneReponse: "à réparer ce qu'il a cassé avec soin"
    distracteurs: ["à changer la règle", "à oublier ce qui s'est passé"]
    indice: "Pense au geste."
  # RSA-CE1-1 tache 2 : reparation
  # TRV-CE1-2 : d, e
  - enonce: "Lina a cassé avec un long indice le jouet de Samir. Le maître lui fait le recoller. À quoi sert cette sanction ?"
    bonneReponse: "à réparer le tort fait"
    distracteurs: ["à changer la règle", "à oublier ce qui s'est passé"]
    indice: "Regarde bien le jouet avant et après le geste du maître, puis dis ce qui a changé ici."
  # RSA-CE1-1 tache 2 : reparation
  # TRV-CE1-2 : d, e
  - enonce: "Tom a cassé avec la réponse le jouet de Jade. Le maître lui fait le recoller. À quoi sert cette sanction ?"
    bonneReponse: "à réparer le tort fait"
    distracteurs: ["à changer la règle", "à oublier ce qui s'est passé"]
    indice: "Dis : à réparer le tort fait."
