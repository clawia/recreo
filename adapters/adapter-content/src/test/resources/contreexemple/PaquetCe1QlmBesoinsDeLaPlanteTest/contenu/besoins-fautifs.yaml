#
# Jeu fautif de PaquetCe1QlmBesoinsDeLaPlanteTest : chaque item porte en commentaire le marqueur
# de la sonde qu'il met a l'epreuve. Les sondes 03 et 04 sont des clauses : elles doivent passer.
