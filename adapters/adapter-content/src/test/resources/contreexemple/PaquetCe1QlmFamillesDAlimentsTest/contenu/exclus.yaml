schema: 1
id: fautif
type: question
descripteur:
  matiere: "Questionner le monde"
  niveau: "CE1"
  domaine: "Jeu fautif"
  competence: "Jeu fautif du test du paquet des familles d'aliments."
lignesDeReferentiel: ["QLM-CE1-04"]
#
# Jeu fautif de PaquetCe1QlmFamillesDAlimentsTest : chaque item porte en commentaire le marqueur
# de la sonde qu'il met a l'epreuve. Les sondes dites 'passe' sont des clauses : elles doivent
# passer. La liste ci-dessous est celle de ces sondes, avec une source qui passe le refus d'un
# fichier du depot. Aucun item n'est un contenu servi.
items:
