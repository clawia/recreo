schema: 1
id: fautif
type: question
descripteur:
  matiere: "Questionner le monde"
  niveau: "CE1"
  domaine: "Jeu fautif"
  competence: "Jeu fautif du test du paquet des familles d'aliments."
lignesDeReferentiel: ["QLM-CE1-04"]
#
# Jeu fautif de PaquetCe1QlmFamillesDAlimentsTest : chaque item porte en commentaire le marqueur
# de la sonde qu'il met a l'epreuve. Les sondes dites 'passe' sont des clauses : elles doivent
# passer. La liste ci-dessous est celle de ces sondes, avec une source qui passe le refus d'un
# fichier du depot. Aucun item n'est un contenu servi.
#   aliment pomme de terre : feculents ; source : Alimentarium, Les groupes alimentaires
#   aliment pates : feculents ; source : Alimentarium, Les groupes alimentaires
#   aliment pain : feculents ; source : Alimentarium, Les groupes alimentaires
#   aliment riz : feculents ; source : Alimentarium, Les groupes alimentaires
#   aliment yaourt : produits laitiers ; source : Alimentarium, Les groupes alimentaires
#   aliment fromage : produits laitiers ; source : Alimentarium, Les groupes alimentaires
#   aliment lait : produits laitiers ; source : Alimentarium, Les groupes alimentaires
#   aliment poulet : viande, poisson et oeufs ; source : Alimentarium, Les groupes alimentaires
#   aliment poisson : viande, poisson et oeufs ; source : Alimentarium, Les groupes alimentaires
#   aliment pomme : fruits et legumes ; source : Alimentarium, Les groupes alimentaires
#   aliment banane : fruits et legumes ; source : Alimentarium, Les groupes alimentaires
#   aliment carottes : fruits et legumes ; source : Alimentarium, Les groupes alimentaires
#   aliment gateau : produits sucres ; source : Alimentarium, Les groupes alimentaires
#   aliment confiture : produits sucres ; source : Alimentarium, Les groupes alimentaires
#   aliment chocolat : produits sucres ; source : Alimentarium, Les groupes alimentaires
items:
  # sonde 01 ni classement ni menu
  - enonce: "Lequel de ces aliments est un féculent ?"
    bonneReponse: "les pâtes"
    distracteurs: ["le yaourt", "la pomme"]
    indice: "Pense au riz."
  # sonde 02 une proposition est un aliment
  # FAL-CE1-1 aliment : yaourt
  - enonce: "Dans quelle famille d'aliments se range le yaourt ?"
    bonneReponse: "produits laitiers"
    distracteurs: ["féculents", "le fromage"]
    indice: "Compare-le avec le fromage."
  # sonde 03 aliment absent
  # FAL-CE1-1 aliment : aubergine
  - enonce: "Dans quelle famille d'aliments se range l'aubergine ?"
    bonneReponse: "fruits et légumes"
    distracteurs: ["féculents", "produits laitiers"]
    indice: "Pense à la carotte."
  # sonde 04 bonne reponse hors liste
  # FAL-CE1-1 aliment : yaourt
  - enonce: "Dans quelle famille d'aliments se range le yaourt ?"
    bonneReponse: "féculents"
    distracteurs: ["produits laitiers", "fruits et légumes"]
    indice: "Compare-le avec le fromage."
  # sonde 05 menu, element absent
  - enonce: "La cantine propose trois menus. Lequel est le plus varié ?"
    bonneReponse: "riz, poisson, aubergine, yaourt"
    distracteurs: ["pâtes, pain, poulet, pomme", "pâtes, pain, carottes, fromage"]
    indice: "Compte les familles de chaque menu."
