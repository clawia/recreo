# Le meme paquet neuf, une fois son trou manquant ferme sur le second item : le garde-fou doit le
# laisser passer. Sans cette seconde direction, un garde-fou rouge sur tout aurait l'air de mordre
# sans rien distinguer (lecon d'ADR-0003). Texte de fixture, jamais affiche a un enfant.
schema: 1
id: paquet-a-trous-avec-un-trou-manquant
type: question
descripteur:
  matiere: "Matiere de fixture"
  niveau: "Niveau de fixture"
  domaine: "Domaine de fixture"
  competence: "Competence de fixture"
items:
  - enonce: "Il ___ mange une pomme de fixture."
    bonneReponse: "juste"
    distracteurs: ["faux"]
  - enonce: "Il ___ mange une pomme de fixture aussi."
    bonneReponse: "juste"
    distracteurs: ["faux"]
