schema: 1
id: ce1-negation-fautif-affirmatifs
type: question
descripteur:
  matiere: "Français"
  niveau: "CE1"
  domaine: "Orthographe et grammaire"
  competence: "Passer d'une phrase affirmative à une phrase négative (ne... pas) et inversement."
lignesDeReferentiel: ["FRA-CE1-11"]
# ADR-0013 obligation 3 : jeu fautif de PaquetCe1NegationTest pour NEG-CE1-1. Quatre items vers
# l'affirmative, aucun vers la negative.
items:
  - enonce: "« Zoé ne mange pas la soupe. » Quelle est la phrase affirmative ?"
    bonneReponse: "Zoé mange la soupe."
    distracteurs: ["Zoé ne mange la soupe.", "Zoé mange pas la soupe."]
    indice: "Enlève les petits mots qui disent non."
  - enonce: "« Mia ne dessine pas la maison. » Quelle est la phrase affirmative ?"
    bonneReponse: "Mia dessine la maison."
    distracteurs: ["Mia ne dessine la maison.", "Mia dessine pas la maison."]
    indice: "Enlève les petits mots qui disent non."
  - enonce: "« Rex ne garde pas la maison. » Quelle est la phrase affirmative ?"
    bonneReponse: "Rex garde la maison."
    distracteurs: ["Rex ne garde la maison.", "Rex garde pas la maison."]
    indice: "Enlève les petits mots qui disent non."
  - enonce: "« Tom ne ferme pas la porte. » Quelle est la phrase affirmative ?"
    bonneReponse: "Tom ferme la porte."
    distracteurs: ["Tom ne ferme la porte.", "Tom ferme pas la porte."]
    indice: "Enlève les petits mots qui disent non."
