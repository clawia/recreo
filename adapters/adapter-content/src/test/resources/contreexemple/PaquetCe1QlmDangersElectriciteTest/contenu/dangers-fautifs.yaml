schema: 1
id: fautif
type: question
descripteur:
  matiere: "Questionner le monde"
  niveau: "CE1"
  domaine: "Jeu fautif"
  competence: "Jeu fautif du test du paquet des dangers de l'électricité."
lignesDeReferentiel: ["QLM-CE1-08"]
#
# Jeu fautif de PaquetCe1QlmDangersElectriciteTest : chaque item porte en commentaire le marqueur de
# la sonde qu'il met a l'epreuve, avec sa provenance (nadia-prof, theo-archi ou marc-dev) quand elle
# est connue. Les sondes dites 'passe' sont des clauses : elles doivent passer. Aucun item n'est un
# contenu servi. Les gardes de paquet (FER-3, FER-1, les trois gestes) se mordent sur le paquet reel
# prive de ses items, dans le test, et n'ont pas d'item ici.
items:
  # sonde 01 (marc-dev) un champ que le test ne lit pas : explication
  # DEL-CE1-1 tache : geste
  # DEL-CE1-1 situation : fil
  - enonce: "Tom voit un fil électrique abîmé dans la cuisine. Que doit-il faire ?"
    bonneReponse: "ne pas toucher le fil"
    distracteurs: ["réparer le fil avec du scotch", "ne rien dire à personne"]
    indice: "Regarde bien la scène."
    explication: "Un fil abîmé laisse voir ce qu'il protège."
  # sonde 02 (marc-dev) situation declaree fil, enonce qui ne nomme que la prise
  # DEL-CE1-1 tache : geste
  # DEL-CE1-1 situation : fil
  - enonce: "La prise du salon est cassée. Que doit faire Sami ?"
    bonneReponse: "ne pas toucher la prise"
    distracteurs: ["ne rien dire à personne", "la réparer avec un tournevis"]
    indice: "Regarde bien la scène."
  # sonde 03 (marc-dev) tache danger dont la bonne reponse est un geste
  # DEL-CE1-1 tache : danger
  # DEL-CE1-1 situation : prise
