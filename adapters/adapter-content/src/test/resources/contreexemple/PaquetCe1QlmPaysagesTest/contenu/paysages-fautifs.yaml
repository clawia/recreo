schema: 1
id: fautif
type: question
descripteur:
  matiere: "Questionner le monde"
  niveau: "CE1"
  domaine: "Jeu fautif"
  competence: "Jeu fautif du test du paquet des paysages."
lignesDeReferentiel: ["QLM-CE1-10"]
#
# Jeu fautif de PaquetCe1QlmPaysagesTest : chaque item porte en commentaire le marqueur de la sonde
# qu'il met a l'epreuve, suivi de ce que la sonde doit rendre. Les sondes dites 'passe' sont des
# clauses : elles doivent passer. Chaque verificateur est appele seul sur sa sonde. Aucun item n'est
# un contenu servi. Les sondes de jugement (G10-5) vivent dans jugements-fautifs.yaml.
items:
  # sonde 01 (G10-1 refusee : cascade n'est pas un element)
  - enonce: "On voit une cascade et un sommet. Quel est ce paysage ?"
    bonneReponse: "la montagne"
    distracteurs: ["la campagne", "la ville"]
    indice: "Cherche le mot qui ne va qu'avec un seul paysage."
  # sonde 02 (G10-1 refusee : le desert n'est ni un paysage ni un element)
  - enonce: "On voit un sommet et une forêt. Quel est ce paysage ?"
    bonneReponse: "la montagne"
    distracteurs: ["la campagne", "le désert"]
    indice: "Cherche le mot qui ne va qu'avec un seul paysage."
  # sonde 03 (G10-1 passe : une foret, des champs)
  - enonce: "On voit une forêt et des champs. Quel est ce paysage ?"
    bonneReponse: "la campagne"
    distracteurs: ["la montagne", "la ville"]
    indice: "Cherche le mot qui ne va qu'avec un seul paysage."
  # sonde 04 (G10-1 refusee, G10-5 passe : un grand champ)
  - enonce: "On voit un grand champ et une rivière. Quel est ce paysage ?"
    bonneReponse: "la campagne"
    distracteurs: ["la montagne", "la ville"]
    indice: "Cherche le mot qui ne va qu'avec un seul paysage."
  # sonde 05 (G10-1 refusee, G10-5 passe : une grande ville en proposition)
  - enonce: "On voit un champ et une rivière. Quel est ce paysage ?"
    bonneReponse: "la campagne"
    distracteurs: ["une grande ville", "la montagne"]
    indice: "Cherche le mot qui ne va qu'avec un seul paysage."
  # sonde 06 (G10-1 refusee : au bord de la mer n'est pas un lieu admis)
  - enonce: "Lequel ne voit-on pas au bord de la mer ?"
    bonneReponse: "les pistes de ski"
    distracteurs: ["la plage", "la forêt"]
    indice: "Cherche le mot qui ne va qu'avec un seul paysage."
  # sonde 07 (G10-1 refusee : la cascade en bonne reponse de B)
  - enonce: "Lequel ne voit-on pas à la montagne ?"
    bonneReponse: "la cascade"
