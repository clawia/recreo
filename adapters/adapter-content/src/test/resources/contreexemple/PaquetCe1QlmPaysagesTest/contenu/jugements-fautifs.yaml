schema: 1
id: fautif
type: question
descripteur:
  matiere: "Questionner le monde"
  niveau: "CE1"
  domaine: "Jeu fautif"
  competence: "Jeu fautif du test du paquet des paysages."
lignesDeReferentiel: ["QLM-CE1-10"]
#
# Jeu fautif de PaquetCe1QlmPaysagesTest : chaque item porte en commentaire le marqueur de la sonde
# qu'il met a l'epreuve, suivi de ce que la sonde doit rendre. Les sondes dites 'passe' sont des
# clauses : elles doivent passer. Chaque verificateur est appele seul sur sa sonde. Aucun item n'est
# un contenu servi. Les 48 premieres sondes sont les 48 formes enumerees de G10-5, une par item, dans l'indice : la forme est le dernier mot de l'indice.
items:
  # sonde 01 (G10-5 refusee : beau)
  - enonce: "On voit un sommet et de la neige. Quel est ce paysage ?"
    bonneReponse: "la montagne"
    distracteurs: ["la campagne", "la ville"]
    indice: "Cherche le mot beau."
