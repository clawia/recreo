# Jeu fautif : reproduit la contradiction que nadia-prof a lue en jouant "Le bon verbe"
# (manche 7 puis manche 10, FICHE-bandit-manchot-conjugaison-present-cm1.md, section 2). Le
# premier item enonce une regle generale non temperee ("avec 'tu', le verbe se termine par
# '-es'") ; le second, sur le meme sujet 'tu', a une bonne reponse qui la dement ('finis' ne se
# termine pas par '-es'). Texte de fixture, jamais affiche a un enfant.
schema: 1
id: paquet-indice-general-dementi
type: question
descripteur:
  matiere: "Matiere de fixture"
  niveau: "Niveau de fixture"
  domaine: "Domaine de fixture"
  competence: "Competence de fixture"
items:
  - enonce: "Tu ___ un dessin."
    bonneReponse: "dessines"
    distracteurs: ["dessine", "dessinent", "dessinez"]
    indice: "Avec 'tu', le verbe se termine par '-es' au présent : c'est 'dessines'."
  - enonce: "Tu ___ ton exercice avant la récréation."
    bonneReponse: "finis"
    distracteurs: ["finit", "finissons", "finissent"]
    indice: "Avec 'tu', le verbe 'finir' se termine par '-is' au présent : c'est 'finis'."
