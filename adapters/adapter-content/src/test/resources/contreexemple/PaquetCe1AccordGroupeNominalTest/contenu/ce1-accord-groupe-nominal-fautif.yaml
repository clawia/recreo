schema: 1
id: ce1-accord-groupe-nominal-fautif
type: question
# ADR-0013 obligation 3 : jeu fautif de PaquetCe1AccordGroupeNominalTest. Chaque item viole une
# seule propriete du paquet. Les commentaires "GNA-CE1-1" ci-dessous annoncent des groupes a
# adjectif qui n'en sont pas : le test recompte le champ bonneReponse, il ne lit pas les
# commentaires. Deux groupes seulement sur cinq ont un adjectif.
descripteur:
  matiere: "Français"
  niveau: "CE1"
  domaine: "Orthographe et grammaire"
  competence: "Accorder en nombre et en genre dans le groupe nominal (déterminant, nom, adjectif)."
lignesDeReferentiel: ["FRA-CE1-15"]
items:
  # GNA-CE1-1: un adjectif dans chaque groupe (faux : deux mots seulement)
  # GNA-CE1-2 : -s a la place du -x sur un mot en -eau
  - enonce: "Quel groupe de mots est bien écrit ?"
    bonneReponse: "des gâteaus"
    distracteurs: ["des gâteau", "le gâteaus"]
    indice: "Regarde la fin de chaque mot."
  # GNA-CE1-1: un adjectif dans chaque groupe (faux : deux mots seulement)
  # GNA-CE1-2 : -x sur une exception, pneu prend un -s
  - enonce: "Quel groupe de mots est bien écrit ?"
    bonneReponse: "des pneux"
    distracteurs: ["des pneu", "des pneus"]
    indice: "Regarde la fin de chaque mot."
  # GNA-CE1-2 : feminin dont aucun distracteur n'est le masculin (une porte vert manque)
  - enonce: "Quel groupe de mots est bien écrit ?"
    bonneReponse: "une porte verte"
    distracteurs: ["un porte verte", "une porte vertes"]
    indice: "Regarde la fin de chaque mot."
  # GNA-CE1-3 : un distracteur qui n'est d'aucune famille, deux lettres echangees
  - enonce: "Quel groupe de mots est bien écrit ?"
    bonneReponse: "les chats noirs"
    distracteurs: ["les chat noirs", "les chtas noirs"]
    indice: "Regarde la fin de chaque mot."
  # TRV-CE1-5 : l'indice contient une proposition, "des sacs"
  - enonce: "Quel groupe de mots est bien écrit ?"
    bonneReponse: "des sacs"
    distracteurs: ["des sac", "un sacs"]
    indice: "Cherche des sacs."
