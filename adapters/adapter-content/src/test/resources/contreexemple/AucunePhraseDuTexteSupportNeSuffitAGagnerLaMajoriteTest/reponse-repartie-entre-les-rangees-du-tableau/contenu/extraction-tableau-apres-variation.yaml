# CAS VERT (ADR-0013, ADR-0072, ADR-0099 decision 4). Ce fichier n'est pas un paquet servi.
#
# Le meme paquet que celui du repertoire voisin, a une seule difference pres : la rangee
# interrogee varie d'un item a l'autre - quatre items sur la premiere ligne du corps, trois sur
# la deuxieme, trois sur la troisieme. Aucune strategie qui ne lit qu'une rangee ne depasse 40 %.
#
# Sans ce cas vert, la morsure prouverait seulement que le garde-fou rougit sur quelque chose ;
# avec lui, elle prouve qu'il distingue exactement le defaut - la rangee interrogee, jamais la
# forme tableau elle-meme. Un garde-fou qui rougirait sur toute grille refuserait la famille au
# lieu du defaut, et fermerait SCI-CM1-20 au lieu de la garder.
#
schema: 1
id: extraction-tableau-apres-variation
type: question
descripteur:
  matiere: "Sciences et technologie"
  niveau: "CM1"
  domaine: "Le vivant, sa diversité et les fonctions qui le caractérisent"
  competence: "Extraire une information d'un document (tableau)"
items:
  - enonce: "Quelle est la hauteur du chêne ?"
    tableauSupport:
      enTete: ["Arbre", "Hauteur"]
      lignes:
        - ["chêne", "25 mètres"]
        - ["hêtre", "30 mètres"]
        - ["bouleau", "18 mètres"]
    bonneReponse: "25 mètres"
    distracteurs: ["30 mètres", "18 mètres"]
    indice: "Cherche la ligne du chêne."
  - enonce: "Quelle est la masse du hêtre ?"
