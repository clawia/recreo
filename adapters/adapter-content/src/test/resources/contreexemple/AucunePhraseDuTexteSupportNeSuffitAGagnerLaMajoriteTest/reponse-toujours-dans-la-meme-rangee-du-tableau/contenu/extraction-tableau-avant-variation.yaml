# JEU FAUTIF (ADR-0013, ADR-0072, ADR-0099 decision 4). Ce fichier n'est pas un paquet servi.
#
# Il n'est pas non plus du materiau reel, et cela doit se lire avant de s'y fier : aucun paquet
# du depot ne declarait de grille au 2026-09-23, jour ou cette regle a ete ecrite. C'est la
# faiblesse nommee d'ADR-0099 - la lecon de s05 veut qu'une fixture ecrite par l'auteur d'une
# regle ressemble a ce qu'il imagine, pas a ce que le monde ecrit - et ce qui la compense est que
# le meme juge s'execute par ailleurs sur du materiau reel : les paquets a texte-support servis,
# et le paquet de `lea-dev` avant et apres correction, dans les repertoires voisins.
#
# Ce que ce paquet fait de fautif, et rien d'autre : les six premiers items sur dix interrogent
# la MEME rangee de leur grille, celle du chene. Un enfant qui ne lit jamais que la premiere
# rangee du corps, sans lire ni la question ni le reste de la grille, y presse la seule
# proposition qu'il y trouve et gagne 60 % des items - au-dessus du seuil strict de S12-3.
#
# Les quatre derniers items interrogent d'autres rangees : sans eux, le paquet serait fautif
# pour une raison triviale (tous les items identiques), et la morsure ne prouverait pas que le
# juge compte bien une part.
#
schema: 1
id: extraction-tableau-avant-variation
type: question
descripteur:
  matiere: "Sciences et technologie"
  niveau: "CM1"
  domaine: "Le vivant, sa diversité et les fonctions qui le caractérisent"
  competence: "Extraire une information d'un document (tableau)"
