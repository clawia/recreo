# Catalogue fautif, jamais servi (ADR-0013 obligation 3, DEC-0121).
# Une entree porte 5 manches sans figurer dans la liste des derogations. Aucun paquet n'est
# charge par ce garde-fou, qui ne juge que le nombre de manches de chaque entree.
schema: 1
jeux:
  - id: jeu-fictif-a-dix-manches
    titre: "Jeu a dix manches"
    consigne: "Consigne fictive"
    mecanique: bandit-manchot
    paquet: paquet-fictif-un
    nombreDeManches: 10
  - id: jeu-fictif-a-cinq-manches-hors-liste
    titre: "Jeu a cinq manches"
    consigne: "Consigne fictive"
    mecanique: bandit-manchot
    paquet: paquet-fictif-deux
    nombreDeManches: 5
