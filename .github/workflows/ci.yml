name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  prefixes:
    name: Prefixes de commit par agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # squad/README.md section 8 annonce que la CI rejette un commit sans tag
      # d'agent. Sur la version precedente, cette regle etait documentee et
      # n'existait dans aucun workflow. Ici elle est executable, et le verdict
      # lui-meme est mis a l'epreuve avant d'etre applique : ADR-0009.
      - name: Tester le garde-fou de prefixes
        run: bash .github/scripts/verifier-prefixes-test.sh

      # Une reecriture d'historique suivie d'un push force peut rendre github.event.before
      # inatteignable sans qu'il soit vide ni a zero : sans ce controle, "git log BASE..SHA"
      # echoue sur "bad object", pour un motif etranger a un prefixe manquant.
      - name: Tester le garde-fou de plage de commits
        run: bash .github/scripts/commit-atteignable-test.sh

      - name: Verifier les prefixes
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          if [ -z "${BASE}" ] || [ "${BASE}" = "0000000000000000000000000000000000000000" ] \
             || ! bash .github/scripts/commit-atteignable.sh "${BASE}"; then
            echo "Pas de base comparable (branche neuve, ou base reecrite et inatteignable) : verification du dernier commit."
            RANGE="-1"
          else
            RANGE="${BASE}..${GITHUB_SHA}"
          fi

          git log --no-merges --format=%s ${RANGE} | bash .github/scripts/verifier-prefixes.sh

  chemins:
    name: Chemins de poste de travail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # CLAUDE.md, Conventions de redaction, interdit tout chemin absolu de poste de travail ou
      # nom de compte dans un fichier commite. ADR-0010 rend cette regle executable.
      - name: Tester le garde-fou de chemins
        run: bash .github/scripts/verifier-chemins-test.sh

      - name: Verifier l'absence de chemins de poste de travail
        run: |
          git ls-files -- . ':!.github/scripts/verifier-chemins-test.sh' \
            | bash .github/scripts/verifier-chemins.sh

  outils:
    name: Juges purs des outils de poste
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ADR-0009 : un garde-fou dont le test n'est lance par personne n'est pas un garde-fou. Les
      # outils de outils/ portent chacun un juge pur teste par des entrees fabriquees, sans
      # aucune dependance au poste - ils s'executent donc ici comme n'importe quel test. Les
      # enveloppes, elles, touchent le poste (git, java, un navigateur) et ne sont pas executees ici :
      # leur preuve est manuelle et nommee dans chaque script. Ajoute par ADR-0025, qui constate que
      # verifier-lignee-test.sh et verifier-jdk-test.sh n'etaient lances par aucun automate.
      #
      # s21 (2026-08-27) : le meme constat se reproduisait un cran plus bas. Les outils de mesure
      # vivent aussi sous squad/outils/, et le seul test qui s'y trouvait
      # (verifier-provenance-lots-test.sh) n'etait lance par aucun automate depuis sa creation. Le
      # perimetre reste derive du repertoire, jamais une liste de noms : les deux emplacements sont
      # balayes, et l'etape est rouge si l'un des deux ne rend aucun fichier - un motif de balayage
      # qui ne trouve plus rien est le faux vert que ce depot combat depuis ADR-0013.
      # s25 (2026-08-31), lot F : le meme constat pour la troisieme fois, et sur un autre axe que
      # les deux precedents. Le perimetre etait derive du repertoire mais fige sur une seule
      # extension : outils/rapport-tokens-horodatage-test.py, ecrit a s22, n'a ete lance par aucun
      # automate depuis sa creation, exactement comme verifier-jdk-test.sh avant ADR-0025 et
      # verifier-provenance-lots-test.sh avant s21. Un balayage qui derive son perimetre d'un
      # repertoire mais pas de l'extension n'est derive qu'a moitie. Les juges Python sont donc
      # balayes eux aussi, avec la meme regle : un motif qui ne rend aucun fichier est rouge.
      #
      # squad/outils/*/*-test.py n'est volontairement pas dans la liste : aucun juge Python n'y
      # vit aujourd'hui, et la regle du balayage vide rendrait l'etape rouge pour une population
      # legitimement absente. Ce motif s'ajoute le jour ou le premier y est ecrit, et pas avant -
      # un motif ajoute d'avance serait un faux rouge, symetrique exact du faux vert combattu ici.
      - name: Tester les juges purs des outils
        run: |
          set -euo pipefail
          if command -v python3 > /dev/null; then PY=python3; else PY=python; fi
          total=0
          for motif in "outils/*-test.sh" "squad/outils/*/*-test.sh" "outils/*-test.py"; do
            trouves=0
            for test in ${motif}; do
              [ -f "${test}" ] || continue
              echo "--- ${test}"
              case "${test}" in
                *.py) "${PY}" "${test}" ;;
                *) bash "${test}" ;;
              esac
              trouves=$((trouves + 1))
            done
            if [ "${trouves}" -eq 0 ]; then
              echo "::error::le motif ${motif} ne rend aucun fichier de test : un balayage vide est un faux vert."
              exit 1
            fi
            total=$((total + trouves))
          done
          echo "${total} juge(s) pur(s) execute(s)."

  build:
    name: Build et tests (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verifier la presence du build Maven
        id: maven
        run: |
          if [ -f pom.xml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Pas encore de pom.xml : le socle Maven arrive au sprint 0."
          fi

      - uses: actions/setup-java@v4
        if: steps.maven.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify (compilation + tests unitaires + tests d'integration Spring Boot + ArchUnit)
        if: steps.maven.outputs.present == 'true'
        run: mvn -B verify

      - name: Package du fat jar
        if: steps.maven.outputs.present == 'true'
        run: mvn -B -pl bootstrap -am package
